# Development overrides — applied automatically by `docker compose up`.
#
# Source is bind-mounted and both services hot-reload. Nothing here should ever
# be required for the stack to be correct; it only makes it pleasant.

services:
  api:
    build:
      target: dev
    image: groundwork-api-dev
    command:
      - uvicorn
      - app.main:app
      - --host=0.0.0.0
      - --port=8000
      - --reload
      - --reload-dir=/srv/app
    volumes:
      - ./services/api/app:/srv/app:ro
      - ./services/api/alembic:/srv/alembic:ro
      # Tests too, or `task test` silently runs whatever was baked into the
      # image the last time it was built — which looks exactly like passing.
      - ./services/api/tests:/srv/tests:ro
      - ./content:/content:ro
    environment:
      GROUNDWORK_ENV: development
      LOG_LEVEL: DEBUG

  worker:
    build:
      target: dev
    volumes:
      - ./services/api/app:/srv/app:ro
      - ./content:/content:ro
    environment:
      LOG_LEVEL: DEBUG

  migrate:
    build:
      target: dev
    volumes:
      - ./services/api/app:/srv/app:ro
      - ./services/api/alembic:/srv/alembic:ro

  web:
    build:
      target: dev
    # A distinct tag per target. Both stages otherwise produce `groundwork-web`,
    # so building the production image silently replaces the development one and
    # the next `up` fails with MODULE_NOT_FOUND — the dev server looking for
    # dependencies the runtime image does not ship.
    image: groundwork-web-dev
    command: ["pnpm", "dev"]
    environment:
      NODE_ENV: development
      NEXT_TELEMETRY_DISABLED: "1"
    volumes:
      - ./services/web/src:/srv/src
      - ./services/web/public:/srv/public
      - ./services/web/next.config.ts:/srv/next.config.ts:ro

  # The broker had no dev override at all, so it always built the runtime
  # target — which has no pytest, so `task test:broker` could not run. A test
  # suite you cannot execute from source is not a test suite.
  lab-broker:
    build:
      target: dev
    image: groundwork-lab-broker-dev
    volumes:
      - ./services/lab-broker/app:/srv/app:ro
      - ./services/lab-broker/tests:/srv/tests:ro
    environment:
      GROUNDWORK_ENV: development
