id: lab.find-your-cgroup
topic: topic.cgroups
title: Find your cgroup, and the number that will mislead your runtime
type: guided
tier: 2
image: groundwork/lab-foundations:1
duration_minutes: 25
objectives: [OBJ-A02.2.1, OBJ-A02.2.2, OBJ-A02.2.3]

intro: >-
  Orientation first: which cgroup you are in, what it may use, and what it has
  been given.


  Then the finding this topic is built around. Two files in this container
  answer "how many CPUs do I have" with different numbers, both correct, and
  almost every language runtime you will deploy asks the wrong one. You will
  read both, compute what the honest answer is, and work out what a thread pool
  sized from the wrong one does to a service.

setup:
  - /opt/lab/seed.sh

steps:
  - id: s1
    instruction: >-
      Establish which cgroup version this kernel is using and save the evidence
      to /tmp/answer-version.


      One file exists only in v2. Its presence is the whole test.
    hint: "`cat /sys/fs/cgroup/cgroup.controllers > /tmp/answer-version`"
    walkthrough: |
      cat /sys/fs/cgroup/cgroup.controllers > /tmp/answer-version
      cat /tmp/answer-version
    verify:
      - type: file_matches
        path: /tmp/answer-version
        pattern: "memory"
        describe: The memory controller is available to this cgroup
      - type: file_matches
        path: /tmp/answer-version
        pattern: "cpu"
        describe: So is the cpu controller — this is a v2 unified hierarchy

  - id: s2
    instruction: >-
      Find out where you are in the hierarchy. Save /proc/self/cgroup to
      /tmp/answer-path.


      Read what comes back. On a Kubernetes node the same file for the same
      process is about a hundred characters long.
    hint: "`cat /proc/self/cgroup > /tmp/answer-path`"
    walkthrough: |
      cat /proc/self/cgroup > /tmp/answer-path
      cat /tmp/answer-path
    verify:
      - type: file_matches
        path: /tmp/answer-path
        pattern: '^0::/'
        describe: You are at the root of the hierarchy — as far as you can tell

  - id: s3
    instruction: >-
      You are not really at the root; a namespace re-rooted your view. Name the
      namespace responsible — one word, lowercase — in /tmp/answer-namespace.


      You listed all eight of them in the previous topic.
    hint: >-
      It is the one whose whole job is changing what a process sees of this
      particular hierarchy.
    walkthrough: |
      readlink /proc/self/ns/cgroup
      echo cgroup > /tmp/answer-namespace
    verify:
      - type: file_matches
        path: /tmp/answer-namespace
        pattern: "^cgroup$"
        describe: You connected the re-rooted path to the cgroup namespace

  - id: s4
    instruction: >-
      Now read what this cgroup has been given. Save cpu.max, memory.max and
      pids.max — each on its own line, labelled — to /tmp/answer-limits.
    hint: >-
      `for f in cpu.max memory.max pids.max; do echo "$f $(cat
      /sys/fs/cgroup/$f)"; done > /tmp/answer-limits`
    walkthrough: |
      for f in cpu.max memory.max pids.max; do
        echo "$f $(cat /sys/fs/cgroup/$f)"
      done > /tmp/answer-limits
      cat /tmp/answer-limits
    verify:
      - type: file_matches
        path: /tmp/answer-limits
        pattern: 'cpu.max \d+ \d+'
        describe: A quota and a period, both in microseconds
      - type: file_matches
        path: /tmp/answer-limits
        pattern: 'memory.max \d+'
        describe: A hard memory limit in bytes
      - type: file_matches
        path: /tmp/answer-limits
        pattern: 'pids.max \d+'
        describe: A ceiling on processes and threads

  - id: s5
    instruction: >-
      Convert the CPU quota into CPUs. Divide the quota by the period and write
      the result to /tmp/answer-cpus — a decimal, like `1.5`.
    hint: >-
      `cpu.max` is two numbers: microseconds of CPU time allowed, per
      microseconds of wall clock.
    walkthrough: |
      read -r q p < /sys/fs/cgroup/cpu.max
      awk -v q="$q" -v p="$p" 'BEGIN { printf "%.1f\n", q/p }' > /tmp/answer-cpus
      cat /tmp/answer-cpus
    verify:
      - type: file_matches
        path: /tmp/answer-cpus
        pattern: '^0\.5$'
        describe: Half a CPU — 50ms of time in every 100ms period

  - id: s6
    instruction: >-
      Now ask the machine the same question the way a runtime does, and save
      the answer to /tmp/answer-nproc.
    hint: "`nproc > /tmp/answer-nproc`"
    walkthrough: |
      nproc > /tmp/answer-nproc
      cat /tmp/answer-nproc
    verify:
      - type: file_matches
        path: /tmp/answer-nproc
        pattern: '^[0-9]+$'
        describe: A CPU count was captured
      - type: command_exit
        command: "test $(cat /tmp/answer-nproc) -gt 1"
        exit_code: 0
        describe: More than one — and more than this cgroup is allowed to use

  - id: s7
    instruction: >-
      Two numbers, both true. Write to /tmp/answer-consequence a sentence saying
      what happens to a service whose thread pool is sized from the second one.


      Be specific about throughput and about latency — they do not move the same
      way.
    hint: >-
      The threads all become runnable. The quota does not grow. What runs out,
      and what happens to a request that arrives after it has run out?
    walkthrough: |
      echo "sixteen threads share half a CPU: the quota is spent early in each 100ms period, every thread is then stopped until the next one, so throughput does not rise and tail latency gets much worse" > /tmp/answer-consequence
    verify:
      - type: file_matches
        path: /tmp/answer-consequence
        pattern: "throttl|quota|stopped|period"
        describe: You named the quota being spent rather than just "it is slower"
      - type: command_exit
        command: "test $(wc -w < /tmp/answer-consequence) -ge 12"
        exit_code: 0
        describe: You wrote a real explanation

solution: |
  ```bash
  cat /sys/fs/cgroup/cgroup.controllers > /tmp/answer-version   # cpuset cpu io memory pids
  cat /proc/self/cgroup > /tmp/answer-path                      # 0::/
  echo cgroup > /tmp/answer-namespace

  for f in cpu.max memory.max pids.max; do
    echo "$f $(cat /sys/fs/cgroup/$f)"
  done > /tmp/answer-limits                                     # 50000 100000 / 536870912 / 256

  read -r q p < /sys/fs/cgroup/cpu.max
  awk -v q="$q" -v p="$p" 'BEGIN { printf "%.1f\n", q/p }' > /tmp/answer-cpus   # 0.5
  nproc > /tmp/answer-nproc                                     # 16, or whatever the host has
  ```

  **What you just established.**

  **This is cgroup v2.** `cgroup.controllers` exists only in the unified
  hierarchy, and it lists what this cgroup may use. Under v1 there would be a
  separate mount per controller and no such file — worth knowing, because you
  will meet v1 on older nodes and every path in this topic would be different
  there.

  **You are at the root, and you are not.** `0::/` is the truth as far as this
  process can see. The same process on the host reads something like:

  ```text
  0::/kubepods.slice/kubepods-burstable.slice/kubepods-burstable-pod9f3c.slice/cri-containerd-8a1f.scope
  ```

  The cgroup namespace re-rooted the view. That is deliberate twice over: it
  stops a container reading the node's tree — pod UIDs, QoS classes, other
  tenants — and it makes `/sys/fs/cgroup/memory.max` mean "my limit" under every
  runtime, without the software knowing where it sits.

  The cost is the thing to remember: **you cannot see what is above you.** A
  limit on a parent slice applies to you and is invisible from here.

  **The two CPU numbers.** `cpu.max` of `50000 100000` is half a CPU: 50ms of
  CPU time per 100ms of wall clock. `nproc` reports the host's CPUs, because
  that is what it counts — it reads the kernel's CPU mask, and the mask has not
  changed.

  Both are correct answers to different questions. The one your runtime needs is
  the first, and the one it usually asks is the second:

  | Runtime | What it sizes from `nproc` |
  |---|---|
  | Go | `GOMAXPROCS` — OS threads running goroutines |
  | Node.js | `UV_THREADPOOL_SIZE`, cluster worker count |
  | nginx | `worker_processes auto` |
  | JVM | GC threads, common pool, and pre-10, the heap from host RAM |
  | `make -j$(nproc)` | Every parallel build in a limited CI container |

  **Why more threads make it worse, not better.** Sixteen runnable threads
  consume the 50ms quota in about three milliseconds of wall clock. All sixteen
  are then stopped for the remaining 97ms. Throughput is unchanged — the quota
  did not grow — but a request arriving during the stopped window waits for the
  next period, so p99 latency inherits the period length. Meanwhile the
  utilisation graph shows a steady 50% and looks entirely healthy.

  **The two-file diagnosis.** For any containerised service behaving oddly under
  load:

  ```bash
  nproc; cat /sys/fs/cgroup/cpu.max
  ```

  Disagreement plus a runtime that self-sizes is the answer, and the fix is one
  environment variable rather than a bigger node.

  **Where this goes.** The next lab puts real load on this limit and reads what
  the kernel says about it — `cpu.stat` and `cpu.pressure` — which is how you
  prove this rather than infer it.
