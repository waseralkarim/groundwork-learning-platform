topic: topic.cgroups

exercises:
  - id: e1
    title: Read four files and say what is wrong
    level: L2
    objectives: [OBJ-A02.2.2]
    kind: interpretation
    prompt: >-
      A team reports their service is slow. You have a shell in the container
      and four readings:


      ```text
      $ nproc
      32

      $ cat /sys/fs/cgroup/cpu.max
      100000 100000

      $ cat /sys/fs/cgroup/cpu.stat
      nr_periods      88214
      nr_throttled    79102
      throttled_usec  4408122910

      $ cat /sys/fs/cgroup/memory.events
      oom_kill 0
      ```


      Say what is happening, and what you would ask the team before changing
      anything.
    answer: >-
      The container has one CPU and is throttled in 90% of periods. Memory is
      not involved — nothing has been OOM-killed. Before changing the limit, ask
      what the runtime is and whether anything sizes itself from `nproc`: 32 is
      what it will have seen, and 32 workers on one CPU is the likeliest cause
      of throttling this severe.
    explanation: >-
      The ratio does the diagnosis: 79102 of 88214 periods ended early, so the
      container is stopped in nine periods out of ten. `throttled_usec` of 4408
      seconds against a much shorter wall-clock window confirms it is a sum over
      many tasks, which is itself a hint that there are many.


      The reason to ask before raising the limit is that raising it may be
      treating a symptom. A runtime that started 32 workers on a one-CPU quota
      will still be over-parallel at two CPUs, and the extra contention costs
      throughput that the extra quota was supposed to buy.


      The two-file check — `nproc` against `cpu.max` — takes five seconds and
      decides whether the fix is a resource change or one environment variable.
      Doing it in the other order is how a service ends up with four CPUs and
      the same p99.

  - id: e2
    title: Choose the knob
    level: L3
    objectives: [OBJ-A02.2.4]
    kind: short_answer
    prompt: >-
      For each of these, name the cgroup file you would set and say why the
      obvious alternative is wrong:


      **A** — A cache service should be allowed to burst above its usual memory
      use during a repopulation, degrading rather than dying.


      **B** — A database's page cache should survive a nightly batch job that
      reads a terabyte of files.


      **C** — Two tenants share a node and should get CPU in proportion to what
      they pay for, without either being capped when the other is idle.
    answer: >-
      A: `memory.high` — throttles and reclaims hard without killing, where
      `memory.max` would OOM-kill it at the moment it was doing the useful work.
      B: `memory.low` on the database — protects its cache from reclaim, where a
      limit on the batch job would not stop the kernel evicting the database's
      pages first. C: `cpu.weight` — proportional under contention, where
      `cpu.max` would cap each tenant even when the node is idle.
    explanation: >-
      Each case is a limit being reached for when the situation calls for
      something else.


      **A** is the commonest. `memory.max` is a wall and the failure mode is
      death; `memory.high` is a pressure valve and the failure mode is slowness.
      For a cache repopulating, slow is obviously better than dead — and almost
      nobody sets it, partly because Kubernetes does not expose it directly.


      **B** is the one people get backwards. Capping the batch job limits how
      much *it* uses, but the kernel is free to reclaim the database's page
      cache to satisfy that job's allocations. Only a protection on the database
      changes who gets evicted, because only a protection is a claim on someone
      else's memory.


      **C** is the weight case, and the giveaway is "without being capped when
      the other is idle". That is the definition of a weight and the opposite of
      a limit. It is also why a proportional-sharing scheme tested on an idle
      node appears to do nothing.

  - id: e3
    title: Compute an effective limit
    level: L3
    objectives: [OBJ-A02.2.6]
    kind: calculation
    prompt: >-
      A pod has two containers. The path and its memory limits:


      ```text
      /                                          max
      /kubepods.slice                            30064771072
      /kubepods.slice/kubepods-burstable.slice   max
      .../kubepods-burstable-pod7c2b.slice       536870912
      .../cri-containerd-c3d4.scope  (app)       469762048
      .../cri-containerd-e5f6.scope  (sidecar)   max
      ```


      The app is holding 440401920 bytes and the sidecar 83886080.


      Give the sidecar's effective limit, the pod's remaining headroom, and say
      which container the kernel will kill first if the pod goes over.
    answer: >-
      Sidecar effective limit: 536870912 (512 MiB), from the pod slice. Pod
      headroom: 536870912 − (440401920 + 83886080) = 12582912, about 12 MiB. The
      kernel picks by `oom_score`, which is roughly proportional to memory used,
      so the app at 420 MiB is the likelier victim — but the sidecar has no limit
      of its own to constrain it and is often the one that grew last, so either
      is possible and the choice is not yours.
    explanation: >-
      The effective limit is the minimum on the path, and `max` contributes
      nothing — so 512 MiB from the pod slice.


      The headroom calculation is the one worth internalising: 420 plus 80 is
      500 of 512 MiB, leaving about 12 MiB for both containers together. Any
      modest spike in either puts the *pod* cgroup over its limit, and the
      kernel then has to kill something inside it.


      On the victim: `oom_score` is roughly "how much would killing this free",
      so the larger process is the likelier target. That means a well-behaved app
      container can be killed because a sidecar with no limit grew — and the
      evidence afterwards is `oom_kill` incrementing on the app, whose own
      numbers looked entirely reasonable.


      Two fixes, and both are worth doing. Set a limit on the sidecar so the
      pod's total is explicit rather than emergent, and set `memory.oom.group`
      so the pod dies as a unit rather than leaving a half-dead container that
      still passes its liveness probe.

  - id: e4
    title: Predict the cgroup files from a manifest
    level: L3
    objectives: [OBJ-A02.2.7]
    kind: interpretation
    prompt: >-
      Given this container spec on a cgroup v2 node with the systemd driver:


      ```yaml
      resources:
        requests:
          cpu: 500m
          memory: 256Mi
        limits:
          cpu: 2
          memory: 1Gi
      ```


      State the pod's QoS class, the values of `cpu.max`, `cpu.weight` and
      `memory.max`, and which of the four manifest numbers leaves no trace in
      the cgroup tree.
    answer: >-
      QoS class Burstable, because requests are set but not equal to limits.
      `cpu.max` = `200000 100000`. `cpu.weight` = 20, from 500m. `memory.max` =
      1073741824. The memory *request* of 256Mi leaves no cgroup file — it is
      used for scheduling and eviction ranking only, unless the node has
      MemoryQoS enabled and writes it to `memory.min`.
    explanation: >-
      Working it through:


      **QoS** — Guaranteed requires requests equal to limits for both resources
      in every container. Here CPU is 500m against 2 and memory 256Mi against
      1Gi, so this is Burstable, and the pod lands under
      `kubepods-burstable.slice`.


      **`cpu.max`** — the limit of 2 CPUs at the default 100ms period is
      `200000 100000`.


      **`cpu.weight`** — shares are `500 × 1024 / 1000 = 512`, and weight is
      `1 + (512 − 2) × 9999 / 262142 ≈ 20`.


      **`memory.max`** — 1Gi in bytes.


      The memory request is the interesting omission. Three of the four numbers
      are recoverable from a node with no cluster access; the fourth is not,
      which matters when you are reconstructing what a workload was asked for
      during an incident. It also means the memory request does nothing to
      protect the container at runtime — it decides where the pod was scheduled
      and how early it is evicted, and then stops mattering.
