id: lab.weights-limits-protections
topic: topic.cgroups
title: Walk a node's tree and find the limit that is not in your file
type: guided
tier: 2
image: groundwork/lab-foundations:1
duration_minutes: 30
objectives: [OBJ-A02.2.4, OBJ-A02.2.6]

intro: >-
  Your own container cannot see the hierarchy above it — that is the cgroup
  namespace doing its job, and it is why the last lab could only read one node
  of a path.


  So here is a real one, copied off a Kubernetes node and laid out at /tmp/node
  as ordinary directories and files. You will walk it the way you would walk the
  real thing, compute effective limits down each path, and find a container that
  can be OOM-killed while its own `memory.max` says `max` and its own usage is
  nowhere near anything.

setup:
  - /opt/lab/seed.sh
  - /opt/lab/seed-cgroups.sh

steps:
  - id: s1
    instruction: >-
      Get the shape of the tree first. List every cgroup under
      /tmp/node/sys/fs/cgroup that has a memory.max, with its value, and save it
      to /tmp/answer-tree.
    hint: >-
      `find /tmp/node/sys/fs/cgroup -name memory.max` gives you the paths; read
      each one alongside its path.
    walkthrough: |
      find /tmp/node/sys/fs/cgroup -name memory.max | sort | while read -r f; do
        printf '%s %s\n' "${f#/tmp/node/sys/fs/cgroup}" "$(cat "$f")"
      done > /tmp/answer-tree
      cat /tmp/answer-tree
    verify:
      - type: file_matches
        path: /tmp/answer-tree
        pattern: "kubepods.slice/memory.max 30064771072"
        describe: The node's allocatable memory is capped on kubepods.slice
      - type: file_matches
        path: /tmp/answer-tree
        pattern: "burstable-pod7c2b.slice/memory.max 536870912"
        describe: One pod slice carries a 512 MiB limit

  - id: s2
    instruction: >-
      Three pods are in this tree, and their QoS classes are readable straight
      off the paths — no cluster access needed.


      Write the three classes to /tmp/answer-qos, one per line, in the form
      `pod3f1a guaranteed`.
    hint: >-
      Kubernetes puts Burstable and BestEffort pods under slices named after
      their class. Guaranteed pods sit directly under kubepods.slice.
    walkthrough: |
      {
        echo "pod3f1a guaranteed"
        echo "pod7c2b burstable"
        echo "pod9e44 besteffort"
      } > /tmp/answer-qos
      cat /tmp/answer-qos
    verify:
      - type: file_matches
        path: /tmp/answer-qos
        pattern: "pod3f1a guaranteed"
        describe: The pod directly under kubepods.slice is Guaranteed
      - type: file_matches
        path: /tmp/answer-qos
        pattern: "pod7c2b burstable"
        describe: You read Burstable off the intermediate slice
      - type: file_matches
        path: /tmp/answer-qos
        pattern: "pod9e44 besteffort"
        describe: And BestEffort off its own

  - id: s3
    instruction: >-
      Now the calculation this lab exists for. Take the container at
      .../kubepods-burstable-pod7c2b.slice/cri-containerd-e5f6.scope and walk
      from it up to the root, printing every memory.max on the way.


      Save the walk to /tmp/answer-walk.
    hint: >-
      Start at that directory and repeatedly take `dirname`, reading memory.max
      at each level until you reach /tmp/node/sys/fs/cgroup.
    walkthrough: |
      p=/tmp/node/sys/fs/cgroup/kubepods.slice/kubepods-burstable.slice/kubepods-burstable-pod7c2b.slice/cri-containerd-e5f6.scope
      while [ "$p" != /tmp/node/sys/fs ]; do
        [ -f "$p/memory.max" ] && printf '%s %s\n' "$(basename "$p")" "$(cat "$p/memory.max")"
        p=$(dirname "$p")
      done > /tmp/answer-walk
      cat /tmp/answer-walk
    verify:
      - type: file_matches
        path: /tmp/answer-walk
        pattern: "cri-containerd-e5f6.scope max"
        describe: The container's own limit is unset
      - type: file_matches
        path: /tmp/answer-walk
        pattern: "kubepods-burstable-pod7c2b.slice 536870912"
        describe: But the pod slice above it is capped at 512 MiB

  - id: s4
    instruction: >-
      Write the effective memory limit of that container, in bytes, to
      /tmp/answer-effective.


      It is not the number in its own file.
    hint: >-
      The effective limit is the tightest one on the path from the root. `max`
      means no limit, so it never wins.
    walkthrough: |
      echo 536870912 > /tmp/answer-effective
    verify:
      - type: file_matches
        path: /tmp/answer-effective
        pattern: "^536870912$"
        describe: You took the minimum along the path rather than the local file

  - id: s5
    instruction: >-
      That container shares its 512 MiB with a sibling. Read both containers'
      memory.current in the pod slice and save the pair, with the pod's own
      limit, to /tmp/answer-siblings.
    hint: >-
      The two `cri-containerd-*.scope` directories inside
      kubepods-burstable-pod7c2b.slice.
    walkthrough: |
      P=/tmp/node/sys/fs/cgroup/kubepods.slice/kubepods-burstable.slice/kubepods-burstable-pod7c2b.slice
      {
        printf 'pod limit %s\n' "$(cat $P/memory.max)"
        for c in "$P"/cri-containerd-*.scope; do
          printf '%s current %s max %s\n' "$(basename "$c")" "$(cat "$c/memory.current")" "$(cat "$c/memory.max")"
        done
      } > /tmp/answer-siblings
      cat /tmp/answer-siblings
    verify:
      - type: file_matches
        path: /tmp/answer-siblings
        pattern: "cri-containerd-c3d4.scope current 440401920"
        describe: The app container is holding 420 MiB of the pod's 512
      - type: file_matches
        path: /tmp/answer-siblings
        pattern: "cri-containerd-e5f6.scope current 83886080"
        describe: The sidecar is holding 80 MiB, and has no limit of its own

  - id: s6
    instruction: >-
      Check whether the kill has already happened. Read memory.events for both
      containers in that pod and save them, labelled, to /tmp/answer-events.
    hint: "The `oom_kill` line is the one that matters, and it survives the process."
    walkthrough: |
      P=/tmp/node/sys/fs/cgroup/kubepods.slice/kubepods-burstable.slice/kubepods-burstable-pod7c2b.slice
      for c in "$P"/cri-containerd-*.scope; do
        printf '== %s\n' "$(basename "$c")"
        cat "$c/memory.events"
      done > /tmp/answer-events
      cat /tmp/answer-events
    verify:
      - type: file_matches
        path: /tmp/answer-events
        pattern: "oom_kill 3"
        describe: One of the two has been OOM-killed three times
      - type: command_exit
        command: "grep -A5 'e5f6' /tmp/answer-events | grep -q 'oom_kill 3'"
        exit_code: 0
        describe: And it is the sidecar — the one with no limit of its own

  - id: s7
    instruction: >-
      Explain it. Write to /tmp/answer-why a sentence saying why the container
      with no memory limit and 80 MiB of usage is the one being killed.
    hint: >-
      420 plus 80 is 500, and the pod's limit is 512. When the pod cgroup cannot
      be brought under its limit, who does the kernel choose from?
    walkthrough: |
      echo "the pod slice caps both containers at 512 MiB together, the app is already using 420, so the pod hits its limit and the kernel picks a victim from inside the pod cgroup; the sidecar's own max of unlimited protects it from nothing because the limit that is being enforced is the parent's" > /tmp/answer-why
    verify:
      - type: file_matches
        path: /tmp/answer-why
        pattern: "pod|parent|slice"
        describe: You attributed the kill to the parent cgroup's limit
      - type: command_exit
        command: "test $(wc -w < /tmp/answer-why) -ge 15"
        exit_code: 0
        describe: You wrote a real explanation

  - id: s8
    instruction: >-
      Last one, about the other kind of knob. Read cpu.weight for all three
      pods and save it to /tmp/answer-weights.


      Then consider: on a node with idle CPU, what do those three numbers
      change?
    hint: >-
      `find /tmp/node -name cpu.weight` and read each with its path. The answer
      to the question is one word.
    walkthrough: |
      find /tmp/node/sys/fs/cgroup -name cpu.weight | sort | while read -r f; do
        printf '%s %s\n' "${f#/tmp/node/sys/fs/cgroup}" "$(cat "$f")"
      done > /tmp/answer-weights
      cat /tmp/answer-weights
    verify:
      - type: file_matches
        path: /tmp/answer-weights
        pattern: "pod3f1a.slice/cpu.weight 79"
        describe: The Guaranteed pod's request became a weight of 79
      - type: file_matches
        path: /tmp/answer-weights
        pattern: "besteffort.slice/cpu.weight 1"
        describe: BestEffort sits at the floor

solution: |
  ```bash
  N=/tmp/node/sys/fs/cgroup

  find $N -name memory.max | sort | while read -r f; do
    printf '%s %s\n' "${f#$N}" "$(cat "$f")"
  done

  p=$N/kubepods.slice/kubepods-burstable.slice/kubepods-burstable-pod7c2b.slice/cri-containerd-e5f6.scope
  while [ "$p" != /tmp/node/sys/fs ]; do
    [ -f "$p/memory.max" ] && printf '%s %s\n' "$(basename "$p")" "$(cat "$p/memory.max")"
    p=$(dirname "$p")
  done
  ```

  **What you just established.**

  **QoS class is a directory name.** Guaranteed pods sit directly under
  `kubepods.slice`; Burstable and BestEffort get their own intermediate slice.
  So you can read a pod's class off a node with no cluster access, no
  credentials and no API server — which matters at exactly the moment when the
  API server is the thing that is unwell.

  **The effective limit is the minimum on the path.** The walk gives:

  ```text
  cri-containerd-e5f6.scope              max          <- the container's own
  kubepods-burstable-pod7c2b.slice       536870912    <- the pod's, 512 MiB
  kubepods-burstable.slice               max
  kubepods.slice                         30064771072  <- the node's allocatable
  /                                      max
  ```

  The container's file says `max`. Its effective limit is 512 MiB. Nothing in
  its own cgroup directory says so, and nothing inside the container can find
  out.

  **The kill is arithmetic.** The app container holds 420 MiB of the pod's 512.
  The sidecar holds 80. Together that is 500 MiB against a 512 MiB pod limit,
  which is close enough that a modest spike in either one puts the *pod* cgroup
  over. The kernel then reclaims what it can and picks a victim from inside the
  pod by `oom_score` — and it chose the sidecar three times, as `memory.events`
  records.

  So a container was killed while:

  - its own `memory.max` was `max`
  - its own `memory.current` was 80 MiB
  - its own `memory.events` showed the kills, and nothing else did

  This is the confusing Kubernetes OOM kill in full. The container's own files
  contain the *evidence* — `oom_kill 3` — but none of the *explanation*, which
  lives one directory up.

  **Weight versus limit, in the same tree.** `cpu.weight` came out as 79, 20 and
  1 for the three pods, which is the Kubernetes conversion of their CPU
  requests: shares are `millicores × 1024 / 1000`, and weight is
  `1 + (shares − 2) × 9999 / 262142`.

  On an idle node those three numbers change **nothing**. A weight is a share of
  a contended resource, and there is no contention to share. This is why raising
  a request and seeing no effect on a quiet staging cluster proves nothing at
  all — the setting is working, and the test had no competition in it.

  **The routine.** For any container killed with headroom to spare:

  ```bash
  p=$(dirname /sys/fs/cgroup$(cut -d: -f3 /proc/<pid>/cgroup))
  while [ "$p" != /sys/fs/cgroup ]; do
    printf '%-70s %s\n' "$p" "$(cat "$p/memory.max")"
    p=$(dirname "$p")
  done
  ```

  Run it on the node, not in the container. If a level above the container has
  a tighter limit, that is the answer, and no amount of reading the container's
  own files would ever have produced it.

  **The fix, for this pod.** Set a memory limit on the sidecar. Not to protect
  it — to stop it being the cheapest victim, and to make the pod's total
  explicit rather than emergent. Then either raise the pod's limit or lower the
  app's, because 500 of 512 MiB is not headroom.
