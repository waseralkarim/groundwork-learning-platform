id: lab.pressure-under-a-limit
topic: topic.cgroups
title: Measure pressure, not utilisation
type: guided
tier: 2
image: groundwork/lab-foundations:1
duration_minutes: 30
objectives: [OBJ-A02.2.5]

intro: >-
  Utilisation tells you how busy a resource is. It cannot tell you how much your
  work is being delayed by not having enough of it, and those are different
  questions with different answers.


  You will take a baseline, put four threads on half a CPU, and read what the
  kernel says about it in two places: the throttling counters you met in
  Foundations, and pressure stall information, which says the same thing in one
  number and says it about memory and I/O too. By the end you will have a
  measurement that a utilisation graph is structurally incapable of showing you.

setup:
  - /opt/lab/seed.sh

steps:
  - id: s1
    instruction: >-
      Take a baseline before doing anything. Save cpu.stat and cpu.pressure,
      exactly as they are now, to /tmp/before.
    hint: "`cat /sys/fs/cgroup/cpu.stat /sys/fs/cgroup/cpu.pressure > /tmp/before`"
    walkthrough: |
      cat /sys/fs/cgroup/cpu.stat /sys/fs/cgroup/cpu.pressure > /tmp/before
      cat /tmp/before
    verify:
      - type: file_matches
        path: /tmp/before
        pattern: "nr_throttled"
        describe: The throttling counters were captured
      - type: file_matches
        path: /tmp/before
        pattern: "^some avg10="
        describe: The pressure baseline was captured

  - id: s2
    instruction: >-
      Now generate load. Run four busy threads for twenty seconds with
      `/opt/lab/spin 4 20`, and while it runs, save cpu.stat to /tmp/during at
      least once.


      Four threads on half a CPU is deliberately eight times more demand than
      the quota allows.
    hint: >-
      Start it in the background with `&`, sleep ten seconds, then read
      cpu.stat.
    walkthrough: |
      /opt/lab/spin 4 20 > /tmp/spin.log 2>&1 &
      sleep 10
      cat /sys/fs/cgroup/cpu.stat > /tmp/during
      cat /tmp/during
      wait
    verify:
      - type: file_matches
        path: /tmp/during
        pattern: "nr_throttled [1-9]"
        describe: Periods are ending early — the cgroup is being throttled
      - type: file_matches
        path: /tmp/during
        pattern: "throttled_usec [1-9]"
        describe: Time was spent stopped, and the kernel counted it

  - id: s3
    instruction: >-
      Capture the same two files again now that the load has run, and save them
      to /tmp/after.
    hint: "`cat /sys/fs/cgroup/cpu.stat /sys/fs/cgroup/cpu.pressure > /tmp/after`"
    walkthrough: |
      cat /sys/fs/cgroup/cpu.stat /sys/fs/cgroup/cpu.pressure > /tmp/after
      cat /tmp/after
    verify:
      - type: file_matches
        path: /tmp/after
        pattern: "nr_throttled [1-9]"
        describe: The throttling counters moved
      - type: file_matches
        path: /tmp/after
        pattern: '^some avg10=[0-9]+\.[0-9]+ avg60='
        describe: The pressure averages were captured after the load

  - id: s4
    instruction: >-
      Work out how throttled you were. Compute `nr_throttled` divided by
      `nr_periods` from /tmp/after and write the percentage, rounded to a whole
      number, to /tmp/answer-throttle-pct.
    hint: >-
      Both numbers are in /tmp/after. This ratio, not the absolute count, is the
      signal — a busy cgroup has many periods.
    walkthrough: |
      awk '/^nr_periods/ {p=$2} /^nr_throttled/ {t=$2} END { printf "%d\n", (t*100)/p }' /tmp/after > /tmp/answer-throttle-pct
      cat /tmp/answer-throttle-pct
    verify:
      - type: command_exit
        command: "test $(cat /tmp/answer-throttle-pct) -ge 50"
        exit_code: 0
        describe: More than half of all periods ended early
      - type: command_exit
        command: "test $(cat /tmp/answer-throttle-pct) -le 100"
        exit_code: 0
        describe: A sane percentage

  - id: s5
    instruction: >-
      Now read the pressure lines in /tmp/after and save just those two lines to
      /tmp/answer-pressure.


      Compare the `some` and `full` averages over ten seconds. Note whether they
      differ.
    hint: "`grep -E '^(some|full)' /tmp/after > /tmp/answer-pressure`"
    walkthrough: |
      grep -E '^(some|full)' /tmp/after > /tmp/answer-pressure
      cat /tmp/answer-pressure
    verify:
      - type: file_matches
        path: /tmp/answer-pressure
        pattern: '^some avg10=[1-9]'
        describe: Pressure over the last ten seconds is not zero
      - type: file_matches
        path: /tmp/answer-pressure
        pattern: '^full avg10='
        describe: The full line was captured too

  - id: s6
    instruction: >-
      `some` and `full` should be very close, which is not what you would see on
      an ordinary busy machine.


      Write to /tmp/answer-why-equal a sentence explaining why quota throttling
      makes them equal.
    hint: >-
      `some` is time when at least one task was stalled; `full` is time when
      every task was. When the quota runs out, which tasks are stopped?
    walkthrough: |
      echo "when the quota is spent every task in the cgroup is stopped at the same moment, so any stall is a total stall and some equals full" > /tmp/answer-why-equal
    verify:
      - type: file_matches
        path: /tmp/answer-why-equal
        pattern: "every|all|whole"
        describe: You identified that throttling stops the entire cgroup at once
      - type: command_exit
        command: "test $(wc -w < /tmp/answer-why-equal) -ge 10"
        exit_code: 0
        describe: You wrote a real explanation

  - id: s7
    instruction: >-
      Last one, and it is the point of the lab. This cgroup used almost exactly
      its full CPU quota, so a utilisation dashboard would show it at 100% of
      its limit and flat.


      Write to /tmp/answer-utilisation what pressure told you that utilisation
      could not.
    hint: >-
      Utilisation is about the resource. Pressure is about the work. What
      happened to a request that arrived while everything was stopped?
    walkthrough: |
      echo "utilisation says the cgroup used all the CPU it was allowed; pressure says work was waiting for CPU it could not have, which is the delay a user experiences and is invisible in a utilisation graph" > /tmp/answer-utilisation
    verify:
      - type: file_matches
        path: /tmp/answer-utilisation
        pattern: "wait|delay|stall|latency"
        describe: You named delay to the work rather than busyness of the resource
      - type: command_exit
        command: "test $(wc -w < /tmp/answer-utilisation) -ge 12"
        exit_code: 0
        describe: You wrote a real explanation

solution: |
  ```bash
  cat /sys/fs/cgroup/cpu.stat /sys/fs/cgroup/cpu.pressure > /tmp/before

  /opt/lab/spin 4 20 > /tmp/spin.log 2>&1 &
  sleep 10
  cat /sys/fs/cgroup/cpu.stat > /tmp/during
  wait

  cat /sys/fs/cgroup/cpu.stat /sys/fs/cgroup/cpu.pressure > /tmp/after

  awk '/^nr_periods/ {p=$2} /^nr_throttled/ {t=$2} END { printf "%d\n", (t*100)/p }' /tmp/after
  grep -E '^(some|full)' /tmp/after
  ```

  **What you just measured.**

  Typical readings after twenty seconds of four threads on half a CPU:

  ```text
  usage_usec      10001127
  nr_periods      201
  nr_throttled    198          <- 98% of periods ended early
  throttled_usec  68023894     <- 68 seconds of task-time spent stopped

  some avg10=37.42 avg60=12.60 avg300=2.71 total=5077376
  full avg10=37.42 avg60=12.60 avg300=2.71 total=5076919
  ```

  **The ratio is the signal, not the count.** 198 of 201 periods ended early.
  Absolute counts grow with uptime and tell you nothing; the ratio says this
  cgroup is stopped in almost every period it runs.

  **`throttled_usec` exceeds wall-clock time, and that is correct.** Four
  threads stopped for one second is four seconds of stalled task-time. It is a
  sum over tasks, not a duration — which is why it is a better measure of harm
  than the number of periods.

  **`some` equals `full`, and that is a fingerprint.** `some` is time when at
  least one task was stalled; `full` is time when every one was. Ordinary CPU
  contention gives you `some` well above `full` — some tasks run while others
  wait. Quota throttling stops the entire cgroup at the same instant, so every
  stall is a total stall and the two lines converge.

  Seeing `some ≈ full` on `cpu.pressure` is therefore a fairly reliable way to
  tell "we are hitting our quota" from "the node is busy", and it takes one
  file rather than a comparison across hosts.

  **What utilisation could not have told you.** This cgroup used its entire
  quota, so utilisation-against-limit reads 100%, flat, all twenty seconds. That
  is also what a perfectly sized, perfectly healthy container looks like.
  Nothing in that graph distinguishes "using what it needs" from "desperate for
  more" — and the difference is 68 seconds of work waiting.

  Pressure measures the work rather than the resource, which is why it can make
  that distinction and utilisation structurally cannot.

  **The three files that belong on a dashboard.**

  ```promql
  rate(container_cpu_cfs_throttled_periods_total[5m])
    / rate(container_cpu_cfs_periods_total[5m])         # > 0.25 is a problem
  rate(container_pressure_cpu_stalled_seconds_total[5m])
  increase(container_oom_events_total[5m])              # any increase at all
  ```

  Use the `total=` counters from PSI rather than the `avg` fields when graphing.
  The averages are already smoothed over windows you did not choose; `total`
  only increases, so a rate over it composes properly with everything else on
  the dashboard.

  **Where this goes.** **F34** builds alerts on saturation, and pressure is the
  signal that states saturation directly instead of inferring it from
  utilisation. The alert you would write from this lab is one line and it is
  right about a case that CPU utilisation gets wrong every time.
