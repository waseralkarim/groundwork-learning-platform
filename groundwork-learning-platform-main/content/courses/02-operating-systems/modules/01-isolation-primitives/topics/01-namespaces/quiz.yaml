id: quiz.namespaces
topic: topic.namespaces
pass_score: 70

questions:
  - id: q1
    type: single_choice
    level: L2
    objectives: [OBJ-A02.1.1]
    stem: Which of these is closest to what the Linux kernel calls a container?
    options:
      - id: a
        text: Nothing — there is no container object; there are processes with their own namespace memberships
        correct: true
      - id: b
        text: A lightweight virtual machine sharing the host's hardware
        note: >-
          A VM has its own kernel. A container makes syscalls into the host's
          kernel, which is the entire security argument about containers.
      - id: c
        text: A cgroup, which the kernel tracks as a container
        note: >-
          Cgroups limit resources and are one of the ingredients, but a cgroup
          is not a container and a container is not required to be in one of
          its own.
      - id: d
        text: A special process type the kernel schedules differently
        note: >-
          The scheduler treats it exactly like any other process. Nothing about
          being "in a container" changes how it is scheduled.
    explanation: >-
      Search the kernel source for a container and you will not find one. What
      exists is a process given its own view of a few global resources —
      process IDs, mounts, network interfaces — plus a filesystem to run in and
      some limits. "Container" is the name of a conventional bundle of those
      parts, which is exactly why individual parts can be opted out of.

  - id: q2
    type: single_choice
    level: L2
    objectives: [OBJ-A02.1.1]
    stem: A namespace virtualises which of the following?
    options:
      - id: a
        text: One global kernel resource, so that different processes see different versions of it
        correct: true
      - id: b
        text: The CPU, so processes can be given a share of it
        note: >-
          That is a cgroup. Namespaces change what a process can see; cgroups
          change how much it can consume.
      - id: c
        text: Memory addresses, so each process has its own address space
        note: >-
          Every process already has its own address space — that is virtual
          memory, and it predates namespaces by decades.
      - id: d
        text: System calls, so a container has a restricted set available
        note: >-
          Restricting which syscalls may be made is seccomp. Namespaces do not
          remove calls; they change what the calls operate on.
    explanation: >-
      A namespace is a per-process view of one global resource. The PID
      namespace virtualises process numbering, the mount namespace the set of
      mounts, the network namespace interfaces and routes. Nothing is removed
      and nothing is filtered — a process simply sees a different instance of
      the resource.

  - id: q3
    type: single_choice
    level: L2
    objectives: [OBJ-A02.1.2]
    stem: >-
      You want to know whether two running processes are isolated from each
      other on the network. What is the quickest reliable check?
    options:
      - id: a
        text: Compare `readlink /proc/<a>/ns/net` with `readlink /proc/<b>/ns/net`
        correct: true
      - id: b
        text: Compare their IP addresses — different addresses mean different namespaces
        note: >-
          Two processes in the same namespace can hold different addresses on
          different interfaces, and two in different namespaces can be given
          the same address. The address is not the identity.
      - id: c
        text: Check whether one can reach the other with ping
        note: >-
          Reachability is a routing and firewall question. Separate namespaces
          are routinely connected on purpose, and shared ones can be blocked.
      - id: d
        text: Compare their PIDs — processes in one namespace have consecutive PIDs
        note: >-
          PID allocation says nothing about the network namespace, and PIDs are
          not consecutive within a namespace either.
    explanation: >-
      The inode in the symlink target is the namespace's identity. Same inode,
      same namespace, same view; different inode, different view. The comparison
      works for every namespace type, needs no tooling beyond `readlink`, and is
      the one operation this whole topic reduces to.

  - id: q4
    type: single_choice
    level: L2
    objectives: [OBJ-A02.1.2]
    stem: >-
      Inside a container, `cat /proc/self/uid_map` prints `0 0 4294967295`.
      What does that tell you?
    options:
      - id: a
        text: There is no remapping — uid 0 inside is uid 0 on the host
        correct: true
      - id: b
        text: The container has its own user namespace with a 4-billion-entry map
        note: >-
          The size is right but the mapping is the giveaway: the second column
          is the outside uid, and it equals the first. Nothing is being
          translated.
      - id: c
        text: The container is running as an unprivileged user
        note: >-
          The map describes the namespace's translation table, not which uid the
          process currently has. Read /proc/self/status for that.
      - id: d
        text: User namespaces are disabled in this kernel
        note: >-
          The file exists and has content, so the facility is present. What this
          container has is the *initial* user namespace, not no namespace.
    explanation: >-
      The three columns are: first uid inside, the uid it corresponds to
      outside, and how many are mapped. `0 0 4294967295` maps every uid to
      itself — the identity mapping of the host's initial user namespace. A
      container with its own would show something like `0 100000 65536`, where
      its root is host uid 100000 and an escape lands as nobody in particular.

  - id: q5
    type: single_choice
    level: L2
    objectives: [OBJ-A02.1.3]
    stem: >-
      From inside a container you run `kill -0 4242` against a process you know
      is running on the host. What happens, and why?
    options:
      - id: a
        text: '"No such process" — the PID has no meaning in this namespace, so there is nothing to name'
        correct: true
      - id: b
        text: '"Operation not permitted" — the container lacks the capability to signal it'
        note: >-
          That would be EPERM, meaning the kernel found the target and refused
          you. No capability is involved here, because nothing was found.
      - id: c
        text: The signal is delivered, since signal 0 only checks existence
        note: >-
          Signal 0 does perform the existence check, and the check fails. It is
          the delivery that never gets as far as being attempted.
      - id: d
        text: It succeeds but has no effect, because the container's kill is namespaced
        note: >-
          `kill` is the same syscall it always was. What changed is the space
          the PID argument is resolved in.
    explanation: >-
      This is ESRCH, not EPERM, and the distinction is the whole PID namespace.
      A permission error would mean the kernel located the process and denied
      the authority to signal it — something a capability could change. "No such
      process" means the number does not resolve to anything in this namespace.
      There is no `--cap-add` for that, because nothing is being denied.

  - id: q6
    type: single_choice
    level: L2
    objectives: [OBJ-A02.1.3]
    stem: >-
      Why does an application running as PID 1 in a container often behave
      differently from the same binary on a VM?
    options:
      - id: a
        text: PID 1 adopts orphaned processes and ignores signals it has no handler for, and most applications are written for neither
        correct: true
      - id: b
        text: The kernel gives PID 1 elevated privileges inside the namespace
        note: >-
          PID 1 gets no extra capabilities. Its special treatment is about
          signals and orphan adoption, not privilege.
      - id: c
        text: PID 1 is scheduled at a higher priority
        note: >-
          The scheduler does not care about the number. Priority comes from nice
          values and scheduling class.
      - id: d
        text: PID 1 has its own memory namespace, so its allocations behave differently
        note: >-
          There is no memory namespace. Memory limits come from cgroups and
          apply to the whole container regardless of PID.
    explanation: >-
      The first process in a new PID namespace is numbered 1 and inherits init's
      contract: it reaps orphans, and a signal with no installed handler is not
      applied to it by default. An application written to be started by systemd
      handles neither — which is why `docker stop` on such a container waits the
      full ten seconds and then kills it, and why zombies accumulate.

  - id: q7
    type: single_choice
    level: L3
    objectives: [OBJ-A02.1.4]
    stem: >-
      Two containers on one host both bind port 8080 and neither reports a
      conflict. Why?
    options:
      - id: a
        text: They are different ports, because a network namespace has its own complete port space
        correct: true
      - id: b
        text: Docker proxies the port and multiplexes between them
        note: >-
          There is a userland proxy in some configurations, but it is not what
          prevents the conflict. Nothing was multiplexed — the two binds never
          met.
      - id: c
        text: Only one of them actually succeeded and the other failed silently
        note: >-
          Both succeed. You can confirm it by connecting to each container's own
          address on 8080.
      - id: d
        text: The kernel allows SO_REUSEPORT for containerised processes
        note: >-
          SO_REUSEPORT is an explicit socket option for sharing one port within
          one namespace. It is not implicit and not what is happening here.
    explanation: >-
      A network namespace has its own interfaces, addresses, routing table,
      firewall rules and socket bindings. Port 8080 in one is a different object
      from port 8080 in another. It is also why publishing needs two numbers:
      `-p 8080:80` is a forwarding rule from the host's namespace into the
      container's, not an instruction to "open" anything.

  - id: q8
    type: single_choice
    level: L3
    objectives: [OBJ-A02.1.4]
    stem: >-
      You exec into a container and `cat /proc/mounts` shows `overlay` on `/`
      and none of the host's filesystems. What is the correct reading?
    options:
      - id: a
        text: The host's filesystems were never mounted in this mount namespace — they are absent, not hidden
        correct: true
      - id: b
        text: The container's view of the mount table is filtered by the runtime
        note: >-
          Nothing filters it. /proc/mounts is generated from the mount namespace
          the reading process belongs to, and this namespace has those mounts
          and no others.
      - id: c
        text: The host's mounts were unmounted when the container started
        note: >-
          They are still mounted on the host and in use by every other process.
          Unmounting them would break the machine.
      - id: d
        text: The container lacks the capability to see them
        note: >-
          Capabilities are not involved. A privileged container in this mount
          namespace would see exactly the same table.
    explanation: >-
      A mount namespace holds its own set of mounts, and two processes on one
      kernel can disagree entirely about what is at `/`. The runtime mounts the
      overlay in the container's namespace and `pivot_root`s into it, so the
      host's tree is unreachable rather than merely unlisted. This is also why a
      bind mount is a mount performed *in* the container's namespace.

  - id: q9
    type: single_choice
    level: L3
    objectives: [OBJ-A02.1.5]
    stem: >-
      Why does creating a new PID or mount namespace require a capability at
      all?
    options:
      - id: a
        text: Because it lets the creator control what other processes in it can see, which is a privileged act
        correct: true
      - id: b
        text: Because namespaces consume kernel memory and could be used to exhaust it
        note: >-
          They are cheap, and there are per-user limits for exhaustion. The
          restriction is about authority, not resources.
      - id: c
        text: Because only root should be able to run containers
        note: >-
          Rootless containers exist precisely to break that assumption, and the
          check is on the capability rather than on the uid.
      - id: d
        text: Because the kernel needs to update the process table atomically
        note: >-
          Namespace creation is not a locking problem. `unshare` returns EPERM,
          not EBUSY.
    explanation: >-
      Constructing a namespace means controlling what processes placed in it can
      observe — which mounts exist, what `/` contains, which processes are
      nameable. That is a position of authority over anything running inside it,
      so `CAP_SYS_ADMIN` is required. The user namespace is the exception: it
      grants capabilities only over itself, so creating one gives you no
      authority you did not already have.

  - id: q10
    type: single_choice
    level: L3
    objectives: [OBJ-A02.1.5]
    stem: >-
      A container is refused `unshare --user`, which the manual says needs no
      capability. Adding `--cap-add=SYS_ADMIN` does not help. What is happening?
    options:
      - id: a
        text: A seccomp filter is blocking the syscall, and it is evaluated before any capability check
        correct: true
      - id: b
        text: The capability was added to the wrong set and needs to be in the ambient set too
        note: >-
          Set juggling would matter for a capability-governed operation. This
          one is not governed by a capability at all, so no set would fix it.
      - id: c
        text: User namespaces are compiled out of the kernel
        note: >-
          Possible in principle, but then the host's own containers would not
          work either, and the error would arrive from a different path.
      - id: d
        text: The container needs `--privileged`, which is the only way to enable user namespaces
        note: >-
          `--privileged` happens to work, because it also disables seccomp — but
          it grants forty capabilities to fix a problem that was never about
          capabilities.
    explanation: >-
      Docker's default seccomp profile blocks `CLONE_NEWUSER`, because
      unprivileged user namespaces have been the entry point for a series of
      kernel privilege-escalation bugs. A seccomp filter runs before the kernel
      reaches the capability check, so adding a capability grants authority for
      a call that never arrives. Two mechanisms, one identical `EPERM` — and the
      fix is a seccomp profile, not a capability.

  - id: q11
    type: single_choice
    level: L3
    objectives: [OBJ-A02.1.6]
    stem: >-
      Given that containers share the host's user namespace by default, what
      does dropping all capabilities actually accomplish?
    options:
      - id: a
        text: It leaves the process as real root with no authority, so an escape has nothing to act with
        correct: true
      - id: b
        text: It maps the container's root to an unprivileged user on the host
        note: >-
          That is what a user namespace does, and it is exactly the thing that
          is not happening. The uid is unchanged; only the authority is gone.
      - id: c
        text: It prevents the container from making syscalls that require privilege
        note: >-
          The calls can still be made. They return EPERM instead of doing
          anything, which is a different thing from being unable to make them.
      - id: d
        text: It is defence in depth on top of the isolation the user namespace already provides
        note: >-
          There is no user-namespace isolation to be on top of. With a shared
          user namespace, capability dropping is the primary confinement.
    explanation: >-
      The kernel genuinely sees uid 0 — there is no translation layer. What has
      been removed is the authority: with an empty effective and bounding set,
      uid 0 can mount nothing, load nothing, and change no ownership. It is root,
      disarmed. That is a real defence, and it is also a brittle one, because a
      single restored capability or a kernel bug returns full host root
      immediately.

  - id: q12
    type: single_choice
    level: L3
    objectives: [OBJ-A02.1.6]
    stem: >-
      Which change most reduces the consequence of a container escape, rather
      than its likelihood?
    options:
      - id: a
        text: Giving the container its own user namespace, so its root maps to an unprivileged host uid
        correct: true
      - id: b
        text: Dropping all capabilities and enabling seccomp
        note: >-
          Both are excellent and both reduce the *likelihood* of an escape. If
          one happens anyway, the process is still uid 0 on the host.
      - id: c
        text: Making the root filesystem read-only
        note: >-
          It removes persistence and some tampering, but an escaped root process
          is not confined by the container's own rootfs settings.
      - id: d
        text: "Setting `automountServiceAccountToken: false`"
        note: >-
          Worth doing — it removes one specific credential — but it does nothing
          about what the process can do to the node itself.
    explanation: >-
      Likelihood and consequence are separate levers, and most container
      hardening pulls the first. Capability dropping, seccomp and read-only
      roots all make an escape harder. The user namespace changes what an escape
      *is worth*: uid 0 inside becomes an ordinary unprivileged uid outside, so
      even a complete break lands as nobody. That is why rootless runtimes are a
      different security posture rather than another hardening tweak.

  - id: q13
    type: multi_choice
    level: L3
    objectives: [OBJ-A02.1.7]
    stem: >-
      A pod's namespace inodes all differ from the node's, and it can still read
      files from the node's disk. Which explanations are consistent with that?
      Select all that apply.
    options:
      - id: a
        text: A hostPath volume mounts a node directory into the pod's own mount namespace
        correct: true
      - id: b
        text: It runs privileged, so it holds CAP_SYS_ADMIN and can mount the node's disk itself
        correct: true
      - id: c
        text: Its mount namespace inode was reused, so the comparison was misleading
        note: >-
          Inodes are not reused while the namespace is alive, and the pod's
          namespace is alive. A differing inode is a reliable difference.
      - id: d
        text: hostPID was set, which exposes the node's filesystem through /proc
        note: >-
          hostPID exposes the node's process table. Reading another process's
          /proc/pid/root would need to traverse into its mount namespace, which
          is a separate permission the pod does not have here.
    explanation: >-
      Both correct answers make the same point from different directions:
      namespace isolation is not the only thing standing between a workload and
      the node. A hostPath volume punctures a perfectly good mount namespace
      deliberately, and `privileged: true` hands back the capability needed to
      puncture it from inside. Check `CapEff`, `Seccomp` and the volume list
      before concluding that differing inodes mean the workload is contained.

  - id: q14
    type: single_choice
    level: L3
    objectives: [OBJ-A02.1.8]
    stem: >-
      A team wants `hostNetwork: true` so their service can reach a database on
      the node's management interface. What is the strongest objection?
    options:
      - id: a
        text: NetworkPolicy stops applying, because policies select pods by pod IP and this pod has the node's
        correct: true
      - id: b
        text: The pod will be unable to resolve cluster DNS
        note: >-
          A real complication — it needs `dnsPolicy: ClusterFirstWithHostNet` —
          but it is a configuration detail, not a security argument.
      - id: c
        text: Two such pods cannot be scheduled onto the same node
        note: >-
          True if they bind the same port, and a genuine operational limit. It
          is not the reason a reviewer should push back.
      - id: d
        text: It requires the pod to run as root
        note: >-
          It does not, unless the pod binds a port below 1024 — and that needs a
          capability rather than root.
    explanation: >-
      Every `host*` option gives up one nameable isolation, and `hostNetwork`
      gives up two. The obvious one is network isolation and the port space. The
      one that surprises people is NetworkPolicy: rules select pods by their pod
      IP, and a host-networked pod does not have one, so every ingress and
      egress rule you believed applied to it silently does not. A `Service` or a
      route to the management interface solves the original problem without
      that.

  - id: q15
    type: single_choice
    level: L3
    objectives: [OBJ-A02.1.8]
    stem: >-
      A debugging sidecar needs to see the application container's processes.
      Which option gives it the least beyond what it needs?
    options:
      - id: a
        text: '`shareProcessNamespace: true`, which merges the pod''s containers into one PID namespace'
        correct: true
      - id: b
        text: '`hostPID: true`, so the sidecar can see everything including the app'
        note: >-
          It works, and it also exposes every process on the node — kubelet,
          etcd, every other tenant's workload. Vastly more than was asked for.
      - id: c
        text: '`privileged: true` on the sidecar, so it can enter any namespace it likes'
        note: >-
          The largest possible grant for the smallest possible need. It also
          removes seccomp and no_new_privs, which have nothing to do with seeing
          processes.
      - id: d
        text: Running the debugger inside the application container instead
        note: >-
          It avoids the namespace question by putting debugging tools in a
          production image — which is the thing distroless images exist to
          avoid.
    explanation: >-
      The review question for every one of these is "what is the smallest thing
      that satisfies the need". `shareProcessNamespace` merges only the pod's own
      containers, so the sidecar sees the application and nothing else on the
      node. `kubectl debug --target` is the even narrower version: an ephemeral
      container joined to one container's namespaces, gone when you are done.
