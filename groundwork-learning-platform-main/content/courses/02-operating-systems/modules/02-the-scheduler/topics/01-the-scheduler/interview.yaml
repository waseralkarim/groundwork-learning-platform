topic: topic.the-scheduler

questions:
  - id: i1
    level: L2
    question: >-
      A service is slow. How do you tell whether it is running slowly or waiting
      for a CPU?
    model_answer: >-
      Those are different states and the kernel counts them separately.
      `/proc/PID/task/*/schedstat` gives three numbers per thread: nanoseconds
      on a CPU, nanoseconds waiting on a run queue, and timeslices. Take two
      readings a while apart and subtract — the totals are cumulative since the
      task started, so the interval is what matters.


      If the waiting column is large relative to the running column, the work
      existed and could not get a turn, and that is scheduling latency. If it is
      near zero, the CPU story is over and the time is going somewhere else — a
      lock, a connection pool, a downstream call.


      Per thread rather than per process matters. A process's own `schedstat`
      covers its main thread, which in a JVM or a Go binary often just
      supervises and blocks while every worker queues. Reading the process and
      concluding "no scheduling delay" is the usual way to miss this.


      `nr_voluntary_switches` against `nr_involuntary_switches` in
      `/proc/PID/sched` is the second reading: mostly voluntary means blocking,
      mostly involuntary means stopped while it still had work.
    signal: >-
      Naming `schedstat` at all is the main signal — most candidates reach for
      `top` and stop. Reading per-thread shows real debugging experience.
      Treating a near-zero wait as a useful *negative* result, rather than a
      dead end, is the strongest version.
    follow_ups:
      - "The waiting column is large. What are the three most likely causes?"
      - "How would you check whether the scheduler statistics are even being collected?"
      - "What would you look at if the waiting column were near zero?"

  - id: i2
    level: L3
    question: >-
      Someone renices a batch job to 19 and reports that it made no difference.
      What do you say?
    model_answer: >-
      That the test almost certainly had no contention in it, and so
      demonstrated nothing.


      Nice sets a weight, and a task's share is its weight over the sum of all
      *runnable* weights. Alone, that sum is its own weight, so the share is
      everything regardless of the numerator. A nice-19 process on a quiet
      machine runs exactly as fast as a nice-0 one — and staging is generally
      quiet.


      To test it you have to create competition. The cheapest way is `taskset -c
      0` on two busy processes, which forces them onto one run queue; then the
      difference is dramatic. Nice 0 has weight 1024 and nice 19 has weight 15,
      so under contention the ratio is about 68 to 1, and you can watch it.


      The important follow-on is that this makes the failure mode sudden rather
      than gradual. The batch job runs at full speed for weeks, then on the one
      busy afternoon it gets 1.4% of a CPU and its queue backs up — with nothing
      about its own configuration having changed. If what you actually need is a
      ceiling that applies on an idle machine, nice is the wrong tool and
      `cpu.max` is the right one.
    signal: >-
      Explaining the negative result rather than doubting the mechanism is the
      discriminator. Naming the denominator — that it contains only runnable
      tasks — shows the model is right. Knowing how to construct the test with
      `taskset`, and separating weight from limit at the end, are senior
      answers.
    follow_ups:
      - "How would you construct a test that does show the effect?"
      - "What is the Kubernetes equivalent of nice, and what is the equivalent of cpu.max?"
      - "Why is the failure mode sudden rather than gradual?"

  - id: i3
    level: L3
    question: >-
      What changed when Linux replaced CFS with EEVDF, and does it affect how
      you configure things?
    model_answer: >-
      CFS ran whichever runnable task had the smallest virtual runtime — real
      time consumed divided by weight. It was fair about *how much* CPU each
      task got, and had no way for a task to express *how often* it needed to
      run. Those are different requirements, and latency-sensitive work cares
      about the second.


      EEVDF, the default since 6.6, adds two things to the same vruntime
      machinery. Eligibility: a task that has run ahead of its fair share is not
      eligible to be picked until the others catch up. And a virtual deadline
      per task, equal to when it becomes eligible plus the slice it requested —
      visible as `se.slice`, 3ms by default. The scheduler picks the eligible
      task with the earliest deadline, so a task asking for a shorter slice gets
      picked sooner and more often without receiving any more total CPU.


      For configuration: shares still come from weights, so nothing about nice,
      `cpu.weight` or Kubernetes CPU requests changed. What did change is that
      `sched_latency_ns` and `sched_min_granularity_ns` no longer exist, so any
      tuning advice referencing them predates 6.6. And tail latency under load
      is generally better with no configuration at all, which matters when
      you're comparing benchmarks across kernel versions and wondering why they
      disagree.
    signal: >-
      "How much versus how often" is the sentence that shows it is understood
      rather than recited. Knowing the old tunables are gone is a practical
      detail that separates people who have looked at a 6.6 machine from people
      who have read a summary. Noting that weights are unchanged shows they know
      what did *not* change, which is usually the more useful half.
    follow_ups:
      - "Which file would you read to tell which scheduler a machine is running?"
      - "What is se.slice, and what would a shorter one buy you?"
      - "Does any of this change how you set Kubernetes CPU requests?"

  - id: i4
    level: L3
    question: >-
      A container asks for `--cap-add=SYS_NICE` to improve its latency. How do
      you review that?
    model_answer: >-
      I would start by asking what it actually wants to do, because the
      capability covers two different things: negative nice values, and the
      real-time policies.


      If it wants negative nice, it is asking to take CPU from its neighbours
      under contention. That is a decision about the node's workload mix, not
      about this container, and the Kubernetes way to express relative
      importance is CPU requests — which need no capability and which the
      scheduler already honours.


      If it wants `SCHED_FIFO` or `SCHED_RR`, that is much more serious. A
      runnable real-time task preempts every normal task on its CPU and runs
      until it blocks. One with a bug that spins does not make the node slow, it
      makes it unreachable — including to the kubelet. Linux reserves 5% of each
      second for normal tasks via `sched_rt_runtime_us`, which turns "gone" into
      "very slow", and that is the only thing standing between you and losing
      the node.


      So: it is a node-level grant wearing a container-level flag, and I would
      want a genuine deadline in the requirement before approving it —
      audio, motion control, a packet path — plus evidence the code blocks
      rather than spins. For nearly everything labelled "improve latency", the
      answer is a higher CPU request, a removed CPU limit, or fixing a thread
      pool sized from `nproc`, and none of those needs a capability.
    signal: >-
      Splitting the capability into its two powers is the first discriminator.
      Knowing that a real-time task must block — and what happens when it does
      not — is the second. Offering the unprivileged alternatives rather than
      just refusing is what makes the review useful instead of obstructive.
    follow_ups:
      - "What does sched_rt_runtime_us do, and when would you change it?"
      - "Which scheduling changes can a container make with no capability at all?"
      - "How would you find out whether the latency problem is even scheduling?"

  - id: i5
    level: L3
    question: >-
      Why is load average a poor signal for "are my processes waiting for CPU"?
    model_answer: >-
      Three reasons, and any one of them is enough.


      On Linux the load average counts tasks in uninterruptible sleep as well as
      runnable ones. That was a deliberate decision decades ago to make the
      number reflect "system busyness", and it means a machine blocked on a slow
      disk or an NFS mount shows a high load with a completely idle CPU. The
      number cannot distinguish the two cases you most need to distinguish.


      It is averaged over one, five and fifteen minutes, which hides exactly the
      bursts that damage tail latency. A minute containing ten seconds of severe
      queueing looks unremarkable.


      And it is system-wide, so it cannot attribute anything to a workload. On a
      shared node that is most of the question.


      What I would use instead: `vmstat`'s `r` column for runnable tasks right
      now, with no averaging; `/proc/pressure/cpu` or the per-cgroup
      `cpu.pressure` for stall time with history; and `schedstat` per thread when
      I want to know which of my threads waited and for how long. Load average
      survives because it is cheap to collect and easy to put on a screen, not
      because it answers anything.
    signal: >-
      The uninterruptible-sleep point is the one that separates people who have
      read about load average from people who have been misled by it. Naming
      concrete replacements, and ordering them from system-wide to per-thread, is
      what makes the answer actionable rather than a complaint.
    follow_ups:
      - "What would you put on a dashboard instead?"
      - "How does PSI differ from load average in what it measures?"
      - "When is load average actually the right thing to look at?"
