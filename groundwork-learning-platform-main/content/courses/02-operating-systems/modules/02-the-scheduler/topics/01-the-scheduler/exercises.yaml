topic: topic.the-scheduler

exercises:
  - id: e1
    title: Read three scheduler states
    level: L2
    objectives: [OBJ-A02.3.2]
    kind: interpretation
    prompt: >-
      Three processes on one node. For each, say its nice value, whether it can
      be preempted by an ordinary task, and one thing you can conclude about
      what it is doing.


      **A** — `policy: 0`, `prio: 139`, `se.load.weight: 15360`,
      `nr_voluntary_switches: 1022`, `nr_involuntary_switches: 87192`


      **B** — `policy: 0`, `prio: 120`, `se.load.weight: 1048576`,
      `nr_voluntary_switches: 1881044`, `nr_involuntary_switches: 3177`


      **C** — `policy: 1`, `prio: 9`, `nr_voluntary_switches: 400221`,
      `nr_involuntary_switches: 2`
    answer: >-
      A: nice 19 (139 − 120), preemptible by anything normal, and CPU-bound —
      almost all its switches are involuntary, so it wants CPU and keeps being
      stopped. B: nice 0, preemptible, and I/O-bound — 1.88 million voluntary
      switches means it blocks constantly and rarely wants a CPU for long. C: a
      SCHED_FIFO real-time task at priority 90, *not* preemptible by any normal
      task, and well-behaved — it blocks voluntarily, which is the thing a
      real-time task must do.
    explanation: >-
      The three readings are three different jobs for the same two lines.


      **A** is the weight problem. `prio 139` and weight 15360 are both nice 19,
      confirming each other. The switch ratio says it is not blocking, so it has
      work and is being stopped — the classic starved-by-weight profile, which
      only appears when neighbours are runnable.


      **B** is the elimination. A process that blocks 1.88 million times and is
      preempted 3177 is not waiting for CPU in any meaningful sense. If this
      service is slow, the CPU story can be dropped entirely, which is worth as
      much as diagnosing the other two.


      **C** needs the priority arithmetic read the other way. Real-time tasks
      occupy prio 0–99, *numerically below* every normal task, and `chrt` reports
      them inverted: `prio 9` is real-time priority 90. It preempts everything
      normal on its CPU the moment it is runnable.


      The reassuring part of C is the switch ratio. It blocks, 400221 times —
      which is what a correctly written real-time task does. One with the same
      policy and near-zero voluntary switches would be the emergency, because it
      would be spinning and nothing normal would run until the RT throttle
      intervened.

  - id: e2
    title: Predict the share
    level: L3
    objectives: [OBJ-A02.3.4]
    kind: calculation
    prompt: >-
      Weights: nice 0 is 1024, nice 5 is 335, nice 10 is 110, nice 19 is 15.


      Three CPU-bound tasks are pinned to one CPU: **P** at nice 0, **Q** at
      nice 5, **R** at nice 10.


      Give each task's share as a percentage. Then say what happens to P's share
      when a fourth task **S** at nice 0 joins, and what happens to R's.
    answer: >-
      Sum is 1024 + 335 + 110 = 1469. P = 69.7%, Q = 22.8%, R = 7.5%. With S
      added the sum becomes 2493: P falls to 41.1%, Q to 13.4%, R to 4.4%. P
      loses the most in absolute terms — 28.6 points — while every task keeps
      the same ratio to every other.
    explanation: >-
      The arithmetic is the whole mechanism: your share is your weight over the
      sum of runnable weights, so the denominator is shared by everyone and one
      new task rescales the lot.


      Two things worth taking from the second half. **The heaviest task loses
      the most absolute CPU**, which is counter-intuitive if you think of nice
      as protecting the important work — proportionality cuts both ways.
      **Relative shares are unchanged**: P is still 3.06× Q, exactly as before,
      because both numerators are untouched.


      And R, at 4.4%, is now nearly useless without anything about R having
      changed. This is what makes weight problems so hard to catch from a
      service's own metrics: the number that moved is in the denominator, and it
      belongs to somebody else.

  - id: e3
    title: Choose a policy for four workloads
    level: L3
    objectives: [OBJ-A02.3.6]
    kind: short_answer
    prompt: >-
      For each, give the scheduling policy or nice value you would use, and say
      whether it needs privilege:


      **A** — A nightly log compactor sharing a node with a latency-sensitive
      API.


      **B** — A cache warmer that should consume only genuinely idle CPU and can
      be abandoned at any time.


      **C** — An audio processing thread that must produce a buffer every 5ms.


      **D** — A CI build container on a shared cluster that should not slow
      anyone down but should finish as fast as possible when the cluster is
      quiet.
    answer: >-
      A: `SCHED_BATCH`, unprivileged — it removes the wake-up bonus so the
      compactor stops briefly preempting the API each time it wakes. B:
      `SCHED_IDLE`, unprivileged — it runs only when a CPU would otherwise be
      idle, which is exactly the requirement. C: `SCHED_FIFO` at a modest
      priority, needs `CAP_SYS_NICE`, and it must block between buffers. D: a
      low CPU *request* — a small weight — and no CPU limit; unprivileged, and
      the request is the Kubernetes spelling of nice.
    explanation: >-
      Each case is chosen by which property of the workload is load-bearing.


      **A** is about interference rather than share. The scheduler gives freshly
      woken tasks a small bonus so interactive work feels responsive; a compute
      job collects that bonus repeatedly, preempts the API each time, and gains
      nothing from it. `SCHED_BATCH` removes exactly that and nothing else.


      **B** says "genuinely idle" and "abandonable", which is SCHED_IDLE's
      definition. `nice 19` is the common substitute and is not the same thing —
      it still guarantees about 1.4% against a competitor, which for a cache
      warmer is 1.4% you did not want to give it.


      **C** has a real deadline, which is what the real-time classes are for.
      The capability requirement is the point: this thread will preempt every
      normal task on its CPU, so granting it is a decision about the whole
      machine. The design obligation is that it blocks — a real-time task that
      spins takes the machine with it.


      **D** is the Kubernetes shape of A, and the trap is reaching for a low CPU
      *limit* instead. A limit throttles the build even on an empty cluster,
      wasting the capacity you were trying to reclaim; a low request gets out of
      the way under contention and takes everything when nobody else wants it.

  - id: e4
    title: Read a latency budget
    level: L3
    objectives: [OBJ-A02.3.7]
    kind: interpretation
    prompt: >-
      A request takes 400ms at p99. Per-thread readings over the same window:


      ```text
      total CPU time consumed by the worker threads   8.1s
      total run-queue wait across the same threads  392.4s
      cpu.stat: nr_periods 6000  nr_throttled 5760
      cpu.max: 50000 100000
      requests served in the window                  1000
      ```


      Account for the 400ms. Say what you would change, and what you would
      expect to happen to p50 as well as p99.
    answer: >-
      Per request: 8.1ms of CPU and 392.4ms of queueing — the work is 2% of the
      latency and waiting is 98%. The cause is the quota: throttled in 96% of
      periods against half a CPU. Raise `limits.cpu` until the throttled ratio
      approaches zero, and check the thread count against the quota first. Both
      p50 and p99 should fall, but p99 much further, because tail latency is
      dominated by how many period boundaries a request happens to sit across.
    explanation: >-
      The division does the whole diagnosis: 8.1 seconds of CPU over 1000
      requests is 8.1ms each, against a 400ms p99. Ninety-eight percent of the
      latency is a queue.


      `nr_throttled / nr_periods` at 96% names the queue's owner. This is not a
      busy node or a noisy neighbour — the container is being stopped by its own
      limit, and a period is 100ms, which is suspiciously close to the shape of
      the tail.


      On what changes: p50 improves because requests stop waiting for a period
      boundary on average, but p99 improves far more, because the tail is
      composed of requests that sat across *several* boundaries. Throttling
      damages tails disproportionately, which is why a service can have a fine
      median and a terrible p99 while its utilisation graph is flat.


      The thread-count check first is not optional. If the pool was sized from
      the node's CPU count, doubling the quota leaves it still over-parallel,
      and you will have spent capacity to buy a fraction of the improvement that
      one environment variable would have given free.
