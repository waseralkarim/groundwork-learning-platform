id: quiz.the-scheduler
topic: topic.the-scheduler
pass_score: 70

questions:
  - id: q1
    type: single_choice
    level: L2
    objectives: [OBJ-A02.3.1]
    stem: What does the Linux scheduler mean by "fair"?
    options:
      - id: a
        text: Each task gets CPU in proportion to its weight, against the sum of all runnable weights
        correct: true
      - id: b
        text: Each runnable task gets an equal share of the CPU
        note: >-
          That would make nice meaningless. Equal shares is what you get only
          when every task happens to have the same weight.
      - id: c
        text: Each task gets the CPU it asks for, until the machine is saturated
        note: >-
          There is no asking. A task is runnable or it is not, and the scheduler
          arbitrates between the runnable ones by weight.
      - id: d
        text: Tasks are served in the order they became runnable
        note: >-
          That is first-come-first-served, which starves interactive work
          behind long-running jobs. Linux has not worked that way since the
          1990s.
    explanation: >-
      Proportional share: your fraction is your weight over the sum of all
      runnable weights. The denominator is the part people forget — it contains
      only runnable tasks, so your share changes when your neighbours wake up,
      with nothing about your own configuration having changed.

  - id: q2
    type: single_choice
    level: L2
    objectives: [OBJ-A02.3.1]
    stem: >-
      A process is niced to 19 on an otherwise idle machine. How much CPU does
      it get?
    options:
      - id: a
        text: All of it — the sum of runnable weights is its own weight, so the fraction is 1
        correct: true
      - id: b
        text: About 1.4%, since that is what weight 15 corresponds to
        note: >-
          1.4% is the share against one nice-0 competitor. With no competitor
          there is nothing to be 1.4% of.
      - id: c
        text: 5%, since nice 19 is the lowest of 40 levels
        note: >-
          The scale is geometric, not linear, and in any case a share requires
          somebody to share with.
      - id: d
        text: It depends on the CPU quota, which nice overrides
        note: >-
          A quota is a separate, absolute ceiling and nice never overrides it.
          Both apply, and neither is the other.
    explanation: >-
      A weight is a share of a *contended* resource. Alone, the denominator is
      your own weight and the fraction is 1 whatever the numerator is. This is
      why "I renamed it and nothing happened" is such a common wrong conclusion
      — the test contained no competition for the setting to arbitrate, and the
      failure mode arrives suddenly on the first busy afternoon.

  - id: q3
    type: single_choice
    level: L2
    objectives: [OBJ-A02.3.2]
    stem: >-
      `/proc/self/sched` shows `se.load.weight : 1048576`. What nice value is
      this?
    options:
      - id: a
        text: 0 — the weight is 1024, reported scaled by a further 1024
        correct: true
      - id: b
        text: −20, since that is the largest weight in the table
        note: >-
          Nice −20 is 88761, which scaled is 90891264 — nearly two orders of
          magnitude larger.
      - id: c
        text: It cannot be determined; load weight and nice are unrelated
        note: >-
          They are related by a fixed lookup table, which makes the mapping
          exact in both directions.
      - id: d
        text: 19 — the default for an unprivileged process
        note: >-
          The default is 0. Nice 19 reads as 15360, and unprivileged processes
          start at 0 like everything else.
    explanation: >-
      The weight table says 1024 for nice 0, and `/proc` reports it shifted by
      another 10 bits for the kernel's fixed-point arithmetic — so 1048576.
      Divide by 1024 to get the documented number. The `prio` line confirms it
      independently: for a normal task, prio is 120 + nice.

  - id: q4
    type: single_choice
    level: L2
    objectives: [OBJ-A02.3.2]
    stem: >-
      Which file tells you how long a specific task spent runnable but not
      running?
    options:
      - id: a
        text: '`/proc/PID/schedstat`, second field, in nanoseconds'
        correct: true
      - id: b
        text: '`/proc/PID/stat`, fields 14 and 15'
        note: >-
          Those are utime and stime — CPU time actually consumed. They say
          nothing about time spent queued.
      - id: c
        text: '`/proc/loadavg`, which is the run queue length over time'
        note: >-
          It is system-wide, averaged over minutes, and includes uninterruptible
          sleep. It cannot attribute waiting to a task.
      - id: d
        text: '`/proc/PID/status`, the `voluntary_ctxt_switches` line'
        note: >-
          Switch counts tell you how often a task stopped, not how long it then
          waited. Both are useful and they are different measurements.
    explanation: >-
      `schedstat` is three numbers: nanoseconds on a CPU, nanoseconds waiting on
      a run queue, and timeslices run. The second is scheduling latency, per
      task, maintained whether or not anyone reads it — and it is the number
      missing from most performance investigations.

  - id: q5
    type: single_choice
    level: L2
    objectives: [OBJ-A02.3.3]
    stem: A task shows 1.9 million voluntary switches and 3000 involuntary ones. What is it doing?
    options:
      - id: a
        text: Blocking on something external — it is I/O-bound, not CPU-bound
        correct: true
      - id: b
        text: Being preempted constantly by higher-priority work
        note: >-
          That would show as involuntary switches. Voluntary means the task gave
          the CPU up itself.
      - id: c
        text: Spinning in a busy loop
        note: >-
          A busy loop never blocks, so its switches are almost entirely
          involuntary. This is the opposite profile.
      - id: d
        text: Being throttled by its cgroup quota
        note: >-
          Quota throttling stops a runnable task, which the kernel counts as
          involuntary. A throttled task's counters look nothing like this.
    explanation: >-
      Voluntary means the task blocked — I/O, a lock, a sleep — and giving up
      the CPU was correct. This profile eliminates the entire CPU story in one
      reading: whatever is slow, it is not the run queue, and more CPU will not
      help.

  - id: q6
    type: single_choice
    level: L2
    objectives: [OBJ-A02.3.3]
    stem: >-
      A container with a CPU quota runs one busy loop with no competitor, and
      accumulates thousands of involuntary switches. Why?
    options:
      - id: a
        text: The quota preempts it at the end of every period, which counts as involuntary
        correct: true
      - id: b
        text: There must be a hidden competitor on the same CPU
        note: >-
          Possible in general, and ruled out here by `cpu.stat`: if nr_throttled
          is close to nr_periods, the preemption is its own quota.
      - id: c
        text: Involuntary switches are counted incorrectly inside containers
        note: >-
          They are counted the same way everywhere. What differs is that a
          container usually has a quota and a bare process usually does not.
      - id: d
        text: The busy loop yields the CPU periodically without blocking
        note: >-
          A yield without blocking would be voluntary, and a shell busy loop
          does not yield at all.
    explanation: >-
      Involuntary means "stopped while still runnable" — not "outbid by a
      neighbour". A quota produces exactly that at the end of every period, with
      no competitor anywhere. Conflating the two sends you hunting for a noisy
      neighbour who does not exist; `cpu.stat` separates them in one reading.

  - id: q7
    type: single_choice
    level: L3
    objectives: [OBJ-A02.3.4]
    stem: >-
      Two CPU-bound tasks share one CPU: one at nice 0, one at nice 19. Roughly
      what CPU does the nice-19 task get?
    options:
      - id: a
        text: About 1.4% — the weights are 1024 and 15
        correct: true
      - id: b
        text: About 25%, since nice 19 is roughly a quarter as important
        note: >-
          That is a linear intuition applied to a geometric scale. Each nice
          step is about 1.25×, not a fixed subtraction.
      - id: c
        text: About 50%, since nice only affects tie-breaking
        note: >-
          Nice sets the weight, which is the entire basis of the share. It is
          not a tie-break.
      - id: d
        text: Nothing at all — nice 19 tasks run only when the CPU is idle
        note: >-
          That is SCHED_IDLE, a separate policy. Nice 19 still gets a small,
          guaranteed, non-zero share.
    explanation: >-
      15 / (1024 + 15) is 1.4%. Each nice step multiplies the weight by about
      1.25, so nineteen steps is roughly 68× — which is measurable in a lab in
      about ninety seconds, and comes out around 70:1 once the quota and
      start-up ordering are accounted for.

  - id: q8
    type: single_choice
    level: L3
    objectives: [OBJ-A02.3.4]
    stem: >-
      You need a batch job to never take more than a quarter of a machine, even
      when the machine is empty. Is nice the right tool?
    options:
      - id: a
        text: 'No — nice is a weight, and a weight does nothing without contention. Use `cpu.max`'
        correct: true
      - id: b
        text: 'Yes — nice 15 corresponds to roughly a quarter share'
        note: >-
          It corresponds to a quarter share *against a specific competitor*.
          With no competitor it gets everything, which is the requirement being
          violated.
      - id: c
        text: 'Yes, provided you also set SCHED_BATCH'
        note: >-
          SCHED_BATCH removes the wake-up bonus. It is not a ceiling either, and
          adding it changes nothing about this requirement.
      - id: d
        text: 'No — use SCHED_IDLE, which caps a task at 25% of a CPU'
        note: >-
          SCHED_IDLE has no percentage at all. It runs whenever nothing else
          wants the CPU, which on an empty machine is all the time.
    explanation: >-
      A weight is a share of what is contended; a limit is a ceiling enforced
      regardless. "Never more than a quarter, even when the machine is empty" is
      a ceiling, so it is `cpu.max` — or a Kubernetes CPU *limit*. Wanting the
      job to get out of the way only under contention is the other requirement,
      and that one is a weight, or a CPU *request*.

  - id: q9
    type: single_choice
    level: L3
    objectives: [OBJ-A02.3.5]
    stem: What did EEVDF add that CFS could not express?
    options:
      - id: a
        text: A way for a task to ask to be scheduled more *often* without receiving more total CPU
        correct: true
      - id: b
        text: Proportional shares based on weight, which CFS lacked
        note: >-
          CFS was built entirely on weighted vruntime. EEVDF kept that machinery
          unchanged.
      - id: c
        text: Support for real-time policies alongside normal tasks
        note: >-
          SCHED_FIFO and SCHED_RR are separate scheduling classes and predate
          both by many years.
      - id: d
        text: Per-cgroup fairness, so containers get their configured shares
        note: >-
          Group scheduling existed under CFS and is what made `cpu.weight` work
          in the first place.
    explanation: >-
      CFS was fair about *how much* CPU a task got and had no way to express
      *how often* it needed to run. EEVDF adds eligibility — you cannot be
      picked while you have run ahead of your share — and a virtual deadline
      derived from a requested slice. A task asking for a shorter slice gets a
      nearer deadline, so it runs sooner and more often for the same total CPU.

  - id: q10
    type: single_choice
    level: L3
    objectives: [OBJ-A02.3.5]
    stem: >-
      You find tuning advice recommending changes to `sched_latency_ns` and
      `sched_min_granularity_ns`. What should you conclude?
    options:
      - id: a
        text: It predates kernel 6.6 — EEVDF removed both tunables
        correct: true
      - id: b
        text: It is current, and those are the main scheduler tunables
        note: >-
          They were the main CFS tunables. On any 6.6+ kernel the files do not
          exist.
      - id: c
        text: They are container-specific and only apply inside a cgroup
        note: >-
          They were system-wide sysctls under `/proc/sys/kernel/`, with no
          per-cgroup form.
      - id: d
        text: They still exist but were renamed to `sched_base_slice_ns`
        note: >-
          EEVDF's base slice is a related concept, and it replaces rather than
          renames them — the semantics are different, not the spelling.
    explanation: >-
      Under CFS, slice length fell out of a target latency divided by the number
      of runnable tasks, which is what those two tunables configured. EEVDF
      derives slices from per-task requests instead, so both were removed. Advice
      referencing them tells you its vintage, which is useful in itself.

  - id: q11
    type: single_choice
    level: L3
    objectives: [OBJ-A02.3.6]
    stem: >-
      Which scheduling change can an unprivileged process make to its own
      workload?
    options:
      - id: a
        text: Setting SCHED_BATCH or SCHED_IDLE, or raising its nice value
        correct: true
      - id: b
        text: Setting SCHED_FIFO at a low real-time priority
        note: >-
          Any real-time priority needs CAP_SYS_NICE, because even priority 1
          preempts every normal task on the CPU.
      - id: c
        text: Lowering its nice value to −5
        note: >-
          Negative nice takes CPU from neighbours, so it needs CAP_SYS_NICE or
          an RLIMIT_NICE allowance.
      - id: d
        text: None of these without CAP_SYS_NICE
        note: >-
          Three of them are unprivileged, and two of those — BATCH and IDLE —
          are genuinely useful and almost never used.
    explanation: >-
      The pattern is consistent: operations that only lower your own standing are
      free, and operations that raise it above your neighbours' need a
      capability. SCHED_BATCH removes the wake-up bonus, SCHED_IDLE runs only on
      spare CPU, and positive nice gives share away — all harmless to others, all
      unprivileged.

  - id: q12
    type: single_choice
    level: L3
    objectives: [OBJ-A02.3.6]
    stem: >-
      What does `/proc/sys/kernel/sched_rt_runtime_us` set to 950000 protect
      against?
    options:
      - id: a
        text: A real-time task that never blocks monopolising the CPU and making the machine unreachable
        correct: true
      - id: b
        text: Too many real-time tasks being created at once
        note: >-
          It bounds their CPU time, not their number. One task is enough to
          cause the problem it prevents.
      - id: c
        text: Real-time tasks exceeding their cgroup CPU quota
        note: >-
          Cgroup quotas are enforced separately by `cpu.max`. This valve is
          system-wide and specific to the real-time classes.
      - id: d
        text: Normal tasks being starved by a high nice value
        note: >-
          Nice is a weight, and even nice 19 gets a small guaranteed share. It
          cannot starve anyone completely.
    explanation: >-
      A runnable SCHED_FIFO task preempts every normal task and runs until it
      blocks. One that spins does not make the machine slow — it makes it
      unavailable, including to the shell you would use to kill it. Reserving
      50ms of every second for normal tasks is what turns that into "very slow"
      rather than "gone", and setting the value to −1 removes the valve.

  - id: q13
    type: single_choice
    level: L3
    objectives: [OBJ-A02.3.7]
    stem: >-
      A process's `schedstat` shows almost no waiting, but the service is slow
      and multithreaded. What is the most likely mistake?
    options:
      - id: a
        text: Reading the process instead of its threads — the main thread often does nothing
        correct: true
      - id: b
        text: Scheduler statistics are disabled, so the numbers are meaningless
        note: >-
          Worth checking with `sched_schedstats`, and it would show zeros in
          *both* fields rather than a plausible small wait.
      - id: c
        text: schedstat resets when a task migrates between CPUs
        note: >-
          The counters are cumulative for the life of the task and survive
          migration.
      - id: d
        text: The units are microseconds, so the numbers look smaller than they are
        note: >-
          They are nanoseconds. Misreading the unit would make waiting look
          *larger*, not smaller.
    explanation: >-
      A process's own `schedstat` covers its main thread only. In a JVM, a Go
      binary or nginx, the main thread frequently supervises and blocks while
      every worker queues. Reading `/proc/PID/task/*/schedstat` is the fix, and
      not doing it is the commonest way to conclude wrongly that there is no
      scheduling delay.

  - id: q14
    type: single_choice
    level: L3
    objectives: [OBJ-A02.3.8]
    stem: >-
      A node is at 44% CPU and three services on it all have bad tail latency.
      What does the node figure tell you?
    options:
      - id: a
        text: Almost nothing — it averages over CPUs, over time and over cgroups, and each average can hide a different problem
        correct: true
      - id: b
        text: There is spare capacity, so the problem is not CPU-related for any of them
        note: >-
          A container throttled at its own quota is a CPU problem happening on a
          node with plenty of CPU. Both statements are true at once.
      - id: c
        text: The services are misconfigured, since correctly sized services would use the node
        note: >-
          Nothing about good configuration implies high node utilisation, and
          the figure cannot distinguish good from bad configuration anyway.
      - id: d
        text: There is a scheduling problem, since latency is bad while the CPU is idle
        note: >-
          Likely for some of them and not established. One of the three may not
          be waiting for CPU at all, which per-task counters would show.
    explanation: >-
      Node utilisation is an average three times over. Over CPUs, so a saturated
      core hides among idle ones. Over time, so 600ms of saturation and 400ms of
      idle reads as 60%. Over cgroups, so a throttled container contributes only
      its quota however desperate it is. `schedstat` per task has none of those
      problems.

  - id: q15
    type: single_choice
    level: L3
    objectives: [OBJ-A02.3.8]
    stem: >-
      A service is fine at night and slow every working day. Its own metrics
      show no change between the two. What should you check first?
    options:
      - id: a
        text: Its weight — a nice value or CPU request only bites when neighbours are runnable
        correct: true
      - id: b
        text: Its memory limit, since daytime traffic means more allocation
        note: >-
          Plausible, and it would show in its own metrics — memory.current,
          oom_kill, memory.pressure would all move. The premise says nothing did.
      - id: c
        text: Its CPU limit, since it must be hitting the quota during the day
        note: >-
          Also worth checking, and also visible in its own metrics as
          nr_throttled. The distinguishing feature here is that nothing of its
          own changed.
      - id: d
        text: DNS, since resolution latency varies with load
        note: >-
          A reasonable general instinct and not what "nothing about it changed
          except the time of day" points at.
    explanation: >-
      "Nothing of ours changed" plus "only when others are busy" is the
      signature of a weight problem. A weight does nothing without contention, so
      a low nice value or a small CPU request is invisible on a quiet node and
      decisive on a busy one — and the change happens in the *denominator*, which
      is not in the service's own metrics at all.
