id: troubleshooting.the-cpu-is-not-busy
topic: topic.the-scheduler
title: Every graph says there is spare CPU and every request is slow
level: L3
objectives: [OBJ-A02.3.8, OBJ-A02.3.7]
reveal_policy: progressive

situation: >-
  A search API's p99 went from 120ms to 1.8 seconds after a migration from VMs
  to Kubernetes. The code is identical — same commit, same binary, same
  dependencies.


  The platform team have checked node CPU (44%), node memory (61%), disk
  (nothing), and network (nothing). They have offered a larger node type. The
  application team have profiled the binary under the same load on a laptop and
  found nothing — 8ms of CPU per request, as it always was.


  Both teams are correct about what they measured, and the conversation has been
  going in circles for four days. The application team now want to roll back to
  VMs.


  Work out what is happening before reading on.

symptoms:
  - "p99 1.8s in Kubernetes, 120ms on the old VMs, same binary"
  - "p50 also worse — 210ms against 40ms — but far less dramatically"
  - "Node CPU utilisation 44%, steady"
  - "The container's own CPU utilisation sits at 99% of its limit, flat"
  - "A local profile shows 8ms of CPU per request, unchanged"
  - "Doubling the replica count improved throughput and not latency"

artifacts:
  - type: command_output
    label: Inside the pod
    content: |
      $ nproc
      32

      $ cat /sys/fs/cgroup/cpu.max
      50000 100000

      $ cat /sys/fs/cgroup/cpu.stat
      usage_usec      299104000
      nr_periods         6000
      nr_throttled       5760
      throttled_usec 1884221000

      $ cat /sys/fs/cgroup/cpu.pressure
      some avg10=68.44 avg60=67.80 avg300=67.11 total=1904772311
      full avg10=68.40 avg60=67.77 avg300=67.09 total=1903991044

  - type: command_output
    label: Per-thread run-queue wait, same 600-second window
    content: |
      $ for t in /proc/1/task/*; do printf '%s %s\n' "$(basename $t)" "$(cat $t/schedstat)"; done | head -6
      1     9410000000 12208400000  30822
      14    9388200000 12244100000  30740
      15    9401100000 12219800000  30801
      16    9377400000 12266300000  30688
      17    9392600000 12233700000  30755
      ...   (32 threads in total)

      # totals across all 32 threads
      # on-cpu   300.1s
      # waiting  391.4s

  - type: config
    label: The deployment
    content: |
      resources:
        requests: { cpu: 200m, memory: 1Gi }
        limits:   { cpu: 500m, memory: 2Gi }
      # no GOMAXPROCS, no thread-pool configuration

  - type: metric
    label: The dashboard the platform team are looking at
    content: |
      node_cpu_utilisation                       44%
      container_cpu_usage / container_cpu_limit  99%   "at its limit, needs more"
      container_memory_working_set / limit       38%
      kube_pod_container_status_restarts_total   0

  - type: log
    label: The old VM deployment, for comparison
    content: |
      # systemd unit on the VM fleet — no CPUQuota, 4 vCPU box
      [Service]
      ExecStart=/srv/search-api
      # (no resource directives of any kind)

diagnostic_questions:
  - "Over the 600-second window, how much CPU did the work need and how much time did it spend queued?"
  - "What is nr_throttled divided by nr_periods, and what does a period boundary have to do with a tail?"
  - "How many threads is the process running, and what is it entitled to?"
  - "Why did the old VM deployment not have this problem, given the same binary?"
  - "Why did doubling the replicas improve throughput but not latency?"

hints:
  - "Add up the per-thread numbers. One column is the work and the other is the queue."
  - "Compare nproc with cpu.max. Then read the deployment for what is missing."
  - "A CFS period is 100ms. Look at the shape of the tail."
  - "The VM had no CPUQuota at all, which is a difference in the environment, not the code."

root_cause: >-
  Two defects compounding, both introduced by the migration and neither present
  in the code.


  **The quota is too small for the work.** 300 seconds of CPU consumed in a
  600-second window against a half-CPU quota means the container wants roughly
  its entire allowance continuously. `nr_throttled / nr_periods` is 5760/6000 —
  96% of periods end early — and the container is stopped for the remainder of
  each one.


  **The thread pool was sized from the node.** `nproc` reports 32 because the
  cgroup does not change the CPU mask, so the runtime started 32 worker threads
  to share half a CPU. Thirty-two runnable threads rotate through a 50ms
  allowance, each switch discarding the cache the previous thread had warmed,
  and a request may wait through several rotations before its own thread is
  picked.


  The per-thread totals give the latency budget directly: 300 seconds on a CPU
  against 391 seconds queued. The work is 43% of the elapsed time and the queue
  is 57% — and per request that is 8ms of CPU against roughly 200ms of waiting
  at the median, far more at the tail.


  The old VM had no `CPUQuota` at all. Same binary, same 32 threads, four real
  vCPUs and no ceiling — so nothing queued and nobody ever discovered that the
  thread pool was sized from the hardware. The migration did not expose a bug in
  the code; it applied a constraint the code had never been asked to respect.


  Doubling the replicas improved throughput because there were twice as many
  quotas. It did not improve latency because each replica has the same quota and
  the same 32 threads, so a single request's experience is unchanged.

method: >-
  **1. Take the per-thread reading, not the process reading.** This is the step
  that breaks the deadlock, and it is one loop:


  ```bash
  for t in /proc/1/task/*; do cat "$t/schedstat"; done
  ```


  300 seconds of work against 391 seconds of queueing is not a matter of
  opinion, and it is not visible in any of the graphs either team was looking
  at. It says the latency is a queue, in the service's own threads, in
  nanoseconds.


  **2. Find the queue's owner.** `nr_throttled / nr_periods` at 96% says the
  container is being stopped by its own limit. That settles the argument about
  node capacity: both teams were right, and the node was never the constraint.


  **3. Read the two CPU counts.** `nproc` 32 against `cpu.max` of half a CPU,
  with no `GOMAXPROCS` in the manifest. That is the second defect, and it is the
  one that makes the tail as bad as it is.


  **4. Explain why the VM was fine, or the rollback wins the argument.** The
  code is identical, so the difference is environmental: the VM unit had no
  `CPUQuota`, so 32 threads on 4 vCPUs was merely slightly wasteful. The
  container applies a ceiling the code was never written to notice. Without this
  step the team reasonably concludes that Kubernetes is the problem.


  **5. Explain the failed remedy.** More replicas is more quotas, which is
  throughput. A single request still runs inside one replica's quota, so its
  latency is untouched. "We scaled and it did not help" is evidence about the
  shape of the problem, not a reason to scale further.


  The general habit: when two teams each measure correctly and disagree, the
  answer is usually a third measurement neither of them is taking. Here it was
  per-thread queue time, and it took ten seconds.

resolution: >-
  **Fix the thread count first — it is free and it changes what the right quota
  is.**


  ```yaml
  env:
    - name: GOMAXPROCS
      valueFrom:
        resourceFieldRef: { resource: limits.cpu }
  ```


  Or import `go.uber.org/automaxprocs`, which reads `cpu.max` at startup.
  Whichever runtime this is, the same defect has a local name: `GOMAXPROCS`,
  `UV_THREADPOOL_SIZE`, `worker_processes`, JVM common-pool sizing, `-j$(nproc)`.
  Expect most of the tail to disappear on this change alone, because the
  scheduler stops rotating 32 threads through an allowance that fits one.


  **Then size the quota from a measurement.**


  The container consumed 300 CPU-seconds in 600 seconds — half a CPU
  *continuously*, which is exactly its limit, which means the limit is capping
  real demand rather than a runaway. Raise `limits.cpu` until
  `nr_throttled / nr_periods` is near zero at target throughput, and put the
  measurement in a comment beside the number. Also raise `requests.cpu`, which
  is currently 200m and is what the scheduler uses to place the pod.


  Expect p50 and p99 both to improve, and p99 far more. Tail latency is composed
  of requests that happened to sit across several period boundaries, so removing
  the boundaries helps the tail disproportionately.


  **Consider removing the CPU limit for this service.** With `requests.cpu` set,
  `cpu.weight` still protects the neighbours under contention, and there is then
  no ceiling to be throttled by. The argument against is that one buggy replica
  can consume a node's spare CPU — a real risk you can now weigh against a
  measured 96% throttling rate rather than against a feeling.


  **Then fix the dashboard, because it actively misled.** The panel reading
  "container CPU 99% of limit" was interpreted as healthy saturation. Add:


  ```promql
  rate(container_cpu_cfs_throttled_periods_total[5m])
    / rate(container_cpu_cfs_periods_total[5m])
  ```


  Four days of two teams talking past each other is its own incident. Both had
  the data; neither had the panel that turns it into a claim.
