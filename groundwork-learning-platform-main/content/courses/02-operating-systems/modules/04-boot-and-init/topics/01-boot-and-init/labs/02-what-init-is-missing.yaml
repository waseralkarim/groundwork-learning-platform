id: lab.what-init-is-missing
topic: topic.boot-and-init
title: Find out what your container has instead of an init
type: guided
tier: 2
image: groundwork/lab-foundations:1
duration_minutes: 25
objectives: [OBJ-A02.5.7]

intro: >-
  On a machine, PID 1 is systemd, and it does four jobs nobody thinks about:
  reaps orphans, forwards shutdown signals, orders and restarts services, and
  gives every one of them a cgroup.


  In this container PID 1 is a shell. You will confirm which of those four jobs
  is actually being done here, and then demonstrate the kernel rule that makes
  the second one fail — safely, by sending your own init a signal it will accept
  and ignore. That single behaviour is why `docker stop` takes ten seconds, why
  `--init` exists, and why every pod in a badly-behaved deployment takes its
  full grace period to delete.

setup:
  - /opt/lab/seed.sh

steps:
  - id: s1
    instruction: >-
      Establish what PID 1 is here. Save its command name and full command line
      to /tmp/answer-pid1.
    hint: "`/proc/1/comm` and `/proc/1/cmdline` — the latter is NUL-separated."
    walkthrough: |
      {
        echo "comm=$(cat /proc/1/comm)"
        printf 'cmdline='
        tr '\0' ' ' < /proc/1/cmdline
        echo
      } > /tmp/answer-pid1
      cat /tmp/answer-pid1
    verify:
      - type: file_matches
        path: /tmp/answer-pid1
        pattern: 'comm=\S+'
        describe: PID 1 was identified
      - type: command_exit
        command: "grep -q 'comm=systemd' /tmp/answer-pid1"
        exit_code: 1
        describe: And it is not systemd — this container has no init

  - id: s2
    instruction: >-
      Run the standard test for "is systemd PID 1 on this machine", and record
      the result — the word `yes` or `no` — in /tmp/answer-has-systemd.
    hint: >-
      Tools check for a directory under /run that systemd creates only when it
      is actually running as PID 1.
    walkthrough: |
      ls /run/systemd/system 2>&1 || true
      if [ -d /run/systemd/system ]; then echo yes > /tmp/answer-has-systemd; else echo no > /tmp/answer-has-systemd; fi
      cat /tmp/answer-has-systemd
    verify:
      - type: file_matches
        path: /tmp/answer-has-systemd
        pattern: '^no$'
        describe: /run/systemd/system does not exist, so systemd is not PID 1

  - id: s3
    instruction: >-
      Now the demonstration. Send SIGTERM to PID 1 — your own init — and record
      both the exit status of `kill` and whether PID 1 survived, in
      /tmp/answer-sigterm.


      This is safe. Read the next step before worrying about it.
    hint: >-
      `kill -TERM 1; echo "rc=$?"`, then check /proc/1/comm again a second
      later.
    walkthrough: |
      kill -TERM 1 2>&1
      echo "rc=$?" > /tmp/answer-sigterm
      sleep 1
      echo "alive=$(cat /proc/1/comm 2>/dev/null || echo GONE)" >> /tmp/answer-sigterm
      cat /tmp/answer-sigterm
    verify:
      - type: file_matches
        path: /tmp/answer-sigterm
        pattern: '^rc=0$'
        describe: The kernel accepted the signal — this was not a permission failure
      - type: file_matches
        path: /tmp/answer-sigterm
        pattern: 'alive=\S+'
        describe: And PID 1 is still running

  - id: s4
    instruction: >-
      The signal was accepted and nothing happened. Explain why in
      /tmp/answer-why-survived — and be precise about what the kernel did with
      it.


      It was not blocked, and it was not a permission error.
    hint: >-
      For an ordinary process, a signal with no handler gets the kernel's
      default action. PID 1 is exempt from that rule.
    walkthrough: |
      grep -E '^Sig(Blk|Ign|Cgt)' /proc/1/status
      echo "the kernel does not apply default signal actions to pid 1, so a signal with no handler installed is discarded rather than terminating it; kill returned 0 because the signal was delivered to the process, and the process simply had nothing registered to do with it" > /tmp/answer-why-survived
    verify:
      - type: file_matches
        path: /tmp/answer-why-survived
        pattern: "default|handler|discard"
        describe: You identified the missing default action rather than a block or a permission denial
      - type: command_exit
        command: "test $(wc -w < /tmp/answer-why-survived) -ge 15"
        exit_code: 0
        describe: You wrote a real explanation

  - id: s5
    instruction: >-
      Capture the evidence that it was not simply blocked or explicitly ignored.
      Save PID 1's three signal masks to /tmp/answer-masks, and a child
      process's for comparison.
    hint: >-
      `SigBlk`, `SigIgn` and `SigCgt` in /proc/PID/status. Read a child's from
      inside that child — /proc/self inside a `grep` is grep.
    walkthrough: |
      {
        echo "== pid 1"
        grep -E '^Sig(Blk|Ign|Cgt)' /proc/1/status
        echo "== a child"
        bash -c 'grep -E "^Sig(Blk|Ign|Cgt)" /proc/$$/status'
      } > /tmp/answer-masks
      cat /tmp/answer-masks
    verify:
      - type: file_matches
        path: /tmp/answer-masks
        pattern: 'SigCgt:\s+[0-9a-f]+'
        describe: The caught-signal mask was captured for both
      - type: command_exit
        command: "grep -A3 'pid 1' /tmp/answer-masks | grep -qE 'SigIgn:\\s+0*[0-9a-f]+'"
        exit_code: 0
        describe: PID 1's explicitly-ignored set is visible, and SIGTERM is not the reason it survived

  - id: s6
    instruction: >-
      Now the job nobody is doing. Write to /tmp/answer-orphans what happens in
      this container when a process's parent exits before it does, and who is
      responsible for collecting it.
    hint: >-
      Orphans are reparented to PID 1. Ask what PID 1 here — a shell running
      your entrypoint — does about that.
    walkthrough: |
      ps -ef
      echo "orphans are reparented to pid 1, which here is the entrypoint shell rather than an init written to reap them, so their exit statuses are never collected and they accumulate as zombies in the process table for the life of the container" > /tmp/answer-orphans
    verify:
      - type: file_matches
        path: /tmp/answer-orphans
        pattern: "reparent|adopt|pid 1|PID 1"
        describe: You identified reparenting to PID 1
      - type: file_matches
        path: /tmp/answer-orphans
        pattern: "zombie|reap|collect"
        describe: And that nobody is reaping them here

  - id: s7
    instruction: >-
      Write to /tmp/answer-consequences the two costs this imposes on a
      deployment — one line each — given what you have just demonstrated.
    hint: >-
      One is about how long a stop takes and what is lost during it. The other
      is about what accumulates over the life of a long-running container.
    walkthrough: |
      {
        echo "docker stop and kubernetes both send SIGTERM first, and an application at pid 1 that installed no handler ignores it, so every stop waits the full grace period and then gets SIGKILL, dropping in-flight requests and unflushed buffers"
        echo "orphaned child processes are never reaped, so a long-running container slowly fills its pid namespace with zombies until it hits the pids limit"
      } > /tmp/answer-consequences
      cat /tmp/answer-consequences
    verify:
      - type: file_matches
        path: /tmp/answer-consequences
        pattern: "SIGTERM|SIGKILL|grace"
        describe: You named the shutdown cost
      - type: file_matches
        path: /tmp/answer-consequences
        pattern: "zombie|reap|pids"
        describe: And the reaping cost

  - id: s8
    instruction: >-
      Last one. Write to /tmp/answer-fixes the two fixes, and say why they are
      not alternatives.
    hint: >-
      One is a change to the application. The other is a change to how the
      container is run. Each solves something the other does not.
    walkthrough: |
      {
        echo "handle SIGTERM in the application, which is correct regardless and is the only thing that can drain connections and flush state properly"
        echo "run a real init with docker run --init or tini as the entrypoint, which forwards signals to the application and reaps orphans"
        echo "they are not alternatives: an init can forward a signal but cannot shut your service down gracefully, and a signal handler cannot reap processes it never started"
      } > /tmp/answer-fixes
      cat /tmp/answer-fixes
    verify:
      - type: file_matches
        path: /tmp/answer-fixes
        pattern: "SIGTERM"
        describe: You named handling the signal in the application
      - type: file_matches
        path: /tmp/answer-fixes
        pattern: "--init|tini|dumb-init"
        describe: And running a real init
      - type: file_matches
        path: /tmp/answer-fixes
        pattern: "not alternatives|both|each"
        describe: And said why both are needed

solution: |
  ```bash
  cat /proc/1/comm                       # bash — not systemd
  ls /run/systemd/system                 # absent: systemd is not PID 1 here

  kill -TERM 1; echo $?                  # 0 — accepted
  sleep 1; cat /proc/1/comm              # still alive

  grep -E '^Sig(Blk|Ign|Cgt)' /proc/1/status
  ```

  **What you just demonstrated.**

  **`kill` returned 0 and nothing happened.** That combination is the whole
  lesson. A return of 0 means the signal was delivered — not blocked by
  permissions, not aimed at a process that does not exist. It simply had no
  effect.

  For an ordinary process, a signal with no installed handler gets the kernel's
  **default action**, and SIGTERM's default is to terminate. PID 1 is exempt:
  the kernel does not apply default actions to it. A signal PID 1 has not
  explicitly asked for is discarded.

  The signal masks confirm it was not something more ordinary. `SigBlk` is what
  is blocked, `SigIgn` is what was explicitly set to `SIG_IGN`, and `SigCgt` is
  what has a handler. SIGTERM is in none of them — there was nothing to run, so
  nothing ran.

  This rule exists so the machine's init cannot be killed by a stray signal.
  Applied to a container, where PID 1 is your application, it becomes a bug.

  **The four jobs of an init, and which this container has:**

  | Job | Here |
  |---|---|
  | Reap orphaned children | **No** — a shell running your entrypoint does not |
  | Forward shutdown signals to the real process | **No** |
  | Start, order and restart services | **No** — there is one process |
  | Put each service in its own cgroup | Not needed — the container *is* the cgroup |

  **Two costs, both familiar once named.**

  `docker stop` sends SIGTERM, waits ten seconds, then sends SIGKILL. Kubernetes
  does the same thing over `terminationGracePeriodSeconds`, thirty by default. An
  application at PID 1 with no handler ignores the first and dies to the second,
  every time — so every stop takes the full grace period, and in-flight requests,
  unflushed buffers and undrained connections are lost at the end of it.

  If every pod in a deployment takes exactly thirty seconds to terminate, nothing
  is handling SIGTERM. That is a diagnosis, not a coincidence.

  Second, orphans are reparented to PID 1 and never collected. A long-running
  container that shells out — a cron-like loop, a subprocess-per-request design
  — accumulates zombies until it reaches its `pids.max`, which then presents as
  "fork: Resource temporarily unavailable" and looks nothing like the cause.

  **Both fixes, because they solve different halves.**

  ```dockerfile
  # 1. handle the signal — correct regardless of anything else
  # (in the application: trap SIGTERM, stop accepting, drain, exit)

  # 2. give the container a real init
  ENTRYPOINT ["/sbin/tini", "--", "/usr/local/bin/app"]
  ```

  ```bash
  docker run --init myimage        # the same thing, without changing the image
  ```

  An init forwards SIGTERM to your process and reaps orphans. It cannot shut your
  service down gracefully — only your code knows what draining means. And a
  signal handler cannot reap processes your application never started. Neither
  substitutes for the other.

  **Where this goes.** **C16** covers `--init` and tini directly. In **E29**, the
  same story appears as pods that always take their full grace period, and the
  same fix applies — plus `preStop` hooks, which exist because sometimes even a
  correct SIGTERM handler needs a moment's warning before the endpoint is
  removed from the Service.
