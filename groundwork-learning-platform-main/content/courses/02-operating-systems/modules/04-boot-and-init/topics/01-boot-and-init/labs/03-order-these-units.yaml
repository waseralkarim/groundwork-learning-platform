id: lab.order-these-units
topic: topic.boot-and-init
title: Work out the start order, then find the race
type: guided
tier: 2
image: groundwork/lab-foundations:1
duration_minutes: 30
objectives: [OBJ-A02.5.4, OBJ-A02.5.5]

intro: >-
  Five unit files are in /tmp/units. They belong to one application — a
  database, a migration, an API, a metrics agent and a cache warmer — and
  between them they use every dependency directive that matters.


  Work out what order systemd starts them in. Then find the unit that will come
  up at the wrong moment, and say why the bug is intermittent: it works on a
  developer's laptop and fails on a loaded node, which is what makes it expensive
  to diagnose from the symptom.

setup:
  - /opt/lab/seed.sh
  - /opt/lab/seed-init.sh

steps:
  - id: s1
    instruction: >-
      Get the shape of the problem first. Extract every ordering and requirement
      directive from all five units, labelled by unit, into /tmp/answer-edges.
    hint: >-
      The directives are `Requires=`, `Wants=`, `After=`, `Before=`, `PartOf=`
      and `BindsTo=`. `grep -H` keeps the filename.
    walkthrough: |
      grep -H -E '^(Requires|Wants|After|Before|PartOf|BindsTo)=' /tmp/units/*.service \
        | sed 's|/tmp/units/||' > /tmp/answer-edges
      cat /tmp/answer-edges
    verify:
      - type: file_matches
        path: /tmp/answer-edges
        pattern: 'api.service:Requires=postgres.service'
        describe: api requires postgres
      - type: file_matches
        path: /tmp/answer-edges
        pattern: 'migrate.service:Before=api.service'
        describe: And migrate declares it must run before api

  - id: s2
    instruction: >-
      Record each unit's `Type=`, in /tmp/answer-types.


      The type decides when a unit counts as started, which is half of what an
      ordering edge actually means.
    hint: "`grep -H '^Type=' /tmp/units/*.service`"
    walkthrough: |
      grep -H '^Type=' /tmp/units/*.service | sed 's|/tmp/units/||' > /tmp/answer-types
      cat /tmp/answer-types
    verify:
      - type: file_matches
        path: /tmp/answer-types
        pattern: 'postgres.service:Type=notify'
        describe: postgres reports its own readiness
      - type: file_matches
        path: /tmp/answer-types
        pattern: 'migrate.service:Type=oneshot'
        describe: And migrate runs to completion

  - id: s3
    instruction: >-
      Now write the start order you expect, to /tmp/answer-order — one unit per
      line, earliest first.


      Use only the ordering directives. Requirement directives do not order
      anything.
    hint: >-
      Build the graph from `After=` and `Before=` alone. Two of these units have
      no ordering relationship with each other at all.
    walkthrough: |
      {
        echo postgres.service
        echo migrate.service
        echo api.service
        echo metrics-agent.service
        echo cache-warmer.service
      } > /tmp/answer-order
      cat /tmp/answer-order
    verify:
      - type: command_exit
        command: "head -1 /tmp/answer-order | grep -q postgres"
        exit_code: 0
        describe: postgres is first — everything else is ordered after it
      - type: command_exit
        command: "awk '/migrate/{m=NR} /^api/{a=NR} END{exit (m && a && m < a) ? 0 : 1}' /tmp/answer-order"
        exit_code: 0
        describe: migrate runs before api, as its Before= demands

  - id: s4
    instruction: >-
      One of those orderings is not actually guaranteed by the files. Find the
      unit whose ordering depends on another unit's declaration rather than its
      own, and name it in /tmp/answer-borrowed.
    hint: >-
      Read api.service on its own, with the others covered up. What does it say
      about *when* it may start?
    walkthrough: |
      cat /tmp/units/api.service
      echo api.service > /tmp/answer-borrowed
    verify:
      - type: file_matches
        path: /tmp/answer-borrowed
        pattern: '^api.service$'
        describe: api has no After= of its own — it is ordered only by migrate's Before=

  - id: s5
    instruction: >-
      State the bug precisely. Write to /tmp/answer-bug what api.service is
      missing and what happens without it.
    hint: >-
      `Requires=` answers whether. Something else answers when. api declares one
      and not the other.
    walkthrough: |
      echo "api.service has Requires=postgres.service but no After=postgres.service, so the requirement pulls postgres in without ordering anything; systemd starts both at the same instant and api races postgres, connecting to a database that may still be initialising" > /tmp/answer-bug
    verify:
      - type: file_matches
        path: /tmp/answer-bug
        pattern: "After="
        describe: You named the missing directive
      - type: file_matches
        path: /tmp/answer-bug
        pattern: "same|simultaneous|parallel|race"
        describe: And said that the two start together

  - id: s6
    instruction: >-
      Explain why the symptom is intermittent. Write to /tmp/answer-intermittent
      why this passes on a developer's machine and fails on a loaded node.
    hint: >-
      Both units start at the same moment either way. What differs is how long
      each takes to become usable.
    walkthrough: |
      echo "both units are launched at the same moment on every machine, so whether it works depends only on whether postgres finishes initialising before api tries to connect; on an idle laptop postgres wins that race almost always, and on a loaded node with slow storage it often does not, which is why the failure looks random and correlates with load rather than with any change" > /tmp/answer-intermittent
    verify:
      - type: file_matches
        path: /tmp/answer-intermittent
        pattern: "race|faster|slower|load"
        describe: You attributed it to which side wins the race
      - type: command_exit
        command: "test $(wc -w < /tmp/answer-intermittent) -ge 20"
        exit_code: 0
        describe: You wrote a real explanation

  - id: s7
    instruction: >-
      Write the fix to /tmp/answer-fix — the exact lines you would add, and to
      which file.
    hint: "Two directives, both in the same unit, both naming postgres."
    walkthrough: |
      {
        echo "file: api.service, in the [Unit] section"
        echo "Requires=postgres.service"
        echo "After=postgres.service"
      } > /tmp/answer-fix
      cat /tmp/answer-fix
    verify:
      - type: file_matches
        path: /tmp/answer-fix
        pattern: 'After=postgres.service'
        describe: You added the ordering edge
      - type: file_matches
        path: /tmp/answer-fix
        pattern: 'api.service'
        describe: To the right unit

  - id: s8
    instruction: >-
      Last one, and it is the part most people stop short of. Even with `After=`
      added, api can still start before postgres accepts connections — unless one
      thing is true of postgres.


      Name it, and say why the other units in this set are safe, in
      /tmp/answer-readiness.
    hint: >-
      Check postgres's `Type=` again, and compare it with what `Type=simple`
      would mean for the same edge.
    walkthrough: |
      grep -H '^Type=' /tmp/units/postgres.service /tmp/units/migrate.service
      echo "postgres is Type=notify, so it tells systemd when it is genuinely ready and After= waits for that rather than for exec; had it been Type=simple, After= would only have ordered api after postgres was launched and the race would survive the fix. migrate is Type=oneshot, so units after it wait for it to finish, which is the right shape for a migration" > /tmp/answer-readiness
    verify:
      - type: file_matches
        path: /tmp/answer-readiness
        pattern: "notify"
        describe: You identified Type=notify as what makes After= mean readiness
      - type: file_matches
        path: /tmp/answer-readiness
        pattern: "oneshot"
        describe: And why oneshot is right for the migration

solution: |
  ```bash
  grep -H -E '^(Requires|Wants|After|Before|PartOf|BindsTo)=' /tmp/units/*.service
  grep -H '^Type=' /tmp/units/*.service
  ```

  **The graph, as written.**

  | Unit | Requirement | Ordering | Type |
  |---|---|---|---|
  | postgres | `Wants=network-online.target` | `After=network-online.target` | notify |
  | migrate | `Requires=postgres` | `After=postgres`, `Before=api` | oneshot |
  | api | `Requires=postgres` | **none** | simple |
  | metrics-agent | `Requires=api`, `PartOf=api` | `After=api` | simple |
  | cache-warmer | `Wants=api` | `After=api` | oneshot |

  **The order that produces:**

  ```text
  network-online.target
    └── postgres.service         (ready, because Type=notify)
          └── migrate.service    (completes, because Type=oneshot)
                └── api.service  (only because migrate says Before=api)
                      ├── metrics-agent.service
                      └── cache-warmer.service
  ```

  **The bug: api.service has no `After=` of its own.**

  `Requires=postgres.service` answers *whether* — pull postgres in, and fail if
  it fails. It says nothing at all about *when*. On its own, that line starts api
  and postgres at the same instant.

  api happens to be ordered correctly here, but only because `migrate.service`
  declares `Before=api.service`. Its ordering is borrowed from a unit that has
  no obligation to keep providing it. Delete the migration — a perfectly
  reasonable thing to do once the schema is stable — and api starts
  simultaneously with postgres, with nothing in api's own file to explain the
  new failures.

  Ordering that depends on another unit's declaration is not a dependency. It is
  a coincidence with a maintenance schedule.

  **Why it is intermittent, which is the expensive part.** Both units launch at
  the same moment on every machine. Whether it works depends only on whether
  postgres becomes usable before api tries to connect — and that is a race
  decided by disk speed, cache state and node load. It passes on a laptop, passes
  in CI, and fails on the busiest node in production, where the error is a
  connection refused pointing at the wrong service.

  **The fix, both lines, in api.service:**

  ```ini
  [Unit]
  Requires=postgres.service
  After=postgres.service
  ```

  **And the step most people stop short of.** `After=` orders you after the
  other unit *has finished starting* — and what "finished starting" means is
  decided by its `Type=`:

  | Type | `After=` waits for |
  |---|---|
  | `simple` | `exec()` returning. Not the port, not the connection pool |
  | `forking` | The parent exiting |
  | `oneshot` | The process **exiting** — genuine completion |
  | `notify` | The service calling `sd_notify(0, "READY=1")` |

  postgres is `Type=notify`, so `After=postgres.service` genuinely waits for
  readiness and the fix is complete. Had it been `Type=simple`, adding `After=`
  would have narrowed the race without closing it — api ordered after postgres
  was *launched*, which is a much weaker promise than it reads as.

  migrate being `Type=oneshot` is the other half done right: units ordered after
  a oneshot wait for it to complete, which is exactly what a migration needs, and
  `RemainAfterExit=yes` keeps it "active" afterwards so the dependency stays
  satisfied.

  **Two directives worth noticing while you are here.** `PartOf=api.service` on
  the metrics agent means stopping or restarting api also stops or restarts the
  agent — but not the reverse, which is usually what you want for a sidecar.
  `Wants=` on the cache warmer means api is pulled in but a failed warmer does
  not fail api, which is the right strength for something optional.

  **Where this goes.** In **E29** this exact model reappears with different
  names: `initContainers` are `After=`, readiness probes are `Type=notify`, and
  an `initContainer` that sleeps for ten seconds hoping the database is up is the
  same bug this lab is about.
