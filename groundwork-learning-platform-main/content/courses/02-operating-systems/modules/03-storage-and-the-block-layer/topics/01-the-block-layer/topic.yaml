id: topic.the-block-layer
slug: the-block-layer
title: "The Block Layer: What Happens After write()"
summary: >-
  `write()` returns before anything reaches a device. This topic is about the
  distance between those two events — the dirty pages, the thresholds that
  decide when they leave, the queues they wait in, and the counters that tell
  you how long the waiting took.
order: 1
levels: [L2, L3]
estimated_minutes: 130
status: published

prerequisites:
  - topic: topic.files-and-filesystems
    hardness: required
  - topic: topic.virtual-memory
    hardness: required
  - topic: topic.cgroups
    hardness: recommended

objectives:
