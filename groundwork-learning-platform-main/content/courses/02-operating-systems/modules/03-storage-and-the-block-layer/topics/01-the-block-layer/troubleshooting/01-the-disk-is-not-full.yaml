id: troubleshooting.the-disk-is-not-full
topic: topic.the-block-layer
title: No space left on device, and df says 38% used
level: L3
objectives: [OBJ-A02.4.8, OBJ-A02.4.2]
reveal_policy: progressive

situation: >-
  An image-processing service began failing at 04:12 with `ENOSPC` — "no space
  left on device" — on every write. It has been restarted three times; each
  restart buys about eleven minutes before the errors return.


  The on-call engineer checked the obvious thing immediately: `df -h` on the
  node reports the data volume at 38% used, with 1.2 TB free. They have opened a
  ticket against the storage team saying the volume is misreporting.


  The storage team have replied that the volume is fine. Both are looking at
  real evidence.


  Work out what is happening before reading on.

symptoms:
  - "Every write fails with ENOSPC, from the moment the failures start"
  - "`df -h` on the data volume: 38% used, 1.2 TB free"
  - "Restarting the service works for about eleven minutes each time"
  - "The failures began at 04:12, which is when a nightly job starts"
  - "Other services on the same node are unaffected"
  - "The service writes many small files and deletes them after processing"

artifacts:
  - type: command_output
    label: What the responder checked
    content: |
      $ df -h /var/lib/imgproc
      Filesystem      Size  Used Avail Use% Mounted on
      /dev/nvme1n1p1  2.0T  741G  1.2T  38% /var/lib/imgproc

      $ df -i /var/lib/imgproc
      Filesystem       Inodes   IUsed IFree IUse% Mounted on
      /dev/nvme1n1p1  1310720 1310720     0  100% /var/lib/imgproc

  - type: log
    label: The application's errors
    content: |
      2026-08-16T04:12:38Z ERROR write /var/lib/imgproc/spool/a41f2.tmp: no space left on device
      2026-08-16T04:12:38Z ERROR write /var/lib/imgproc/spool/a41f3.tmp: no space left on device
      2026-08-16T04:12:39Z ERROR write /var/lib/imgproc/spool/a41f4.tmp: no space left on device

  - type: command_output
    label: What is in the directory
    content: |
      $ ls /var/lib/imgproc/spool | wc -l
      1287441

      $ du -sh /var/lib/imgproc/spool
      6.1G    /var/lib/imgproc/spool

      $ find /var/lib/imgproc/spool -name '*.tmp' -mmin +60 | wc -l
      1284902

  - type: config
    label: The nightly job that starts at 04:00
    content: |
      # /etc/cron.d/imgproc-reprocess
      12 4 * * *  imgproc  /usr/local/bin/reprocess-batch --since=24h

  - type: command_output
    label: The service's own cleanup, from its source
    content: |
      # cleanup runs on successful completion only
      defer func() {
          if err == nil {
              os.Remove(tmpPath)
          }
      }()

diagnostic_questions:
  - "What are the two different resources a filesystem can run out of?"
  - "Which one does `df -h` report, and which does `df -i` report?"
  - "Why does a restart buy exactly eleven minutes?"
  - "What is the average size of the files in that spool directory?"
  - "Why did this start at 04:12 rather than gradually?"

hints:
  - "Run `df` twice, with different flags. The second one is the answer."
  - "1287441 files occupying 6.1 GB. What is that per file, and what does each one cost besides its bytes?"
  - "Read the cleanup code and ask what happens to a temporary file when processing fails."
  - "Eleven minutes is how long it takes to do something, not how long it takes to fill something."

root_cause: >-
  The filesystem is out of **inodes**, not out of bytes. `df -i` reports
  `IUse% 100%` with zero free, while `df -h` reports 38%. Both are correct: they
  are reporting two different resources, and a filesystem needs both.


  Every file consumes one inode regardless of size. This filesystem was created
  with 1310720 inodes — the ext4 default, roughly one per 16 KB of capacity —
  and the spool directory alone holds 1287441 files averaging about 4.7 KB each.
  Small files exhaust inodes long before they exhaust space.


  The files accumulated because cleanup only runs on success:


  ```go
  defer func() {
      if err == nil {
          os.Remove(tmpPath)
      }
  }()
  ```


  Every failed conversion leaks its temporary file permanently. 1284902 of them
  are over an hour old, which is the backlog of every failure since the
  filesystem was created.


  The nightly reprocess job at 04:12 is the trigger rather than the cause: it
  creates a burst of temporary files, and that burst consumed the last of a
  reserve that had been shrinking for months. The service had been walking
  toward this for a long time and arrived at 04:12.


  The eleven minutes after each restart is the same mechanism seen from the
  other end. On restart the service completes some work successfully, each
  success frees one inode, and the reprocess job consumes them again at a
  slightly higher rate — so it runs until the small surplus is used up.

method: >-
  **1. Run `df` the other way.** `df -h` and `df -i` report different resources
  and only one of them is habitual. The moment `ENOSPC` appears with visible
  free space, the second command is the first thing to try — it takes two
  seconds and it is the answer here.


  **2. Count the files and divide.** 1287441 files in 6.1 GB is about 4.7 KB
  each. That ratio is the diagnosis in one division: at the ext4 default of
  roughly one inode per 16 KB, any workload averaging below that will run out of
  inodes first, always.


  **3. Establish whether they should be there.** `find -mmin +60` returning
  1284902 says almost none of these are in flight. Temporary files an hour old
  are not temporary; they are a leak with a misleading extension.


  **4. Find the leak in the code, not in the metrics.** The cleanup is
  conditional on success. That single `if err == nil` is the whole defect, and
  no amount of monitoring would have found it — the metric that would have shown
  it is inode usage, which nobody was collecting.


  **5. Explain the timing before proposing anything.** "It started at 04:12" and
  "a restart buys eleven minutes" both need to fit the theory, or the theory is
  incomplete. The cron entry explains the first, and inodes being freed by
  successful completions explains the second. A diagnosis that leaves either
  unexplained is not finished.


  The general habit: when a resource error contradicts the obvious gauge, ask
  what *other* resource shares that error code. `ENOSPC` covers bytes and inodes;
  `EPERM` covers uid and capabilities; `ENOMEM` covers a limit and a node.

resolution: >-
  **Immediately: free inodes.** Delete the leaked temporary files, oldest first,
  in batches so the directory operations do not themselves become the problem:


  ```bash
  find /var/lib/imgproc/spool -name '*.tmp' -mmin +60 -delete
  df -i /var/lib/imgproc
  ```


  Expect it to take a while — over a million unlinks on a directory that large is
  slow, and the directory itself will not shrink, which is a separate ext4
  behaviour worth knowing.


  **Then fix the leak, which is one line.** Clean up unconditionally, and log
  the failure rather than leaving evidence of it on disk:


  ```go
  defer os.Remove(tmpPath)   // remove regardless of outcome
  ```


  **Then make the resource visible.** Inode usage is not on the dashboard, and
  it is the reason this was a four-hour outage rather than a ticket six months
  ago:


  ```promql
  node_filesystem_files_free / node_filesystem_files < 0.15
  ```


  Alert on it beside the bytes alert. They fail independently, they produce the
  same error, and only one of them is usually watched.


  **Finally, decide whether the filesystem is right for the workload.** A
  service whose files average 4.7 KB is a poor fit for a filesystem with one
  inode per 16 KB. Options, in ascending order of disruption: recreate the
  filesystem with `mkfs.ext4 -i 4096`, which cannot be changed afterwards; move
  to XFS, which allocates inodes dynamically; or stop writing a file per item at
  all, which is the real answer if the items are this small.


  Worth raising the last one explicitly. A million 4.7 KB files is a database
  with extra steps, and every filesystem will be bad at it in a different way.
