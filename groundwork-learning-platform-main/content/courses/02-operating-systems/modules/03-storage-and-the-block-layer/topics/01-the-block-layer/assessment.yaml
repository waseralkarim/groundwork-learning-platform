id: assessment.the-block-layer
topic: topic.the-block-layer
pass_score: 70

parts:
  - id: A
    title: Explain two counters that both read zero
    kind: explain
    objectives: [OBJ-A02.4.2]
    prompt: >-
      A colleague is confused. A process in a container shows `rchar: 56826358`
      with `read_bytes: 0`, and `wchar: 67108958` with `write_bytes: 0`. They
      have concluded that the I/O accounting is broken.


      In about 200 words: explain what each pair of counters measures, give the
      two different reasons the physical counters are zero here, and say what
      the corresponding numbers would look like on a node where one of the two
      workloads was in trouble.
    rubric:
      - "States that rchar/wchar count bytes requested through the VFS and read_bytes/write_bytes count bytes moved by a block device"
      - "Explains the read zero as a page-cache hit — the data was already resident"
      - "Explains the write zero as tmpfs having no backing device at all, so those bytes are memory"
      - "Notes that the two zeros are structurally different: one would become non-zero on a cache miss, the other never can"
      - "Gives a concrete failing case, such as tmpfs pages being unreclaimable and causing an OOM kill"
    model_answer: >-
      The accounting is fine; it is measuring two different things.


      `rchar` and `wchar` count bytes the process asked the VFS for. That
      includes cache hits, pipes, sockets and tmpfs — everything, whether or not
      a device was involved. `read_bytes` and `write_bytes` count bytes a block
      device actually moved on this process's behalf. The gap between them is
      the page cache, measured in bytes.


      The two zeros have different causes. The read zero is a cache hit: the
      files were already resident, so the VFS served every byte without asking a
      device. On a cold cache the same commands would produce tens of megabytes
      of `read_bytes`.


      The write zero is structural. `/tmp` is a tmpfs, which lives entirely in
      page cache with no device behind it, so those bytes can never reach one.
      They are memory.


      That second case is where it turns into an incident. Tmpfs pages are
      charged to the cgroup and are not reclaimable — there is nowhere to write
      them back to — so a pod writing 2 GB of "temporary files" against a 1 GiB
      limit is OOM-killed on a node with tens of gigabytes free. The tells are
      exactly these counters, plus a large `shmem` in `memory.stat`.
    common_failures:
      - "Treating both zeros as the same phenomenon, which misses the whole point of the question"
      - "Saying tmpfs writes are 'buffered and will be flushed later' — there is nothing to flush to"
      - "Describing rchar as 'logical' without saying what it includes, which leaves the reader unable to apply it"
      - "Omitting the failing case, which makes the answer trivia rather than diagnosis"

  - id: B
    title: Compute and interpret from raw counters
    kind: diagnose
    objectives: [OBJ-A02.4.5, OBJ-A02.4.6]
    prompt: >-
      Two `/proc/diskstats` samples for `sdb`, ten seconds apart. Fields are:
      major, minor, name, reads, reads-merged, sectors-read, ms-reading,
      writes, writes-merged, sectors-written, ms-writing, in-flight,
      ms-doing-io, weighted-ms.


      ```text
      8 16 sdb 200000 400 25600000 900000 3000000 900000 384000000 600000 0 700000 2400000
      8 16 sdb 200500 402 25664000 1050000 3012000 903000 385536000 624000 0 710000 2574000
      ```


      The device is rotational and its scheduler is set to `none`.


      Compute r/s, w/s, r_await, w_await, aqu-sz and %util. Then diagnose the
      device, say what you would change, and explain why `%util` did not help.
    rubric:
      - "r/s 50, w/s 1200, r_await 300 ms, w_await 2 ms, aqu-sz 17.4, %util 100"
      - "Diagnoses reads being starved by the write stream rather than a failing or slow device"
      - "Uses the asymmetry between r_await and w_await as the evidence, not the absolute read latency alone"
      - "Names mq-deadline and explains that a read deadline bounds the starvation"
      - "Explains that %util only reports time with a request in flight and so cannot distinguish these cases"
    model_answer: >-
      ```text
      r/s     = 500 / 10          = 50
      w/s     = 12000 / 10        = 1200
      r_await = 150000 / 500      = 300 ms
      w_await = 24000 / 12000     = 2 ms
      aqu-sz  = 174000 / 10000    = 17.4
      %util   = 10000 / 10000     = 100%
      ```


      **The device is not slow — reads are being starved.** Writes complete in
      2 ms, so the hardware is serving requests perfectly well. Reads take 300 ms,
      150 times longer, and there are 24 writes for every read. That asymmetry is
      the diagnosis: a failing device would be slow for both.


      The mechanism is the scheduler. `none` does no reordering and gives reads
      no deadline. Merging adjacent writes is the efficient thing to do, so the
      device keeps being fed writes, and a read arriving into that stream waits
      essentially without bound. A queue depth of 17.4 confirms requests are
      waiting for each other rather than for the medium.


      **The change:** `echo mq-deadline > /sys/block/sdb/queue/scheduler`. It
      gives reads an expiry the scheduler must honour, converting an unbounded
      wait into a bounded one, at negligible cost. `none` on a rotational device
      is the misconfiguration — it is the right choice for NVMe and the wrong one
      here.


      **Why `%util` did not help:** it reports only the fraction of the interval
      with at least one request in flight. That is 100% here and would also be
      100% on a perfectly healthy device under steady load, so it cannot
      distinguish the two. The numbers that could were `await` split by
      direction, and queue depth.
    common_failures:
      - "Concluding the device is failing, which the 2 ms writes contradict"
      - "Reading %util as saturation and stopping there"
      - "Computing await from ms-doing-io rather than from ms-reading and ms-writing"
      - "Recommending a deeper queue or a faster device, both of which make read starvation worse"

  - id: C
    title: Review a database deployment
    kind: reason
    objectives: [OBJ-A02.4.8, OBJ-A02.4.7]
    prompt: >-
      A team has deployed PostgreSQL as a StatefulSet with no `volumeMounts` and
      no `volumeClaimTemplates`. Their justification: "it is a read-through
      cache, the data is disposable, and local disk is faster than the network
      storage class anyway".


      Two weeks in, commit latency is 14 ms against 1.8 ms on the VM it
      replaced, and `/proc/1/io` shows `wchar` 8.6 GB against `write_bytes`
      103 GB over one hour.


      Write your review — about 200 words. Reach a decision, explain the
      counters, and address both the performance and the durability arguments.
    rubric:
      - "Identifies twelvefold write amplification from the counter ratio"
      - "Names overlayfs copy-up as the mechanism and explains file-granularity copy-on-write"
      - "States that a volume is the fix and that this is a performance argument as well as a durability one"
      - "Raises that a StatefulSet with no volume loses its data on any reschedule, regardless of the team's intent"
      - "Engages with the 'local disk is faster' claim rather than dismissing it"
    model_answer: >-
      Blocking this, and the counters make the case rather than the principle.


      `wchar` 8.6 GB against `write_bytes` 103 GB is twelvefold write
      amplification. The mechanism is overlayfs copy-up: it is copy-on-write at
      *file* granularity, so the first write to any file living in a lower layer
      copies the whole file before applying the change. PostgreSQL modifies 8 KiB
      pages inside 1 GiB segments constantly, which is close to a worst case —
      and it explains why checkpoints and schema changes are worst, since those
      touch many previously untouched segments at once.


      So "local disk is faster" is true and is not being tested. The device is
      fine; it is being asked to do twelve times the necessary work. A volume
      mounts the underlying filesystem directly and bypasses the overlay, which
      should take commit latency below the old VM's figure — the hardware really
      is faster once the work is right.


      Separately, and more seriously: a StatefulSet with no volume loses its data
      on any reschedule — a node drain, an eviction, an image update. "Disposable"
      may be true today, and it means an unplanned full cache rebuild at a
      moment nobody chose. Worth deciding deliberately rather than by omission.


      Happy to pair on the volumeClaimTemplate and the migration.
    common_failures:
      - "Refusing on the durability rule alone, which does not engage with the performance evidence in front of them"
      - "Accepting 'the data is disposable' without noting that reschedules are unplanned"
      - "Attributing the latency to the device or the storage class rather than to the filesystem layer"
      - "Missing that the read counters would corroborate copy-up, and so leaving the diagnosis weaker than it needs to be"
