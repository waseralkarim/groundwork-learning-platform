id: lab.reading-diskstats
topic: topic.the-block-layer
title: Compute what iostat computes, and find out which columns lie
type: guided
tier: 2
image: groundwork/lab-foundations:1
duration_minutes: 30
objectives: [OBJ-A02.4.5]

intro: >-
  Every number `iostat -x` prints is arithmetic on two samples of
  `/proc/diskstats`. Doing that arithmetic once, by hand, is worth more than
  reading the manual page — afterwards none of the derived columns are magic,
  and two of them stop being trusted.


  You will read the raw counters on this machine to learn the field layout, then
  work on three real sample pairs taken from real devices ten seconds apart. One
  is healthy. One reports 100% utilisation and is completely fine. One has an
  average read latency of three hundred milliseconds and a scheduler that
  explains it.

setup:
  - /opt/lab/seed.sh
  - /opt/lab/seed-blockdev.sh

steps:
  - id: s1
    instruction: >-
      Start on the live machine. Save one device's raw diskstats line to
      /tmp/answer-raw, and count how many fields it has.
    hint: >-
      `grep ' sda ' /proc/diskstats` or any real device name from the previous
      lab. Count with `awk '{print NF}'`.
    walkthrough: |
      d=$(ls /sys/block | grep -Ev '^(loop|ram)' | head -1)
      grep " $d " /proc/diskstats > /tmp/answer-raw
      awk '{print "fields=" NF}' /tmp/answer-raw >> /tmp/answer-raw
      cat /tmp/answer-raw
    verify:
      - type: file_matches
        path: /tmp/answer-raw
        pattern: 'fields=(1[4-9]|20)'
        describe: A modern kernel exposes 20 fields, including discards and flushes

  - id: s2
    instruction: >-
      Now the samples. Compute reads per second and writes per second for the
      healthy device in /tmp/samples/healthy.txt, and save them to
      /tmp/answer-healthy-rate.


      The two data lines are ten seconds apart. Field 4 is reads completed,
      field 8 is writes completed.
    hint: >-
      Read the first non-comment line into an array, then subtract on the
      second. Divide by 10.
    walkthrough: |
      awk '!/^#/ { if (!p) { for (i=1;i<=NF;i++) a[i]=$i; p=1; next }
                   printf "r/s %.0f\nw/s %.0f\n", ($4-a[4])/10, ($8-a[8])/10 }' \
        /tmp/samples/healthy.txt > /tmp/answer-healthy-rate
      cat /tmp/answer-healthy-rate
    verify:
      - type: file_matches
        path: /tmp/answer-healthy-rate
        pattern: '^r/s 120$'
        describe: 1200 reads over ten seconds
      - type: file_matches
        path: /tmp/answer-healthy-rate
        pattern: '^w/s 60$'
        describe: And 600 writes

  - id: s3
    instruction: >-
      Compute the average time each read took — `r_await` — for the same
      device, and save it to /tmp/answer-healthy-await in milliseconds.


      Field 7 is milliseconds spent reading, summed across requests.
    hint: "Milliseconds spent reading, divided by reads completed."
    walkthrough: |
      awk '!/^#/ { if (!p) { for (i=1;i<=NF;i++) a[i]=$i; p=1; next }
                   printf "r_await %.2f\n", ($7-a[7])/($4-a[4]) }' \
        /tmp/samples/healthy.txt > /tmp/answer-healthy-await
      cat /tmp/answer-healthy-await
    verify:
      - type: file_matches
        path: /tmp/answer-healthy-await
        pattern: '^r_await 0\.50$'
        describe: Half a millisecond per read — a healthy SSD

  - id: s4
    instruction: >-
      Now the alarming one. For the NVMe device in /tmp/samples/nvme.txt,
      compute utilisation and average queue depth, and save both to
      /tmp/answer-nvme.


      Field 13 is milliseconds with at least one request in flight. Field 14 is
      that, weighted by queue depth.
    hint: >-
      `%util` is field 13's delta over the interval in milliseconds. `aqu-sz` is
      field 14's delta over the same.
    walkthrough: |
      awk '!/^#/ { if (!p) { for (i=1;i<=NF;i++) a[i]=$i; p=1; next }
                   printf "util %.0f\naqu-sz %.1f\n", ($13-a[13])/10000*100, ($14-a[14])/10000 }' \
        /tmp/samples/nvme.txt > /tmp/answer-nvme
      cat /tmp/answer-nvme
    verify:
      - type: file_matches
        path: /tmp/answer-nvme
        pattern: '^util 100$'
        describe: 100% utilisation — something was in flight the whole interval
      - type: file_matches
        path: /tmp/answer-nvme
        pattern: '^aqu-sz 0\.[0-9]$'
        describe: And an average queue depth below one

  - id: s5
    instruction: >-
      Finish the NVMe picture: compute its r_await and r/s into
      /tmp/answer-nvme-latency.


      Then decide whether the 100% figure is a problem.
    walkthrough: |
      awk '!/^#/ { if (!p) { for (i=1;i<=NF;i++) a[i]=$i; p=1; next }
                   printf "r/s %.0f\nr_await %.2f\n", ($4-a[4])/10, ($7-a[7])/($4-a[4]) }' \
        /tmp/samples/nvme.txt > /tmp/answer-nvme-latency
      cat /tmp/answer-nvme-latency
    verify:
      - type: file_matches
        path: /tmp/answer-nvme-latency
        pattern: '^r_await 0\.20$'
        describe: Two hundred microseconds per read
      - type: file_matches
        path: /tmp/answer-nvme-latency
        pattern: '^r/s 3000$'
        describe: At 3000 reads per second

  - id: s6
    instruction: >-
      Write to /tmp/answer-util-verdict one sentence explaining why 100%
      utilisation on that device does not mean it is saturated.
    hint: >-
      Ask what `%util` actually counts, and how many requests an NVMe device
      serves at once.
    walkthrough: |
      echo "util only measures the fraction of time at least one request was in flight, and a device that serves thousands of requests concurrently can be busy by that definition while using a tiny fraction of its capability; the queue depth of 0.7 and the 0.2ms await say it is nowhere near its limit" > /tmp/answer-util-verdict
    verify:
      - type: file_matches
        path: /tmp/answer-util-verdict
        pattern: "in flight|concurrent|at least one"
        describe: You explained what %util actually counts
      - type: command_exit
        command: "test $(wc -w < /tmp/answer-util-verdict) -ge 15"
        exit_code: 0
        describe: You wrote a real explanation

  - id: s7
    instruction: >-
      Last device. For /tmp/samples/starved.txt compute r/s, w/s, r_await and
      w_await, and save all four to /tmp/answer-starved.
    walkthrough: |
      awk '!/^#/ { if (!p) { for (i=1;i<=NF;i++) a[i]=$i; p=1; next }
                   printf "r/s %.0f\nw/s %.0f\nr_await %.0f\nw_await %.0f\n",
                     ($4-a[4])/10, ($8-a[8])/10, ($7-a[7])/($4-a[4]), ($11-a[11])/($8-a[8]) }' \
        /tmp/samples/starved.txt > /tmp/answer-starved
      cat /tmp/answer-starved
    verify:
      - type: file_matches
        path: /tmp/answer-starved
        pattern: '^r_await 300$'
        describe: Three hundred milliseconds per read
      - type: file_matches
        path: /tmp/answer-starved
        pattern: '^w_await 2$'
        describe: Against two milliseconds per write
      - type: file_matches
        path: /tmp/answer-starved
        pattern: '^w/s 1200$'
        describe: And writes outnumber reads twenty-four to one

  - id: s8
    instruction: >-
      Diagnose it. Read the header comment in that sample file, then write your
      finding and the one-line fix to /tmp/answer-starved-fix.
    hint: >-
      Compare the two await figures, then look at which scheduler is active on a
      rotational device.
    walkthrough: |
      head -3 /tmp/samples/starved.txt
      echo "reads are being starved by a heavy write stream: 300ms per read against 2ms per write on a rotational disk running the none scheduler, which does no reordering and gives reads no deadline; switching to mq-deadline bounds read latency by giving reads an expiry the scheduler must honour" > /tmp/answer-starved-fix
    verify:
      - type: file_matches
        path: /tmp/answer-starved-fix
        pattern: "starv|deadline|reorder"
        describe: You identified reads being starved rather than a slow device
      - type: file_matches
        path: /tmp/answer-starved-fix
        pattern: "mq-deadline"
        describe: And named the scheduler that fixes it

solution: |
  ```bash
  # the general shape: read sample 1 into an array, subtract on sample 2
  awk '!/^#/ { if (!p) { for (i=1;i<=NF;i++) a[i]=$i; p=1; next }
    rd=$4-a[4]; rms=$7-a[7]; wr=$8-a[8]; wms=$11-a[11];
    busy=$13-a[13]; wgt=$14-a[14]; secs=10;
    printf "r/s     %.0f\n",   rd/secs
    printf "w/s     %.0f\n",   wr/secs
    printf "r_await %.2f ms\n", (rd ? rms/rd : 0)
    printf "w_await %.2f ms\n", (wr ? wms/wr : 0)
    printf "aqu-sz  %.2f\n",    wgt/(secs*1000)
    printf "%%util   %.0f\n",   busy/(secs*1000)*100 }' /tmp/samples/nvme.txt
  ```

  **The three devices.**

  | | healthy (sda) | nvme0n1 | starved (sdb) |
  |---|---|---|---|
  | r/s | 120 | 3000 | 50 |
  | w/s | 60 | 600 | 1200 |
  | r_await | 0.50 ms | 0.20 ms | **300 ms** |
  | w_await | 0.40 ms | 0.10 ms | 2 ms |
  | aqu-sz | 0.2 | 0.7 | 17.4 |
  | %util | 10% | **100%** | 100% |
  | scheduler | mq-deadline | none | **none**, on rotational |

  **The formulas, now that you have used them:**

  ```text
  r/s     = Δfield4  ÷ Δseconds
  r_await = Δfield7  ÷ Δfield4        ms per read
  w_await = Δfield11 ÷ Δfield8        ms per write
  aqu-sz  = Δfield14 ÷ Δmilliseconds  average queue depth
  %util   = Δfield13 ÷ Δmilliseconds × 100
  rkB/s   = Δfield6  × 512 ÷ 1024 ÷ Δseconds
  ```

  Sectors in `/proc/diskstats` are always 512 bytes, whatever the device's real
  block size. That catches people who have just read `physical_block_size` and
  assume it applies here.

  **The NVMe is the important one, because everything about it looks wrong and
  nothing is.** `%util` at 100% means only that at least one request was in
  flight for the whole interval. A device serving thousands of requests
  concurrently reaches that at a tiny fraction of its capability — and the two
  numbers that would show real saturation say the opposite: an average queue
  depth of 0.7, so requests are barely waiting for each other, and 200
  microseconds per read.

  Reading `%util` as saturation is among the most common storage misdiagnoses
  there is. It was a good approximation for a spinning disk, which serves one
  request at a time. It has been misleading on everything else for over a decade.

  **The starved device is the opposite: it looks like a slow disk and is not.**
  300 ms per read against 2 ms per write, with writes outnumbering reads 24 to 1.
  The device is serving writes perfectly well; reads are queued behind them.

  The header says why: `rotational 1`, scheduler `none`. No reordering, and no
  deadline. Merging adjacent writes is the efficient thing to do, so the
  scheduler keeps doing it, and a read that arrives can wait behind an unbounded
  stream. `mq-deadline` exists exactly for this — it gives reads an expiry the
  scheduler must honour, which caps how long the starvation can go on.

  ```bash
  echo mq-deadline > /sys/block/sdb/queue/scheduler
  ```

  **The distinction worth carrying away.** `await` is queue time *plus* service
  time. Comparing it against `aqu-sz` separates the two cases:

  - `await` high, `aqu-sz` high — requests waiting for each other. A queue
    problem, and a deeper queue makes it worse.
  - `await` high, `aqu-sz` near 1 — the device really is slow, or the requests
    are very large.

  And the number to distrust twice: throughput. 50 MB/s of 4 KiB random writes
  is 12800 IOPS and a great deal of work; 50 MB/s of 1 MiB sequential writes is
  50 IOPS and nearly idle. A throughput figure with no request size beside it
  means nothing at all.
