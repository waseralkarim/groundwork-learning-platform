id: lab.your-root-is-an-overlay
topic: topic.files-and-filesystems
title: Look at the filesystem you are standing on
type: guided
tier: 2
image: groundwork/lab-foundations:1
duration_minutes: 20
objectives: [OBJ-A01.5.3, OBJ-A01.5.4]

intro: >-
  The container you are typing into has a root filesystem assembled from
  read-only image layers plus one writable layer of its own. It is all visible
  in one file, and reading it explains image size, why `docker run` is instant,
  and why some paths refuse writes.


  You will count this image's layers, find where your own writes go, and confirm
  the three different filesystems under your feet.

setup:
  - /opt/lab/seed.sh

steps:
  - id: s1
    instruction: >-
      Save the mount line for `/` to /tmp/answer-root-mount, and record its
      filesystem type — one word — to /tmp/answer-root-type.
    hint: "`grep ' / ' /proc/mounts`. The third field is the type."
    walkthrough: |
      grep ' / ' /proc/mounts > /tmp/answer-root-mount
      awk '{print $3}' /tmp/answer-root-mount > /tmp/answer-root-type
      cat /tmp/answer-root-type
    verify:
      - type: file_matches
        path: /tmp/answer-root-type
        pattern: '^overlay$'
        describe: Your root filesystem is an overlay, not a disk

  - id: s2
    instruction: >-
      That mount line contains a `lowerdir=` list. Each path in it is one image
      layer.


      Count them and write the number to /tmp/answer-layer-count.
    hint: >-
      The paths in `lowerdir=` are separated by colons, and the list ends at the
      next comma. One more path than colons.
    walkthrough: |
      grep -o 'lowerdir=[^,]*' /tmp/answer-root-mount | tr ':' '\n' | wc -l | tr -d ' ' > /tmp/answer-layer-count
      cat /tmp/answer-layer-count
    verify:
      - type: file_matches
        path: /tmp/answer-layer-count
        pattern: '^[2-9]$|^[1-9][0-9]+$'
        describe: This image is made of several read-only layers

  - id: s3
    instruction: >-
      Find where this container's own writes are meant to go. Extract the
      `upperdir=` path to /tmp/answer-upperdir.


      Note that it is one directory on the host, created for this container
      alone.
    hint: "`grep -o 'upperdir=[^,]*' /tmp/answer-root-mount`"
    walkthrough: |
      grep -o 'upperdir=[^,]*' /tmp/answer-root-mount > /tmp/answer-upperdir
      cat /tmp/answer-upperdir
    verify:
      - type: file_matches
        path: /tmp/answer-upperdir
        pattern: "upperdir="
        describe: The writable layer was identified

  - id: s4
    instruction: >-
      Now test whether you can actually use it. Try to create /opt/lab/newfile
      and capture the error to /tmp/answer-write-root.


      Then look again at the options in the root mount line and explain the
      result to yourself.
    hint: >-
      `touch /opt/lab/newfile > /tmp/answer-write-root 2>&1`. Then look for `ro`
      in the mount options.
    walkthrough: |
      touch /opt/lab/newfile > /tmp/answer-write-root 2>&1 || true
      grep -o ' ro,\| rw,' /tmp/answer-root-mount || awk '{print $4}' /tmp/answer-root-mount | cut -c1-2
      cat /tmp/answer-write-root
    verify:
      - type: file_matches
        path: /tmp/answer-write-root
        pattern: "Read-only file system"
        describe: The root filesystem is mounted read-only, so the upper layer is unusable here

  - id: s5
    instruction: >-
      List every filesystem mounted in this container, saving the type and mount
      point of each to /tmp/answer-mounts.


      You should find at least three different types. Note which of them you can
      write to.
    hint: "`awk '{print $3, $2}' /proc/mounts | sort -u > /tmp/answer-mounts`"
    walkthrough: |
      awk '{print $3, $2}' /proc/mounts | sort -u > /tmp/answer-mounts
      cat /tmp/answer-mounts
    verify:
      - type: file_matches
        path: /tmp/answer-mounts
        pattern: "tmpfs"
        describe: A tmpfs is mounted
      - type: file_matches
        path: /tmp/answer-mounts
        pattern: "proc"
        describe: procfs is mounted
      - type: command_output
        command: "wc -l < /tmp/answer-mounts"
        pattern: "[3-9]|[0-9]{2,}"
        describe: Several different filesystems are in play

  - id: s6
    instruction: >-
      Confirm where you *can* write, and what that costs. Create a file under
      /tmp, then record which filesystem serves /tmp to /tmp/answer-tmp-type.


      Then answer in /tmp/answer-tmp-cost, with the single word `disk` or
      `memory`: what does filling /tmp consume here?
    hint: >-
      `df -T /tmp` or `findmnt -no FSTYPE /tmp`. You measured the answer to the
      second question in the virtual memory labs.
    walkthrough: |
      echo written > /tmp/proof.txt
      awk '$2=="/tmp" {print $3}' /proc/mounts > /tmp/answer-tmp-type
      cat /tmp/answer-tmp-type
      echo memory > /tmp/answer-tmp-cost
    verify:
      - type: file_exists
        path: /tmp/proof.txt
        describe: You can write to /tmp
      - type: file_matches
        path: /tmp/answer-tmp-type
        pattern: '^tmpfs$'
        describe: /tmp is a tmpfs
      - type: file_matches
        path: /tmp/answer-tmp-cost
        pattern: '^memory$'
        describe: You recognised that a tmpfs consumes memory, not disk

solution: |
  ```bash
  grep ' / ' /proc/mounts                                   # overlay, ro
  grep -o 'lowerdir=[^,]*' /proc/mounts | tr ':' '\n' | wc -l   # layer count
  grep -o 'upperdir=[^,]*' /proc/mounts                     # this container's writes

  touch /opt/lab/newfile                                    # Read-only file system
  awk '{print $3, $2}' /proc/mounts | sort -u               # every filesystem
  awk '$2=="/tmp" {print $3}' /proc/mounts                  # tmpfs
  ```

  **What that one mount line contained.**

  **Your root is a view, not a disk.** `overlay` composes a stack of read-only
  directories and one writable one into a single tree. Nothing was copied when
  this container started — which is why it started instantly.

  **Each `lowerdir` path is an image layer.** One per `RUN` or `COPY` in the
  Dockerfile that built this image. They are read-only and shared: every
  container from this image uses the same copy on disk, and shares its page
  cache in RAM too. Ten containers from one image cost roughly one image.

  **The `upperdir` is this container's own.** It was created at start and is
  deleted when the container is removed. Everything written there is discarded —
  not by accident, by design, and the reason volumes exist.

  **Here, even that is unavailable.** This lab mounts the root read-only, so the
  writable layer cannot be reached and `/opt` refuses writes with `EROFS`. That
  is the hardened container shape: read-only root, writable mounts only where
  they are needed.

  **`/tmp` is a tmpfs, and it is memory.** It is writable, fast, discarded at
  exit — and charged against the container's memory limit rather than its disk.
  You watched that accounting directly in the virtual memory labs.

  **The copy-up cost you did not have to pay here.** On a writable overlay, the
  first modification of a file that came from a lower layer copies the entire
  file into the upper layer. Appending one line to a 2 GB file inherited from the
  image costs 2 GB — which is why anything written frequently belongs on a
  volume.

  **Where this goes.** **C14** introduces images, layers, the build cache and
  volumes as Docker concepts. Every one of them is this mount line.
