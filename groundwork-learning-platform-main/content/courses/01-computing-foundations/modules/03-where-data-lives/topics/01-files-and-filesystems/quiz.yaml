id: quiz.files-and-filesystems
topic: topic.files-and-filesystems
pass_score: 70

questions:
  - id: q1
    type: single_choice
    level: L2
    objectives: [OBJ-A01.5.1]
    stem: What does a directory actually contain?
    options:
      - id: a
        text: A list of names paired with inode numbers
        correct: true
      - id: b
        text: The files themselves
        note: >-
          File data lives in blocks the inode points at. A directory holds only
          the mapping from name to inode.
      - id: c
        text: The permissions and sizes of the files in it
        note: >-
          Those are attributes of each file's inode, which is why `chmod` is
          visible through every name a file has.
      - id: d
        text: Pointers to the data blocks of each file
        note: >-
          The inode holds those pointers. The directory holds only the inode
          number.
    explanation: >-
      A directory is a file whose contents are (name, inode) pairs. Path lookup
      walks these, one component at a time. This is why renaming within a
      filesystem is instant — one entry is rewritten and no data moves.

  - id: q2
    type: multi_choice
    level: L2
    objectives: [OBJ-A01.5.1]
    stem: Which of these are stored in the inode? Select all that apply.
    options:
      - id: a
        text: Permissions and ownership
        correct: true
      - id: b
        text: The number of names referring to it
        correct: true
      - id: c
        text: Timestamps and size
        correct: true
      - id: d
        text: The file's name
        note: >-
          The one thing an inode does not hold. Names live in directories, which
          is what makes several names for one file possible.
    explanation: >-
      Everything except the name. That single omission explains hard links,
      why `rm` is called `unlink`, and why a deleted file with an open descriptor
      still exists.

  - id: q3
    type: single_choice
    level: L2
    objectives: [OBJ-A01.5.2]
    stem: >-
      `ln a.txt b.txt` then `rm a.txt`. What happens to the data?
    options:
      - id: a
        text: Nothing — b.txt still refers to the same inode
        correct: true
      - id: b
        text: It is deleted; b.txt becomes a broken link
        note: >-
          That describes a symbolic link. A hard link is another name for the
          same inode, not a pointer to a path.
      - id: c
        text: It is deleted, because a.txt was the original
        note: >-
          There is no original. Both entries are equal, and the filesystem does
          not record which was created first.
      - id: d
        text: b.txt becomes empty
        note: >-
          Nothing about the inode changed except its link count, which went from
          two to one.
    explanation: >-
      `rm` removed one name and decremented the count. The data is freed only
      when the count reaches zero *and* no process holds the file open — both
      conditions, which is the source of the disk-full-after-deleting incident.

  - id: q4
    type: single_choice
    level: L2
    objectives: [OBJ-A01.5.2]
    stem: Which is true of a symbolic link but not a hard link?
    options:
      - id: a
        text: It can point at a path on another filesystem, or at nothing at all
        correct: true
      - id: b
        text: It shares an inode with its target
        note: >-
          That is a hard link. A symlink has its own inode holding the target
          path as text.
      - id: c
        text: It keeps the data alive when the target is removed
        note: >-
          The opposite: removing the target leaves the symlink dangling.
      - id: d
        text: It is indistinguishable from the original file
        note: >-
          That is a hard link, where there is no "original" to distinguish from.
    explanation: >-
      A symlink is a small file containing a path, resolved by a second lookup.
      That indirection is exactly why it can cross filesystems and can dangle,
      and why it breaks when the target moves.

  - id: q5
    type: single_choice
    level: L2
    objectives: [OBJ-A01.5.3]
    stem: >-
      A mount line shows `/data ext4 ro,relatime`. Root cannot write there. Why?
    options:
      - id: a
        text: The filesystem is mounted read-only, which applies to everyone
        correct: true
      - id: b
        text: The directory permissions are wrong
        note: >-
          Mode bits produce EACCES. A read-only mount produces EROFS and does
          not consult them.
      - id: c
        text: Root lacks a capability
        note: >-
          Capability checks produce EPERM. No capability overrides a read-only
          mount.
      - id: d
        text: SELinux or AppArmor is blocking it
        note: >-
          Possible in general, but the mount options here already explain it
          completely.
    explanation: >-
      Mount options are per-mount and beat permissions. `ro` means no write
      succeeds under that mount point, for any user — which is why EROFS and
      EACCES are different errors with different fixes.

  - id: q6
    type: single_choice
    level: L2
    objectives: [OBJ-A01.5.3]
    stem: >-
      Inside a container, `/tmp` is a tmpfs. What does filling it consume?
    options:
      - id: a
        text: Memory, counted against the container's memory limit
        correct: true
      - id: b
        text: Disk on the host
        note: >-
          A tmpfs never touches the disk. That is the point of it.
      - id: c
        text: The container's writable overlay layer
        note: >-
          A separate mount at /tmp means writes there never reach the overlay.
      - id: d
        text: Nothing — tmpfs is unlimited
        note: >-
          It is bounded by its size option and by the memory it is charged
          against.
    explanation: >-
      A tmpfs lives in RAM and is charged to the cgroup, which is why spooling a
      large upload to /tmp can get a container OOM-killed while its heap looks
      healthy. A Kubernetes `emptyDir` with `medium: Memory` is the same trap.

  - id: q7
    type: single_choice
    level: L3
    objectives: [OBJ-A01.5.4]
    stem: Ten containers run from the same image. How much disk do the image layers use?
    options:
      - id: a
        text: One copy — the layers are read-only and shared
        correct: true
      - id: b
        text: Ten copies, one per container
        note: >-
          Nothing is copied at start. Each container gets an empty writable
          layer over the same read-only ones.
      - id: c
        text: It depends on the storage driver's compression
        note: >-
          Sharing is a property of the overlay design, not of compression.
      - id: d
        text: One copy for the base layer, ten for the rest
        note: >-
          Every lower layer is shared, not just the base.
    explanation: >-
      The lowerdirs are shared, and so is their page cache — so the containers
      share RAM as well as disk. Only each container's own writable upper layer
      is per-container, which is why `docker run` is instant.

  - id: q8
    type: single_choice
    level: L3
    objectives: [OBJ-A01.5.4]
    stem: >-
      A Dockerfile installs a 400 MB toolchain in one RUN and deletes it in the
      next. What happens to the image size?
    options:
      - id: a
        text: It stays the same — the earlier layer still contains the files
        correct: true
      - id: b
        text: It shrinks by 400 MB
        note: >-
          Layers only add. A deletion in a later layer records a whiteout that
          hides the files without removing them from the layer below.
      - id: c
        text: It shrinks only if the layers are squashed
        note: >-
          True as a workaround, but the default answer is that the size does not
          change.
      - id: d
        text: It grows, because the whiteout is large
        note: >-
          A whiteout is tiny. The size is unchanged for practical purposes.
    explanation: >-
      The image is the sum of its layers, and no layer is ever edited. The fix is
      to install, use and clean up in one RUN — or to use a multi-stage build and
      copy out only the artifact.

  - id: q9
    type: single_choice
    level: L3
    objectives: [OBJ-A01.5.5]
    stem: >-
      `df` says 100% full. `du -x -sh` on the same filesystem accounts for 6 GB
      of 200 GB. What is the most likely cause?
    options:
      - id: a
        text: Deleted files still held open by a running process
        correct: true
      - id: b
        text: du is slow and has not finished
        note: >-
          It reported a total, so it finished. The gap is real.
      - id: c
        text: Filesystem corruption
        note: >-
          Possible but rare, and not the first hypothesis when the gap has a
          much more common explanation.
      - id: d
        text: Another filesystem is mounted underneath and hiding files
        note: >-
          A real cause of the opposite confusion — files hidden *under* a mount
          point — but `du -x` stays on one filesystem, so it would not produce
          this gap.
    explanation: >-
      `du` walks names; a deleted file has none. `df` asks the filesystem for
      free blocks, and the kernel has not released them because a process still
      holds the file open. `lsof +L1`, or `/proc/*/fd` for a target ending in
      `(deleted)`, names the culprit.

  - id: q10
    type: single_choice
    level: L3
    objectives: [OBJ-A01.5.5]
    stem: >-
      A service is writing to a log you must shrink right now, and you cannot
      restart it. What do you do?
    options:
      - id: a
        text: "Truncate it in place with `: > /path/to/log`"
        correct: true
      - id: b
        text: Delete it with rm
        note: >-
          This is what creates the problem: the name goes, the writer keeps its
          descriptor, and the space stays used and invisible.
      - id: c
        text: Move it aside with mv and create a new one
        note: >-
          The writer holds the inode, so it keeps writing to the moved file and
          the new one stays empty. This is the classic log-rotation bug.
      - id: d
        text: Compress it in place with gzip
        note: >-
          gzip writes a new file and removes the original — the same problem as
          deleting, plus the writer keeps appending to the old inode.
    explanation: >-
      Truncation empties the file the descriptor points at, so the blocks are
      freed and the writer keeps working. Better still is a signal that makes the
      service reopen its log, which is what `logrotate` arranges.

  - id: q11
    type: single_choice
    level: L3
    objectives: [OBJ-A01.5.6]
    stem: >-
      Every write fails with "No space left on device" but `df -h` shows 40%
      used. What do you check?
    options:
      - id: a
        text: "`df -i` — the filesystem is probably out of inodes"
        correct: true
      - id: b
        text: The disk's SMART status
        note: >-
          A failing device produces I/O errors, not ENOSPC.
      - id: c
        text: Whether the file is too large for the filesystem
        note: >-
          That produces EFBIG, and only at extreme sizes.
      - id: d
        text: The quota for the current user
        note: >-
          Worth checking, but a quota failure is EDQUOT, and ENOSPC with free
          space points at inodes first.
    explanation: >-
      Blocks and inodes are separate resources and both report ENOSPC. Millions
      of tiny files exhaust inodes long before space. On ext4 the count is fixed
      at format time, so the fix is deleting files or reformatting — not adding
      capacity.

  - id: q12
    type: single_choice
    level: L3
    objectives: [OBJ-A01.5.7]
    stem: >-
      `write()` returned successfully and the machine loses power a second
      later. Is the data on disk?
    options:
      - id: a
        text: Not necessarily — it may still be in the page cache
        correct: true
      - id: b
        text: Yes, a successful write means it is durable
        note: >-
          Success means the kernel accepted the bytes, not that the device
          stored them.
      - id: c
        text: Only if the file was opened for synchronous writing
        note: >-
          True in the sense that O_SYNC changes it, but the default answer is
          that a plain write is not durable.
      - id: d
        text: Yes, unless the filesystem is mounted async
        note: >-
          Buffering is the default behaviour, not an unusual mount option.
    explanation: >-
      Writes land in the page cache and are flushed later. `fsync` is the request
      to make them durable, and it returns only when the device confirms — which
      is why it is expensive and why databases spend so much effort managing it.

  - id: q13
    type: single_choice
    level: L3
    objectives: [OBJ-A01.5.7]
    stem: >-
      You create a new file, write to it and call fsync on it. The machine
      crashes. What might still be missing?
    options:
      - id: a
        text: The directory entry naming the file
        correct: true
      - id: b
        text: The file's data, since fsync is advisory
        note: >-
          fsync is not advisory. The data was made durable.
      - id: c
        text: The file's permissions
        note: >-
          Those are in the inode, which fsync on the file covers.
      - id: d
        text: Nothing — fsync on the file is sufficient
        note: >-
          A common and costly assumption. The directory is a separate file with
          its own dirty state.
    explanation: >-
      Durably creating a file means fsyncing the file *and* the directory that
      names it. Otherwise the data exists in an inode nothing points at. This is
      why the safe pattern is write-temp, fsync, rename — rename within a
      filesystem is atomic.

  - id: q14
    type: single_choice
    level: L3
    objectives: [OBJ-A01.5.8]
    stem: >-
      A container fails at start-up with "Read-only file system" writing to
      /var/lib/app. What is the fix?
    options:
      - id: a
        text: Mount a volume or tmpfs at that path
        correct: true
      - id: b
        text: chmod 777 the directory in the image
        note: >-
          EROFS is not a permission failure. The mode bits are never consulted.
      - id: c
        text: Run the container as root
        note: >-
          A read-only mount refuses root exactly as firmly as anyone else.
      - id: d
        text: Add CAP_DAC_OVERRIDE
        note: >-
          That capability bypasses permission checks, which are not what failed
          here.
    explanation: >-
      A read-only root filesystem is deliberate hardening. The correct shape is
      to keep it and add a writable mount exactly where the application needs
      one — a volume for anything worth keeping, a tmpfs for scratch.

  - id: q15
    type: multi_choice
    level: L3
    objectives: [OBJ-A01.5.8]
    stem: >-
      Which of these belong on a volume rather than a container's own
      filesystem? Select all that apply.
    options:
      - id: a
        text: A database's data directory
        correct: true
      - id: b
        text: A frequently rewritten cache file inherited from the image
        correct: true
      - id: c
        text: Uploads the service spools before processing
        correct: true
      - id: d
        text: The application binary
        note: >-
          Read-only and part of the image. Putting it on a volume defeats
          immutability and the layer sharing that makes containers cheap.
    explanation: >-
      Two reasons drive the rule: the upper layer is discarded when the container
      is removed, and modifying a file from a lower layer triggers copy-up of the
      whole file. Anything written frequently or worth keeping belongs on a
      volume.
