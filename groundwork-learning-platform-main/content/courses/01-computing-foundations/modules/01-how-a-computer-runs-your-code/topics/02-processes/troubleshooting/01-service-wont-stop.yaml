id: troubleshooting.service-wont-stop
topic: topic.processes
title: The deploy hangs for 30 seconds on every pod
level: L3
objectives: [OBJ-A01.2.6, OBJ-A01.2.7]
reveal_policy: progressive

situation: >-
  Your team's payments service was containerised last month. Since then, every
  deploy takes far longer than it should: each pod sits in `Terminating` for
  exactly 30 seconds before disappearing. A rolling deploy of 12 pods now takes
  six minutes.


  Nobody has treated it as urgent — the deploy does finish, and no alert fires.
  But this week support reported a handful of payment requests failing during
  deploy windows, with connection resets rather than error responses.


  Work out what is happening before reading the answer, and be ready to say
  which evidence proves it.

symptoms:
  - "Every pod takes exactly 30 seconds to terminate — never 5, never 45"
  - "No errors in the application log during shutdown"
  - "Pod exit code is 137"
  - "The application's shutdown handler logs nothing"
  - "A handful of requests fail with connection reset during deploys"
  - "Worked fine before containerisation, when it ran under systemd"

artifacts:
  - type: config
    label: "Dockerfile (final lines)"
    content: |
      COPY entrypoint.sh /entrypoint.sh
      RUN chmod +x /entrypoint.sh
      ENTRYPOINT ["/entrypoint.sh"]

  - type: config
    label: "entrypoint.sh"
    content: |
      #!/bin/sh
      echo "starting payments service"
      export DB_HOST=$(cat /etc/config/db_host)
      python3 /app/server.py

  - type: config
    label: "Application shutdown handler (server.py, abridged)"
    content: |
      import signal, sys

      def shutdown(signum, frame):
          log.info("shutting down: draining connections")
          server.stop(grace=10)
          sys.exit(0)

      signal.signal(signal.SIGTERM, shutdown)

  - type: command_output
    label: "kubectl exec into a running pod"
    content: |
      $ kubectl exec -it payments-7d4f -- ps -ef
      UID   PID  PPID  C STIME TTY   TIME CMD
      root    1     0  0 09:14 ?  00:00:00 /bin/sh /entrypoint.sh
      root    7     1  0 09:14 ?  00:00:12 python3 /app/server.py

  - type: command_output
    label: "kubectl describe pod, on a terminating pod"
    content: |
      Containers:
        payments:
          State:       Terminated
            Reason:    Error
            Exit Code: 137
      Events:
        Normal  Killing  Stopping container payments

  - type: config
    label: "Deployment spec (excerpt)"
    content: |
      spec:
        terminationGracePeriodSeconds: 30
        containers:
          - name: payments
            image: registry.internal/payments:1.8.2

diagnostic_questions:
  - "Which process receives the SIGTERM that Kubernetes sends?"
  - "Is that the same process that installed the shutdown handler?"
  - "Why is the duration always exactly 30 seconds, rather than varying?"
  - "What does exit code 137 tell you, and how did the process get there?"
  - "Why did this work under systemd but not in a container?"
  - "Why do the failures show as connection resets rather than error responses?"

hints:
  - >-
    Start with the process list inside the pod. Kubernetes signals PID 1 — is
    PID 1 the process you think it is?
  - >-
    The handler is installed in server.py. Look at which PID server.py is
    running as, and which PID gets the signal.
  - >-
    A duration identical to a configured timeout, every single time, is almost
    never work being done. It is a deadline being reached.

root_cause: >-
  The entrypoint script runs as PID 1 and starts Python as a child (PID 7).
  Kubernetes sends SIGTERM to PID 1 — the shell — which has no handler installed
  for it.


  Because PID 1 is exempt from default signal actions, the kernel discards the
  signal rather than terminating the shell. The shell keeps waiting on its child.
  Python, which does have a correct handler, is never signalled and never learns
  that shutdown was requested.


  After `terminationGracePeriodSeconds` (30) elapses, Kubernetes sends SIGKILL
  to the whole process group. That cannot be discarded, so everything dies
  instantly — mid-request. Exit code 137 is 128 + 9, meaning killed by signal 9.


  The connection resets are the direct consequence: in-flight requests were
  severed rather than drained, because the drain code never ran.


  Under systemd this did not happen because the service was not PID 1 — it was
  an ordinary child of init, so default signal actions applied and SIGTERM
  reached it normally. Containerisation changed the PID, and nothing else.

method: |
  The generalisable procedure, which is the part worth keeping:

  **1. A duration identical to a configured timeout is a deadline, not work.**
  Real cleanup varies — 3 seconds one time, 8 the next. Exactly 30, every time,
  with a 30-second grace period configured, means nothing responded and the
  timeout expired. This single observation narrows the problem enormously before
  you have looked at anything else.

  **2. Decode the exit code.** 137 = 128 + 9 = killed by SIGKILL. 143 = 128 + 15
  = terminated by SIGTERM, which is what a *successful* graceful shutdown looks
  like. The difference between those two numbers is the difference between "it
  shut down" and "it was executed", and it is visible without reading a log.

  **3. Ask who actually receives the signal.** The orchestrator signals PID 1.
  `ps -ef` inside the container answers whether PID 1 is your application or
  something wrapping it. This is one command and it settles the whole question.

  **4. Check that the handler is installed in the process being signalled.**
  Correct handler code in the wrong process is indistinguishable from no handler
  at all — and it reviews cleanly, which is why this bug survives code review.

  **5. Ask what changed.** "It worked under systemd" is a strong clue: the code
  did not change, so the *environment* did. Under systemd the app was a child of
  init; in a container it is a grandchild of PID 1. That is the whole difference.

  The transferable rule: **when an orchestrator and an application disagree
  about shutdown, find out which process is PID 1 before anything else.**

resolution: |
  **Immediate fix**, one line in `entrypoint.sh`:

  ```sh
  exec python3 /app/server.py
  ```

  `exec` replaces the shell with Python rather than starting it as a child.
  Python becomes PID 1, receives SIGTERM directly, and its handler runs. Shutdown
  drops from 30 seconds to however long draining actually takes, and the exit
  code becomes 0 or 143 instead of 137.

  **Verify in seconds, not deploys:**

  ```sh
  kubectl exec <pod> -- ps -p 1 -o comm=
  # want: python3     not: sh
  ```

  **Alternatives**, in order of preference:

  1. Drop the wrapper entirely — move the env setup into the deployment spec and
     use `ENTRYPOINT ["python3", "/app/server.py"]`. Fewest moving parts.
  2. `exec` as above, when the wrapper genuinely needs to do work first.
  3. A real init (`tini`, or `shareProcessNamespace`/`--init`) when the
     application also spawns children it does not reap. This solves signal
     forwarding *and* orphan reaping.

  **Prevention:**

  - Assert PID 1 in a smoke test: `ps -p 1 -o comm=` must be the application.
  - Alert on containers whose termination duration equals the grace period. That
    is a leading indicator of exactly this bug, and it would have caught this in
    the first week rather than the fifth.
  - Test shutdown under load. This bug is invisible without in-flight requests —
    which is precisely why it reached production.
