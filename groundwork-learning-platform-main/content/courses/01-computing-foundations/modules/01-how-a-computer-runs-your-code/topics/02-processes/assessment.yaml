id: assessment.processes
topic: topic.processes
pass_score: 70

parts:
  - id: A
    title: Explain it to a colleague
    kind: explain
    objectives: [OBJ-A01.2.2]
    prompt: >-
      A developer asks: "Why does Linux need both fork and exec? Every other
      system I've used has one call that just runs a program. This seems
      needlessly complicated."


      Write a reply of roughly 150–250 words. Explain what each call does, why
      the split exists, and give one concrete thing that would be harder with a
      single call. Assume they are a competent programmer who has never thought
      about how a shell works.
    rubric:
      - "States clearly that fork duplicates and exec replaces"
      - "Notes that the child keeps the same PID through exec"
      - "Identifies the gap between the two calls as the point of the design"
      - "Gives a concrete example — redirection, chdir, or dropping privileges"
      - "Explains why a single spawn() call would need a parameter for each of those"
      - "Written for the stated audience, without unexplained jargon"
    model_answer: >-
      It is two calls because the interesting part happens between them.


      `fork` makes a copy of the process that called it. You now have two nearly
      identical processes; the only differences are the new PID and what the call
      returns — zero in the child, the child's PID in the parent — which is how
      each side knows which one it is.


      `exec` throws away the program running in the current process and loads a
      different one in its place. Same PID, same open files, new code.


      So a shell running a command forks, and then in the child calls exec.


      The reason to split them is that the child is an ordinary process running
      ordinary code before it execs. Anything you want set up for the new program
      you just *do*, in the child, with normal calls.


      Take `ls > out.txt`. After forking, the child opens `out.txt` and points
      file descriptor 1 at it. Then it execs `ls`, which writes to descriptor 1
      exactly as it always does. `ls` has no idea a file is involved.


      With a single `spawn()` you would need a parameter for redirection — and
      another for the working directory, and another for the user to run as, and
      another for environment variables, and so on forever. The two-call design
      needs none of them, because "write some code in the child" covers every
      case anyone will ever invent.
    common_failures:
      - "Describing both calls accurately but never answering *why* they are separate"
      - "Giving no concrete example, leaving the argument abstract"
      - "Missing that the PID survives exec, which is the detail the whole design turns on"
      - "Treating it as a historical accident rather than a deliberate design"

  - id: B
    title: Diagnose from evidence
    kind: diagnose
    objectives: [OBJ-A01.2.6]
    prompt: |
      You are handed this and told "the service won't restart cleanly".

      ```text
      $ kubectl exec -it api-5f8d -- ps -ef
      UID   PID  PPID  C STIME TTY   TIME CMD
      root    1     0  0 08:02 ?  00:00:00 /bin/bash /run.sh
      root   9     1  0 08:02 ?  00:01:44 /usr/local/bin/api-server
      root  204     9  0 09:31 ?  00:00:00 /usr/bin/report-gen
      root  399     1  0 10:14 ?  00:00:00 [report-gen] <defunct>
      root  511     1  0 11:02 ?  00:00:00 [report-gen] <defunct>

      $ kubectl get pod api-5f8d -o jsonpath='{.spec.terminationGracePeriodSeconds}'
      45

      $ kubectl describe pod api-5f8d | grep -A2 'Last State'
      Last State:     Terminated
        Reason:       Error
        Exit Code:    137
      ```

      Answer all four:

      1. There are **two** distinct problems here. Name both and cite the
         evidence for each.
      2. For the shutdown problem: which process receives SIGTERM, and what does
         it do with it?
      3. For the other problem: which process is at fault, and how do you know
         it is that one rather than another?
      4. Give one fix that addresses both, and say what it does.
    rubric:
      - "Identifies the shutdown problem: PID 1 is a shell wrapper, so SIGTERM is discarded"
      - "Identifies the second problem: accumulating zombies (<defunct> entries)"
      - "Cites exit code 137 as evidence of SIGKILL rather than clean shutdown"
      - "Notes that the zombies have PPID 1, so PID 1 is failing to reap"
      - "Explains that the shell as PID 1 neither forwards signals nor reaps orphans"
      - "Proposes an init (tini / --init) or exec, and explains which problem each solves"
    model_answer: |
      **1. Two problems.**

      *Shutdown is broken.* PID 1 is `/bin/bash /run.sh`, a wrapper, not the
      application. Exit code 137 is 128 + 9, so the pod was SIGKILLed rather than
      terminating cleanly.

      *Zombies are accumulating.* PIDs 399 and 511 are `<defunct>` with PPID 1 —
      dead `report-gen` processes nobody has collected.

      **2. Shutdown.** Kubernetes sends SIGTERM to PID 1, which is bash. Bash
      installs no handler for it, and PID 1 is exempt from default signal
      actions, so the kernel discards it. `api-server` (PID 9) is never told to
      stop. After 45 seconds Kubernetes sends SIGKILL and everything dies
      mid-request.

      **3. Zombies.** The parent shown for both is PID 1 — the bash wrapper. The
      original parent was `api-server` (PID 9), which spawned `report-gen`; when
      those children exited without being reaped, they were reparented to PID 1.
      Bash is not an init and does not reap adopted orphans, so they accumulate
      there. Grouping zombies by PPID is what identifies the responsible process,
      and here it points at PID 1 rather than at api-server.

      **4. One fix for both:** run a real init as PID 1 — `docker run --init`,
      tini in the image, or Kubernetes' equivalent. An init forwards SIGTERM to
      its children, so shutdown works, *and* reaps adopted orphans, so zombies do
      not accumulate. `exec` in `run.sh` would fix shutdown alone, but would leave
      api-server as PID 1 with the same reaping problem it has now.
    common_failures:
      - "Spotting only the shutdown problem and missing the zombies entirely"
      - "Spotting the zombies but blaming api-server without checking their PPID"
      - "Not decoding 137, and so treating the shutdown as possibly successful"
      - "Proposing `exec` as a complete fix, when it does not address reaping"
      - "Suggesting the zombies be killed"

  - id: C
    title: Reason about a design
    kind: reason
    objectives: [OBJ-A01.2.8]
    prompt: >-
      You run a fleet of 300 hosts. A service on each one forks a subprocess per
      job — roughly 20 jobs a minute — and a code review has just revealed it
      never calls `wait()`. `pid_max` is the default 32,768 on every host.


      Write roughly 250–350 words covering: how long you have, what happens at
      the limit and in what order, why your existing monitoring will not warn
      you, what you do in the next hour, and what you change so this class of
      problem cannot recur.


      This is a judgement question. The arithmetic is the easy part.
    rubric:
      - "Estimates the time to exhaustion with working shown"
      - "Describes the failure order: fork failures spreading, monitoring agent affected, host effectively unreachable"
      - "Explains why memory/CPU/disk alerts stay silent throughout"
      - "Separates immediate mitigation from the real fix"
      - "Proposes per-service limits so a leak is contained rather than host-wide"
      - "Proposes an alert on a leading indicator, not just the failure"
      - "Considers the fleet dimension — 300 hosts failing at roughly the same time"
    model_answer: |
      **The arithmetic.** ~32,400 usable PIDs at 20/minute is about 27 hours per
      host. Worse: all 300 hosts started at roughly the same time and leak at the
      same rate, so they will not fail one by one — they will fail together,
      inside the same few hours. That turns a host incident into a fleet incident.

      **What happens, in order.** PIDs fill quietly for a day; nothing looks
      wrong. Near the limit, `fork` starts failing intermittently — the service
      cannot spawn job subprocesses and jobs begin failing. Then anything else
      trying to start fails too: cron, log rotation, the monitoring agent. That
      last one is why the alert you eventually get is "host unreachable" rather
      than anything useful. SSH may connect but the shell cannot fork, so the box
      is barely diagnosable.

      **Why monitoring is silent.** Zombies use no memory, no CPU and no disk.
      Every metric on a standard dashboard is flat and healthy right up to the
      failure. Nobody graphs PID usage, so the one number that was moving was the
      one nobody could see.

      **Next hour.** Alert on `process count / pid_max` across the fleet
      immediately, so I know how long I actually have per host rather than
      guessing. Then roll a restart of the service across the fleet — that
      orphans the zombies to PID 1, which reaps them instantly, and buys another
      27 hours per host. Schedule a recurring restart as a stopgap while the fix
      is written. I would not raise `pid_max`: it hides the leak and moves the
      deadline without changing anything.

      **So it cannot recur.** The code fix is `wait()`, a SIGCHLD handler, or
      `SIG_IGN` on SIGCHLD. But the systemic fix is a per-service `TasksMax` or
      `pids` cgroup limit well below `pid_max`, so a leaking service exhausts its
      own budget and crashes loudly instead of taking the host with it. Plus a
      standing alert on zombie count. The principle: **give every service a limit
      smaller than the machine's**, so a leak is contained to the thing leaking.
    common_failures:
      - "Doing the arithmetic and stopping there"
      - "Missing that 300 hosts fail together, not gradually"
      - "Not explaining why standard alerts stay silent — the crux of the question"
      - "Proposing to raise pid_max as the fix rather than as a stopgap"
      - "Fixing only the application and adding nothing that contains the next leak"
      - "Forgetting that the monitoring agent itself needs to fork"
