id: lab.signals-in-practice
topic: topic.processes
title: Catch a signal, then fail to catch one
type: guided
tier: 2
image: groundwork/lab-foundations:1
duration_minutes: 20
objectives: [OBJ-A01.2.5]

intro: >-
  Graceful shutdown is not a feature you enable. It is a signal handler, and you
  are about to write one.


  Then you will try to write a handler for SIGKILL and discover that you cannot —
  which is the single most useful thing to know about signals, and the reason an
  OOM kill takes your in-flight work with it.

setup:
  - /opt/lab/seed.sh

steps:
  - id: s1
    instruction: >-
      Write a script /tmp/graceful.sh that traps SIGTERM. On receiving it, it
      should append the line `caught SIGTERM` to /tmp/shutdown.log and exit 0.
      Otherwise it should just wait.


      Make it executable.
    hint: |
      ```bash
      #!/bin/bash
      trap 'echo "caught SIGTERM" >> /tmp/shutdown.log; exit 0' TERM
      echo "running as $$"
      while true; do sleep 1; done
      ```
    walkthrough: |
      cat > /tmp/graceful.sh <<'EOF'
      #!/bin/bash
      trap 'echo "caught SIGTERM" >> /tmp/shutdown.log; exit 0' TERM
      while true; do sleep 1; done
      EOF
      chmod +x /tmp/graceful.sh
    verify:
      - type: file_exists
        path: /tmp/graceful.sh
        describe: The script exists
      - type: file_matches
        path: /tmp/graceful.sh
        pattern: "trap"
        describe: It installs a signal handler
      - type: command_exit
        command: "test -x /tmp/graceful.sh"
        exit_code: 0
        describe: The script is executable

  - id: s2
    instruction: >-
      Run it in the background, then send it SIGTERM with plain `kill` (no
      `-9`). Check /tmp/shutdown.log.


      This is what a well-behaved process does when an orchestrator asks it to
      stop.
    hint: "`/tmp/graceful.sh & sleep 1; kill %1` — or use the PID from `$!`."
    walkthrough: |
      /tmp/graceful.sh &
      sleep 1
      kill $!
      sleep 1
    verify:
      - type: file_matches
        path: /tmp/shutdown.log
        pattern: "caught SIGTERM"
        describe: The handler ran and logged its shutdown

  - id: s3
    instruction: >-
      Now try to do the same for SIGKILL. Copy the script to /tmp/stubborn.sh and
      change the trap to catch both TERM and KILL.


      Run it, send `kill -9`, and look at the log. Write what you observe to
      /tmp/answer-sigkill — the single word `caught` or `not-caught`.
    hint: >-
      `trap '...' TERM KILL` — bash will accept the line without complaint. That
      does not mean it works.
    walkthrough: |
      sed 's/ TERM$/ TERM KILL/' /tmp/graceful.sh > /tmp/stubborn.sh
      chmod +x /tmp/stubborn.sh
      : > /tmp/shutdown.log
      /tmp/stubborn.sh &
      sleep 1
      kill -9 $!
      sleep 1
      echo not-caught > /tmp/answer-sigkill
    verify:
      - type: file_exists
        path: /tmp/stubborn.sh
        describe: The second script exists
      - type: file_matches
        path: /tmp/answer-sigkill
        pattern: '^not-caught$'
        describe: You observed that SIGKILL cannot be caught

  - id: s4
    instruction: >-
      Prove a process exists without disturbing it. Start
      `sleep 300 &`, then use `kill -0` on its PID and record the exit code in
      /tmp/answer-kill0 as a bare number.


      Then do the same for a PID that does not exist, such as 999999, and append
      that exit code on a second line.
    hint: >-
      `kill -0 <pid>; echo $?` — signal 0 sends nothing and only reports whether
      you could have signalled it.
    walkthrough: |
      sleep 300 & P=$!
      kill -0 $P; echo $? > /tmp/answer-kill0
      kill -0 999999 2>/dev/null; echo $? >> /tmp/answer-kill0
    verify:
      - type: file_matches
        path: /tmp/answer-kill0
        pattern: '^0'
        describe: Signalling the live process succeeded
      - type: command_output
        command: "wc -l < /tmp/answer-kill0"
        pattern: "[2-9]"
        describe: Both results were recorded

  - id: s5
    instruction: >-
      Last one. Start a fresh `sleep 300 &`, then send SIGSTOP to it and check
      its state in `ps`. Write the state letter to /tmp/answer-stopped.


      Then send SIGCONT and confirm it goes back to sleeping.
    hint: "`kill -STOP <pid>` then `ps -p <pid> -o stat=`. `kill -CONT <pid>` resumes it."
    walkthrough: |
      sleep 300 & Q=$!
      kill -STOP $Q
      sleep 1
      ps -p $Q -o stat= | tr -d ' ' > /tmp/answer-stopped
      kill -CONT $Q
    verify:
      - type: file_matches
        path: /tmp/answer-stopped
        pattern: '^T'
        describe: You observed the stopped state

solution: |
  ```bash
  cat > /tmp/graceful.sh <<'EOF'
  #!/bin/bash
  trap 'echo "caught SIGTERM" >> /tmp/shutdown.log; exit 0' TERM
  echo "running as $$"
  while true; do sleep 1; done
  EOF
  chmod +x /tmp/graceful.sh

  /tmp/graceful.sh &
  sleep 1
  kill $!
  sleep 1
  cat /tmp/shutdown.log        # caught SIGTERM

  sed 's/TERM$/TERM KILL/' /tmp/graceful.sh > /tmp/stubborn.sh
  chmod +x /tmp/stubborn.sh
  : > /tmp/shutdown.log
  /tmp/stubborn.sh &
  sleep 1
  kill -9 $!
  sleep 1
  cat /tmp/shutdown.log        # empty
  echo not-caught > /tmp/answer-sigkill

  sleep 300 &
  kill -0 $! ; echo $? > /tmp/answer-kill0
  kill -0 999999 2>/dev/null ; echo $? >> /tmp/answer-kill0

  sleep 300 &
  PID=$!
  kill -STOP $PID
  ps -p $PID -o stat= | tr -d ' ' > /tmp/answer-stopped
  kill -CONT $PID
  ```

  **What you proved.**

  **SIGTERM is a request and your handler decides.** The log line exists because
  your code chose to write it. That is all "graceful shutdown" ever is — and it
  is why a process with no handler simply dies with its work in flight.

  **`trap ... KILL` is accepted and does nothing.** Bash does not reject the
  line; the kernel simply never delivers SIGKILL to a handler. There is no
  configuration, no privilege and no language feature that changes this. It is
  why the OOM killer is not survivable, and why the ten-second wait before
  `docker stop` escalates is the *only* chance your cleanup gets.

  **`kill -0` asks without touching.** Exit 0 means the process exists and you
  may signal it; non-zero means it does not, or you may not. This is the correct
  liveness check in a script — `ps | grep` matches its own grep and lies to you.

  **SIGSTOP freezes rather than kills.** State `T`, resumable with SIGCONT.
  Like SIGKILL it cannot be caught, for the same reason: the system needs a way
  to act on a process that has stopped cooperating.

  **Where this goes.** When your container ignores `docker stop` for ten seconds
  and then dies, it is the second finding above: no handler, so nothing to catch
  the TERM, so the KILL was the only thing that worked. **C14** shows the three
  fixes; you have now built the mechanism all three rely on.
