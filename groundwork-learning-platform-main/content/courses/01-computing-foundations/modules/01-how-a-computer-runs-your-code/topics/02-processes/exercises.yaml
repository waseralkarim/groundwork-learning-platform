topic: topic.processes

exercises:
  - id: e1
    title: Read the tree
    level: L2
    objectives: [OBJ-A01.2.3]
    kind: interpretation
    prompt: |
      Given this snapshot:

      ```text
        PID  PPID STAT COMMAND
          1     0 Ss   /sbin/init
        412     1 Ss   /usr/sbin/sshd -D
       1180     1 Ssl  postgres
       1204  1180 Ss   postgres: writer
       1205  1180 Ss   postgres: wal writer
       8821   412 Ss   sshd: alice [priv]
       8835  8821 Ss   -bash
       9100  8835 S    ./deploy.sh
       9101     1 S    ./long-task.sh
      ```

      1. Which process started `-bash`, and how do you know?
      2. How many children does postgres have here?
      3. `long-task.sh` has PPID 1. Give two different explanations.
      4. If PID 8835 exits right now, what happens to PID 9100?
      5. Which of these processes would you expect to be reaping children?
    answer: |
      1. **PID 8821**, the per-connection sshd. `-bash` has PPID 8821, and PPIDs
         point at the creating process.
      2. **Two** — 1204 and 1205, both with PPID 1180.
      3. Either **it was started as a daemon** (forked, and its parent exited, so
         the kernel reparented it to init), or **its parent died** while it kept
         running. The snapshot cannot distinguish them; `etime` on both would
         help.
      4. It is **reparented to PID 1** and keeps running. Children are not killed
         when a parent exits.
      5. **PID 1**, always — that is a core part of init's job. And **postgres**,
         which manages a pool of child processes and must collect them as they
         exit.
    explanation: |
      Reading PPIDs bottom-up reconstructs how any process came to exist, which
      is the fastest way to answer "what started this thing".

      Question 3 is the interesting one, because both explanations are common and
      they mean very different things. A PPID of 1 on a process you did not
      expect to be a daemon is worth investigating — it may mean its supervisor
      died and nothing noticed.

  - id: e2
    title: Diagnose from state
    level: L2
    objectives: [OBJ-A01.2.4]
    kind: interpretation
    prompt: |
      For each, say what is happening and what you would do:

      1. 200 processes in `S`, load average 0.2
      2. 12 processes in `D`, load average 14, CPU 95% idle
      3. 3,000 processes in `Z`, memory 15%, CPU idle
      4. 1 process in `T`, nothing else unusual
      5. 40 processes in `R` on a 4-core machine
    answer: |
      1. **Normal.** Sleeping processes cost nothing. A process count is not a
         load measure. Do nothing.
      2. **I/O-bound, badly.** Load counts D as well as R, which is why it is 14
         while the CPUs are idle. Something is stuck on storage — check the disk
         or the network filesystem. Killing the processes will not work; they are
         in D.
      3. **A reaping leak, heading for PID exhaustion.** Find the common parent
         of the zombies and fix or restart it. Adding memory would do nothing.
      4. **Suspended**, by SIGSTOP or a debugger. Harmless if intentional;
         `kill -CONT` resumes it. Worth asking who stopped it and why.
      5. **CPU-bound, oversubscribed 10:1.** Reduce concurrency or add cores. The
         run queue is the signal, not the process count.
    explanation: |
      The state column is the fastest triage on a Linux box, and it distinguishes
      three failures that look identical from a dashboard: I/O stalls (D),
      reaping leaks (Z) and genuine CPU pressure (R).

      Case 2 is the one that misleads people. Load average counts uninterruptible
      sleep, so an I/O problem produces a frightening load number with idle CPUs.
      Buying CPU would change nothing.

  - id: e3
    title: The ten-second container
    level: L3
    objectives: [OBJ-A01.2.7]
    kind: short_answer
    prompt: |
      A colleague reports that `docker stop` on their service takes exactly ten
      seconds every time, then succeeds with exit code 0. Their Dockerfile ends:

      ```dockerfile
      ENTRYPOINT ["/bin/sh", "-c", "python3 /app/server.py"]
      ```

      Their Python code installs a SIGTERM handler and logs "shutting down".
      That line never appears.

      1. Why does the handler never run, given that it exists?
      2. What is PID 1 in this container?
      3. Give two fixes, and say which you would prefer.
      4. How would you verify the fix without waiting ten seconds?
    answer: |
      1. The handler exists in the *Python* process, but Python is not the process
         receiving the signal. `sh -c` runs as PID 1 and starts Python as a
         child. Docker signals PID 1 — the shell — which has no handler, and PID 1
         gets no default action, so nothing happens. Python is never told.
      2. `/bin/sh`.
      3. Either:
         - `ENTRYPOINT ["python3", "/app/server.py"]` — Python becomes PID 1 and
           receives SIGTERM directly.
         - Keep a shell entrypoint but end it with `exec python3 /app/server.py`,
           so the shell *becomes* Python rather than parenting it.
         - Or `docker run --init`, which puts a real init at PID 1 to forward
           signals and reap.

         Prefer the first: fewest moving parts, and the application is genuinely
         PID 1. Use `--init` when the application also spawns children it does
         not reap.
      4. `docker exec` into it and check `ps -p 1 -o comm=`. If PID 1 is not your
         application, the signal will not reach it. That takes a second and
         requires no restart.
    explanation: |
      This is the single most common containerisation bug, and it survives review
      because the code is correct — the handler is written properly and works
      locally where the program is not PID 1.

      Point 4 is the transferable habit: `ps -p 1` inside a container answers "will
      my shutdown handler ever run" faster than any amount of log reading.

  - id: e4
    title: Budget the processes
    level: L3
    objectives: [OBJ-A01.2.8]
    kind: calculation
    prompt: |
      A service runs 40 workers. Each forks a subprocess per job and — through a
      bug — never reaps it. It handles roughly 30 jobs per minute in total.

      The host has `pid_max` set to 32,768, with about 400 processes already
      running.

      1. How long until PID exhaustion?
      2. What will the first visible symptom be, and to whom?
      3. Why will the memory and CPU dashboards look fine throughout?
      4. What is the immediate mitigation, and what is the actual fix?
    answer: |
      1. ~32,368 PIDs available, consumed at 30/minute → about **18 hours**.
      2. `fork: Resource temporarily unavailable` — and it will hit whoever tries
         to start a process next. Very often that is an engineer opening an SSH
         session to investigate, so it can present as "the box is down" rather
         than "the app is broken".
      3. Zombies hold no memory and use no CPU. Every conventional resource graph
         is flat right up to the failure.
      4. **Immediate:** restart the parent processes — the zombies are reparented
         to PID 1 and reaped instantly. Raising `pid_max` buys hours, not a fix.
         **Actual:** the parent must call `wait()`, or handle SIGCHLD, or set
         `SIGCHLD` to `SIG_IGN` so the kernel reaps automatically.
    explanation: |
      The arithmetic is easy; the point is question 3. This failure is invisible
      to every dashboard people normally watch, so it is caught late and
      diagnosed slowly.

      The alert that would catch it is a count of processes in state Z, or
      simply total process count as a fraction of `pid_max`. Neither is on a
      default dashboard, which is why this outage recurs across the industry.
