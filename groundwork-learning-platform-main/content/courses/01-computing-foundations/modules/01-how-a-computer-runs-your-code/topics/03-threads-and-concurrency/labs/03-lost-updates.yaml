id: lab.lost-updates
topic: topic.threads-and-concurrency
title: Lose a hundred million increments
type: guided
tier: 2
image: groundwork/lab-foundations:1
duration_minutes: 20
objectives: [OBJ-A01.6.7]

intro: >-
  Two threads increment the same counter. Each counts how many times it tried.
  At the end, the counter is smaller than the total attempted — by a lot.


  Nothing goes wrong, nothing errors, and no log line appears. This is what a
  race condition looks like from the outside, and doing it once is worth more
  than reading about it five times.

setup:
  - /opt/lab/seed.sh

steps:
  - id: s1
    instruction: >-
      Run /opt/lab/spin with a single thread for 3 seconds and save its output to
      /tmp/answer-one-thread.


      Look at the last three lines: attempted, counted, lost.
    hint: "`/opt/lab/spin 1 3 > /tmp/answer-one-thread 2>&1`"
    walkthrough: |
      /opt/lab/spin 1 3 > /tmp/answer-one-thread 2>&1
      tail -3 /tmp/answer-one-thread
    verify:
      - type: file_matches
        path: /tmp/answer-one-thread
        pattern: 'lost updates:\s+0'
        describe: With one thread, nothing is lost

  - id: s2
    instruction: >-
      Now run four threads for the same 3 seconds, saving the output to
      /tmp/answer-four-threads.


      Read the same three lines. The increments are unsynchronised, and four
      threads are now interleaving on the same variable.
    hint: "`/opt/lab/spin 4 3 > /tmp/answer-four-threads 2>&1`"
    walkthrough: |
      /opt/lab/spin 4 3 > /tmp/answer-four-threads 2>&1
      tail -3 /tmp/answer-four-threads
    verify:
      - type: file_matches
        path: /tmp/answer-four-threads
        pattern: 'lost updates:\s+[1-9]'
        describe: With four threads, increments were lost

  - id: s3
    instruction: >-
      Record how many were lost, as a bare number, to /tmp/answer-lost.


      Then work out what fraction of the attempts survived and write it as a
      percentage, to the nearest whole number, in /tmp/answer-survived-percent.
    hint: >-
      The output gives both figures. `awk` can pull the numbers out and do the
      arithmetic.
    walkthrough: |
      awk '/lost updates:/ {print $3}' /tmp/answer-four-threads > /tmp/answer-lost
      attempted=$(awk '/increments attempted:/ {print $3}' /tmp/answer-four-threads)
      counted=$(awk '/shared counter:/ {print $3}' /tmp/answer-four-threads)
      awk -v c="$counted" -v a="$attempted" 'BEGIN {printf "%d\n", 100*c/a}' > /tmp/answer-survived-percent
      echo "attempted=$attempted counted=$counted lost=$(cat /tmp/answer-lost) survived=$(cat /tmp/answer-survived-percent)%"
    verify:
      - type: file_matches
        path: /tmp/answer-lost
        pattern: '^[1-9][0-9]{3,}$'
        describe: Thousands of increments or more were lost
      - type: file_matches
        path: /tmp/answer-survived-percent
        pattern: '^\d{1,3}$'
        describe: The survival rate was calculated

  - id: s4
    instruction: >-
      Run the four-thread version twice more, appending the lost figure each
      time to /tmp/answer-repeats.


      The number will differ every run. That variability is the defining
      property of this class of bug.
    hint: "Run it twice, appending `awk '/lost updates:/ {print $3}'` each time."
    walkthrough: |
      for i in 1 2; do
        /opt/lab/spin 4 3 2>/dev/null | awk '/lost updates:/ {print $3}' >> /tmp/answer-repeats
      done
      cat /tmp/answer-repeats
    verify:
      - type: command_output
        command: "wc -l < /tmp/answer-repeats"
        pattern: "[2-9]"
        describe: At least two more runs were recorded
      - type: file_matches
        path: /tmp/answer-repeats
        pattern: '^\d+$'
        describe: Each run produced a figure

  - id: s5
    instruction: >-
      Write to /tmp/answer-mechanism, in at least twenty-five words, the
      sequence by which two threads incrementing the same variable end up
      applying only one increment.


      Describe the three machine-level operations that make up `x = x + 1`.
    walkthrough: |
      cat > /tmp/answer-mechanism <<'EOF'
      The increment is three operations: read the value, add one, write it back.
      Two threads can both read the same value before either writes, so both
      compute the same result and both store it. Two increments happened and the
      counter advanced by one, because the second write overwrote the first
      rather than building on it.
      EOF
    verify:
      - type: command_output
        command: "wc -w < /tmp/answer-mechanism"
        pattern: "([2-9][0-9]|[0-9]{3,})"
        describe: At least twenty-five words
      - type: file_matches
        path: /tmp/answer-mechanism
        pattern: "read"
        describe: You described the read step of read-modify-write

  - id: s6
    instruction: >-
      Finally, name the fix. Write to /tmp/answer-fix the single word for the
      mechanism that makes the read-add-write indivisible so no other thread can
      interleave: `lock`, `mutex` or `atomic`.
    hint: >-
      Any of the three is accepted. For a single counter one of them is cheaper
      than the others — worth knowing which, and why.
    walkthrough: |
      echo atomic > /tmp/answer-fix
    verify:
      - type: file_matches
        path: /tmp/answer-fix
        pattern: '^(lock|mutex|atomic|atomics)$'
        describe: You named a mechanism that makes the update indivisible

solution: |
  ```bash
  /opt/lab/spin 1 3      # lost updates: 0
  /opt/lab/spin 4 3      # lost updates: hundreds of millions
  /opt/lab/spin 4 3      # a different number every time
  ```

  **What happened.**

  `counter = counter + 1` is three machine operations — read, add, write — and the
  scheduler can run another thread between any two of them. Two threads read 41,
  both compute 42, both write 42. Two increments, one advance.

  **One thread lost nothing.** There was nothing to interleave with. This is why
  the bug does not appear in single-threaded tests, and why it often does not
  appear in testing at all.

  **Four threads lost most of them.** Not a few, not an edge case: with real
  contention the interleaving is the normal case. The counter ended at a fraction
  of the true total, and nothing anywhere reported an error.

  **The number differed every run.** That is the defining property. A bug whose
  output changes between identical runs cannot be reproduced on demand, which is
  what makes this class so expensive — and why "it worked when I tested it" is
  worth nothing here.

  **What a lock actually does.** A mutex makes one interleaving impossible: one
  thread at a time completes the read-add-write. Two things it does *not* do:

  - It does not make the code fast. It removes parallelism from the protected
    section, and a service can be limited by one lock while every CPU is idle.
  - It does not make the code correct by itself. If an invariant spans two locked
    sections, the state can still be inconsistent between them.

  **For a counter, an atomic is better than a lock.** The hardware performs
  read-modify-write as one indivisible instruction: no scheduling window, no lock
  to contend on, and no chance of forgetting to unlock it.

  **Where this goes.** Every shared cache, connection pool and metrics counter in
  a multi-threaded service has this shape. It is also why database transactions
  exist: the same problem, one layer up, where the interleaving is between
  requests rather than threads (**B13**).
