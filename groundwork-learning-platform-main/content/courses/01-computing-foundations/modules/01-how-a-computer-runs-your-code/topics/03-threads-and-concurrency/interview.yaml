topic: topic.threads-and-concurrency

questions:
  - id: i1
    level: L2
    question: What is the difference between a thread and a process?
    model_answer: >-
      On Linux they are the same kernel object created by the same call, with
      different sharing flags. A thread shares the address space, the open file
      table and the working directory with its siblings; each keeps its own
      stack, registers and TID.


      The consequences follow from the sharing. Passing data between threads is
      free because they already see the same memory; corrupting each other's data
      is equally free, and a segfault in one thread kills the whole process.


      That trade-off is the whole design decision: threads for cheap
      communication, processes for isolation.
    signal: >-
      Reasoning from the sharing to the consequences rather than reciting a
      definition. Knowing that the crash blast radius is the process is what
      separates someone who has debugged a multi-threaded service from someone
      who has read about one.
    follow_ups:
      - "Why is a context switch between threads cheaper than between processes?"
      - "When would you choose worker processes over worker threads?"
      - "What is a process's PID, in terms of threads?"

  - id: i2
    level: L3
    question: >-
      A service is slow. Someone doubled its worker threads and it got slower.
      What happened?
    model_answer: >-
      Almost certainly a CPU limit. A container's `cpu.max` is a quota per
      period, shared by every thread in it — say 50ms of CPU per 100ms. Doubling
      the workers does not double the budget; it spends the same budget twice as
      fast, so throttling begins earlier in each period and every thread is
      stopped for the remainder.


      The confirming evidence is `throttled_usec` in `cpu.stat`, which counts
      exactly one thing: time stopped by the limit.


      The counter-intuitive part is that CPU utilisation usually *falls*, because
      a throttled container is idle while stopped. That is what leads teams to
      conclude they have headroom.
    signal: >-
      Explaining why utilisation falls is the discriminator. Anyone can say
      "throttling"; understanding why the obvious metric moves the wrong way is
      what makes someone able to argue the point with a dashboard on screen.
    follow_ups:
      - "How would you size the worker pool correctly?"
      - "Why does a CPU-utilisation autoscaler not fire for a throttled pod?"
      - "When is raising the limit the right fix rather than lowering the workers?"

  - id: i3
    level: L3
    question: Why is `nproc` the wrong number to size a thread pool inside a container?
    model_answer: >-
      Because `/proc/cpuinfo` is not namespaced, so `nproc` reports the host's
      CPUs. A container limited to half a core on a 64-core node is told there
      are 64, and anything sizing itself from that — GC threads, a ForkJoin pool,
      `GOMAXPROCS`, an HTTP worker count — configures for hardware it does not
      have.


      The correct source is the cgroup: `quota / period` from `cpu.max`, rounded
      up, with `max` meaning genuinely unlimited.


      It is the same bug as a JVM reading the host's RAM to size its heap. Same
      cause, different resource.
    signal: >-
      Connecting it to the memory version shows the underlying model rather than
      a memorised gotcha. Knowing that Go and the JVM have both fixed this in
      recent versions — and that application-level pools have not — is the
      practical half.
    follow_ups:
      - "What else inside a container reports host values?"
      - "How would you compute the right number in a shell?"
      - "Does this matter for I/O-bound work?"

  - id: i4
    level: L3
    question: >-
      A service stops responding with near-zero CPU and no errors. How do you
      approach it?
    model_answer: >-
      Near-zero CPU is the most useful fact available, because it rules out
      saturation and throttling immediately — a busy service is busy. Something
      is blocked.


      I would sample `usage_usec` twice a minute apart to confirm nothing is
      moving, check `throttled_usec` to exclude the limit, then look at thread
      states with `ps -L` and `wchan`. Threads in `futex_wait` are blocked on
      userspace locks, which points at a deadlock; threads in state `D` or a
      socket call point at I/O or a remote dependency instead.


      Then a thread dump names the lines. The classic cause is two paths taking
      the same two locks in opposite orders, and the fix is a consistent global
      lock ordering, with an acquisition timeout as a backstop so a future
      violation fails loudly rather than hanging.
    signal: >-
      Establishing busy-versus-idle before theorising. The weak answer starts
      taking thread dumps immediately; the strong one spends ten seconds
      eliminating two-thirds of the possibilities first.
    follow_ups:
      - "How would you tell a deadlock from waiting on a slow database?"
      - "Why does restarting fix it, and why is that a problem?"
      - "How would you make the next occurrence easier to diagnose?"

  - id: i5
    level: L2
    question: >-
      Two threads each increment a shared counter a million times without
      synchronisation. What do you expect, and what would you do about it?
    model_answer: >-
      Somewhere between one and two million, different on every run. The
      increment is read-add-write, and two threads can both read the same value
      before either writes, so one increment is lost.


      For a counter I would use an atomic operation: the hardware does
      read-modify-write indivisibly, so there is no window and no lock to
      contend on. A mutex also works but costs more and can be forgotten.


      Under heavy contention the better answer is often a per-thread counter
      summed at read time — no sharing, no contention, at the cost of a slightly
      stale total, which for a metric is fine.
    signal: >-
      Knowing that the result varies between runs, and that this is what makes
      the bug expensive rather than merely wrong. Reaching for an atomic before a
      lock shows they have thought about cost as well as correctness.
    follow_ups:
      - "What does a mutex guarantee, and what does it not?"
      - "Why might this never appear in testing?"
      - "How does this relate to database transactions?"
