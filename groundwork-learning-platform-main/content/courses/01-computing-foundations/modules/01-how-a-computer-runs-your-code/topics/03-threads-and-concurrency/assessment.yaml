id: assessment.threads-and-concurrency
topic: topic.threads-and-concurrency
pass_score: 70

parts:
  - id: A
    title: Explain a CPU limit to a developer
    kind: explain
    objectives: [OBJ-A01.6.4]
    prompt: >-
      A developer asks why their service is slow when the CPU graph shows 45%
      and there is "obviously headroom".


      Explain in about 150 words what a CPU limit actually does, why the graph
      looks the way it does, and which number they should be looking at instead.
    rubric:
      - "Describes cpu.max as a quota per period rather than a speed"
      - "States that exceeding it stops every thread until the next period, rather than slowing them"
      - "Explains that a stopped container is idle, so utilisation looks moderate"
      - "Names throttled_usec (or the equivalent Prometheus metric) as the number to read"
      - "Avoids implying that adding workers would use the apparent headroom"
    model_answer: >-
      A CPU limit is not a speed setting. It is a quota per period: `cpu.max` of
      `50000 100000` means your container may use 50ms of CPU in every 100ms of
      wall clock.


      Your threads run at full speed until that quota is gone. Then every one of
      them is **stopped** — not slowed — until the next period starts. A request
      needing 5ms of CPU can take 100ms of wall time because it sat out a period.


      The graph shows 45% because a stopped container is idle. Throttling makes
      utilisation look *better*, not worse, which is exactly why it hides.


      The number to look at is `throttled_usec` in `/sys/fs/cgroup/cpu.stat`, or
      `container_cpu_cfs_throttled_seconds_total` in Prometheus. Any non-zero
      value means the limit is shaping your latency.


      And the headroom is not real: adding workers spends the same quota faster.
    common_failures:
      - "Describing throttling as the container running more slowly"
      - "Accepting the utilisation figure as evidence of headroom"
      - "Suggesting more workers or a bigger node without checking throttling"
      - "Explaining the mechanism without naming the metric that proves it"

  - id: B
    title: Size a worker pool
    kind: practical
    objectives: [OBJ-A01.6.5, OBJ-A01.6.6]
    prompt: >-
      You have two services to configure, both in containers with
      `cpu.max = 100000 100000` on a 32-core node:


      **A** — an image resizer; each request is 200ms of pure CPU.


      **B** — an API gateway; each request is 2ms of CPU and 80ms waiting on a
      backend.


      For each, say how many workers you would configure and why, what you would
      measure to check, and what you would change if the measurement disagreed.
    rubric:
      - "Reads the limit as 1.0 CPU and does not use the node's 32 cores"
      - "Sizes the CPU-bound service at or near one worker, and justifies it"
      - "Sizes the I/O-bound service well above one, because its threads are waiting rather than computing"
      - "Names throttled_usec as the measurement for the CPU-bound case"
      - "Names a different signal — latency, queue depth, connection count — for the I/O-bound case"
      - "Says what a disagreeing measurement would imply, rather than treating the numbers as final"
    model_answer: >-
      Both containers may use one CPU, regardless of the node having 32. That is
      the number both answers start from.


      **A, the image resizer**, is CPU-bound: every worker wants a full core. One
      worker, or perhaps two to keep the CPU busy across request boundaries.
      Beyond that they compete for a single core's quota and latency rises while
      throughput does not. I would measure `throttled_usec` under load — near
      zero means the pool fits; climbing means it does not. If throughput is
      genuinely insufficient, the fix is a higher limit or more replicas, not
      more threads.


      **B, the gateway**, is I/O-bound: each request needs 2ms of CPU and spends
      80ms waiting. Its threads are asleep almost all the time, so one CPU can
      sustain roughly 40 concurrent requests before CPU is the constraint. I would
      start around 32–64 workers and watch p99 latency and connection saturation
      rather than CPU — and throttling as a guard, because it would tell me the
      2ms figure was wrong.


      If the measurements disagreed with those estimates I would trust the
      measurements: for A, throttling with one worker means the request costs
      more CPU than stated; for B, throttling at 32 workers means the same.
    common_failures:
      - "Using the node's core count for either service"
      - "Applying the same worker count to both without distinguishing CPU-bound from I/O-bound"
      - "Measuring only CPU utilisation"
      - "Treating the estimate as the answer rather than something to verify"

  - id: C
    title: Diagnose a service that stopped responding
    kind: diagnose
    objectives: [OBJ-A01.6.8]
    prompt: >-
      A service hangs every few days. Health checks fail, it is restarted
      automatically, and it recovers for another few days. There are no errors in
      the log and no memory growth. Nobody has investigated because it recovers
      on its own.


      You have a hung instance that has not yet been restarted. Say what you
      would run, in what order, what each result would tell you, and how you
      would distinguish the three plausible causes.
    rubric:
      - "Establishes busy-versus-idle first, by sampling CPU usage twice"
      - "Rules out throttling explicitly with cpu.stat"
      - "Reads per-thread state and wchan, and interprets futex_wait as a lock"
      - "Distinguishes deadlock from I/O waiting from saturation, with the evidence for each"
      - "Takes a thread dump only after narrowing, and says what it would name"
      - "Notes that automatic restarts are destroying the evidence, and proposes capturing it"
      - "Proposes a structural fix — consistent lock ordering, acquisition timeouts"
    model_answer: >-
      **First, is it busy or idle?** Sample `usage_usec` from `cpu.stat` twice, a
      minute apart. If it barely moves, the process is doing nothing, and that
      single fact eliminates saturation and throttling before I look at anything
      else.


      **Then rule out the limit explicitly.** `nr_throttled` and `throttled_usec`
      unchanged across the same interval means the CPU quota is not involved.


      **Then read the threads.** `ps -L -o pid,tid,stat,wchan,comm` distinguishes
      the three causes directly:


      - threads in `futex_wait` and no CPU movement — a deadlock
      - threads in `D`, or in a socket call, with load high and CPU low — waiting
        on I/O or a remote dependency
      - threads runnable with throttling climbing — saturation


      Context switches confirm it: both counters frozen means nothing is even
      being woken to retry.


      **Only then a thread dump** — `jstack`, `py-spy dump`, SIGQUIT — which names
      the lines holding each lock. The classic shape is two paths taking the same
      two locks in opposite orders.


      **Separately, the restarts are the reason this has lasted for months.** Each
      one erases the state that would explain it. I would capture a thread dump on
      termination so the next occurrence leaves evidence behind, and make the
      liveness probe check that a worker can make progress rather than that the
      port is open.


      **The fix** is a consistent global lock ordering, documented where the locks
      are defined, plus an acquisition timeout so a future violation becomes a
      loud error rather than a silent hang.
    common_failures:
      - "Taking thread dumps first, without establishing that the process is idle"
      - "Assuming saturation because the service is 'slow'"
      - "Missing that automatic restarts are destroying the evidence"
      - "Fixing the immediate deadlock without a rule that prevents the next one"
      - "Treating the recovery after restart as evidence that nothing is seriously wrong"
