id: lab.more-workers-made-it-slower
topic: topic.threads-and-concurrency
title: "Challenge: more workers made it slower"
type: challenge
tier: 2
image: groundwork/lab-foundations:1
duration_minutes: 25
objectives: [OBJ-A01.6.5, OBJ-A01.6.6]

intro: >-
  A team raised their service's worker count from one to eight because it was
  slow. It got slower, and the CPU graph went down rather than up. They have
  asked for a bigger instance.


  You are going to reproduce that result here, measure both configurations, and
  produce the evidence for what is actually happening — before deciding whether
  a bigger instance is the right answer.

setup:
  - /opt/lab/seed.sh

steps:
  - id: s1
    instruction: >-
      Before measuring anything, write at least two hypotheses to
      /tmp/hypotheses, one per line: reasons adding workers could make a service
      slower.
    walkthrough: |
      printf 'the CPU quota is shared so more threads exhaust it sooner\ncontext switching overhead grows with thread count\nlock contention between workers\n' > /tmp/hypotheses
    verify:
      - type: file_exists
        path: /tmp/hypotheses
        describe: You recorded hypotheses first
      - type: command_output
        command: "wc -l < /tmp/hypotheses"
        pattern: "[2-9]"
        describe: At least two hypotheses

  - id: s2
    instruction: >-
      Establish what this container is allowed. Save the CPU limit, the CPU
      count the machine advertises, and the current throttling counters to
      /tmp/baseline.
    hint: >-
      `cpu.max`, `nproc`, and the `nr_throttled` and `throttled_usec` lines of
      `cpu.stat`.
    walkthrough: |
      {
        echo "cpu.max=$(cat /sys/fs/cgroup/cpu.max)"
        echo "nproc=$(nproc)"
        grep -E 'nr_throttled|throttled_usec' /sys/fs/cgroup/cpu.stat
      } > /tmp/baseline
      cat /tmp/baseline
    verify:
      - type: file_matches
        path: /tmp/baseline
        pattern: 'cpu.max=\d+ \d+'
        describe: The limit was recorded
      - type: file_matches
        path: /tmp/baseline
        pattern: 'nproc=\d+'
        describe: The advertised CPU count was recorded

  - id: s3
    instruction: >-
      Measure the one-worker configuration. Time a single-threaded run of
      /opt/lab/spin doing 4 seconds of work, and record both the timing and the
      throttled time it added, to /tmp/answer-one-worker.
    hint: >-
      Read `throttled_usec` before and after, and wrap the run in
      `{ time ... ; } 2>>` to capture the timing.
    walkthrough: |
      b=$(awk '/throttled_usec/{print $2}' /sys/fs/cgroup/cpu.stat)
      { time /opt/lab/spin 1 4 >/dev/null 2>&1 ; } 2> /tmp/answer-one-worker
      a=$(awk '/throttled_usec/{print $2}' /sys/fs/cgroup/cpu.stat)
      echo "throttled_delta_usec=$((a-b))" >> /tmp/answer-one-worker
      cat /tmp/answer-one-worker
    verify:
      - type: file_matches
        path: /tmp/answer-one-worker
        pattern: 'real'
        describe: The run was timed
      - type: file_matches
        path: /tmp/answer-one-worker
        pattern: 'throttled_delta_usec=\d+'
        describe: The throttled time was recorded

  - id: s4
    instruction: >-
      Now the eight-worker configuration, measured the same way, into
      /tmp/answer-eight-workers.


      Each worker does the same amount of work as before, so eight workers ask
      for eight times the CPU.
    hint: "`/opt/lab/spin 8 4`, with the same before-and-after reading of throttled_usec."
    walkthrough: |
      b=$(awk '/throttled_usec/{print $2}' /sys/fs/cgroup/cpu.stat)
      { time /opt/lab/spin 8 4 >/dev/null 2>&1 ; } 2> /tmp/answer-eight-workers
      a=$(awk '/throttled_usec/{print $2}' /sys/fs/cgroup/cpu.stat)
      echo "throttled_delta_usec=$((a-b))" >> /tmp/answer-eight-workers
      cat /tmp/answer-eight-workers
    verify:
      - type: file_matches
        path: /tmp/answer-eight-workers
        pattern: 'throttled_delta_usec=\d+'
        describe: The throttled time was recorded for eight workers
      - type: command_exit
        command: "test $(awk -F= '/throttled_delta_usec/{print $2}' /tmp/answer-eight-workers) -gt $(awk -F= '/throttled_delta_usec/{print $2}' /tmp/answer-one-worker)"
        exit_code: 0
        describe: Eight workers spent far longer stopped by the limit

  - id: s5
    instruction: >-
      State the diagnosis. Write to /tmp/answer-cause the single word naming what
      limited the service: `cpu`, `memory`, `disk` or `network`.


      Then compute how many workers this container's limit actually supports for
      CPU-bound work, and write that number to /tmp/answer-right-size.
    hint: >-
      Divide the quota by the period and round up — never round down to zero.
    walkthrough: |
      echo cpu > /tmp/answer-cause
      read -r quota period < /sys/fs/cgroup/cpu.max
      if [ "$quota" = "max" ]; then nproc > /tmp/answer-right-size; else echo $(( (quota + period - 1) / period )) > /tmp/answer-right-size; fi
      cat /tmp/answer-right-size
    verify:
      - type: file_matches
        path: /tmp/answer-cause
        pattern: '^cpu$'
        describe: You identified the CPU limit as the constraint
      - type: file_matches
        path: /tmp/answer-right-size
        pattern: '^[1-9][0-9]*$'
        describe: You derived a worker count from the limit rather than from nproc

  - id: s6
    instruction: >-
      Write the recommendation to /tmp/answer-recommendation, in at least thirty
      words: what you would tell the team, why a bigger instance may not help,
      and what you would measure to know whether it would.
    walkthrough: |
      cat > /tmp/answer-recommendation <<'EOF'
      The service is limited by its CPU quota, not by the size of the machine, so
      a bigger instance changes nothing unless the limit is raised with it. Set
      the worker count from the quota rather than from nproc, and if the work
      genuinely needs more CPU then raise the limit. I would measure
      throttled_usec against total periods before and after, because that is the
      only signal that says whether the limit is binding.
      EOF
    verify:
      - type: command_output
        command: "wc -w < /tmp/answer-recommendation"
        pattern: "([3-9][0-9]|[0-9]{3,})"
        describe: At least thirty words
      - type: file_matches
        path: /tmp/answer-recommendation
        pattern: "throttl|quota|limit"
        describe: You named the limit rather than the machine

solution: |
  ```bash
  cat /sys/fs/cgroup/cpu.max          # the quota
  nproc                               # the host's CPUs — not yours

  b=$(awk '/throttled_usec/{print $2}' /sys/fs/cgroup/cpu.stat)
  time /opt/lab/spin 1 4
  a=$(awk '/throttled_usec/{print $2}' /sys/fs/cgroup/cpu.stat); echo $((a-b))

  b=$a
  time /opt/lab/spin 8 4
  a=$(awk '/throttled_usec/{print $2}' /sys/fs/cgroup/cpu.stat); echo $((a-b))
  ```

  **The diagnosis, in the order it should be made.**

  **The limit is a quota per period, shared by every thread.** Eight workers do
  not get eight CPUs; they get the same fraction of one, divided eight ways, and
  they exhaust it eight times faster. Each period they spend the budget early and
  every one of them is stopped for the rest of it.

  **The throttled time proves it.** One worker added little; eight added a great
  deal. Nothing else in the system produces that number — it counts exactly one
  thing, time spent stopped by this container's own limit.

  **The CPU graph went down for the same reason.** A stopped container is idle.
  Utilisation falls while latency rises, which is the observation that sent the
  team looking for a bigger instance.

  **Why a bigger instance may not help.** The constraint is `cpu.max`, not the
  host. Moving to a machine with more cores changes nothing unless the limit
  moves too — and if the limit moves, the instance size may not have needed to.
  Those are two separate decisions and the team conflated them.

  **What to actually do:**

  ```bash
  read -r quota period < /sys/fs/cgroup/cpu.max
  [ "$quota" = "max" ] && cpus=$(nproc) || cpus=$(( (quota + period - 1) / period ))
  ```

  Size the pool from that. If the work genuinely needs more CPU, raise the limit
  and measure again — the throttling counter tells you immediately whether it
  helped.

  **The monitoring that would have prevented this.** Alert on throttled periods
  as a fraction of total periods, not on CPU utilisation:

  ```promql
  rate(container_cpu_cfs_throttled_periods_total[5m])
    / rate(container_cpu_cfs_periods_total[5m]) > 0.25
  ```

  Utilisation could not have shown it, and in **E29** this is also why a
  horizontal autoscaler on CPU utilisation does not fire for a throttled pod.
