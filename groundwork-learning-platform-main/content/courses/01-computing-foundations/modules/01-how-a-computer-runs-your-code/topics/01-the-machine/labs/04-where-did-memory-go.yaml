id: lab.where-did-memory-go
topic: topic.the-machine
title: Watch the OOM killer do its job
type: guided
tier: 2
image: groundwork/lab-foundations:1
duration_minutes: 20
objectives: [OBJ-A01.1.6, OBJ-A01.1.8]

intro: >-
  This lab container has a hard memory limit of 512 MiB. You are going to
  allocate memory until you hit it, watch the numbers move, and then watch the
  kernel kill your process.


  Doing this deliberately once, in a place where it does not matter, is worth
  more than reading about it three times. When you later see `OOMKilled` on a
  Kubernetes pod at 3am, you will already know exactly what happened.

setup:
  - /opt/lab/seed.sh

steps:
  - id: s1
    instruction: >-
      Record the container's memory limit and its current usage before you start.
      Write the limit in bytes to /tmp/answer-limit.
    hint: >-
      Inside a container, the limit is in the cgroup filesystem:
      `cat /sys/fs/cgroup/memory.max`. The current usage is in
      `/sys/fs/cgroup/memory.current`.
    walkthrough: |
      cat /sys/fs/cgroup/memory.max > /tmp/answer-limit
    verify:
      - type: file_matches
        path: /tmp/answer-limit
        pattern: '^\d+$'
        describe: The cgroup memory limit was recorded

  - id: s2
    instruction: >-
      Start /opt/lab/eat-memory 200 in the background. It allocates 200 MiB and
      holds it. Then record the process's RSS — its resident set size, the
      physical RAM it actually occupies — in /tmp/answer-rss-200.
    hint: >-
      `ps -o rss= -C eat-memory` gives RSS in kilobytes, or read
      `/proc/<pid>/status` and look for `VmRSS`.
    walkthrough: |
      /opt/lab/eat-memory 200 &
      sleep 3
      ps -o rss= -C eat-memory | tr -d ' ' | head -1 > /tmp/answer-rss-200
    verify:
      - type: process_running
        pattern: "eat-memory"
        describe: The allocator is running
      - type: file_matches
        path: /tmp/answer-rss-200
        pattern: '^\d+$'
        describe: RSS was recorded

  - id: s3
    instruction: >-
      Now make the two numbers disagree. Kill the previous process and run
      `/opt/lab/eat-memory 400 50 &` — that reserves 400 MiB but only writes to
      50 MiB of it.


      Record both figures in /tmp/answer-vsz-vs-rss, in the form
      `vsz=<kb> rss=<kb>`.


      One of these is a reservation of address space. The other is the bill, and
      it is the only one the OOM killer reads.
    hint: >-
      `ps -o vsz=,rss= -C eat-memory`. The kernel does not back a page with real
      memory until something writes to it, so untouched pages cost nothing.
    walkthrough: |
      pkill -f eat-memory || true
      sleep 1
      /opt/lab/eat-memory 400 50 &
      sleep 3
      echo "vsz=$(ps -o vsz= -C eat-memory | tr -d ' ' | head -1) rss=$(ps -o rss= -C eat-memory | tr -d ' ' | head -1)" > /tmp/answer-vsz-vs-rss
    verify:
      - type: file_matches
        path: /tmp/answer-vsz-vs-rss
        pattern: 'vsz=\d+\s+rss=\d+'
        describe: Both figures were recorded

  - id: s4
    instruction: >-
      Which of those two numbers determines whether the process gets OOM-killed?
      Write the literal word `vsz` or `rss` to /tmp/answer-which-matters.
    walkthrough: |
      echo rss > /tmp/answer-which-matters
    verify:
      - type: file_matches
        path: /tmp/answer-which-matters
        pattern: '^rss$'
        describe: You identified RSS as the number that counts

  - id: s5
    instruction: >-
      Now push past the limit. Run /opt/lab/eat-memory 600 in the foreground and
      watch what happens. Record what the shell reported in /tmp/answer-outcome.
    hint: "It will not exit cleanly. Note the exact wording."
    walkthrough: |
      /opt/lab/eat-memory 600 >/dev/null 2>&1; echo "exit=$? Killed" > /tmp/answer-outcome
    verify:
      - type: file_matches
        path: /tmp/answer-outcome
        pattern: "[Kk]ill"
        describe: The kill was observed

  - id: s6
    instruction: >-
      Find the kernel's record of the kill and save it to /tmp/answer-dmesg.


      Read `/sys/fs/cgroup/memory.events` — the `oom` counter is the cgroup's own
      tally of how many times it has triggered the OOM killer.


      Try `dmesg` as well. It will fail with "Operation not permitted", and that
      failure is worth understanding: reading the kernel ring buffer needs
      CAP_SYSLOG, and this container was started with every capability dropped.
      On a real host you would use `dmesg`; from inside a hardened container you
      use the cgroup counters instead.


      Then answer in /tmp/answer-signal: which signal was the process sent, and
      could it have caught that signal to clean up? Write `SIGKILL yes` or
      `SIGKILL no`.
    hint: >-
      `cat /sys/fs/cgroup/memory.events > /tmp/answer-dmesg`. On the signal
      question — one signal in the whole set cannot be caught, blocked or
      ignored.
    walkthrough: |
      cat /sys/fs/cgroup/memory.events > /tmp/answer-dmesg
      dmesg 2>&1 | tail -3 >> /tmp/answer-dmesg || true
      echo 'SIGKILL no' > /tmp/answer-signal
    verify:
      - type: file_exists
        path: /tmp/answer-dmesg
        describe: The kernel record was captured
      - type: file_matches
        path: /tmp/answer-signal
        pattern: '^SIGKILL no$'
        describe: You identified that SIGKILL cannot be caught

solution: |
  ```bash
  cat /sys/fs/cgroup/memory.max > /tmp/answer-limit
  /opt/lab/eat-memory 200 &
  sleep 2
  ps -o rss= -C eat-memory | tr -d ' ' > /tmp/answer-rss-200
  echo "vsz=$(ps -o vsz= -C eat-memory | tr -d ' ') rss=$(ps -o rss= -C eat-memory | tr -d ' ')" \
    > /tmp/answer-vsz-vs-rss
  echo rss > /tmp/answer-which-matters

  /opt/lab/eat-memory 600 ; echo "exit=$?" > /tmp/answer-outcome
  cat /sys/fs/cgroup/memory.events > /tmp/answer-dmesg
  echo "SIGKILL no" > /tmp/answer-signal
  ```

  **What happened, precisely.**

  The process asked for 600 MiB inside a cgroup capped at 512 MiB. When the
  allocation could not be satisfied by reclaiming anything, the kernel's OOM
  killer selected a process in that cgroup and sent it `SIGKILL`.

  `SIGKILL` cannot be caught, blocked or ignored. There is no shutdown hook, no
  `finally` block, no chance to flush a buffer or close a connection cleanly. The
  process simply stops existing. Any in-flight work is lost.

  This is why "handle out-of-memory gracefully" is not a thing you can implement
  at the point of death. The graceful handling has to happen much earlier — by
  not getting there.

  **VSZ versus RSS.** Running `eat-memory 400 50` showed roughly `vsz=409600
  rss=51200` — the process reserved 400 MiB of address space and occupies 50 MiB
  of RAM. The kernel does not back a page until something writes to it, so the
  other 350 MiB costs nothing.

  This is why a JVM with a 4GB heap setting can show gigabytes of VSZ while using
  a fraction of it. The OOM killer counts RSS, container limits count RSS, and
  your capacity planning should count RSS. VSZ is a promise; RSS is the bill.

  **Why dmesg failed.** Reading the kernel ring buffer requires CAP_SYSLOG, and
  this lab drops every capability. That is not a limitation to work around — it
  is the sandbox doing its job, and it is a preview of a real constraint: inside a
  hardened container you read cgroup counters, not kernel logs. The `oom` line in
  `memory.events` told you what you needed without any privilege at all.

  **The exact shape of a Kubernetes OOMKill.** A container memory limit *is* a
  cgroup memory limit — the same file you read in step 1. When a pod exceeds it,
  the same kernel code runs and sends the same signal. `kubectl describe pod`
  reports:

  ```text
  Last State:     Terminated
    Reason:       OOMKilled
    Exit Code:    137
  ```

  Exit code 137 is 128 + 9, and 9 is `SIGKILL`. You now know what every part of
  that message means, and you have not read a word of Kubernetes documentation.

  **E26 Kubernetes Workloads** covers requests and limits and refers back to this
  lab.
