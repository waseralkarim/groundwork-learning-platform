topic: topic.the-machine

questions:
  - id: i1
    level: L1
    question: What is the difference between RAM and disk?
    model_answer: >-
      RAM is volatile working memory — fast, roughly 80 nanoseconds to access,
      and lost when power is removed. Disk is persistent storage — much slower,
      microseconds for an SSD and milliseconds for a spinning disk, but it
      survives power loss. Running programs work in RAM; anything that must
      outlive the process has to reach disk.
    signal: >-
      A weak answer says "RAM is faster". A strong one names the volatility
      difference *and* has a sense of the magnitude — knowing it is roughly
      1000×, not 10×, is what makes swapping and caching behaviour predictable
      rather than surprising.
    follow_ups:
      - "Roughly how much faster? Order of magnitude is fine."
      - "If RAM is so much faster, why not put everything in RAM?"

  - id: i2
    level: L1
    question: What happens when you run a program?
    model_answer: >-
      The shell asks the kernel to execute the file via the execve system call.
      The kernel checks permissions, reads the ELF header and verifies the binary
      matches the CPU architecture. It creates a fresh virtual address space and
      maps the code and data into it. If the binary is dynamically linked, the
      dynamic linker loads the required shared libraries. Then control transfers
      to the entry point and the program runs. At that point it is a process,
      with a PID and memory of its own.
    signal: >-
      The interesting part is whether they know failures happen *before* their
      code runs. Someone who can say "an architecture mismatch fails at step
      three, so nothing of the application executed" has a real model rather than
      a memorised sequence.
    follow_ups:
      - "Where in that sequence does `Exec format error` come from?"
      - "What is the difference between a program and a process?"

  - id: i3
    level: L2
    question: >-
      A server shows 200MB free out of 64GB. Is that a problem? Walk me through
      how you would check.
    model_answer: >-
      Almost certainly not. On Linux the kernel fills unused RAM with page cache,
      so a low `free` figure is normal and expected on a machine that has been up
      for a while. The number that matters is `available`, which is free memory
      plus everything the kernel could reclaim immediately. I would check
      `available` in `free -h`, then look at the Swap line — if swap usage is
      zero and available is high, there is no memory pressure. If I wanted to
      confirm, `vmstat 1` and check that si and so are zero.
    signal: >-
      This question separates people who have read `free` output from people who
      have *acted* on it. The strong answer volunteers the page cache explanation
      unprompted and names swap activity as the real pressure signal. A weak
      answer says "yes, add more RAM".
    follow_ups:
      - "What exactly is in the buff/cache column?"
      - "What would actually convince you the machine was under memory pressure?"
      - "Would you alert on free or on available? Why?"

  - id: i4
    level: L2
    question: >-
      Your container runs fine locally on your MacBook and crashes immediately in
      production with `exec format error`. What is going on?
    model_answer: >-
      The image was built for arm64 because Apple Silicon is arm64, and the
      production nodes are amd64. Those are different instruction sets, so the
      kernel refuses to execute the binary — it reads the ELF header, sees the
      wrong architecture, and stops before any application code runs. The fix is
      to build for the target platform, either with
      `docker buildx build --platform linux/amd64` or by producing a
      multi-architecture image so one tag serves both.
    signal: >-
      Recognising the error on sight is table stakes. What distinguishes a good
      answer is knowing it is a *loader* failure rather than an application
      failure, and therefore that no amount of application debugging will help.
    follow_ups:
      - "How would you verify the architecture of an image before deploying it?"
      - "What if you could not rebuild — say it is a vendor binary?"
      - "What are the downsides of emulation as a workaround?"

  - id: i5
    level: L3
    question: >-
      A service is slow. Describe how you would determine whether it is CPU-,
      memory- or I/O-bound.
    model_answer: >-
      I would run `vmstat 1 5` — ignoring the first line, which is an average
      since boot — and read three things. The `r` column is processes waiting for
      CPU; consistently above the core count with low idle means CPU-bound. The
      `si` and `so` columns are swap activity; any sustained non-zero value means
      memory pressure, and that dominates everything else because swapped memory
      access costs disk latency. The `wa` column is time the CPU spent idle
      waiting for I/O; high `wa` with low user time and blocked processes in `b`
      means I/O-bound. I would then confirm with `free -h` for memory or `iostat`
      for disk, and use `ps` sorted by RSS or CPU to find the responsible process.
    signal: >-
      The strongest signal is that they *rule things out* rather than pattern-match
      to one answer. Also listen for whether they know `wa` is idle time rather
      than CPU utilisation — misreading that column is extremely common and leads
      people to buy CPU for an I/O problem.
    follow_ups:
      - "vmstat shows wa at 60%. Is the CPU busy?"
      - "Why do you ignore the first line of vmstat output?"
      - "You find swap activity. Does that mean you should add swap or remove it?"

  - id: i6
    level: L3
    question: >-
      Explain what happens when a Linux machine runs out of memory, in order.
    model_answer: >-
      The kernel escalates. First it drops reclaimable page cache, which is free
      and invisible — though file I/O quietly gets slower as cached reads become
      disk reads. Then, if swap is configured, it writes memory pages to disk to
      reclaim RAM. Reading those back costs roughly a thousand times more than
      RAM, so latency degrades sharply rather than gradually. Finally, if it still
      cannot satisfy an allocation, the OOM killer selects a process — roughly by
      memory footprint — and sends it SIGKILL. That cannot be caught, so there is
      no cleanup or flush. In practice users see timeouts before they see any
      out-of-memory error, because the machine becomes unresponsive while
      everything is technically still running.
    signal: >-
      The order matters, and so does the observation that the *symptom* is
      usually latency rather than an OOM error. Engineers who have actually lived
      through this mention that health checks time out and monitoring reports the
      service down while `ps` shows everything running.
    follow_ups:
      - "Why can a process not handle being OOM-killed gracefully?"
      - "Would you enable swap on a production server? Argue both sides."
      - "How does this differ inside a container with a memory limit?"

  - id: i7
    level: L4
    question: >-
      You are choosing an instance size for a service you have never run.
      How do you decide?
    model_answer: >-
      I would not guess from the instance catalogue. I would measure: run the
      service under representative load and record RSS — not VSZ — at steady
      state and at peak, plus CPU utilisation and whether the workload is
      actually parallel. Then size for peak rather than average, because failure
      happens at the peak and peaks correlate across instances. I would leave
      headroom for the OS, agents and page cache, and check whether memory grows
      over time, which would indicate a leak that changes the answer entirely.
      If I had to ship before measuring, I would over-provision deliberately,
      instrument it, and right-size within a week — over-provisioning costs
      money, under-provisioning costs an outage.
    signal: >-
      Listen for "measure, do not guess", for RSS rather than VSZ, and for
      sizing on peak rather than average. The best answers also raise the leak
      question, because a service whose memory grows makes any static sizing
      wrong eventually.
    follow_ups:
      - "Why peak rather than average?"
      - "What is the difference between VSZ and RSS, and which one do you size on?"
      - "How would this change if the workload were bursty and infrequent?"

  - id: i8
    level: L5
    question: >-
      Your company wants to migrate its fleet from Intel to ARM to cut costs by
      about 20%. What do you need to think about?
    model_answer: >-
      The core issue is that every compiled artefact is architecture-specific, so
      the change reaches much further than the instance type. I would inventory
      what we run: our own services, third-party binaries, vendor agents, base
      images, and anything with native extensions — Python wheels, Node native
      modules, JNI libraries. Our own code mostly recompiles; the risk sits in
      dependencies we do not build. The build pipeline needs to produce
      multi-architecture images, and that roughly doubles build time and cost.
      Performance is workload-dependent — ARM cores are not equivalent to x86
      cores one-for-one, so the 20% saving has to be validated per service, not
      assumed. I would migrate incrementally behind a load balancer, comparing
      per-instance latency rather than aggregates, since a slow subset hides
      inside an average. And I would ban emulation on production hosts, because
      it turns a loud architecture failure into a silent 4× slowdown.
    signal: >-
      This is a trade-off question, not a knowledge question. Strong answers
      identify that the *dependencies* are the risk rather than the application,
      that the cost saving needs validating per workload, and that per-instance
      observability is required to detect a partial failure. Mentioning the
      emulation trap shows real operational experience.
    follow_ups:
      - "How would you detect that one host in a mixed fleet is emulating?"
      - "What would make you abandon the migration?"
      - "How do you validate the 20% number before committing?"
