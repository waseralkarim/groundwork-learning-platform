id: troubleshooting.slow-server
topic: topic.the-machine
title: The server got slow at 14:00
level: L3
objectives: [OBJ-A01.1.7]
reveal_policy: progressive

situation: >-
  You are on call. At 14:07 the alerting system fires: API p99 latency has gone
  from 40ms to 2.5 seconds. The service is still returning correct responses,
  just slowly. There has been no deploy today — the last one was four days ago.
  Traffic volume is normal for a Tuesday afternoon.


  You have SSH access to the host. Work out what is wrong before you read the
  answer, and be able to point at the specific line of output that proves it.

symptoms:
  - "API p99 latency: 40ms → 2,500ms, starting around 14:00"
  - "Error rate unchanged — responses are correct, just slow"
  - "No deploy in four days"
  - "Request volume normal"
  - "SSH itself feels sluggish"

artifacts:
  - type: command_output
    label: "vmstat 1 5"
    content: |
      procs -----------memory---------- ---swap-- -----io---- -system-- ------cpu-----
       r  b   swpd   free   buff  cache   si   so    bi    bo   in   cs us sy id wa st
       1  3 4194300  62144  12000  98000  892  1140  4820  1260 3100 8200  8  9 21 62  0
       2  4 4198200  58900  11800  94000  1024 1320  5100  1480 3350 8900  7 11 18 64  0
       1  5 4201100  55200  11500  91000  976  1208  4990  1390 3210 8600  9 10 19 62  0
       2  3 4205600  53100  11200  88000  1100 1420  5240  1510 3400 9100  8 12 17 63  0
       1  4 4208900  51800  10900  86000  1050 1380  5080  1440 3380 8950  8 11 18 63  0

  - type: command_output
    label: "free -h"
    content: |
      $ free -h
