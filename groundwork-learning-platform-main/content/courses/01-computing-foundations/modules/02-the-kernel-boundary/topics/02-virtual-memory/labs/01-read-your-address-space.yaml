id: lab.read-your-address-space
topic: topic.virtual-memory
title: Read your own address space
type: guided
tier: 2
image: groundwork/lab-foundations:1
duration_minutes: 20
objectives: [OBJ-A01.4.1, OBJ-A01.4.2]

intro: >-
  Your shell has an address space. It is a list, the kernel will show it to you,
  and after twenty minutes of reading it the phrase "virtual memory" stops being
  abstract.


  You will find the heap, the stack, the code, and the C library — and see the
  difference between the memory your shell has mapped and the memory it actually
  holds.

setup:
  - /opt/lab/seed.sh

steps:
  - id: s1
    instruction: >-
      Save your shell's complete memory map to /tmp/answer-maps, then count how
      many regions it has and write that number to /tmp/answer-region-count.
    hint: "`cat /proc/self/maps > /tmp/answer-maps` then `wc -l`."
    walkthrough: |
      cat /proc/self/maps > /tmp/answer-maps
      wc -l < /tmp/answer-maps | tr -d ' ' > /tmp/answer-region-count
    verify:
      - type: file_matches
        path: /tmp/answer-maps
        pattern: 'rw-p|r-xp'
        describe: The map was captured with its permission columns
      - type: file_matches
        path: /tmp/answer-region-count
        pattern: '^\d+$'
        describe: The region count was recorded

  - id: s2
    instruction: >-
      Find the heap and the stack. Save the two lines that name them to
      /tmp/answer-heap-stack.


      Note their permissions before moving on: neither is executable, and that
      is deliberate.
    hint: "They are labelled `[heap]` and `[stack]` in the last column."
    walkthrough: |
      grep -E '\[heap\]|\[stack\]' /proc/self/maps > /tmp/answer-heap-stack
      cat /tmp/answer-heap-stack
    verify:
      - type: file_matches
        path: /tmp/answer-heap-stack
        pattern: '\[heap\]'
        describe: The heap region was found
      - type: file_matches
        path: /tmp/answer-heap-stack
        pattern: '\[stack\]'
        describe: The stack region was found

  - id: s3
    instruction: >-
      The C library is mapped several times, not once. Save every line
      mentioning libc to /tmp/answer-libc and record how many there are, as a
      bare number, in /tmp/answer-libc-count.


      Look at the permissions across those lines and work out why one file needs
      more than one mapping.
    hint: >-
      `grep libc /proc/self/maps`. One segment is read-only code, one is
      read-only data, one is writable data.
    walkthrough: |
      grep libc /proc/self/maps > /tmp/answer-libc
      wc -l < /tmp/answer-libc | tr -d ' ' > /tmp/answer-libc-count
    verify:
      - type: file_matches
        path: /tmp/answer-libc
        pattern: "libc"
        describe: The C library mappings were captured
      - type: file_matches
        path: /tmp/answer-libc-count
        pattern: '^[2-9]$|^\d{2,}$'
        describe: One file, mapped more than once

  - id: s4
    instruction: >-
      Find the executable regions — the ones with `x` in their permissions —
      and save them to /tmp/answer-exec.


      Then answer this in /tmp/answer-wx, with the single word `yes` or `no`:
      is any region both writable and executable?
    hint: >-
      `grep 'r-xp' /proc/self/maps` for the first part. For the second, look for
      `rwx`.
    walkthrough: |
      grep 'r-xp' /proc/self/maps > /tmp/answer-exec
      if grep -q 'rwx' /proc/self/maps; then echo yes > /tmp/answer-wx; else echo no > /tmp/answer-wx; fi
    verify:
      - type: file_matches
        path: /tmp/answer-exec
        pattern: 'r-xp'
        describe: Executable regions were captured
      - type: file_matches
        path: /tmp/answer-wx
        pattern: '^no$'
        describe: Nothing here is both writable and executable

  - id: s5
    instruction: >-
      Now the two totals. Save your shell's VmSize and VmRSS lines to
      /tmp/answer-size-rss.


      One of these is address space and one is physical memory. The gap between
      them is the whole point of this topic.
    hint: "`grep -E '^Vm(Size|RSS)' /proc/self/status`"
    walkthrough: |
      grep -E '^Vm(Size|RSS)' /proc/self/status > /tmp/answer-size-rss
      cat /tmp/answer-size-rss
    verify:
      - type: file_matches
        path: /tmp/answer-size-rss
        pattern: 'VmSize'
        describe: Virtual size was captured
      - type: file_matches
        path: /tmp/answer-size-rss
        pattern: 'VmRSS'
        describe: Resident size was captured

  - id: s6
    instruction: >-
      Split the resident memory into the part that can be dropped and the part
      that cannot. Save the RssAnon and RssFile lines to /tmp/answer-anon-file.


      Then write which of the two words — `anon` or `file` — names the memory
      the kernel can reclaim without losing anything, to /tmp/answer-reclaimable.
    hint: >-
      `grep -E '^Rss(Anon|File)' /proc/self/status`. One of them has a copy on
      disk to go back to.
    walkthrough: |
      grep -E '^Rss(Anon|File)' /proc/self/status > /tmp/answer-anon-file
      echo file > /tmp/answer-reclaimable
    verify:
      - type: file_matches
        path: /tmp/answer-anon-file
        pattern: 'RssAnon'
        describe: Anonymous resident memory was captured
      - type: file_matches
        path: /tmp/answer-reclaimable
        pattern: '^file$'
        describe: You identified file-backed memory as the reclaimable kind

solution: |
  ```bash
  cat /proc/self/maps > /tmp/answer-maps
  wc -l < /tmp/answer-maps > /tmp/answer-region-count

  grep -E '\[heap\]|\[stack\]' /proc/self/maps > /tmp/answer-heap-stack
  grep libc /proc/self/maps > /tmp/answer-libc
  wc -l < /tmp/answer-libc > /tmp/answer-libc-count

  grep 'r-xp' /proc/self/maps > /tmp/answer-exec
  echo no > /tmp/answer-wx

  grep -E '^Vm(Size|RSS)' /proc/self/status > /tmp/answer-size-rss
  grep -E '^Rss(Anon|File)' /proc/self/status > /tmp/answer-anon-file
  echo file > /tmp/answer-reclaimable
  ```

  **What the map told you.**

  **One file, several mappings.** libc appears three or four times because its
  segments need different permissions: executable code must not be writable,
  writable data must not be executable. The kernel maps each segment separately
  so that each gets exactly the permissions it needs — which is why `rwx` regions
  are rare and worth noticing when you see one.

  **Nothing is writable and executable.** That combination lets an attacker who
  can write data also execute it, which is the mechanism behind a whole class of
  exploits. Modern toolchains avoid it, and a JIT that needs it does the write
  and the execute through separate mappings of the same memory.

  **The heap and stack have no path.** They are anonymous — no file behind them,
  nothing to reclaim them to. When the OOM killer runs, this is the memory that
  cannot be given back.

  **VmSize far exceeds VmRSS.** Your shell has mapped several megabytes it has
  never touched: guard regions, libraries whose pages have not all been read,
  reserved heap. Only the touched pages are real.

  **RssFile usually dominates RssAnon in a shell.** Most of what a shell holds
  resident is code and library pages — file-backed, shared with every other
  process running the same binaries, and droppable at any moment. Its own data
  is a fraction of the total.

  **Where this goes.** In **C14**, an image layer shared by ten containers is
  exactly this: one physical copy, mapped into many address spaces, counted in
  full by each of them. That is why ten containers from one image cost far less
  than ten times one container.
