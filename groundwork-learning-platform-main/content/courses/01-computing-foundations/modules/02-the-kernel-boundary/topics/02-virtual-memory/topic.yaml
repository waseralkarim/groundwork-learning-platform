id: topic.virtual-memory
slug: virtual-memory
title: "Virtual Memory: Why Every Process Thinks It Owns the Machine"
summary: >-
  Every process sees a private address space that does not exist. Understanding
  the lie explains RSS against VSZ, why the page cache is not a leak, why a
  container dies at 60% usage, and what an OOM kill is actually counting.
order: 4
levels: [L2, L3]
estimated_minutes: 130
status: published

prerequisites:
  - topic: topic.user-space-and-the-kernel
    hardness: required
  - topic: topic.processes
    hardness: required

objectives:
  - id: OBJ-A01.4.1
    level: L2
    verb: explain
    statement: >-
      Explain what a virtual address is, and why two processes can hold the same
      address without seeing each other's data.
    assessed_by: [quiz.q1, quiz.q2, lab.read-your-address-space]

  - id: OBJ-A01.4.2
    level: L2
    verb: interpret
    statement: >-
      Interpret a process's memory map, identifying which regions are code,
      heap, stack and shared libraries.
    assessed_by: [quiz.q3, quiz.q4, lab.read-your-address-space, exercise.e1]

  - id: OBJ-A01.4.3
    level: L2
    verb: distinguish
    statement: >-
      Distinguish virtual size, resident size and proportional set size, and say
      which one answers "how much memory is this using".
    assessed_by: [quiz.q5, quiz.q6, lab.three-numbers, exercise.e2, assessment.A]

  - id: OBJ-A01.4.4
    level: L2
    verb: explain
    statement: >-
      Explain why summing RSS across processes overcounts memory, and what
      shared pages have to do with it.
    assessed_by: [quiz.q7, lab.three-numbers, exercise.e3]

  - id: OBJ-A01.4.5
    level: L3
    verb: measure
    statement: >-
      Measure how a cgroup accounts for page cache separately from anonymous
      memory, and predict which of the two is reclaimable under pressure.
    assessed_by: [quiz.q8, quiz.q9, lab.what-the-cgroup-counts, assessment.B]

  - id: OBJ-A01.4.6
    level: L3
    verb: diagnose
    statement: >-
      Diagnose a container killed while its application memory looked healthy,
      and identify what the limit was actually counting.
    assessed_by: [quiz.q10, quiz.q11, lab.killed-at-sixty-percent, troubleshooting.oom-with-headroom]

  - id: OBJ-A01.4.7
    level: L3
    verb: explain
    statement: >-
      Explain what overcommit means, and why a successful allocation is not a
      promise that the memory exists.
    assessed_by: [quiz.q12, quiz.q13, lab.three-numbers, exercise.e4]

  - id: OBJ-A01.4.8
    level: L3
    verb: troubleshoot
    statement: >-
      Troubleshoot a service whose memory use climbs steadily, and separate a
      leak from cache growth from fragmentation.
    assessed_by: [quiz.q14, quiz.q15, troubleshooting.memory-climbs-forever, assessment.C]

terminology:
  - term: virtual address
    definition: >-
      An address as a process sees it. Meaningless outside that process: the
      same number in two processes refers to two different pieces of physical
      memory, or to none at all.
  - term: physical address
    definition: >-
      An address in actual RAM. Only the kernel and the hardware deal in these;
      no user-space program has ever seen one.
  - term: page
    definition: >-
      The unit virtual memory is managed in, almost always 4 KiB on x86-64.
      Every mapping, every fault and every accounting number is a multiple of it.
  - term: page table
    definition: >-
      The per-process structure the CPU walks to translate a virtual address to
      a physical one. Switching processes means switching page tables, which is
      what makes two processes' identical addresses land in different places.
  - term: MMU
    definition: >-
      Memory management unit. The hardware that performs the translation on
      every single memory access, using the page tables the kernel installed.
  - term: page fault
    definition: >-
      What happens when a process touches an address that has no physical page
      behind it yet. Usually routine — the kernel allocates a page and carries
      on — and the mechanism behind lazy allocation.
  - term: VSZ
    definition: >-
      Virtual size. Everything the process has mapped, whether or not any of it
      is in RAM. Can be enormous and mean nothing.
  - term: RSS
    definition: >-
      Resident set size. Physical memory the process currently has, including
      pages shared with other processes — which is why summing it across
      processes double-counts.
  - term: PSS
    definition: >-
      Proportional set size. Like RSS, but each shared page is divided by the
      number of processes sharing it. The only one of the three that sums
      correctly across a machine.
  - term: anonymous memory
    definition: >-
      Memory not backed by a file — heap and stack. It cannot be dropped, only
      swapped, which is why it is the memory that gets a process OOM-killed.
  - term: page cache
    definition: >-
      File data the kernel keeps in RAM. Counted against a cgroup's limit but
      reclaimable on demand, which is why high memory usage is not the same as
      memory pressure.
  - term: overcommit
    definition: >-
      The kernel promising more memory than it has, on the correct assumption
      that most allocations are never fully touched. It is why malloc succeeds
      and the OOM killer exists.
  - term: OOM killer
    definition: >-
      The kernel's response to being unable to reclaim enough memory: choose a
      process and kill it with SIGKILL. Not catchable, not negotiable.
  - term: memory.current
    definition: >-
      A cgroup v2 file holding the total charged to the group — anonymous memory
      plus page cache plus kernel memory. The number that is compared against
      the limit.
  - term: swap
    definition: >-
      Disk used to hold anonymous pages that do not fit in RAM. Disabled in most
      container platforms, which removes the slow-down but also removes the
      warning before the kill.

foreshadows:
  - "Kubernetes memory requests and limits are cgroup v2 numbers, and a pod evicted at 'high memory' is usually page cache (E29)."
  - "A JVM or Go runtime that reads the machine's memory rather than the cgroup's limit is the classic container memory bug (C14)."
  - "Node-level memory pressure and eviction thresholds in E31 are the same accounting seen from the cluster's side."
  - "Database tuning in B13 is largely a negotiation with the page cache."

tags: [memory, kernel, cgroups, containers, linux, troubleshooting, fundamentals]
