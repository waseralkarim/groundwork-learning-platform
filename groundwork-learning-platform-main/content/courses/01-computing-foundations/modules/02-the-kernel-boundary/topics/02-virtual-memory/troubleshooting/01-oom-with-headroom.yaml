id: troubleshooting.oom-with-headroom
topic: topic.virtual-memory
title: The pod dies at 60% memory and the graph shows nothing
level: L3
objectives: [OBJ-A01.4.5, OBJ-A01.4.6]
reveal_policy: progressive

situation: >-
  An image-processing service runs as a Kubernetes deployment with a 1 GiB
  memory limit. Twice a day, one pod restarts. The application's own memory
  metric — heap in use, exported by the runtime — never rises above 620 MiB, and
  the team's dashboard shows a comfortable flat line right up to each restart.


  A ticket has been opened against the platform team: "pods are being killed
  below their limit". The proposed fix is to raise the limit to 2 GiB.


  You have the evidence below. Work out what is happening before reading the
  answer, and be ready to say which specific number proves it.

symptoms:
  - "One pod restarts roughly twice a day, never the same one"
  - "Application heap metric peaks at 620 MiB against a 1 GiB limit"
  - "No errors in the application log before the restart — the log just stops"
  - "Restart count climbs; readiness and liveness probes were passing"
  - "Happens more often on pods handling large uploads"
  - "Never reproduced in staging, where the same image runs with the same limit"

artifacts:
  - type: command_output
    label: Pod status after a restart
    content: |
      $ kubectl describe pod image-proc-7d9f4-x2k9 | grep -A5 'Last State'
          Last State:     Terminated
            Reason:       OOMKilled
            Exit Code:    137
            Started:      Fri, 14 Aug 2026 03:11:52 +0000
            Finished:     Fri, 14 Aug 2026 09:47:03 +0000

  - type: metric
    label: The application's own memory metric, last hour before the kill
    content: |
      09:17  heap_in_use_bytes  598,441,984
      09:27  heap_in_use_bytes  604,127,232
      09:37  heap_in_use_bytes  611,942,400
      09:47  heap_in_use_bytes  619,610,112   <- last sample before restart

  - type: command_output
    label: cgroup accounting, sampled on a healthy pod under the same load
    content: |
      $ cat /sys/fs/cgroup/memory.max
      1073741824
      $ cat /sys/fs/cgroup/memory.current
      1038628608
      $ grep -E '^(anon|file|slab) ' /sys/fs/cgroup/memory.stat
      anon 648122368
      file 378447616
      slab 12058624

  - type: command_output
    label: What the service does with uploads
    content: |
      $ grep -n 'ioutil.WriteFile\|os.ReadFile\|filepath.Walk' handler.go
      41:  data, err := os.ReadFile(uploadPath)          // whole file into memory
      52:  os.WriteFile(scratchPath, resized, 0644)      // scratch copy on disk
      68:  filepath.Walk(scratchDir, cleanupOlderThan)   // re-reads every scratch file

  - type: config
    label: The deployment's resources
    content: |
      resources:
        requests:
          memory: 512Mi
        limits:
          memory: 1Gi

diagnostic_questions:
  - "What does memory.current include that the application's heap metric does not?"
  - "Which of anon and file was near the limit, and which one can the kernel take back?"
  - "Why does the application log stop rather than record an error?"
  - "Why does staging never reproduce it?"
  - "Would raising the limit to 2 GiB fix the cause or move it?"

hints:
  - "The application metric and the cgroup number are measuring different things. Compare them."
  - "The service writes scratch files and then walks the directory reading them."
  - "SIGKILL cannot be caught. Consider what that means for the last log line."
  - "Staging has the same limit — but does it have the same upload sizes?"

root_cause: >-
  The limit counts page cache, and the service generates a lot of it. Every
  upload is read whole into memory, written to a scratch file, and then read
  again by the cleanup walk — so the cgroup is charged for both the anonymous
  heap and the page cache of every scratch file the pod has touched.


  At the moment of the kill, `anon` was around 618 MiB and `file` around 361
  MiB, together just under the 1 GiB limit. As the heap grew, the kernel
  reclaimed page cache silently to make room. Once the cache was exhausted and
  the heap kept growing, there was nothing reclaimable left and the pod was
  killed.


  The application's heap metric was accurate the entire time. It was simply
  measuring one of the two things that had to fit.


  Staging does not reproduce it because the uploads there are small, so the
  scratch files never generate enough page cache to matter.

method: >-
  **1. Confirm what killed it before theorising.** `OOMKilled` and exit code 137
  in the pod status are unambiguous — this was SIGKILL from the kernel, not a
  crash, not a failed probe. That also explains the missing log line: SIGKILL
  cannot be caught, so there is no shutdown path and no final write.


  **2. Compare the application's number with the cgroup's.** This is the whole
  diagnosis. The heap metric said 620 MiB; `memory.current` said 990 MiB. Both
  were correct, and the gap between them is what the application could not see.


  **3. Split the cgroup charge.** `anon 618 MiB` plus `file 361 MiB` accounts
  for the difference. `file` is page cache — reclaimable, and therefore not what
  killed the pod, but occupying the headroom the heap needed.


  **4. Find what generates the cache.** Reading the handler answers it in three
  lines: whole-file reads, scratch writes, and a cleanup walk that reads every
  scratch file again. Each of those populates page cache charged to this pod.


  **5. Only now consider the limit.** With the cause understood, raising to 2 GiB
  is a legitimate option — but so is streaming instead of reading whole files,
  and so is not re-reading scratch files during cleanup. Choosing between them
  requires knowing which number was at the limit, which is step 3.

resolution: >-
  Two changes, in order of value.


  **Stop generating unnecessary cache.** The cleanup walk re-reads every scratch
  file to check its age; `os.Stat` answers that without reading the contents.
  That alone removes most of the cache growth. Streaming the upload rather than
  `os.ReadFile` removes a proportional chunk of the heap at the same time.


  **Then size the limit from evidence.** With cache growth bounded, measure
  `anon` at peak and set the limit above it with headroom, rather than picking a
  number that makes the symptom stop.


  ```yaml
  resources:
    requests:
      memory: 1Gi        # raised: eviction ranks on usage above requests
    limits:
      memory: 1500Mi
  ```


  Note the request as well as the limit. A pod whose real usage sits far above
  its request is first in line for eviction when the node is under pressure —
  a separate failure from this one, with the same underlying accounting.


  **Alert on the unambiguous signal.** The team's dashboard could not have
  caught this, because it plotted the application's view. Add
  `container_memory_working_set_bytes` against the limit, and an alert on the
  OOM kill counter — the one memory signal that is never a false positive.
