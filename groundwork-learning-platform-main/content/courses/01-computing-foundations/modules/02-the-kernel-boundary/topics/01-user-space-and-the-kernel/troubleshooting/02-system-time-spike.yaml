id: troubleshooting.system-time-spike
topic: topic.user-space-and-the-kernel
title: The service is at 90% CPU and the profiler shows nothing
level: L3
objectives: [OBJ-A01.3.4, OBJ-A01.3.8]
reveal_policy: progressive

situation: >-
  An invoice export service used to finish its nightly run in four minutes. Over
  the last two months the run time has crept to just under an hour, and last
  night it overran into the morning batch window.


  The service is pinned at 90% CPU throughout. The team doubled its CPU limit
  last week and the run time did not improve. An application profiler has been
  attached twice; both times it reported the process as almost entirely idle in
  application code, which nobody could explain, so it was dismissed as a broken
  profiler.


  The only change anyone can point to is a logging improvement two months ago
  that added a per-record audit line.

symptoms:
  - "Run time grew from 4 minutes to 55 minutes over two months"
  - "CPU sits at 90% for the whole run"
  - "Doubling the CPU limit changed nothing"
  - "The application profiler shows almost no time in application code"
  - "Disk throughput during the run is under 3 MB/s"
  - "Record count grew about 30% over the same period"

artifacts:
  - type: metric
    label: top, during the run
    content: |
      %Cpu(s):  5.2 us, 88.4 sy,  0.0 ni,  5.9 id,  0.4 wa,  0.1 hi,  0.0 si

        PID USER      PR  NI    VIRT    RES    SHR S  %CPU  %MEM     TIME+ COMMAND
       1041 app       20   0  982340  91244   8120 R  94.7   1.1  48:11.02 invoice-export

  - type: command_output
    label: time, for a single run
    content: |
      real    54m18.226s
      user    2m41.104s
      sys     50m52.881s

  - type: command_output
    label: strace -c -f -p 1041, sampled for 5 seconds
    content: |
      % time     seconds  usecs/call     calls    errors syscall
      ------ ----------- ----------- --------- --------- ----------------
       61.02    2.981043           0   4118400           write
       33.77    1.649802           0   2059200           fsync
        4.88    0.238410           1     34320           newfstatat
        0.19    0.009122           2      4004           read
      ------ ----------- ----------- --------- --------- ----------------
      100.00    4.878377               6215924         0 total

  - type: config
    label: The logging change from two months ago
    content: |
      # audit.py — added in release 3.8
      def audit(record):
          with open(AUDIT_PATH, "a") as fh:
              fh.write(f"{now()} exported {record.id} {record.total}\n")
              fh.flush()
              os.fsync(fh.fileno())      # "so we never lose an audit line"

diagnostic_questions:
  - "Where is the CPU time actually going — the program's code or the kernel's?"
  - "Why did the profiler show nothing, and was it actually broken?"
  - "How many syscalls per record does the audit function make?"
  - "Which of the two calls in the trace is the expensive one, and why?"
  - "Why did doubling the CPU limit not help?"

hints:
  - "Compare user against sys in the `time` output before anything else."
  - "The strace summary counts two calls in a 2:1 ratio. What makes that pair per record?"
  - "`open`, `write`, `flush`, `fsync`, `close` — count the crossings per audit line."
  - "fsync does not return until the data is durable on the device."

root_cause: >-
  The audit function opens the file, writes one line, flushes, calls `fsync`,
  and closes — once per record. That is five system calls per record, one of
  which forces a durability barrier all the way to the device.


  The run is spending 50 of its 54 minutes in the kernel. The program's own
  logic accounts for under three minutes, which is why the profiler reported
  almost no time in application code: the profiler was correct, and the process
  genuinely was not running application code.


  `fsync` is the dominant cost. It does not merely hand bytes to the kernel — it
  blocks until the storage device confirms the write is durable, defeating the
  page cache and any batching the kernel would otherwise do. Two million of
  those in a run is the entire regression.


  Growth was gradual because the cost scales with record count, and the 30%
  growth in records over the same period compounded it.

method: >-
  The triage that finds this in under a minute.


  **1. Split the CPU time before choosing a tool.** `real 54m, user 2m41s, sys
  50m52s` says the process is in the kernel, not in its own code. That single
  reading tells you the profiler is the wrong instrument — it samples
  application stacks, and there are barely any to sample. The profiler was never
  broken; it was answering a question nobody was asking.


  **2. Ask which calls, with `strace -c`.** Five seconds of sampling is enough:
  4.1 million writes and 2 million fsyncs. The 2:1 ratio is the signature of a
  pair of operations per unit of work, which points straight at a per-record
  code path rather than anything periodic.


  **3. Work backwards from the call to the code.** `fsync` is rare in
  application code, and searching for it finds the audit function immediately.
  Reading it, the per-record open/write/flush/fsync/close is visible in five
  lines.


  **4. Explain the earlier non-result.** Doubling the CPU limit did not help
  because the CPU was not the constraint — the process was burning it in the
  kernel and blocking on durability barriers. A resource increase that produces
  no change is evidence, and it should have redirected the investigation two
  weeks earlier.

resolution: >-
  Keep the audit file open for the run, buffer the lines, and fsync on a policy
  rather than per record.


  ```python
  # once, at start of run
  audit_fh = open(AUDIT_PATH, "a", buffering=1 << 16)

  def audit(record):
      audit_fh.write(f"{now()} exported {record.id} {record.total}\n")

  # every N records or T seconds, and once at the end
  def checkpoint():
      audit_fh.flush()
      os.fsync(audit_fh.fileno())
  ```


  This turns five crossings per record into roughly one per 64 KB, and two
  million durability barriers into a few hundred. Expect the run to return to
  its original few minutes.


  The durability question deserves an explicit decision rather than a default.
  Per-record `fsync` bounds the loss to one record; checkpointing every N
  records bounds it to N. If the audit trail genuinely requires per-record
  durability, that is a legitimate requirement — but then it is a design
  constraint with a known cost, written down, rather than a line added to a
  logging helper by someone who did not know what `fsync` does.
