id: lab.what-you-may-ask
topic: topic.user-space-and-the-kernel
title: Find out what you are permitted to ask for
type: guided
tier: 2
image: groundwork/lab-foundations:1
duration_minutes: 20
objectives: [OBJ-A01.3.6]

intro: >-
  Every process may make any system call. Whether the kernel honours it is a
  different question, and the answer is not your user ID — it is your capability
  set.


  You will read your own, decode the set a normal Docker container gets, watch
  an operation be refused, and name the exact capability that would have allowed
  it. That last skill is the difference between fixing a container permission
  problem in one line and reaching for `--privileged`.

setup:
  - /opt/lab/seed.sh

steps:
  - id: s1
    instruction: >-
      Read your own capability sets out of /proc and save the four Cap lines to
      /tmp/answer-caps.
    hint: "`grep ^Cap /proc/self/status > /tmp/answer-caps`"
    walkthrough: |
      grep ^Cap /proc/self/status > /tmp/answer-caps
    verify:
      - type: file_matches
        path: /tmp/answer-caps
        pattern: "CapEff"
        describe: The effective set was captured
      - type: file_matches
        path: /tmp/answer-caps
        pattern: 'CapEff:\s*0+$'
        describe: This process holds no capabilities at all

  - id: s2
    instruction: >-
      All zeros is not what a normal container looks like. Decode Docker's
      default set — the hex value 00000000a80425fb — and save the readable list
      to /tmp/answer-docker-default.


      Read it. Then look for `cap_sys_admin` in it.
    hint: "`capsh --decode=00000000a80425fb > /tmp/answer-docker-default`"
    walkthrough: |
      capsh --decode=00000000a80425fb > /tmp/answer-docker-default
    verify:
      - type: file_matches
        path: /tmp/answer-docker-default
        pattern: "cap_net_bind_service"
        describe: The decoded set includes binding low ports
      - type: command_exit
        command: "grep -q cap_sys_admin /tmp/answer-docker-default"
        exit_code: 1
        describe: CAP_SYS_ADMIN is not in Docker's default set

  - id: s3
    instruction: >-
      Two more lines from the same file decide how much privilege this process
      can ever gain. Save the NoNewPrivs and Seccomp lines to
      /tmp/answer-hardening.
    hint: "`grep -E '^(NoNewPrivs|Seccomp)' /proc/self/status > /tmp/answer-hardening`"
    walkthrough: |
      grep -E '^(NoNewPrivs|Seccomp)' /proc/self/status > /tmp/answer-hardening
    verify:
      - type: file_matches
        path: /tmp/answer-hardening
        pattern: 'NoNewPrivs:\s*1'
        describe: This process can never gain privilege through exec

  - id: s4
    instruction: >-
      Now try something privileged. Create a file in /tmp and attempt to change
      its owner to root, saving both the output and the exit status to
      /tmp/answer-chown.


      It will fail. The interesting part is which error it fails with.
    hint: >-
      `touch /tmp/owned; chown root /tmp/owned > /tmp/answer-chown 2>&1; echo
      "exit=$?" >> /tmp/answer-chown`
    walkthrough: |
      touch /tmp/owned
      chown root /tmp/owned > /tmp/answer-chown 2>&1
      echo "exit=$?" >> /tmp/answer-chown
    verify:
      - type: file_matches
        path: /tmp/answer-chown
        pattern: "Operation not permitted|not permitted"
        describe: The operation was refused with EPERM, not EACCES

  - id: s5
    instruction: >-
      Name the capability that would have allowed it. Write it to
      /tmp/answer-capability in lowercase, in the form capsh prints it.


      The list you decoded in step 2 contains it.
    hint: "Look through /tmp/answer-docker-default for the one about changing ownership."
    walkthrough: |
      grep -o 'cap_chown' /tmp/answer-docker-default | head -1 > /tmp/answer-capability
    verify:
      - type: file_matches
        path: /tmp/answer-capability
        pattern: '^cap_chown$'
        describe: You identified the exact capability required

  - id: s6
    instruction: >-
      Last question, and the one that matters most. Look at CapBnd — the
      bounding set — in /tmp/answer-caps.


      If this process ran a setuid-root binary, could it gain cap_chown? Write
      the single word `yes` or `no` to /tmp/answer-bounding.
    hint: >-
      The bounding set is a ceiling: no capability outside it can ever be
      acquired, by any means. Look at its value.
    walkthrough: |
      grep CapBnd /tmp/answer-caps
      echo no > /tmp/answer-bounding
    verify:
      - type: file_matches
        path: /tmp/answer-bounding
        pattern: '^no$'
        describe: You understood that the bounding set is a hard ceiling

solution: |
  ```bash
  grep ^Cap /proc/self/status > /tmp/answer-caps
  capsh --decode=00000000a80425fb > /tmp/answer-docker-default
  grep -E '^(NoNewPrivs|Seccomp)' /proc/self/status > /tmp/answer-hardening

  touch /tmp/owned
  chown root /tmp/owned > /tmp/answer-chown 2>&1     # Operation not permitted
  echo "exit=$?" >> /tmp/answer-chown

  echo cap_chown > /tmp/answer-capability
  echo no > /tmp/answer-bounding
  ```

  **What you just established.**

  **Your capability set is empty.** `CapEff: 0000000000000000` means this shell
  holds none of the roughly forty privileges root used to carry as one lump.
  That is stricter than a normal container, and it is the actual configuration
  of the environment you are typing into.

  **Docker's default is fourteen.** Not zero, and not all of them. A container
  "running as root" holds `cap_chown`, `cap_net_bind_service`, `cap_net_raw` and
  eleven others — and conspicuously not `cap_sys_admin`, `cap_sys_module`,
  `cap_sys_time` or `cap_syslog`. This is why root in a container cannot mount a
  filesystem, load a module or set the clock.

  **The refusal was `EPERM`, not `EACCES`.** That distinction is the entire
  diagnosis. `EACCES` would mean the file permission check failed and `chmod`
  or `chown` would fix it. `EPERM` means the kernel understood the request and
  the process lacked the authority to make it — no amount of adjusting file
  permissions will help, because file permissions were never the problem.

  **The bounding set answers the "but what if" question.** `CapBnd` is a
  ceiling. A capability outside it cannot be gained by executing a setuid-root
  binary, by any file capabilities, by anything. Combined with `NoNewPrivs: 1`,
  this process cannot become more privileged than it is now, whatever it runs.

  **The practical routine.** When a container is refused something:

  ```bash
  docker exec <c> grep -E 'Uid|CapEff' /proc/1/status
  capsh --decode=<the CapEff value>
  ```

  Then find the capability the operation needs and add exactly that one:
  `--cap-add=NET_BIND_SERVICE`. Reaching for `--privileged` instead grants all
  forty and disables seccomp — it works, which is exactly what makes it
  dangerous, because it ends the investigation one step before the answer.

  **Where this goes.** In **C16** these become `cap_drop` and `cap_add` in a
  Compose file, and in **E29** the same values appear as a Kubernetes
  `securityContext`. Neither introduces anything new — they set the bits you
  just read.
