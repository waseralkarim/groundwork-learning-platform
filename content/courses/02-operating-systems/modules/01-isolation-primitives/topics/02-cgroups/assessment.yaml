id: assessment.cgroups
topic: topic.cgroups
pass_score: 70

parts:
  - id: A
    title: Explain the three kinds of knob to a colleague
    kind: explain
    objectives: [OBJ-A02.2.4]
    prompt: >-
      A colleague has raised a service's CPU request, tested it on an idle
      staging cluster, seen no change, and concluded that requests do nothing.


      Explain in about 200 words what a weight, a limit and a protection each
      are, what their colleague's test actually demonstrated, and give one
      example where a protection is the right tool and a limit is not.
    rubric:
      - "Defines a limit as a ceiling enforced regardless of contention"
      - "Defines a weight as a share of a contended resource, inert when there is no contention"
      - "Defines a protection as a claim on another cgroup's resource under pressure"
      - "States that the idle-cluster test had no contention in it and therefore demonstrated nothing"
      - "Gives a concrete protection example where a limit would not achieve the same thing"
    model_answer: >-
      Three different kinds of thing, and only one of them is a ceiling.


      A **limit** — `cpu.max`, `memory.max` — is enforced always. Half a CPU is
      half a CPU on an idle 64-core node just as firmly as on a busy one.


      A **weight** — `cpu.weight`, which is what a CPU request becomes — is a
      share of *contended* CPU. Two cgroups at 100 and 200 get a third and two
      thirds of the CPU that is scarce. When nothing is scarce, both get
      everything they ask for and the numbers change nothing.


      A **protection** — `memory.low`, `memory.min` — is a claim on somebody
      else's memory when the kernel needs to reclaim. It does not cap you; it
      changes who gets evicted first.


      So the staging test demonstrated that the cluster was idle. The setting
      worked exactly as designed; there was no competition for it to arbitrate.
      Testing a weight requires contention in the test.


      Where a protection is the only tool: a database's page cache should
      survive a nightly batch job. Capping the batch job limits how much it
      uses, and the kernel is still free to evict the database's cache to serve
      it. Only `memory.low` on the database changes who loses pages.
    common_failures:
      - "Describing a weight as a guaranteed minimum share of the machine rather than of contended capacity"
      - "Saying the request 'does nothing' — it also places the pod, which is half its purpose"
      - "Giving a protection example that a limit would solve equally well, which misses the point of the category"
      - "Concluding the colleague's test was wrong without saying what would make it right"

  - id: B
    title: Trace a resources block onto a node
    kind: reason
    objectives: [OBJ-A02.2.7]
    prompt: >-
      Given this pod spec on a cgroup v2 node using the systemd driver:


      ```yaml
      containers:
        - name: api
          resources:
            requests: { cpu: 500m, memory: 512Mi }
            limits:   { cpu: 2,    memory: 1Gi }
        - name: sidecar
          resources:
            requests: { cpu: 50m,  memory: 64Mi }
      ```


      State the pod's QoS class and where in the tree it lands, the values of
      `cpu.max`, `cpu.weight` and `memory.max` for each container and for the
      pod slice, and one risk this spec carries. Show the weight arithmetic.
    rubric:
      - "QoS class Burstable, landing under kubepods-burstable.slice"
      - "api: cpu.max = 200000 100000, memory.max = 1073741824, cpu.weight = 20"
      - "sidecar: cpu.max = max, memory.max = max, cpu.weight = 2 or 3 from 50m"
      - "Shows the shares-to-weight arithmetic rather than asserting the numbers"
      - "Identifies the limitless sidecar sharing the pod slice as the risk, and explains the OOM-victim consequence"
    model_answer: >-
      **QoS: Burstable.** Requests are set but not equal to limits, and the
      sidecar has no limits at all — so the pod lands under
      `kubepods.slice/kubepods-burstable.slice/kubepods-burstable-pod<uid>.slice`.


      **api** — `cpu.max` = `200000 100000` (2 CPUs at the default 100ms
      period). `memory.max` = 1073741824. `cpu.weight`: shares are
      `500 × 1024 / 1000 = 512`, weight is `1 + (512 − 2) × 9999 / 262142 ≈ 20`.


      **sidecar** — `cpu.max` = `max` and `memory.max` = `max`, since it has no
      limits. `cpu.weight`: shares are `50 × 1024 / 1000 = 51`, weight is
      `1 + 49 × 9999 / 262142 ≈ 2`.


      **pod slice** — `memory.max` is the sum of the containers' limits, and one
      container has none, so the pod slice is effectively unlimited on memory
      too. `cpu.weight` on the slice comes from the summed requests, 550m ≈ 22.


      **The risk.** The sidecar has no memory limit and shares the pod slice
      with the api. If it grows, there is no bound on it, and when memory does
      run short the kernel picks a victim by `oom_score` — roughly by size. The
      api, being much larger, is the likelier casualty of the sidecar's growth.
      The container that misbehaves is not the one that dies, and nothing in the
      api's own numbers will explain the kill.
    common_failures:
      - "Assigning Guaranteed because requests are present, missing that they must equal limits in every container"
      - "Writing cpu.weight values without the arithmetic, which makes them unverifiable"
      - "Saying the memory request becomes memory.min unconditionally — it does so only with MemoryQoS enabled"
      - "Naming the missing limits as untidy rather than tracing the consequence to who gets OOM-killed"

  - id: C
    title: Diagnose from cgroup files alone
    kind: diagnose
    objectives: [OBJ-A02.2.8, OBJ-A02.2.5, OBJ-A02.2.6]
    prompt: >-
      Two containers were pulled off a node during an incident. Both teams
      reported "slow".


      **X**


      ```text
      cpu.max         30000 100000
      cpu.stat        nr_periods 102400  nr_throttled 99841  throttled_usec 4102884221
      cpu.pressure    some avg60=57.20  full avg60=57.11
      memory.max      2147483648
      memory.current  402653184
      memory.events   oom_kill 0
      ```


      **Y**


      ```text
      cpu.max         max
      cpu.stat        nr_periods 0  nr_throttled 0
      cpu.pressure    some avg60=0.14  full avg60=0.11
      memory.max      268435456
      memory.current  263192576
      memory.peak     268435456
      memory.pressure some avg60=48.80  full avg60=48.40
      memory.events   oom_kill 9
      ```


      Diagnose each, say which single change you would make to each, and explain
      why giving Y more CPU would not help.
    rubric:
      - "X: CPU-throttled in 97% of periods against a 0.3 CPU quota; memory is not involved"
      - "Y: memory-starved — usage at 98% of the limit, peak touching it, and nine OOM kills"
      - "Uses the throttled ratio rather than the absolute count for X"
      - "Reads Y's near-zero CPU pressure against its 49% memory pressure to rule out CPU"
      - "Explains that Y's delay is time spent in reclaim, which more CPU does not shorten"
    model_answer: >-
      **X — CPU-throttled.** 99841 of 102400 periods ended early, which is 97%.
      Against a quota of 0.3 CPU that means it is stopped in almost every period,
      and a request arriving during the stopped part waits for the next one.
      `some` and `full` are essentially equal at 57%, which is the
      quota-throttling fingerprint: a spent quota stops the whole cgroup at once,
      so every stall is total. Memory is at 19% of its limit and has never been
      killed, so it is not part of this story.


      Change: raise `limits.cpu` until the throttled ratio approaches zero at
      target throughput — after checking `nproc` against `cpu.max`, because a
      runtime that self-sized to the node's CPU count will still be over-parallel
      at a higher quota.


      **Y — memory-starved.** `memory.current` is at 98% of a 256 MiB limit,
      `memory.peak` has touched the limit exactly, and `oom_kill` is 9. That
      combination is a container repeatedly being killed at its ceiling.


      Change: raise `limits.memory` above the observed peak with headroom
      justified from a longer window — and add an alert on `oom_kill`, because
      nine kills happened without anyone acting.


      **Why more CPU would not help Y.** Its CPU pressure is 0.14% — nothing is
      waiting for CPU, and with no quota it cannot be throttled. Its memory
      pressure is 49%: for nearly half the time, tasks are stalled while the
      kernel reclaims. That stall is the slowness, and it is time spent in
      reclaim rather than time spent waiting for a processor. More CPU makes
      reclaim marginally faster at best and does nothing about the fact that
      there is not enough memory to reclaim.
    common_failures:
      - "Reading X's throttled count as large without dividing by nr_periods, which is the only meaningful form"
      - "Diagnosing Y as CPU-starved because 49% pressure looks high, without noticing which file it came from"
      - "Recommending more replicas for X — every replica has the same quota, so per-request latency is unchanged"
      - "Missing that Y's memory.peak equalling memory.max is a distinct signal from memory.current being high"
