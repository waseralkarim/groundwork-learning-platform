id: topic.cgroups
slug: cgroups
title: "Cgroups: the Hierarchy Limits Are Written Into"
summary: >-
  Foundations measured what a limit does. This topic is about where limits live:
  a single tree, controllers enabled downward, weights that only act under
  contention, protections that act before pressure — and the Kubernetes
  resources block that writes all of it.
order: 2
levels: [L2, L3]
estimated_minutes: 130
status: published

prerequisites:
  - topic: topic.namespaces
    hardness: required
  - topic: topic.virtual-memory
    hardness: required
  - topic: topic.threads-and-concurrency
    hardness: required

objectives:
  - id: OBJ-A02.2.1
    level: L2
    verb: explain
    statement: >-
      Explain what a cgroup is, and how v2's single hierarchy differs from v1's
      separate tree per controller.
    assessed_by: [quiz.q1, quiz.q2, lab.find-your-cgroup]

  - id: OBJ-A02.2.2
    level: L2
    verb: identify
    statement: >-
      Identify a process's cgroup and the controllers available to it, from
      inside a container and from the host.
    assessed_by: [quiz.q3, quiz.q4, lab.find-your-cgroup, exercise.e1]

  - id: OBJ-A02.2.3
    level: L2
    verb: explain
    statement: >-
      Explain why a container sees itself at the root of the hierarchy, and what
      the host sees in its place.
    assessed_by: [quiz.q5, lab.find-your-cgroup]

  - id: OBJ-A02.2.4
    level: L3
    verb: distinguish
    statement: >-
      Distinguish a weight, a limit and a protection, and say which of them does
      anything when there is no contention.
    assessed_by: [quiz.q6, quiz.q7, lab.weights-limits-protections, exercise.e2, assessment.A]

  - id: OBJ-A02.2.5
    level: L3
    verb: interpret
    statement: >-
      Interpret pressure stall information, and distinguish what `some` reports
      from what `full` reports.
    assessed_by: [quiz.q8, quiz.q9, lab.pressure-under-a-limit]

  - id: OBJ-A02.2.6
    level: L3
    verb: calculate
    statement: >-
      Calculate the effective limit on a cgroup from the limits along its path,
      and explain why a parent can kill a child that is within its own.
    assessed_by: [quiz.q10, quiz.q11, lab.weights-limits-protections, exercise.e3]

  - id: OBJ-A02.2.7
    level: L3
    verb: trace
    statement: >-
      Trace a Kubernetes resources block to the cgroup files it produces, and to
      the QoS class it assigns.
    assessed_by: [quiz.q12, quiz.q13, lab.what-this-block-does, exercise.e4, assessment.B]

  - id: OBJ-A02.2.8
    level: L3
    verb: diagnose
    statement: >-
      Diagnose a workload's resource problem from its cgroup files alone, and
      say which knob would fix it.
    assessed_by: [quiz.q14, quiz.q15, lab.what-this-block-does, troubleshooting.throttled-not-busy, troubleshooting.the-noisy-neighbour, assessment.C]

terminology:
  - term: cgroup
    definition: >-
      A control group: a set of processes with resource accounting and limits
      attached, represented as a directory of interface files under
      /sys/fs/cgroup.
  - term: cgroup v2
    definition: >-
      The current design, in which every controller shares one hierarchy. A
      process belongs to exactly one cgroup, and that cgroup's path determines
      every limit applied to it.
  - term: controller
    definition: >-
      The kernel component that accounts for and limits one resource — cpu,
      memory, io, pids. Which controllers a cgroup may use is decided by its
      parent.
  - term: cgroup.subtree_control
    definition: >-
      The file in which a parent enables controllers for its children. A
      controller not listed here is unavailable below, however deep the tree
      goes.
  - term: no internal processes rule
    definition: >-
      In cgroup v2, a cgroup that has children may not also hold processes
      directly, except at the root. It removes the v1 ambiguity about who
      competes with whom.
  - term: cpu.max
    definition: >-
      A quota and period in microseconds. `50000 100000` means half a CPU: the
      cgroup may run 50ms of CPU time in every 100ms, and is stopped when it is
      spent.
  - term: cpu.weight
    definition: >-
      A relative share of contended CPU, default 100. It does nothing at all
      when the CPU is not contended, which is what makes it different in kind
      from a limit.
  - term: memory.max
    definition: >-
      The hard limit. Exceeding it and failing to reclaim gets the cgroup's
      processes OOM-killed.
  - term: memory.high
    definition: >-
      A throttling threshold. Above it the kernel reclaims aggressively and
      slows the cgroup down, but does not kill it — a pressure valve rather than
      a wall.
  - term: memory.low
    definition: >-
      A protection. Memory below this figure is reclaimed only when there is no
      other option, so a cgroup can be defended from its neighbours rather than
      merely capped.
  - term: memory.min
    definition: >-
      A hard protection: memory below it is never reclaimed, which can push the
      OOM killer at someone else instead.
  - term: PSI
    definition: >-
      Pressure stall information — how much time tasks spent stalled waiting for
      CPU, memory or I/O, as a percentage over 10, 60 and 300 seconds.
  - term: some and full
    definition: >-
      Two PSI lines. `some` is time when at least one task was stalled; `full`
      is time when every task was. `full` climbing means nothing is getting
      done.
  - term: delegation
    definition: >-
      Handing a subtree to a less privileged owner — a container runtime, a
      user session — by making it writable while the limits above it stay
      enforced.
  - term: QoS class
    definition: >-
      Kubernetes' classification of a pod from its requests and limits —
      Guaranteed, Burstable or BestEffort — which decides where in the node's
      cgroup tree it lands and how early it is evicted.

foreshadows:
  - "C14 assembles namespaces, cgroups and overlayfs into what Docker calls a container; the flags it passes are the files read here."
  - "E29's requests and limits are exactly the writes this topic traces, and its QoS classes are positions in the node's tree."
  - "F34 alerts on saturation, and PSI is the signal that says saturation directly rather than by inference from utilisation."
  - "E31 debugs a node under memory pressure, where the question is which cgroup's protection pushed the OOM killer at somebody else."

tags: [cgroups, kernel, containers, limits, resources, linux, kubernetes]
