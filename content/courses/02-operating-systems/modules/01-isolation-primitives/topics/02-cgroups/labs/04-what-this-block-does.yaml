id: lab.what-this-block-does
topic: topic.cgroups
title: "Challenge: three containers, three resource stories"
type: challenge
tier: 2
image: groundwork/lab-foundations:1
duration_minutes: 30
objectives: [OBJ-A02.2.7, OBJ-A02.2.8]

intro: >-
  Three containers were pulled off a node during an incident, and their cgroup
  files are at /tmp/incident. Nobody kept the manifests.


  All three were reported as "slow" by their teams in the same hour. One of them
  is genuinely fine and was reported because everything else was. Work out what
  each one's resources block said, what is actually wrong with it, and which
  single change you would make — from the files alone.

setup:
  - /opt/lab/seed.sh
  - /opt/lab/seed-cgroups.sh

steps:
  - id: s1
    instruction: >-
      Before opening anything, write at least three hypotheses to
      /tmp/hypotheses — one per line — for why a container might be slow in a
      way its cgroup files would show.
    hint: >-
      There are at least four distinct resource stories a cgroup can tell, and
      one of them is "nothing is wrong here".
    walkthrough: |
      printf 'it is being CPU-throttled against its quota\nit is close to its memory limit and reclaiming constantly\nit has been OOM-killed and restarted repeatedly\nits limits are fine and the problem is elsewhere\n' > /tmp/hypotheses
    verify:
      - type: file_exists
        path: /tmp/hypotheses
        describe: You recorded hypotheses before looking
      - type: command_output
        command: "wc -l < /tmp/hypotheses"
        pattern: "[3-9]"
        describe: At least three hypotheses

  - id: s2
    instruction: >-
      Reconstruct the CPU limit each container was given. For each of alpha,
      bravo and charlie, convert cpu.max into CPUs and write it to
      /tmp/answer-cpu-limits in the form `alpha 0.2`.


      One of them has no CPU limit at all.
    walkthrough: |
      for c in alpha bravo charlie; do
        read -r q p < /tmp/incident/$c/cpu.max
        if [ "$q" = max ]; then
          echo "$c none"
        else
          awk -v q="$q" -v p="$p" -v c="$c" 'BEGIN { printf "%s %.1f\n", c, q/p }'
        fi
      done > /tmp/answer-cpu-limits
      cat /tmp/answer-cpu-limits
    verify:
      - type: file_matches
        path: /tmp/answer-cpu-limits
        pattern: "alpha 0.2"
        describe: Alpha is limited to a fifth of a CPU
      - type: file_matches
        path: /tmp/answer-cpu-limits
        pattern: "bravo none"
        describe: Bravo has no CPU limit
      - type: file_matches
        path: /tmp/answer-cpu-limits
        pattern: "charlie 4.0"
        describe: Charlie is limited to four CPUs

  - id: s3
    instruction: >-
      Now find who is actually being throttled. Compute the throttled-period
      ratio as a whole-number percentage for each container and save it to
      /tmp/answer-throttle in the form `alpha 98`.
    walkthrough: |
      for c in alpha bravo charlie; do
        awk -v c="$c" '/^nr_periods/ {p=$2} /^nr_throttled/ {t=$2} END { printf "%s %d\n", c, (p ? (t*100)/p : 0) }' /tmp/incident/$c/cpu.stat
      done > /tmp/answer-throttle
      cat /tmp/answer-throttle
    verify:
      - type: file_matches
        path: /tmp/answer-throttle
        pattern: "alpha 9[0-9]"
        describe: Alpha is throttled in almost every period
      - type: file_matches
        path: /tmp/answer-throttle
        pattern: "bravo 0"
        describe: Bravo is not throttled at all — it has no quota to hit
      - type: file_matches
        path: /tmp/answer-throttle
        pattern: "charlie 0"
        describe: And charlie is barely throttled despite doing real work

  - id: s4
    instruction: >-
      Collect the memory evidence. For each container save memory.max,
      memory.current, memory.peak and the oom_kill count into
      /tmp/answer-memory, labelled by container.
    walkthrough: |
      for c in alpha bravo charlie; do
        printf '%s max=%s current=%s peak=%s oom_kill=%s\n' "$c" \
          "$(cat /tmp/incident/$c/memory.max)" \
          "$(cat /tmp/incident/$c/memory.current)" \
          "$(cat /tmp/incident/$c/memory.peak)" \
          "$(awk '/^oom_kill/ {print $2}' /tmp/incident/$c/memory.events)"
      done > /tmp/answer-memory
      cat /tmp/answer-memory
    verify:
      - type: file_matches
        path: /tmp/answer-memory
        pattern: "bravo .*oom_kill=12"
        describe: Bravo has been OOM-killed twelve times
      - type: file_matches
        path: /tmp/answer-memory
        pattern: "alpha .*oom_kill=0"
        describe: Alpha has never been OOM-killed

  - id: s5
    instruction: >-
      Two of these are broken in different ways and one is healthy. Write your
      diagnosis to /tmp/answer-diagnosis — one line per container, naming the
      problem or saying there is none.
    walkthrough: |
      {
        echo "alpha: CPU-throttled in 98 percent of periods against a 0.2 CPU quota; memory is fine and it has never been OOM-killed"
        echo "bravo: memory-starved; current is at 98 percent of a 256 MiB limit, memory pressure is around 44 percent and it has been OOM-killed 12 times"
        echo "charlie: healthy; barely throttled, peak memory is half its limit, pressure near zero, and it was reported only because everything else was"
      } > /tmp/answer-diagnosis
      cat /tmp/answer-diagnosis
    verify:
      - type: file_matches
        path: /tmp/answer-diagnosis
        pattern: "alpha:.*(throttl|quota)"
        describe: You diagnosed alpha as CPU-throttled
      - type: file_matches
        path: /tmp/answer-diagnosis
        pattern: "bravo:.*(memory|oom|OOM)"
        describe: You diagnosed bravo as a memory problem
      - type: file_matches
        path: /tmp/answer-diagnosis
        pattern: "charlie:.*(health|fine|nothing|no problem)"
        describe: You recognised that charlie is not broken

  - id: s6
    instruction: >-
      Bravo has no CPU limit and is still slow. Explain what its memory pressure
      figure has to do with that, in /tmp/answer-bravo-cpu.
    hint: >-
      Compare its cpu.pressure and its memory.pressure. Reclaim is not free, and
      the time it takes is charged to somebody.
    walkthrough: |
      cat /tmp/incident/bravo/cpu.pressure /tmp/incident/bravo/memory.pressure
      echo "its cpu pressure is near zero but memory pressure is about 44 percent: tasks are stalled waiting for memory reclaim, not for CPU, so adding CPU would change nothing and raising the memory limit is the fix" > /tmp/answer-bravo-cpu
    verify:
      - type: file_matches
        path: /tmp/answer-bravo-cpu
        pattern: "reclaim|memory pressure|stall"
        describe: You attributed the delay to memory reclaim rather than CPU
      - type: command_exit
        command: "test $(wc -w < /tmp/answer-bravo-cpu) -ge 12"
        exit_code: 0
        describe: You wrote a real explanation

  - id: s7
    instruction: >-
      Write the one change you would make to each container, to
      /tmp/answer-fixes — one line each, naming the specific field.


      For the healthy one, say what you would change and why it is not urgent.
    walkthrough: |
      {
        echo "alpha: raise limits.cpu until the throttled ratio is near zero, or remove the limit and rely on the request weight"
        echo "bravo: raise limits.memory above the observed peak with justified headroom; the 12 OOM kills are the alert nobody had"
        echo "charlie: lower limits.cpu from 4 toward observed usage to stop reserving capacity it never uses; not urgent, it is a cost issue"
      } > /tmp/answer-fixes
      cat /tmp/answer-fixes
    verify:
      - type: file_matches
        path: /tmp/answer-fixes
        pattern: "alpha:.*cpu"
        describe: Alpha's fix is on the CPU side
      - type: file_matches
        path: /tmp/answer-fixes
        pattern: "bravo:.*memory"
        describe: Bravo's fix is on the memory side
      - type: file_matches
        path: /tmp/answer-fixes
        pattern: "charlie:"
        describe: You said something about charlie rather than skipping it

solution: |
  **The three stories.**

  | | alpha | bravo | charlie |
  |---|---|---|---|
  | `cpu.max` | `20000 100000` → 0.2 CPU | `max` → none | `400000 100000` → 4 CPU |
  | Throttled periods | 211944 / 214880 = **98%** | 0 | 24 / 214880 = **0%** |
  | `cpu.pressure` some | 61% | 0.1% | 1% |
  | `memory.max` | 1 GiB | 256 MiB | 4 GiB |
  | `memory.peak` | 256 MiB | **256 MiB — the limit** | 2 GiB |
  | `memory.pressure` some | — | **44%** | — |
  | `oom_kill` | 0 | **12** | 0 |

  **alpha — CPU-throttled, memory irrelevant.** Throttled in 98% of periods
  against a fifth of a CPU, with `some` pressure at 61% and `full` at 61.4% —
  essentially equal, which is the quota-throttling fingerprint. Its memory is at
  a quarter of its limit and it has never been killed. Every minute spent
  looking at its memory would have been wasted.

  Its resources block said roughly `requests.cpu: 100m`, `limits.cpu: 200m`,
  `limits.memory: 1Gi` — and the `cpu.weight` of 4 gives the request away, since
  4 is what 100m converts to.

  **bravo — memory-starved, and the slowness is a side effect.** `memory.current`
  is 250 MiB against a 256 MiB limit; `memory.peak` has touched the limit
  exactly, which is what a container that keeps being killed looks like; and
  `oom_kill` is 12.

  The instructive part is the pressure pair. CPU pressure is 0.1% — this
  container is not waiting for CPU and has no quota to hit. Memory pressure is
  44%: nearly half the time, tasks are stalled while the kernel reclaims. That
  is where the slowness comes from, and it is why "give it more CPU" — the
  reflex — would have changed nothing.

  `memory.stat` confirms the shape: 238 MiB of `anon` against 4 MiB of `file`.
  Almost all of it is anonymous memory, which is *not* reclaimable, so the
  kernel is churning through a tiny amount of page cache over and over and then
  killing something.

  **charlie — healthy, and it is worth saying so out loud.** 24 throttled
  periods out of 214880 is 0.01%. Pressure is near zero on both. Peak memory is
  2 GiB against a 4 GiB limit. It was reported because it is in the same request
  path as the other two and everything downstream of alpha was slow.

  Finding the healthy one is a real skill. During an incident the pressure is to
  find something wrong with every service that was named, and cgroup files let
  you say "not this one" with evidence instead of instinct.

  **What the reconstruction rests on.**

  - `cpu.max` quota ÷ period is the CPU limit, directly.
  - `cpu.weight` is the CPU request, invertibly: `millicores ≈ (weight − 1) ×
    262142 / 9999 × 1000 / 1024`, so weight 4 ≈ 100m, 39 ≈ 1 CPU, 157 ≈ 4 CPU.
  - `memory.max` is the memory limit in bytes.
  - The memory *request* is not visible here — it is a scheduling figure, not a
    cgroup file, unless the node has MemoryQoS enabled and sets `memory.min`.

  That last gap is worth remembering: three of the four numbers in a resources
  block are recoverable from the node, and one is not.

  **The fixes.**

  - **alpha** — raise `limits.cpu` until the throttled ratio is near zero at
    target throughput, or drop the limit and let `cpu.weight` from the request
    do the work under contention. Either is defensible; the round number 200m
    is not.
  - **bravo** — raise `limits.memory` above the observed peak with headroom you
    can justify from `memory.peak` over a longer window. Then alert on
    `oom_kill`, because twelve kills happened and nobody knew.
  - **charlie** — lower `limits.cpu` toward what it uses, so the node's
    schedulable capacity is not reserved for headroom that is never taken. Cost,
    not correctness, and it can wait until after the incident.

  **The order to read these files in, next time.**

  ```bash
  awk '/nr_periods|nr_throttled/' cpu.stat     # throttled? ratio, not count
  cat memory.events                            # killed? oom_kill survives
  cat cpu.pressure memory.pressure io.pressure # waiting on what, exactly
  cat memory.peak memory.max                   # how close, at its worst
  ```

  Four commands, and they separate "throttled", "starved", "killed" and "fine"
  before anyone has opened a dashboard.
