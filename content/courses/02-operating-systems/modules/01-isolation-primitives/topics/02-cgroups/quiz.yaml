id: quiz.cgroups
topic: topic.cgroups
pass_score: 70

questions:
  - id: q1
    type: single_choice
    level: L2
    objectives: [OBJ-A02.2.1]
    stem: What is a cgroup, mechanically?
    options:
      - id: a
        text: A directory of interface files with a set of processes attached to it
        correct: true
      - id: b
        text: A kernel object created through a dedicated set of system calls
        note: >-
          There are no cgroup syscalls. Creating one is mkdir, joining one is a
          write, and setting a limit is a write — the filesystem is the API.
      - id: c
        text: A namespace that isolates a process's view of resources
        note: >-
          Namespaces change what a process can see; cgroups change what it may
          consume. There is a cgroup *namespace*, but it is a different thing
          from a cgroup.
      - id: d
        text: A systemd concept that the kernel implements on systemd's behalf
        note: >-
          systemd is a heavy user and its slice names are everywhere, but
          cgroups predate that use and work identically with no systemd present.
    explanation: >-
      A cgroup is a directory under /sys/fs/cgroup. Create it with `mkdir`, move
      a process in by writing its PID to `cgroup.procs`, set a limit by writing
      a number to a file, remove it with `rmdir`. Everything Docker, systemd and
      the kubelet do here you could do with a shell — which is worth knowing the
      first time a tool will not tell you what it configured.

  - id: q2
    type: single_choice
    level: L2
    objectives: [OBJ-A02.2.1]
    stem: >-
      What changed between cgroup v1 and v2 that made pressure stall information
      possible?
    options:
      - id: a
        text: v2 has a single hierarchy, so the kernel can reason about a group's resources together
        correct: true
      - id: b
        text: v2 added new controllers that v1 did not have
        note: >-
          The controller set is broadly the same. What changed is that they now
          share one tree, so they can agree about who is who.
      - id: c
        text: v2 moved the interface from sysfs to a set of system calls
        note: >-
          Both are filesystem interfaces. v2 simplified the layout; it did not
          replace the mechanism.
      - id: d
        text: v2 made cgroups per-namespace, so each container gets its own accounting
        note: >-
          Accounting was always per-cgroup. The cgroup namespace changes the
          view of the tree, not who is accounted where.
    explanation: >-
      Under v1 each controller had its own hierarchy, so a process could be in
      one group for memory and a different one for I/O. "A group" did not exist
      as a single thing the kernel could reason about, which is precisely what
      memory reclaim needs when it wants to coordinate with the I/O controller.
      v2's single tree is what lets `memory.pressure` and `io.pressure` mean
      anything.

  - id: q3
    type: single_choice
    level: L2
    objectives: [OBJ-A02.2.2]
    stem: >-
      A child cgroup has no `memory.max` file at all. What is the likeliest
      reason?
    options:
      - id: a
        text: Its parent has not written `+memory` to `cgroup.subtree_control`
        correct: true
      - id: b
        text: The memory controller is not compiled into the kernel
        note: >-
          Possible, but then no cgroup anywhere would have the file, including
          the root — which is easy to check and usually rules this out.
      - id: c
        text: The cgroup has no processes in it yet
        note: >-
          Interface files exist from the moment the directory does. They do not
          appear when the first process arrives.
      - id: d
        text: Memory limits can only be set at the root of the hierarchy
        note: >-
          The opposite is true: the root is the one place where several
          restrictions do not apply, and limits are normally set well below it.
    explanation: >-
      Controllers are handed down one level at a time. `cgroup.controllers` is
      read-only and lists what the parent enabled; a parent grants a controller
      to its children by writing `+memory` to its own `subtree_control`. A
      controller not enabled at some level does not exist below it, however deep
      the tree goes — so a missing interface file is usually a parent that never
      enabled it.

  - id: q4
    type: single_choice
    level: L2
    objectives: [OBJ-A02.2.2]
    stem: >-
      Why may a cgroup that has child cgroups not also contain processes
      directly?
    options:
      - id: a
        text: Because it would be ambiguous whether those processes compete with the children or alongside them
        correct: true
      - id: b
        text: Because the kernel cannot account for processes at a non-leaf level
        note: >-
          It can — v1 did exactly that. The problem was that nobody could say
          what the resulting numbers meant.
      - id: c
        text: Because moving a process into a parent would move it out of the children
        note: >-
          A process is only ever in one cgroup, so there is nothing to move it
          out of. The rule is about competition, not membership.
      - id: d
        text: It is a systemd convention rather than a kernel rule
        note: >-
          The kernel enforces it: a write to `cgroup.procs` on a cgroup with
          children fails. The root is the only exception.
    explanation: >-
      The "no internal processes" rule makes every cgroup except the root either
      a branch or a leaf. Under v1 a parent's own processes competed with its
      children's, and no distribution of resources between them was obviously
      correct. v2 removes the question by making the situation impossible.

  - id: q5
    type: single_choice
    level: L2
    objectives: [OBJ-A02.2.3]
    stem: >-
      Inside a container, `cat /proc/self/cgroup` prints `0::/`. On the host,
      the same process shows a long path. Why?
    options:
      - id: a
        text: The cgroup namespace re-roots the view, so the container's cgroup appears as /
        correct: true
      - id: b
        text: The container is genuinely at the root, and the host path is the runtime's own bookkeeping
        note: >-
          The host path is the kernel's, not the runtime's, and the limits along
          it are enforced. Both readings come from the same kernel structure.
      - id: c
        text: /proc is mounted read-only in the container, so the path is truncated
        note: >-
          Read-only affects writing, not content. The path is short because the
          view starts there.
      - id: d
        text: Docker rewrites the file to hide the node's layout
        note: >-
          Nothing rewrites /proc. The kernel generates it per reader, from the
          reader's cgroup namespace.
    explanation: >-
      The cgroup namespace exists for exactly this. It stops a container reading
      the node's tree — pod UIDs, QoS classes, other tenants — and it makes
      `/sys/fs/cgroup/memory.max` mean "my limit" under every runtime. The cost
      is that a container cannot see the limits above it, which is where the
      confusing OOM kills come from.

  - id: q6
    type: single_choice
    level: L3
    objectives: [OBJ-A02.2.4]
    stem: >-
      You double a container's `cpu.weight` and measure no change on an idle
      staging node. What does that tell you?
    options:
      - id: a
        text: Nothing about the setting — a weight only acts when the resource is contended
        correct: true
      - id: b
        text: The weight was not applied, since a doubled share should double throughput
        note: >-
          A weight is not a share of the machine; it is a share of what is
          contested. With nothing to contest, both values behave identically.
      - id: c
        text: The container is also limited by `cpu.max`, which overrides the weight
        note: >-
          Possible in general, but on an idle node a container below its quota
          is not limited by anything — which is the actual reason nothing moved.
      - id: d
        text: Weights only apply to processes, not to whole cgroups
        note: >-
          `cpu.weight` is a property of the cgroup and applies to everything in
          it. Per-process nice values are a separate mechanism.
    explanation: >-
      This is the classic false negative. Weights distribute a contended
      resource: two cgroups at 100 and 200 get a third and two thirds *of the
      CPU that is scarce*. On an idle machine both get everything they ask for
      and the numbers are inert. Testing a weight requires competition in the
      test, which staging environments famously lack.

  - id: q7
    type: multi_choice
    level: L3
    objectives: [OBJ-A02.2.4]
    stem: >-
      Which of these act only when the system is under memory pressure? Select
      all that apply.
    options:
      - id: a
        text: "`memory.low` — memory below it is reclaimed only as a last resort"
        correct: true
      - id: b
        text: "`memory.min` — memory below it is never reclaimed"
        correct: true
      - id: c
        text: "`memory.max` — the cgroup cannot exceed it"
        note: >-
          A ceiling is enforced whether or not anything else wants memory.
          Allocation past it fails or triggers a kill regardless of system-wide
          pressure.
      - id: d
        text: "`memory.current` — the cgroup's usage right now"
        note: >-
          Not a knob at all. It is a counter, and reading it changes nothing.
    explanation: >-
      Protections are claims on other cgroups' memory, so they mean nothing
      until there is competition for it. `memory.low` is soft — the kernel takes
      protected memory only if there is no alternative. `memory.min` is hard, and
      can push the OOM killer at somebody else, which makes it a weapon worth
      treating as one. A limit is different in kind: it is a ceiling, and it
      applies on a completely idle machine.

  - id: q8
    type: single_choice
    level: L3
    objectives: [OBJ-A02.2.5]
    stem: >-
      `cpu.pressure` reads `some avg10=40.00` and `full avg10=39.90`. What does
      the near-equality suggest?
    options:
      - id: a
        text: Quota throttling — when the quota runs out every task stops at once, so every stall is total
        correct: true
      - id: b
        text: A single-threaded workload, where "some" and "full" are necessarily the same
        note: >-
          True for one task, and worth ruling out — but a single-threaded
          container is unusual and the throttling counters distinguish the two
          cases immediately.
      - id: c
        text: A measurement error, since `full` can never approach `some`
        note: >-
          `full` is bounded above by `some` and may legitimately equal it. There
          is nothing wrong with these numbers.
      - id: d
        text: Memory pressure being misreported in the CPU file
        note: >-
          The files are independent. Memory stalls appear in `memory.pressure`
          and would not move this one.
    explanation: >-
      Ordinary CPU contention gives `some` well above `full`: some tasks run
      while others wait. Quota throttling stops the entire cgroup at the same
      instant, so any stall is a total stall and the two lines converge. Seeing
      `some ≈ full` on `cpu.pressure` is a fairly reliable way to tell "we are
      hitting our own quota" from "the node is busy" — confirmed in one step by
      `nr_throttled / nr_periods`.

  - id: q9
    type: single_choice
    level: L3
    objectives: [OBJ-A02.2.5]
    stem: >-
      A container sits at exactly 100% of its CPU limit, flat, all day. What
      does that tell you about whether it needs more CPU?
    options:
      - id: a
        text: Nothing — a perfectly sized container and a starved one both look like this
        correct: true
      - id: b
        text: It is correctly sized, since it is using exactly what it was given
        note: >-
          That is one of the two possibilities the graph cannot distinguish. The
          other is a container desperate for more, and they are identical here.
      - id: c
        text: It needs more, since being at the limit is always saturation
        note: >-
          Also one of the two. A batch job that is meant to consume its quota
          looks exactly the same and is fine.
      - id: d
        text: It is throttled, since utilisation cannot exceed the limit without throttling
        note: >-
          It can sit at the limit without being throttled if its demand happens
          to match the quota. Throttling has its own counter, and this is why.
    explanation: >-
      Utilisation measures the resource; pressure measures the work. A limited
      container's utilisation is bounded above by its limit, so it converges to
      100% for anything busy — and the graph then says nothing about whether the
      work is waiting. `nr_throttled / nr_periods` and `cpu.pressure` answer the
      question the utilisation graph structurally cannot.

  - id: q10
    type: single_choice
    level: L3
    objectives: [OBJ-A02.2.6]
    stem: >-
      A container's `memory.max` is `max` and its `memory.current` is 80 MiB.
      Can it be OOM-killed?
    options:
      - id: a
        text: Yes — a cgroup on the path above it can have a limit, and the kernel picks a victim from inside
        correct: true
      - id: b
        text: 'No — `max` means no limit, so there is nothing to exceed'
        note: >-
          `max` means no limit *at this level*. The effective limit is the
          tightest on the whole path, and most of that path is invisible from
          inside the container.
      - id: c
        text: Only if the node itself runs out of memory
        note: >-
          That is one way, but not the common one. A pod slice hitting its own
          limit kills from inside itself while the node has memory to spare.
      - id: d
        text: Only if `memory.oom.group` is set on it
        note: >-
          `oom.group` changes *what* is killed — one process or the whole
          cgroup. It does not decide whether a kill happens.
    explanation: >-
      This is the confusing Kubernetes OOM kill. The pod cgroup above the
      container has a limit — usually the sum of its containers' limits — and
      the containers share it. When the pod cgroup cannot be brought under it,
      the kernel picks a victim by `oom_score` from inside the pod, and often
      picks a container that was well within its own numbers. The container's
      `memory.events` records the kill; nothing else in its own files explains
      it.

  - id: q11
    type: single_choice
    level: L3
    objectives: [OBJ-A02.2.6]
    stem: >-
      Along a path, memory limits are: root `max`, kubepods 28G, burstable
      `max`, pod 512M, container 448M. What is the container's effective limit?
    options:
      - id: a
        text: 448 MiB — the tightest limit on the path
        correct: true
      - id: b
        text: 512 MiB, because the pod's limit governs its containers
        note: >-
          The pod's limit governs the pod. The container's own is tighter, and
          the tightest on the path is what applies.
      - id: c
        text: 960 MiB, since limits at different levels add up
        note: >-
          Limits compose by minimum, never by sum. A parent's limit constrains
          the total of its children; it does not extend them.
      - id: d
        text: 28 GiB, because the intermediate `max` values reset the constraint
        note: >-
          `max` means "no limit here" and is simply skipped. It cannot lift a
          constraint set above or below it.
    explanation: >-
      The effective limit is the minimum of every limit between the root and the
      cgroup, with `max` contributing nothing. Here that is 448 MiB. The pod's
      512 MiB still matters — it is what the container's 448 MiB and its
      siblings' usage together must fit inside, which is how a container with a
      generous limit of its own still gets killed.

  - id: q12
    type: single_choice
    level: L3
    objectives: [OBJ-A02.2.7]
    stem: What does a Kubernetes CPU *request* become on the node?
    options:
      - id: a
        text: '`cpu.weight` — a share of contended CPU, plus a number the scheduler uses to place the pod'
        correct: true
      - id: b
        text: '`cpu.max` — a guaranteed floor of CPU time the container always gets'
        note: >-
          `cpu.max` is the *limit*, and it is a ceiling rather than a floor.
          Requests never produce a quota.
      - id: c
        text: 'Nothing on the node — it is used only by the scheduler'
        note: >-
          It is used by the scheduler, and it is also written as a weight. Both,
          not either.
      - id: d
        text: '`cpuset.cpus` — a pinned set of CPUs reserved for the container'
        note: >-
          Only with the static CPU manager policy, for Guaranteed pods with
          whole-number CPU requests. Not the general case.
    explanation: >-
      The conversion is arithmetic: shares are `millicores × 1024 / 1000`, and
      `cpu.weight` is `1 + (shares − 2) × 9999 / 262142`. So 100m becomes 4, and
      2 CPUs becomes 79. A request is therefore not a reservation — it is a
      claim on a share of the CPU when there is competition, plus a figure the
      scheduler subtracts from a node's allocatable capacity.

  - id: q13
    type: single_choice
    level: L3
    objectives: [OBJ-A02.2.7]
    stem: >-
      Which of these can you determine about a pod from the node's cgroup files
      alone, with no cluster access?
    options:
      - id: a
        text: Its QoS class, its CPU request and limit, and its memory limit
        correct: true
      - id: b
        text: All four numbers in its resources block
        note: >-
          The memory *request* is the one that is missing. It is a scheduling
          figure, and unless MemoryQoS is enabled it produces no cgroup file.
      - id: c
        text: Only its limits — requests are not represented on the node at all
        note: >-
          The CPU request is right there as `cpu.weight`, and it is invertible.
          Only the memory request is absent.
      - id: d
        text: Nothing — cgroup files are runtime state and do not reflect the manifest
        note: >-
          They are precisely what the manifest was translated into. Reading them
          is how you check that the manifest you think is deployed is deployed.
    explanation: >-
      QoS class is a directory name in the path. CPU limit is `cpu.max`, CPU
      request inverts out of `cpu.weight`, and memory limit is `memory.max`. The
      memory request is the gap: it is used for scheduling and eviction ranking
      and, unless the node has MemoryQoS setting `memory.min`, leaves no trace
      in the tree.

  - id: q14
    type: single_choice
    level: L3
    objectives: [OBJ-A02.2.8]
    stem: >-
      A container has no CPU limit, near-zero `cpu.pressure`, `memory.current` at
      98% of `memory.max`, and `memory.pressure some avg60=44`. What is wrong?
    options:
      - id: a
        text: It is memory-starved; tasks are stalled in reclaim, and adding CPU would change nothing
        correct: true
      - id: b
        text: It is CPU-starved, since 44% pressure is high and the node must be busy
        note: >-
          The 44% is in `memory.pressure`. Its CPU pressure is near zero, which
          says directly that CPU is not what anything is waiting for.
      - id: c
        text: Nothing — without a CPU limit it cannot be throttled
        note: >-
          It cannot be CPU-throttled, which is true and not the same as being
          fine. The memory figures are the problem.
      - id: d
        text: Its memory limit is too high, causing the kernel to over-allocate
        note: >-
          A high limit does not cause pressure. Usage pressed up against the
          limit does, and here the limit is the thing being hit.
    explanation: >-
      The pressure files separate the two stories directly. CPU pressure near
      zero means nothing is waiting for CPU. Memory pressure at 44% means that
      for nearly half the time, tasks were stalled while the kernel reclaimed —
      which is where the slowness comes from. The reflex fix of "give it more
      CPU" would change nothing, and `memory.peak` against `memory.max` says how
      much more memory to give it.

  - id: q15
    type: single_choice
    level: L3
    objectives: [OBJ-A02.2.8]
    stem: >-
      You can add exactly one resource alert to a cluster that has none. Which
      one?
    options:
      - id: a
        text: An increase in the `oom_kill` counter from `memory.events`
        correct: true
      - id: b
        text: CPU utilisation above 90% of the limit
        note: >-
          A throttled container sits at its limit and looks identical to a
          healthy one that is correctly sized. This alert fires on both and
          distinguishes neither.
      - id: c
        text: Memory utilisation above 80% of the limit
        note: >-
          A reasonable second choice, and noisy: many workloads sit above 80%
          quite happily because the cgroup counts reclaimable page cache.
      - id: d
        text: Container restart count above zero
        note: >-
          Useful, and it conflates every cause of a restart — a failed probe, a
          deploy, a crash and an OOM kill all look the same.
    explanation: >-
      `oom_kill` is the only unambiguous one. It counts kills in this cgroup, it
      is a kernel counter rather than a log line so it cannot be missed because
      nobody was tailing, and it survives the process that was killed. Every
      other candidate needs interpretation; this one means exactly what it says,
      and it is the alert most often absent.
