topic: topic.cgroups

questions:
  - id: i1
    level: L2
    question: What is the difference between a cgroup and a namespace?
    model_answer: >-
      Namespaces change what a process can *see*; cgroups change what it may
      *consume*. A namespace gives a process its own view of one global resource
      — process IDs, mounts, network interfaces. A cgroup attaches accounting and
      limits to a set of processes: CPU quota, memory ceiling, process count,
      I/O bandwidth.


      They are independent mechanisms that container runtimes use together. You
      can have namespaces with no limits, or limits with no namespaces — systemd
      puts every service on a normal machine in a cgroup without giving any of
      them a namespace.


      The one place they meet is the cgroup namespace, which re-roots a
      process's view of the cgroup tree. That is a namespace whose subject
      happens to be cgroups, and it is why `/proc/self/cgroup` reads `0::/`
      inside a container while the host sees a hundred-character path.
    signal: >-
      "See versus consume" in the first sentence is the answer. Knowing that
      systemd cgroups everything without namespacing it shows the two are
      genuinely separate in the candidate's model rather than being two halves
      of "container". Naming the cgroup namespace as the point of contact is a
      strong extra.
    follow_ups:
      - "Which of the two would you use to stop one workload starving another?"
      - "What does /proc/self/cgroup show inside a container, and why?"
      - "Can a process be in a cgroup with no namespaces at all?"

  - id: i2
    level: L3
    question: >-
      A container is at 100% of its CPU limit. Is that a problem? How would you
      find out?
    model_answer: >-
      By itself it tells you nothing, because a limited container's utilisation
      is bounded by its limit — so anything busy converges on 100%, whether it
      is correctly sized or desperate for more. The graph cannot distinguish
      those.


      What answers it is `cpu.stat`: `nr_throttled / nr_periods`. That ratio is
      the fraction of periods that ended early because the quota was spent. Near
      zero means the container is using what it needs; near one means it is
      stopped in almost every period, and the requests that arrive during the
      stopped part inherit the period length as latency.


      `cpu.pressure` is the second reading and says it in one number: how much
      time tasks spent stalled waiting for CPU. A useful detail there is that
      `some` and `full` converge under quota throttling, because a spent quota
      stops the entire cgroup at once — so `some ≈ full` distinguishes "we are
      hitting our own quota" from "the node is busy".


      Before raising the limit I would check `nproc` against `cpu.max`. If the
      runtime sized a thread pool from the host's CPU count, more quota is
      treating a symptom.
    signal: >-
      Naming the ratio rather than the count is the key discriminator; absolute
      throttling numbers grow with uptime and mean nothing alone. Reaching for
      PSI is a modern answer. Checking `nproc` before raising the limit is the
      difference between someone who has fixed this and someone who has read
      about it.
    follow_ups:
      - "What does throttled_usec exceeding wall-clock time tell you?"
      - "When would you remove a CPU limit rather than raise it?"
      - "Why is CPU utilisation against a limit a bad thing to alert on?"

  - id: i3
    level: L3
    question: >-
      A container is OOM-killed. Its own memory limit is unset and its usage was
      80 MiB. Where do you look?
    model_answer: >-
      Up the path. The effective limit on a cgroup is the tightest limit between
      the root and itself, and most of that path is invisible from inside the
      container — the cgroup namespace re-roots the view so the container sees
      only its own node.


      In Kubernetes the usual answer is the pod cgroup. It has a limit of its
      own, roughly the sum of its containers' limits, and the containers share
      it. If one container has no limit set it can consume the headroom the
      others were relying on; the pod cgroup then hits its limit and the kernel
      picks a victim from inside it by `oom_score`, which is roughly "how much
      would killing this free". So the largest container dies, and that is very
      often not the one that grew.


      The command is to walk from the container's cgroup to the root reading
      `memory.max` at each level, on the node. I would also read `memory.peak`
      rather than `memory.current` for every container in the pod — a sidecar
      that buffers during an upstream outage looks small right now and may have
      touched 300 MiB at four in the morning.


      Above the pod, `kubepods.slice` caps everything the kubelet scheduled, and
      when that fills, pods within their own limits get killed too.
    signal: >-
      The insight is that the container's own files contain the evidence
      (`oom_kill` in `memory.events`) but not the explanation. Candidates who
      reach for `memory.peak` over `memory.current` have debugged a real
      intermittent spike. Knowing that the victim is chosen by size — so the
      culprit is usually not the casualty — is the senior version of the answer.
    follow_ups:
      - "Why would raising the killed container's own limit not help?"
      - "What does memory.oom.group change, and when would you set it?"
      - "How would you find every pod on a cluster with a limitless sidecar?"

  - id: i4
    level: L3
    question: >-
      Explain the difference between a Kubernetes request and a limit, at the
      cgroup level.
    model_answer: >-
      A CPU limit becomes `cpu.max` — a quota and a period, enforced always. A
      CPU request becomes `cpu.weight`, which is a share of *contended* CPU and
      does nothing at all on an idle node. The conversion is arithmetic: shares
      are millicores times 1024 over 1000, and the weight is
      `1 + (shares − 2) × 9999 / 262142`, so 100m becomes 4 and 2 CPUs becomes
      79.


      A memory limit becomes `memory.max`, the hard ceiling. A memory request
      becomes nothing in the cgroup tree at all by default — it is used by the
      scheduler to place the pod and by the kubelet to rank eviction. On a node
      with MemoryQoS enabled it also becomes `memory.min`, a protection.


      So three of the four numbers are readable back off a node with no cluster
      access, and the memory request is the one that is not. The practical
      consequence is that a memory request does nothing to protect a running
      container — it decides where the pod landed and how early it is evicted,
      and then stops mattering.


      The QoS class falls out of the combination rather than being set: requests
      equal to limits everywhere is Guaranteed, some requests set is Burstable,
      nothing set is BestEffort. That class is a directory name in the node's
      cgroup path, so you can read it off the node too.
    signal: >-
      The distinction to hear is that a request is a weight, not a reservation —
      which explains why proportional-sharing changes appear to do nothing in
      staging. Knowing that the memory request produces no cgroup file by
      default is an uncommon and genuinely useful piece of knowledge. QoS class
      as a directory rather than a label is the same kind of signal.
    follow_ups:
      - "What is the practical difference between Guaranteed and Burstable at runtime?"
      - "Why would requests equal to limits everywhere be a bad blanket policy?"
      - "How would you determine a pod's QoS class with no API server access?"

  - id: i5
    level: L3
    question: >-
      What is PSI, and what does it tell you that utilisation does not?
    model_answer: >-
      Pressure stall information: how much time tasks spent stalled waiting for
      CPU, memory or I/O, as a percentage over 10, 60 and 300 seconds, plus a
      monotonic total. It is per-cgroup in v2, which is what makes it usable
      per-workload.


      Utilisation measures the resource — how busy it is. Pressure measures the
      work — how much it is being delayed by not having enough. Those are
      different questions, and only the second is what anyone actually cares
      about. A resource at 100% utilisation with no pressure is perfectly sized;
      one at 60% with high pressure is a problem. Utilisation cannot express
      either of those statements.


      The two lines matter separately. `some` is time when at least one task was
      stalled, so work is being delayed. `full` is time when every task was
      stalled, so nothing is happening at all. Under CPU quota throttling they
      converge, because a spent quota stops the whole cgroup at once — which
      makes `some ≈ full` a useful fingerprint.


      For dashboards I would graph a rate over the `total=` counter rather than
      the averages; the averages are smoothed over windows you did not choose,
      and `total` composes properly with everything else.
    signal: >-
      "Measures the work, not the resource" is the sentence that shows it is
      understood rather than memorised. Distinguishing `some` from `full`
      correctly is the second discriminator. Preferring the total counter over
      the pre-averaged fields suggests the candidate has actually put this on a
      dashboard.
    follow_ups:
      - "Why did PSI need cgroup v2's unified hierarchy to exist?"
      - "What would you alert on: pressure, throttling, or both?"
      - "How would you use memory.pressure to distinguish a leak from a limit that is too tight?"
