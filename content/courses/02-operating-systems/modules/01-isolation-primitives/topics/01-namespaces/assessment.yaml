id: assessment.namespaces
topic: topic.namespaces
pass_score: 70

parts:
  - id: A
    title: Explain why capability dropping is load-bearing
    kind: explain
    objectives: [OBJ-A02.1.5, OBJ-A02.1.6]
    prompt: >-
      A colleague reviewing your Kubernetes manifests asks why you bother
      dropping all capabilities when "the container is namespaced anyway".


      Answer in about 200 words. Name the file you would read to settle it, say
      what you expect it to contain, and explain what capability dropping does
      and does not achieve.
    rubric:
      - "Names /proc/<pid>/uid_map and states the expected identity mapping (0 0 4294967295)"
      - "States that containers share the host's user namespace by default, so container uid 0 is host uid 0"
      - "Distinguishes what namespaces isolate (visibility) from what capabilities govern (authority)"
      - "Concludes that with a shared user namespace, capability dropping is the primary confinement rather than an extra layer"
      - "Notes the limit of the argument: capabilities reduce likelihood, a user namespace reduces consequence"
    model_answer: >-
      Read `/proc/<container-pid>/uid_map`. It will say `0 0 4294967295` — the
      identity mapping. That means the container is in the host's initial user
      namespace, and its uid 0 is the node's uid 0 with no translation
      whatsoever.


      Namespaces isolate what a process can *see*: its own process numbering,
      its own mounts, its own interfaces. They say nothing about what it may
      *do*. Authority comes from capabilities, and those are checked in the user
      namespace the process is in — which here is the host's.


      So "it's namespaced anyway" is true and does not help. If the process
      reaches past one of its namespaces — a hostPath volume, a device node, a
      kernel bug — it does so as real root on the node. The empty capability set
      is what makes that survivable: uid 0 that cannot mount, cannot load
      modules, cannot change ownership.


      With a shared user namespace, capability dropping is not defence in depth
      on top of isolation. It is the confinement.


      The honest limit: it reduces the likelihood of an escape mattering, not the
      consequence. Giving the container its own user namespace is what changes
      the consequence, because then root inside is nobody outside.
    common_failures:
      - "Asserting that containers are isolated without naming any file that would show it"
      - "Describing capability dropping as 'defence in depth', which is exactly the framing being corrected"
      - "Confusing the uid the container runs as with the mapping the user namespace applies"
      - "Stopping at 'capabilities are good' without the user-namespace caveat, which is what makes the argument honest"

  - id: B
    title: Diagnose three workloads from namespace evidence
    kind: diagnose
    objectives: [OBJ-A02.1.7, OBJ-A02.1.3, OBJ-A02.1.4]
    prompt: >-
      Three pods on one node. The node's own readings are:


      ```text
      pid:[4026531836]  net:[4026531992]  mnt:[4026531841]
      ipc:[4026531839]  uts:[4026531838]  user:[4026531837]
      ```


      **Pod one** — `pid:[4026531836] net:[4026532701] mnt:[4026532698]
      ipc:[4026532700] uts:[4026532699] user:[4026531837]`


      **Pod two** — `pid:[4026532812] net:[4026532815] mnt:[4026532809]
      ipc:[4026532811] uts:[4026532810] user:[4026531837]`, and inside it
      `CapEff: 000001ffffffffff`, `Seccomp: 0`


      **Pod three** — `pid:[4026532904] net:[4026531992] mnt:[4026532901]
      ipc:[4026532903] uts:[4026532902] user:[4026531837]`


      For each: what isolation is missing, which setting produced it, and what
      it can now do. Then rank them by urgency and justify the ranking.
    rubric:
      - "Pod one: shares the node's PID namespace (hostPID) — can see and signal every node process, and read their command lines"
      - "Pod three: shares the node's network namespace (hostNetwork) — node port space, node traffic, and no NetworkPolicy"
      - "Pod two: all namespaces its own, but privileged — full capabilities, no seccomp, so it can mount the node's filesystem"
      - "Explicitly discounts the user namespace match as universal rather than a finding"
      - "Ranks pod two first and justifies it as reachability rather than visibility"
    model_answer: >-
      **Pod one** shares the node's PID namespace — `hostPID: true`. It can
      enumerate and signal every process on the node and read their
      `/proc/<pid>/cmdline`, which routinely contains credentials passed as
      arguments. No capability is needed for any of that; the file is
      world-readable and the PID namespace was the only thing withholding it.


      **Pod three** shares the node's network namespace — `hostNetwork: true`.
      It is in the node's port space, can see node traffic, and — the part that
      gets missed — has no pod IP, so no NetworkPolicy selects it. Every rule
      anyone believed applied to it does not.


      **Pod two** has every namespace of its own and is the dangerous one:
      `CapEff: 000001ffffffffff` with `Seccomp: 0` is `privileged: true`. With
      `CAP_SYS_ADMIN` it can mount the node's disk inside its own mount
      namespace, and because it shares the host's user namespace it does so as
      real root.


      Every pod matches on `user` — that is true of every pod on a default
      cluster and is not a finding.


      **Ranking: two, then one, then three.** One and three are visibility
      failures, serious and bounded. Two is a reachability failure: it can read
      and write the node's filesystem, which is node compromise and, on a shared
      cluster, compromise of everything scheduled there. It also looks the most
      innocent of the three by inode comparison alone, which is the reason to
      check capabilities before concluding anything from namespaces.
    common_failures:
      - "Reporting the shared user namespace as a finding for each pod, which is true of every pod and buries the real findings"
      - "Ranking pod two last because its namespaces all differ — the trap the question is built around"
      - "Naming hostNetwork's port space but missing that NetworkPolicy stops applying"
      - "Claiming pod one needs a capability to read other processes' command lines"

  - id: C
    title: Decide on a request to share a namespace with the host
    kind: reason
    objectives: [OBJ-A02.1.8]
    prompt: >-
      A team running a payment reconciliation service has opened a pull request
      adding `hostNetwork: true`. Their justification: the service calls a
      licence server that only listens on the node's management interface, and
      routing to it through the cluster network "would take weeks of networking
      work we don't have".


      Write your review comment — about 200 words. Reach a decision, justify it
      in terms of what is given up, and say what you would accept instead.
    rubric:
      - "Reaches a clear decision rather than listing considerations"
      - "Names what hostNetwork gives up: node port space, node traffic visibility, and NetworkPolicy no longer applying"
      - "Identifies why this workload in particular makes that unacceptable"
      - "Proposes at least one concrete alternative rather than only refusing"
      - "Engages with the team's actual constraint instead of dismissing it"
    model_answer: >-
      Rejecting this, but the underlying need is real and I will help with it.


      `hostNetwork: true` puts the pod in the node's network namespace. That
      means the node's port space, visibility of node traffic, and — the one
      that decides this — no pod IP. NetworkPolicy selects pods by pod IP, so
      every ingress and egress rule we have written for this service silently
      stops applying. Nothing reports that; the rules just quietly select
      nothing.


      For a payment reconciliation service that is not a trade I can approve.
      This is the workload whose network policy we most want to be real, and the
      change removes it as a side effect of solving a routing problem.


      What I would accept, in order of how quickly you could have it:


      A `Service` of type `ExternalName`, or a headless `Service` with a manual
      `Endpoints` object pointing at the node's management address — that is an
      afternoon, not weeks, and the pod keeps its own network namespace.


      Failing that, `hostPort` on a sidecar that proxies to the licence server,
      so the exposure is one port on one container rather than the whole pod on
      the node's stack.


      Happy to pair on the Endpoints object this week if that helps.
    common_failures:
      - "Approving because the requirement is genuine, without weighing what is lost"
      - "Refusing with no alternative, which gets overruled the next time a release is blocked"
      - "Listing hostNetwork's downsides generically without saying why this workload makes them decisive"
      - "Treating 'weeks of networking work' as bad faith rather than checking whether it is true"
