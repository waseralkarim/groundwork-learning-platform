id: lab.the-pid-namespace
topic: topic.namespaces
title: What the PID, network and mount namespaces actually hide
type: guided
tier: 2
image: groundwork/lab-foundations:1
duration_minutes: 25
objectives: [OBJ-A02.1.3, OBJ-A02.1.4]

intro: >-
  The last lab established which views you have. This one is about what each
  view removes.


  You will count the processes you can see on a machine running hundreds, try to
  signal one you cannot see and read the error carefully, then do the equivalent
  for the network and mount namespaces. By the end you will have a
  one-line-per-dimension picture of what a container can and cannot observe —
  which is exactly the picture you need when someone asks why their debugging
  tool sees nothing.

setup:
  - /opt/lab/seed.sh

steps:
  - id: s1
    instruction: >-
      Count how many processes exist, as far as this process is concerned, and
      save the number to /tmp/answer-count.
    hint: "`ps -e --no-headers | wc -l > /tmp/answer-count`"
    walkthrough: |
      ps -e --no-headers | wc -l > /tmp/answer-count
      cat /tmp/answer-count
    verify:
      - type: file_matches
        path: /tmp/answer-count
        pattern: '^\s*[0-9]+\s*$'
        describe: You captured a process count
      - type: command_exit
        command: "test $(tr -d ' ' < /tmp/answer-count) -lt 20"
        exit_code: 0
        describe: Fewer than twenty processes are visible from in here

  - id: s2
    instruction: >-
      The host this runs on has hundreds. Confirm which process is PID 1 in your
      view, and save the full listing to /tmp/answer-ps.


      On a normal Linux machine PID 1 is systemd or init. Note what it is here.
    hint: "`ps -ef > /tmp/answer-ps`"
    walkthrough: |
      ps -ef > /tmp/answer-ps
      cat /tmp/answer-ps
    verify:
      - type: file_matches
        path: /tmp/answer-ps
        pattern: '\s1\s+0\s'
        describe: A process with PID 1 and PPID 0 is listed — this namespace's init

  - id: s3
    instruction: >-
      Now try to reach a process that is not in your namespace. PID 4242 almost
      certainly exists on the host and certainly does not exist here.


      Send it signal 0 — the existence check that does nothing — and save both
      the message and the exit status to /tmp/answer-signal.
    hint: >-
      `kill -0 4242 > /tmp/answer-signal 2>&1; echo "exit=$?" >>
      /tmp/answer-signal`
    walkthrough: |
      kill -0 4242 > /tmp/answer-signal 2>&1
      echo "exit=$?" >> /tmp/answer-signal
      cat /tmp/answer-signal
    verify:
      - type: file_matches
        path: /tmp/answer-signal
        pattern: "No such process"
        describe: The kernel reported ESRCH — no such process
      - type: command_exit
        command: "grep -qi 'not permitted' /tmp/answer-signal"
        exit_code: 1
        describe: It was not a permission error

  - id: s4
    instruction: >-
      Read that error again and write down which of these two it was, in
      /tmp/answer-why — the single word `nonexistent` or `forbidden`.


      This distinction is the whole PID namespace in one word.
    hint: >-
      "No such process" is ESRCH. "Operation not permitted" would be EPERM. Only
      one of them says the kernel found the target and refused you.
    walkthrough: |
      echo nonexistent > /tmp/answer-why
    verify:
      - type: file_matches
        path: /tmp/answer-why
        pattern: "^nonexistent$"
        describe: You read it as absence rather than refusal

  - id: s5
    instruction: >-
      Move to the network namespace. Save your interface list to
      /tmp/answer-links, and count them.


      A Kubernetes node typically has a dozen or more — eth0, docker0, cni0, a
      veth for every pod. Compare.
    hint: "`ip -o link > /tmp/answer-links`"
    walkthrough: |
      ip -o link > /tmp/answer-links
      cat /tmp/answer-links
      ip -o link | wc -l
    verify:
      - type: file_matches
        path: /tmp/answer-links
        pattern: "lo:"
        describe: Your own loopback is there
      - type: command_exit
        command: "test $(wc -l < /tmp/answer-links) -lt 5"
        exit_code: 0
        describe: You see a handful of interfaces, not a node's worth

  - id: s6
    instruction: >-
      Now the mount namespace. Save the mount table to /tmp/answer-mounts and
      find what is mounted at / — the filesystem type is the interesting part.
    hint: "`cat /proc/mounts > /tmp/answer-mounts` then look at the line for `/`"
    walkthrough: |
      cat /proc/mounts > /tmp/answer-mounts
      awk '$2 == "/" {print}' /tmp/answer-mounts
    verify:
      - type: file_matches
        path: /tmp/answer-mounts
        pattern: "overlay|/ / "
        describe: The root of this namespace is captured
      - type: file_matches
        path: /tmp/answer-mounts
        pattern: "tmpfs .*/tmp"
        describe: Your writable /tmp is a tmpfs mounted in this namespace

  - id: s7
    instruction: >-
      Finish with the UTS namespace, the smallest one. Save the hostname to
      /tmp/answer-hostname.


      Then consider: nothing on the host is called this. It is a name that
      exists only inside this namespace.
    hint: "`hostname > /tmp/answer-hostname`"
    walkthrough: |
      hostname > /tmp/answer-hostname
      cat /tmp/answer-hostname
    verify:
      - type: file_matches
        path: /tmp/answer-hostname
        pattern: '^\S+$'
        describe: A hostname was captured
      - type: command_ran
        pattern: "hostname"
        describe: You read it from the running system rather than a file

solution: |
  ```bash
  ps -e --no-headers | wc -l > /tmp/answer-count       # a handful
  ps -ef > /tmp/answer-ps                              # PID 1 is bash, not systemd

  kill -0 4242 > /tmp/answer-signal 2>&1               # No such process
  echo "exit=$?" >> /tmp/answer-signal
  echo nonexistent > /tmp/answer-why

  ip -o link > /tmp/answer-links                       # lo and eth0
  cat /proc/mounts > /tmp/answer-mounts                # overlay on /, tmpfs on /tmp
  hostname > /tmp/answer-hostname                      # a name only this namespace knows
  ```

  **What you just established.**

  **PID 1 is your shell.** On the host, PID 1 is systemd. Here it is bash,
  because the first process in a new PID namespace is numbered 1 there. Both
  numbers are real; neither is a translation of the other. This is where the
  PID 1 problem comes from — your application inherits init's special signal and
  orphan-reaping behaviour without being written for it.

  **`kill` failed with ESRCH, not EPERM, and that is the point.** "Operation not
  permitted" would mean the kernel found the process and refused you — a
  permission check, something a capability could change. "No such process" means
  there was nothing to find. PID 4242 is a real, running process a few
  microseconds away on the same kernel, and from in here it has no name.

  That is a stronger property than a permission check. There is no `--cap-add`
  for it, because nothing is being denied.

  **The network namespace is a whole stack, not a filter.** Two interfaces, one
  routing table, one set of firewall rules, one port space. Nothing is hidden
  from you; the host's interfaces are simply not in this namespace. It is why
  two containers can both bind 8080, and why `-p 8080:80` needs two numbers —
  it is a forwarding rule between two namespaces, not an "open port".

  **The mount table explains the shape of the sandbox.** `overlay` on `/` is the
  image, assembled from its layers. `tmpfs` on `/tmp` and `/home/learner` is
  everywhere you can write, and it is RAM that dies with the session. The
  host's filesystems are not unmounted — they were never mounted in this
  namespace.

  **Where this goes.** In **E29**, `hostPID: true` deletes the first finding,
  `hostNetwork: true` deletes the third, and `shareProcessNamespace` merges the
  first across a pod so a debug sidecar can see the app. Each is a decision to
  give up exactly one of the things you just measured — which is the only honest
  way to evaluate one.
