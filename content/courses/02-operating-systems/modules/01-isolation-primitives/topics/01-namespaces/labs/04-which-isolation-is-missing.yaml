id: lab.which-isolation-is-missing
topic: topic.namespaces
title: "Challenge: which isolation is this workload missing?"
type: challenge
tier: 2
image: groundwork/lab-foundations:1
duration_minutes: 30
objectives: [OBJ-A02.1.7]

intro: >-
  Three workloads are running on one Kubernetes node. All three passed review.
  One of them can read every process on the node, one can see every packet, and
  one can do more than either — and nobody wrote down which.


  Under /tmp/evidence you have what was collected from each: their namespace
  inodes, what `ps` and `ip` showed inside them, and the same readings taken on
  the node itself. That is everything you get. No pod specs, no manifests, no
  annotations — because in the incident this is drawn from, nobody could find
  them either.


  Work out what each one is missing, and say which you would stop first.

setup:
  - /opt/lab/seed.sh
  - /opt/lab/seed-namespaces.sh

steps:
  - id: s1
    instruction: >-
      Before reading any evidence, write to /tmp/hypotheses at least three
      distinct ways a containerised workload can end up seeing more of a node
      than it should — one per line.


      Commit to them now. The evidence is much less useful once you have already
      decided what it says.
    hint: >-
      Each namespace can be individually surrendered, and there is also a class
      of problem that is not about namespaces at all.
    walkthrough: |
      printf 'it shares the host PID namespace\nit shares the host network namespace\nit runs privileged with capabilities restored\n' > /tmp/hypotheses
    verify:
      - type: file_exists
        path: /tmp/hypotheses
        describe: You recorded hypotheses before looking
      - type: command_output
        command: "wc -l < /tmp/hypotheses"
        pattern: "[3-9]"
        describe: At least three hypotheses

  - id: s2
    instruction: >-
      Now do the comparison that answers most of this. For each workload, find
      which of its namespace inodes are identical to the node's.


      Collect your findings in /tmp/shared — one line per workload, naming the
      workload and the namespace types it shares with the node.
    walkthrough: |
      for pod in alpha bravo charlie; do
        shared=$(grep -o '^[a-z]*:\[[0-9]*\]' /tmp/evidence/$pod/namespaces.txt \
          | grep -Ff <(grep -o '^[a-z]*:\[[0-9]*\]' /tmp/evidence/host/namespaces.txt) \
          | cut -d: -f1 | tr '\n' ' ')
        echo "$pod: $shared"
      done > /tmp/shared
      cat /tmp/shared
    verify:
      - type: file_matches
        path: /tmp/shared
        pattern: "alpha:.*pid"
        describe: You found that alpha shares the node's PID namespace
      - type: file_matches
        path: /tmp/shared
        pattern: "bravo:.*net"
        describe: You found that bravo shares the node's network namespace

  - id: s3
    instruction: >-
      Confirm each finding against the other evidence rather than trusting the
      inodes alone. Save your corroboration to /tmp/corroboration.


      For alpha, something in its process listing should be impossible for an
      isolated pod. For bravo, something in its interface list should be.
    walkthrough: |
      {
        echo "alpha processes:"
        grep -E 'kubelet|systemd|etcd' /tmp/evidence/alpha/processes.txt
        echo "bravo interfaces:"
        grep -E 'cni0|flannel|veth' /tmp/evidence/bravo/interfaces.txt
      } > /tmp/corroboration
      cat /tmp/corroboration
    verify:
      - type: file_matches
        path: /tmp/corroboration
        pattern: "kubelet"
        describe: Alpha can see the node's kubelet — it is in the node's PID namespace
      - type: file_matches
        path: /tmp/corroboration
        pattern: "cni0|flannel"
        describe: Bravo can see the node's CNI interfaces — it is on the node's network

  - id: s4
    instruction: >-
      Charlie shares none of the node's namespaces. Its inodes are all its own,
      it sees three processes, it has one interface.


      Read the rest of its evidence and write what is wrong with it to
      /tmp/answer-charlie — a sentence naming the actual problem.
    walkthrough: |
      cat /tmp/evidence/charlie/status.txt /tmp/evidence/charlie/attempt.txt
      echo "charlie is namespaced correctly but privileged: full CapEff and CapBnd, no seccomp, no_new_privs off, so it can create namespaces and mount filesystems" > /tmp/answer-charlie
    verify:
      - type: file_matches
        path: /tmp/answer-charlie
        pattern: "privileg|capab|cap_sys_admin|CapEff"
        describe: You identified capabilities rather than a missing namespace
      - type: command_exit
        command: "test $(wc -w < /tmp/answer-charlie) -ge 8"
        exit_code: 0
        describe: You wrote a real explanation rather than one word

  - id: s5
    instruction: >-
      Now rank them. Write to /tmp/answer-worst the name of the workload that
      most urgently needs stopping, and on the following lines say why it is
      worse than the other two.


      All three are wrong. Only one of them can reach the whole node.
    walkthrough: |
      {
        echo charlie
        echo "alpha can see and signal node processes; bravo can see node traffic and bind node ports."
        echo "charlie holds cap_sys_admin with no seccomp and no_new_privs off, and shares the host user namespace,"
        echo "so its root is the node's root and it can mount the host filesystem. That is node compromise, not visibility."
      } > /tmp/answer-worst
      cat /tmp/answer-worst
    verify:
      - type: file_matches
        path: /tmp/answer-worst
        pattern: "^charlie"
        describe: You ranked the privileged workload above the two over-sharing ones
      - type: file_matches
        path: /tmp/answer-worst
        pattern: "mount|root|user namespace|node"
        describe: You justified it by what charlie can reach, not just by how it looks

  - id: s6
    instruction: >-
      Last question, and it is the one a reviewer actually gets asked. For each
      workload, write to /tmp/answer-fixes the single setting that produced it —
      the thing you would look for in the manifest.


      One line per workload.
    walkthrough: |
      {
        echo "alpha: hostPID: true"
        echo "bravo: hostNetwork: true"
        echo "charlie: securityContext.privileged: true"
      } > /tmp/answer-fixes
      cat /tmp/answer-fixes
    verify:
      - type: file_matches
        path: /tmp/answer-fixes
        pattern: "alpha:.*hostPID"
        describe: You named the setting behind alpha
      - type: file_matches
        path: /tmp/answer-fixes
        pattern: "bravo:.*hostNetwork"
        describe: You named the setting behind bravo
      - type: file_matches
        path: /tmp/answer-fixes
        pattern: "charlie:.*privileged"
        describe: You named the setting behind charlie

solution: |
  **The answers.**

  | Workload | Missing | Evidence | Setting |
  |---|---|---|---|
  | alpha | PID isolation | `pid:[4026531836]` matches the node's; `ps` shows kubelet, etcd, kube-apiserver | `hostPID: true` |
  | bravo | Network isolation | `net:[4026531992]` matches the node's; `ip` shows cni0, flannel.1, veths | `hostNetwork: true` |
  | charlie | Nothing namespaced — capability confinement | All inodes its own, but `CapEff: 000001ffffffffff`, `Seccomp: 0`, `NoNewPrivs: 0` | `privileged: true` |

  **The comparison that did the work.** Every diagnosis here came from one
  operation: intersect a workload's namespace inodes with the node's. Anything
  in both sets is a dimension in which that workload is not isolated. It needs
  no manifests, no cluster access beyond a shell, and no cooperation from
  whoever deployed it.

  Two inodes appeared in every intersection, and you should have ignored them
  both: `user:[4026531837]` and `time:[4026531834]`. Every container on the
  node shares those — the user namespace because Kubernetes does not enable user
  namespaces by default, the time namespace because almost nothing uses it. A
  shared namespace is only a finding when it is not shared by everything.

  **Why charlie is worse, despite looking better.** Alpha and bravo are
  *visibility* failures. Alpha can enumerate and signal node processes; bravo
  can sniff node traffic and bind node ports. Both are serious, both are
  bounded.

  Charlie is a *reachability* failure. Its `attempt.txt` shows it creating
  namespaces and mounting filesystems, which means it holds `CAP_SYS_ADMIN`.
  Combined with the shared user namespace — its root is the node's root, with no
  translation — it can mount the host's root filesystem and read or write
  anything on it. Perfectly namespaced, and it owns the node.

  That is the lesson the whole topic has been building to: **namespaces without
  capability confinement are not a security boundary.** Charlie has all eight of
  its own and it does not matter.

  **The routine.** For any workload you have a shell in:

  ```bash
  for t in pid net mnt ipc uts; do
    printf '%-4s %s vs %s\n' "$t" "$(readlink /proc/self/ns/$t)" "$(readlink /proc/1/ns/$t)"
  done
  grep -E 'CapEff|NoNewPrivs|Seccomp' /proc/self/status
  ```

  Five namespaces and three lines of status. If any of the five match a process
  you know to be the node's, that isolation is gone; if `CapEff` is large or
  `Seccomp` is 0, the isolation that remains is not doing the job you think it
  is.

  **Where this goes.** In **E29** these become policy rather than review:
  Pod Security Standards' `baseline` profile forbids `hostPID`, `hostNetwork`
  and `privileged` outright, and admission control refuses the manifest instead
  of relying on someone noticing. That is the right end state — but it only
  works if someone once understood what the three settings actually did, which
  is what you just did from evidence alone.
