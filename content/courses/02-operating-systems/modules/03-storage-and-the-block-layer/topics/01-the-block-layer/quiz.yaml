id: quiz.the-block-layer
topic: topic.the-block-layer
pass_score: 70

questions:
  - id: q1
    type: single_choice
    level: L2
    objectives: [OBJ-A02.4.1]
    stem: What has happened by the time a buffered `write()` returns?
    options:
      - id: a
        text: The bytes are in page cache, the pages are marked dirty, and nothing else
        correct: true
      - id: b
        text: The bytes are on the device, which is why the call can report a count
        note: >-
          The count is how many bytes were accepted into cache. Reaching the
          device happens later, and only `fsync` tells you it did.
      - id: c
        text: The filesystem has allocated blocks and queued a request
        note: >-
          Allocation and request building happen during writeback, which the
          write() path does not wait for.
      - id: d
        text: The bytes are in the device's own write cache, awaiting a flush
        note: >-
          That is one step further along than write() gets. Nothing has been
          handed to the device at all yet.
    explanation: >-
      `write()` copies into page cache, marks the pages dirty, and returns. The
      data exists in exactly one place — volatile memory — and if the machine
      loses power in the next thirty seconds it is gone, having been reported as
      successful. That gap is where storage performance and most storage
      incidents live.

  - id: q2
    type: single_choice
    level: L2
    objectives: [OBJ-A02.4.1]
    stem: Which of these does NOT trigger writeback of dirty pages?
    options:
      - id: a
        text: The process closing the file descriptor
        correct: true
      - id: b
        text: Dirty pages exceeding `dirty_background_ratio`
        note: >-
          This is exactly what starts background writeback — kernel threads
          begin writing, and nothing blocks.
      - id: c
        text: A page being older than `dirty_expire_centisecs`
        note: >-
          Age alone forces writeback, which is why data is not left in RAM
          indefinitely on an idle system.
      - id: d
        text: The application calling `fsync()`
        note: >-
          That is the explicit request, and the only one of the four that also
          waits for completion.
    explanation: >-
      `close()` does not flush. This surprises people regularly and is the
      source of a specific class of data-loss bug: a program writes a file,
      closes it, reports success, and the bytes are still only in page cache.
      Only `fsync` (or `fdatasync`) makes durability a promise rather than a
      probability.

  - id: q3
    type: single_choice
    level: L2
    objectives: [OBJ-A02.4.2]
    stem: >-
      A process shows `wchar: 67108864` and `write_bytes: 0`. Give the two
      explanations that are both consistent with this.
    options:
      - id: a
        text: The writes are buffered and not yet flushed, or the filesystem is a tmpfs with no device behind it
        correct: true
      - id: b
        text: The writes failed, or the file descriptor was invalid
        note: >-
          Failed writes do not increment `wchar`, and an invalid descriptor
          returns before anything is counted.
      - id: c
        text: The process wrote to a pipe, or write accounting is disabled
        note: >-
          A pipe would explain it, and there is no switch that disables this
          accounting — both halves would have to be true.
      - id: d
        text: The device has a write cache, or the writes were merged away
        note: >-
          A device write cache is still a device write and is counted. Merging
          reduces request counts, not byte counts.
    explanation: >-
      Both are common and they are genuinely different. Buffered writes will
      eventually produce `write_bytes` — at the background threshold, at expiry,
      or on `fsync`. Tmpfs writes never will, because there is no device: those
      bytes are memory, charged to the cgroup, and not reclaimable. The second
      case is a regular cause of container OOM kills on nodes with plenty of
      free memory.

  - id: q4
    type: single_choice
    level: L2
    objectives: [OBJ-A02.4.2]
    stem: What does it mean when `write_bytes` is substantially larger than `wchar`?
    options:
      - id: a
        text: Write amplification — the device did more work than the application asked for
        correct: true
      - id: b
        text: The counters are cumulative from different points and cannot be compared
        note: >-
          Both are cumulative from process start, over the same interval, so the
          comparison is valid.
      - id: c
        text: Other processes' writes are being attributed to this one
        note: >-
          The accounting is per task. Writeback done by kernel threads is a
          separate matter and does not inflate a process's own counter this way.
      - id: d
        text: The process is reading as well as writing, and the counters overlap
        note: >-
          Reads are counted separately in `rchar` and `read_bytes`. There is no
          overlap between the read and write counters.
    explanation: >-
      Something between the application and the device is enlarging the writes.
      The usual suspects are overlayfs copy-up (a whole file copied on first
      write), a filesystem journal, RAID parity, or 512-byte writes to a 4 KiB
      device becoming read-modify-write. In containers, copy-up is by far the
      most common, and it is why "databases need volumes" is a performance
      statement as well as a durability one.

  - id: q5
    type: single_choice
    level: L2
    objectives: [OBJ-A02.4.3]
    stem: >-
      `cat /sys/block/sda/queue/scheduler` prints `[none] mq-deadline kyber`.
      What does that tell you?
    options:
      - id: a
        text: Three schedulers are available and `none` is the one in use
        correct: true
      - id: b
        text: No scheduler is configured, and the other two are suggestions
        note: >-
          `none` is a scheduler — it is the choice to do no reordering, which is
          correct for devices that reorder better themselves.
      - id: c
        text: The device supports only `none`, and the rest are compiled in but unusable
        note: >-
          All three listed are usable on that device; writing any of the names
          to the file switches to it.
      - id: d
        text: The kernel will pick between them dynamically depending on load
        note: >-
          The choice is static until something writes to the file. There is no
          automatic switching.
    explanation: >-
      The bracketed entry is active and the rest are available. `none` means no
      kernel-side reordering, which is right for NVMe: the device has tens of
      thousands of queue entries and reorders with knowledge of its own flash
      layout that the kernel does not have. On anything slower, `mq-deadline` is
      the safer default because it stops a write stream starving reads.

  - id: q6
    type: single_choice
    level: L3
    objectives: [OBJ-A02.4.4]
    stem: >-
      A service writes at full speed for forty minutes and then every `write()`
      blocks for seconds. Nothing outside the machine changed. What happened?
    options:
      - id: a
        text: Dirty pages crossed `dirty_ratio`, so writers are now throttled to the device's speed
        correct: true
      - id: b
        text: The device's write cache filled and it began rejecting requests
        note: >-
          Devices do not reject writes when their cache fills; they slow down,
          and that would show as gradually rising `await` rather than a step
          change in the application.
      - id: c
        text: The filesystem ran out of contiguous space and began fragmenting
        note: >-
          Fragmentation degrades gradually and would not produce a sharp
          transition after a consistent period.
      - id: d
        text: The page cache filled, so reads and writes now contend for memory
        note: >-
          A full page cache reclaims clean pages transparently. It is the
          *dirty* fraction, which cannot be reclaimed, that causes throttling.
    explanation: >-
      This is a cliff, not a slope. Below `dirty_background_ratio` nothing is
      written back. Between it and `dirty_ratio`, kernel threads write back and
      nobody blocks — so the application still sees memory speed and the
      throughput graph is flat and healthy. Above `dirty_ratio`, `write()` blocks
      until pages are cleaned, and the application drops to device speed in one
      step. On a cloud volume that can be a twentyfold change arriving at once.

  - id: q7
    type: single_choice
    level: L3
    objectives: [OBJ-A02.4.4]
    stem: >-
      Why is `vm.dirty_bytes` often a better control than `vm.dirty_ratio` on a
      large node?
    options:
      - id: a
        text: A percentage of a large memory becomes an enormous amount of unwritten data
        correct: true
      - id: b
        text: '`dirty_ratio` is ignored on machines with more than 64 GiB of memory'
        note: >-
          It is honoured at any size. The problem is that honouring it produces
          a very large number.
      - id: c
        text: '`dirty_bytes` applies per cgroup, while `dirty_ratio` is system-wide'
        note: >-
          Both are system-wide. Per-cgroup writeback limits are a different
          mechanism entirely.
      - id: d
        text: '`dirty_ratio` is deprecated in current kernels'
        note: >-
          It is not deprecated and remains the default. Setting `dirty_bytes`
          simply overrides it.
    explanation: >-
      20% of a 128 GiB node is around 25 GiB of dirty pages. That is minutes of
      writeback on a network-attached volume, all of it lost on a crash, and a
      violent stall for whichever writer crosses the line. The percentages were
      sensible when machines had a gigabyte. An absolute figure sized to a few
      seconds of the device's real write rate keeps writeback continuous instead
      of turning it into a cliff.

  - id: q8
    type: single_choice
    level: L3
    objectives: [OBJ-A02.4.5]
    stem: >-
      Over ten seconds a device completed 1200 reads and accumulated 600 ms of
      read time. What is `r_await`, and what does it include?
    options:
      - id: a
        text: 0.5 ms, and it includes queue time as well as device service time
        correct: true
      - id: b
        text: 0.5 ms, and it is the device's service time alone
        note: >-
          The counter starts when the request enters the block layer, not when
          the device receives it, so queueing is included.
      - id: c
        text: 5 ms, since the interval is ten seconds
        note: >-
          The interval cancels: it is milliseconds-of-read-time divided by
          reads-completed, both measured over the same window.
      - id: d
        text: It cannot be computed without knowing the queue depth
        note: >-
          Queue depth is a separate derived figure. `await` needs only fields 7
          and 4.
    explanation: >-
      `r_await` is Δfield7 ÷ Δfield4 — 600 ÷ 1200 = 0.5 ms. It is measured from
      the moment the request is handed to the block layer, so a fast device
      behind a deep queue produces a large `await` while being perfectly
      healthy. Comparing `await` against average queue depth is what separates
      "the device is slow" from "the queue is deep".

  - id: q9
    type: single_choice
    level: L3
    objectives: [OBJ-A02.4.5]
    stem: >-
      An NVMe device reports 100% `%util`, `aqu-sz` 0.7 and `r_await` 0.2 ms. Is
      it saturated?
    options:
      - id: a
        text: 'No — the queue is under one request deep and reads take 200 microseconds'
        correct: true
      - id: b
        text: 'Yes — 100% utilisation is the definition of saturation'
        note: >-
          It is the definition of "something was in flight". For a device that
          serves thousands of requests concurrently, that is reached at a small
          fraction of its capability.
      - id: c
        text: 'Cannot tell without the throughput figure'
        note: >-
          Throughput would be the least informative of the four numbers here,
          since it means nothing without a request size.
      - id: d
        text: 'Yes — an aqu-sz above zero means requests are being delayed'
        note: >-
          A queue depth below one means requests are generally not waiting for
          each other at all.
    explanation: >-
      `%util` measures the fraction of the interval during which at least one
      request was in flight. That approximated saturation for a spinning disk
      serving one request at a time, and has been misleading on everything since.
      The honest signals here are the queue depth and `await`, and both say the
      device is nowhere near its limit — as does `io.pressure`, which reports how
      much time tasks actually spent stalled.

  - id: q10
    type: single_choice
    level: L3
    objectives: [OBJ-A02.4.6]
    stem: >-
      A rotational disk running the `none` scheduler shows `r_await` 300 ms and
      `w_await` 2 ms, with writes outnumbering reads 24 to 1. What is happening?
    options:
      - id: a
        text: Reads are being starved by the write stream, because `none` gives them no deadline
        correct: true
      - id: b
        text: The device is failing, since 300 ms is far outside its specification
        note: >-
          A failing device would slow writes too. Writes are completing in 2 ms,
          so the hardware is serving requests perfectly well.
      - id: c
        text: The reads are much larger than the writes, so they take proportionally longer
        note: >-
          Possible in general, and the sector counts here do not support it —
          the reads are ordinary sized.
      - id: d
        text: Readahead is disabled, so each read costs a separate seek
        note: >-
          That would raise read latency modestly, not by two orders of magnitude
          relative to writes on the same device.
    explanation: >-
      Merging adjacent writes is the efficient thing to do, so a scheduler with
      no deadline will keep doing it, and a read arriving into that stream can
      wait effectively without bound. `mq-deadline` exists for exactly this: it
      gives reads an expiry the scheduler must honour, which caps how long the
      starvation can go on. It costs very little and it converts an unbounded
      failure into a bounded one.

  - id: q11
    type: single_choice
    level: L3
    objectives: [OBJ-A02.4.6]
    stem: >-
      Why is `none` the right scheduler for NVMe when it does no reordering at
      all?
    options:
      - id: a
        text: The device reorders internally with knowledge of its own layout that the kernel lacks
        correct: true
      - id: b
        text: NVMe devices are fast enough that ordering cannot affect throughput
        note: >-
          Ordering does affect NVMe throughput — it is just that the device is
          better placed to decide it than the kernel is.
      - id: c
        text: The NVMe driver implements its own scheduler, so the block layer's would duplicate it
        note: >-
          The driver does not schedule. The reordering happens in the device's
          firmware, below the driver entirely.
      - id: d
        text: '`none` was chosen for compatibility and `mq-deadline` would be better'
        note: >-
          `mq-deadline` on NVMe adds CPU cost and a serialisation point for very
          little benefit. `none` is a deliberate choice.
    explanation: >-
      An NVMe device has tens of thousands of queue entries and reorders using
      information the kernel does not have — how the flash is laid out, what is
      being garbage-collected, which channels are free. Kernel-side reordering
      adds CPU cost and gets in the way of a better decision made downstream. The
      general principle: schedule where the knowledge is.

  - id: q12
    type: single_choice
    level: L3
    objectives: [OBJ-A02.4.7]
    stem: >-
      A container changes one byte in a 2 GB file on its overlay filesystem. How
      much I/O does that cause?
    options:
      - id: a
        text: About 2 GB read and 2 GB written — the whole file is copied up first
        correct: true
      - id: b
        text: One 4 KiB read-modify-write, as on any filesystem
        note: >-
          That is what happens *after* the file has been copied up. The first
          write to it pays for the whole file.
      - id: c
        text: 2 GB written but nothing read, since the new content is known
        note: >-
          Copy-up must read the original from the lower layer before it can be
          reproduced in the upper one.
      - id: d
        text: Nothing until the container exits, when the layer is flushed
        note: >-
          The writable layer is an ordinary filesystem and writes normally. It
          is deleted at exit, not flushed at exit.
    explanation: >-
      Overlayfs is copy-on-write at *file* granularity, not block granularity.
      The first write to a file living in a lower layer copies the whole file
      up — reading all of it, then writing all of it — before applying the
      change. For a database, with large data files and small constant
      modifications, this is close to a worst case, and it explains the
      characteristic symptom: fine for weeks, then a migration takes forty
      minutes instead of ninety seconds.

  - id: q13
    type: single_choice
    level: L3
    objectives: [OBJ-A02.4.7]
    stem: >-
      A pod writes 2 GB of temporary files to `/tmp` and is OOM-killed. Its
      memory limit is 1 GiB; the node has 60 GiB free. Why?
    options:
      - id: a
        text: '`/tmp` is a tmpfs, so those "files" are unreclaimable memory charged to the pod'
        correct: true
      - id: b
        text: The page cache for those writes counted against the pod and could not be reclaimed in time
        note: >-
          Ordinary file-backed page cache *is* reclaimable — the kernel drops it
          under pressure. Tmpfs pages have nowhere to be written back to.
      - id: c
        text: The node was under memory pressure, and the pod was the largest consumer
        note: >-
          The node has 60 GiB free. The limit being enforced is the pod's own,
          exactly as in the cgroups topic.
      - id: d
        text: Writeback could not keep up, so dirty pages accumulated past the limit
        note: >-
          There is no writeback for tmpfs, and no device for it to target.
          Nothing was ever going to drain.
    explanation: >-
      Tmpfs lives entirely in page cache with no backing device. Its pages are
      charged to the cgroup that touched them and are **not** reclaimable, since
      there is nowhere to write them. The cgroup reaches `memory.max`, reclaim
      finds nothing to take, and the OOM killer fires. The tells are `wchar`
      large with `write_bytes` at zero, and `shmem` large in `memory.stat`.

  - id: q14
    type: single_choice
    level: L3
    objectives: [OBJ-A02.4.8]
    stem: >-
      Which single figure is least useful for judging whether storage is a
      problem?
    options:
      - id: a
        text: Throughput in MB/s, quoted without a request size
        correct: true
      - id: b
        text: '`io.pressure` stall time'
        note: >-
          This is among the most useful: it measures how much the work was
          delayed, rather than how busy the device looked.
      - id: c
        text: Average queue depth alongside `await`
        note: >-
          Together these separate a slow device from a deep queue, which is the
          distinction most diagnoses turn on.
      - id: d
        text: '`write_bytes` compared with `wchar`'
        note: >-
          This ratio identifies amplification, buffering and tmpfs — three
          entirely different situations that look alike from outside.
    explanation: >-
      50 MB/s of 4 KiB random writes is about 12800 IOPS and a great deal of
      work; 50 MB/s of 1 MiB sequential writes is 50 IOPS and nearly idle. The
      same number describes a saturated device and an idle one. Throughput is
      only meaningful with a request size beside it, and by the time you have
      that you usually have better numbers to look at.

  - id: q15
    type: single_choice
    level: L3
    objectives: [OBJ-A02.4.8]
    stem: >-
      You can add one storage alert to a cluster that has none. Which do you
      choose?
    options:
      - id: a
        text: '`io.pressure` stall time per workload'
        correct: true
      - id: b
        text: Disk utilisation above 90%
        note: >-
          This saturates at 100% on any device that serves requests
          concurrently, so it fires on healthy services and cannot distinguish
          them from sick ones.
      - id: c
        text: Throughput below an expected baseline
        note: >-
          Low throughput is equally consistent with low demand. It would page
          somebody every quiet night.
      - id: d
        text: Average queue depth above 1
        note: >-
          A reasonable signal and heavily device-dependent — a depth of 1 is
          alarming for one device and unremarkable for another.
    explanation: >-
      Pressure measures the work rather than the device: how much time tasks
      spent stalled waiting for I/O. It is comparable across device types, it
      does not saturate, and a rise in it means something is actually being
      delayed. Utilisation and throughput both need interpretation before they
      mean anything, and both routinely mean the opposite of what they appear to.
