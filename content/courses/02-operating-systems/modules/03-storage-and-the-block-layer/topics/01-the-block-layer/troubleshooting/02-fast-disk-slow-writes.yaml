id: troubleshooting.fast-disk-slow-writes
topic: topic.the-block-layer
title: We moved to NVMe and the database got slower
level: L3
objectives: [OBJ-A02.4.8, OBJ-A02.4.7]
reveal_policy: progressive

situation: >-
  A PostgreSQL instance was moved from a VM with a SATA SSD to a Kubernetes node
  with local NVMe. The hardware benchmark was unambiguous: sequential throughput
  went from 480 MB/s to 3.1 GB/s.


  Commit latency went from 1.8 ms to 14 ms. Throughput on the actual workload
  fell by about 60%. Every dashboard the platform team has says the storage is
  healthy: `%util` occasionally reaches 100%, which they have noted, but `await`
  averages 0.3 ms, well under the old 1.1 ms.


  The database team want to move back. The platform team point out that the new
  hardware is measurably six times faster and that the benchmark proves it.


  Both are right about their own measurement. Work out what is happening before
  reading on.

symptoms:
  - "Commit latency 1.8 ms before, 14 ms after"
  - "Sequential throughput benchmark: 480 MB/s before, 3.1 GB/s after"
  - "Device `await` averages 0.3 ms, better than the old 1.1 ms"
  - "Transaction throughput down about 60%"
  - "Reads are fine — query latency for read-only queries is unchanged or better"
  - "The problem is worst during checkpoints and during any schema change"

artifacts:
  - type: command_output
    label: How the data directory is mounted
    content: |
      $ kubectl exec pricing-db-0 -- findmnt -no SOURCE,FSTYPE,OPTIONS /var/lib/postgresql/data
      overlay  overlay  rw,relatime,lowerdir=/var/lib/containerd/...,upperdir=/var/lib/containerd/...

      # on the old VM, for comparison
      $ findmnt -no SOURCE,FSTYPE,OPTIONS /var/lib/postgresql/data
      /dev/sdb1  ext4  rw,relatime

  - type: command_output
    label: The container's I/O counters, over one hour of steady load
    content: |
      $ kubectl exec pricing-db-0 -- grep -E 'rchar|wchar|read_bytes|write_bytes' /proc/1/io
      rchar:        48318382080
      wchar:         8589934592
      read_bytes:   47244640256
      write_bytes: 103079215104

  - type: command_output
    label: Device counters on the node
    content: |
      # nvme0n1, ten seconds apart
      259 0 nvme0n1 8100000 0 890000000 2400000 3900000 0 1240000000 900000 0 900000 3300000 0 0 0 0 1840000 92000
      259 0 nvme0n1 8104000 0 890512000 2401200 3919000 0 1244864000 903800 0 910000 3315000 0 0 0 0 1852000 95400

  - type: config
    label: The StatefulSet, abridged
    content: |
      spec:
        containers:
          - name: postgres
            image: postgres:17
            # volumeMounts: (none)
        # volumeClaimTemplates: (none)

  - type: log
    label: PostgreSQL's own view
    content: |
      LOG:  checkpoint starting: time
      LOG:  checkpoint complete: wrote 41822 buffers (12.8%); 0 WAL file(s) added;
            write=182.442 s, sync=41.882 s, total=224.918 s
      LOG:  duration: 14.221 ms  statement: COMMIT

diagnostic_questions:
  - "Compare wchar with write_bytes. What ratio is that, and what does it mean?"
  - "What is the data directory actually mounted on, and what is missing from the StatefulSet?"
  - "Compute the device's flush rate from the two diskstats samples. What issues flushes?"
  - "Why are reads unaffected while writes are twelve times worse?"
  - "Why does the sequential benchmark not predict any of this?"

hints:
  - "The two byte counters disagree by a factor. Which direction, and what enlarges writes?"
  - "Fields 19 and 20 of diskstats are flush requests and time spent flushing."
  - "Look at what the StatefulSet does *not* contain."
  - "A sequential throughput benchmark measures one thing. Which thing does a database commit depend on?"

root_cause: >-
  The data directory is on the container's overlay filesystem. There is no
  volume in the StatefulSet at all — no `volumeMounts`, no
  `volumeClaimTemplates` — so PostgreSQL is writing into the container's
  writable layer.


  The counters say what that costs: `wchar` of 8.6 GB against `write_bytes` of
  103 GB. **Twelve times amplification.** The reads confirm the mechanism —
  `read_bytes` of 47 GB against a workload that should be reading almost
  entirely from shared buffers, which is overlayfs reading whole files out of
  the lower layer in order to copy them up.


  Overlayfs is copy-on-write at file granularity. PostgreSQL's data files are
  1 GB segments and it modifies 8 KB pages inside them constantly, so the first
  write to each segment copies the entire segment before applying the change.
  Checkpoints touch many segments at once, which is exactly when the symptom is
  worst — 182 seconds of checkpoint write time says so.


  On top of that, `fsync` on overlayfs has to satisfy both layers, and the flush
  counters show what that costs: 12000 flushes in ten seconds, 3400 ms spent
  flushing — about 0.28 ms per flush, at 1200 flushes per second. Commit latency
  is dominated by flush latency, and there are now far more flushes than the
  application issued.


  The `await` figure of 0.3 ms is real and irrelevant. The device is serving
  each individual request quickly; there are simply twelve times too many of
  them, and each commit waits for a flush chain through two filesystem layers.
  A benchmark that measured sequential throughput could not have predicted any
  of it, because commit latency does not depend on sequential throughput.

method: >-
  **1. Compare the two write counters before anything else.** 8.6 GB asked for,
  103 GB delivered. A ratio of 12 is not a tuning problem; something between the
  application and the device is enlarging the work by an order of magnitude, and
  no device-side change will fix it.


  **2. Note that the reads are the corroboration.** A database serving from
  shared buffers should not be reading 47 GB from disk. Copy-up must *read* the
  original before it can reproduce it, so a large `read_bytes` beside a large
  `write_bytes` is the fingerprint. Either alone is ambiguous; together they
  name the mechanism.


  **3. Look at the mount, and then at what the manifest omits.** `overlay
  overlay` on a database data directory is the finding. The StatefulSet has no
  volume of any kind, which means the state is not merely slow but is deleted
  when the pod is rescheduled — a second, worse problem that nobody has hit yet.


  **4. Read the flush counters, because commits are flushes.** Fields 19 and 20
  give 12000 flushes and 3400 ms in ten seconds. Database commit latency is
  fsync latency, and fsync through two filesystem layers is more expensive than
  through one. This is why the *sequential benchmark* was so misleading: it
  measured the one property that commits do not depend on.


  **5. Reconcile the two teams' evidence rather than choosing between them.**
  The device is faster — that benchmark is honest. The database is slower — that
  measurement is honest too. Both are true because the new environment inserted
  a filesystem layer that multiplies writes by twelve. Saying so explicitly is
  what ends the argument; picking a side prolongs it.


  The general habit: when two correct measurements disagree, look for the thing
  that changed between where one is taken and where the other is.

resolution: >-
  **Give it a volume. That is the fix, and everything else is secondary.**


  ```yaml
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: local-nvme
        resources:
          requests:
            storage: 500Gi
  ```

  ```yaml
  volumeMounts:
    - name: data
      mountPath: /var/lib/postgresql/data
  ```


  A volume mounts the underlying filesystem straight into the container,
  bypassing overlayfs entirely. Expect the write amplification to disappear and
  commit latency to fall below the old VM's figure, because the device really is
  faster once it is being asked to do the right amount of work.


  This is a migration, not a config change: the data has to be dumped and
  restored, or copied while the instance is down. Plan it as such.


  **Say plainly that this was also a data-loss risk.** A StatefulSet with no
  volume loses its data whenever the pod is rescheduled — a node drain, an
  eviction, an image update. The performance problem is what got noticed; the
  durability problem is the one that would have ended worse. It is worth being
  direct about that in the write-up, because "it is only a cache" tends to be
  how these get approved.


  **Then fix the benchmark, because it will mislead the next migration too.** A
  sequential throughput number does not predict database performance. What does:


  ```bash
  # commit-shaped: small writes, each fsynced
  fio --name=commit --rw=write --bs=8k --size=1G --fsync=1 --runtime=60
  # and the same *through the same filesystem path the database will use*
  ```


  Benchmark the path, not the device. The device was never the problem.


  **Finally, add the counter that would have caught it in an afternoon:**


  ```promql
  rate(container_fs_writes_bytes_total[5m])
    / rate(container_fs_write_seconds_total[5m])   # or export /proc/PID/io directly
  ```


  A write-amplification ratio is cheap to compute and there is no reasonable
  value above about 2. Twelve would have been visible from the first hour.
