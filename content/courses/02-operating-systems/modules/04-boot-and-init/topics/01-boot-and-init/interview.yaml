topic: topic.boot-and-init

questions:
  - id: i1
    level: L2
    question: Walk me through what happens between power-on and a login prompt.
    model_answer: >-
      Firmware first — UEFI or BIOS. It initialises hardware and loads a
      bootloader. UEFI finds it by a path recorded in NVRAM on the EFI system
      partition, which is the one filesystem firmware can read.


      The bootloader — GRUB or systemd-boot — picks a kernel, assembles the
      kernel command line, loads the kernel and the initramfs into memory, and
      jumps to the kernel.


      The kernel unpacks the initramfs into a RAM filesystem and runs `/init`
      inside it. That stage exists to solve a circular dependency: the driver
      needed to read the root filesystem lives on the root filesystem. So the
      initramfs carries exactly the modules this machine needs — NVMe, RAID,
      LUKS, LVM — assembles or unlocks whatever is required, and then
      `switch_root` pivots to the real root and frees the RAM disk.


      `/sbin/init` on the real root becomes PID 1, which on most systems is
      systemd. It starts units in dependency order until the default target is
      reached, and one of those is a getty on a console, which is the login
      prompt.


      The whole thing is readable afterwards: `/proc/cmdline` for what the
      bootloader chose, `btime` in `/proc/stat` for when it happened.
    signal: >-
      The initramfs explanation is the discriminator. Candidates who describe it
      as "a small filesystem loaded at boot" have memorised the stage;
      candidates who name the circular dependency have understood why it exists
      and can therefore diagnose a machine that will not find its own disk.
    follow_ups:
      - "What breaks if the initramfs is regenerated without the storage driver?"
      - "How would you check what parameters this machine actually booted with?"
      - "What is the first thing you type at a bootloader when a machine will not boot?"

  - id: i2
    level: L3
    question: >-
      What is the difference between `Requires=` and `After=` in a systemd unit,
      and why does it matter?
    model_answer: >-
      They answer different questions and neither implies the other.
      `Requires=` is *whether*: pull that unit in as well, and if it fails to
      start, we fail too. `After=` is *when*: do not start until that unit has
      finished starting. They are completely orthogonal.


      So `Requires=postgres.service` on its own starts both at the same instant.
      The service comes up, connects to a database that is still initialising,
      and fails. It is a race, so it passes on a developer's laptop and in CI and
      fails on a loaded production node, with a connection-refused error pointing
      at the wrong service. Almost every real dependency wants both lines.


      Two things I would add. `Requires=` is stronger than people expect —
      failure propagates, and with `BindsTo=` so does stopping — so `Wants=` is
      the better default unless you genuinely want your service to die with its
      dependency.


      And even with both lines it is not finished, because `After=` waits for the
      other unit to have *started*, and for `Type=simple` that means `exec()`
      returned. Closing the race properly needs the dependency to be
      `Type=notify` so it reports real readiness — which is exactly what a
      Kubernetes readiness probe is.
    signal: >-
      "Whether versus when" in the first sentence is the answer. Explaining the
      failure as a race that passes in CI shows they have debugged it rather
      than read about it. Volunteering that `After=` on a `Type=simple` unit is
      still not enough is the senior version, and it is the step most people
      stop short of.
    follow_ups:
      - "When would you use Wants= instead of Requires=?"
      - "What does After= actually wait for, and does that depend on anything?"
      - "How would you find every unit in a fleet with this bug?"

  - id: i3
    level: L3
    question: >-
      A unit has `Restart=always` and is sitting in a failed state. Explain how
      that is possible.
    model_answer: >-
      It hit its start rate limit. `StartLimitBurst` starts within
      `StartLimitIntervalSec` — five in ten seconds by default — and exceeding
      that stops systemd retrying regardless of what `Restart=` says. A service
      that crashes instantly reaches five attempts in well under a second,
      especially with a low `RestartSec`. The journal says `Start request
      repeated too quickly` and the result is `start-limit-hit`.


      The operationally important part is that systemd stops *permanently*. Fix
      the underlying problem and nothing happens, because nothing is going to try
      again. I have seen hours spent re-investigating a solved problem for
      exactly this reason, and the tell is an empty journal — a service that is
      still failing produces failures, and silence means nobody is attempting it.


      The fix is `systemctl reset-failed` and then start it. Then raise
      `RestartSec` rather than the burst: five attempts five seconds apart cannot
      reach a five-in-ten-seconds limit, so the protection stays and a real
      service stops tripping it.


      Kubernetes differs here in a way worth knowing. `CrashLoopBackOff` keeps
      retrying with a growing interval capped at five minutes, so a pod does
      recover on its own after a fix — but possibly not for five minutes, which
      produces the same "it is still broken" report for the opposite reason.
    signal: >-
      Knowing the limit overrides the restart policy is the core. Knowing it
      stops permanently, and that `reset-failed` is therefore required, is what
      separates someone who has been on call for a systemd machine. Reading an
      empty journal as evidence rather than as a gap is a strong extra.
    follow_ups:
      - "Why raise RestartSec rather than StartLimitBurst?"
      - "What in the journal would tell you this had happened?"
      - "How does Kubernetes handle the same situation differently?"

  - id: i4
    level: L3
    question: >-
      Why does a container often take the full grace period to stop, and what
      would you do about it?
    model_answer: >-
      Because the application is PID 1 and never installed a SIGTERM handler.


      The kernel treats PID 1 specially: signals with no *installed* handler are
      not given their default action, they are discarded. So `docker stop` sends
      SIGTERM, the application ignores it — not deliberately, it simply has
      nothing registered — the grace period expires, and SIGKILL arrives, which
      nothing can ignore.


      The costs are real: in-flight requests dropped, buffers unflushed,
      connections not drained, and ten or thirty seconds added to every pod
      deletion. If every pod in a deployment takes exactly its
      `terminationGracePeriodSeconds`, that is a diagnosis rather than a
      coincidence.


      Two fixes, and they are not alternatives. Handle SIGTERM in the
      application — stop accepting, drain, exit — which is correct regardless and
      is the only thing that knows what draining means. And run a real init:
      `docker run --init`, or tini as the entrypoint, which forwards signals to
      your process and also reaps the orphaned children PID 1 inherits and your
      application is not collecting. An init cannot shut your service down
      gracefully, and a signal handler cannot reap processes it never started.
    signal: >-
      The precise mechanism — no default action for PID 1, as distinct from the
      signal being blocked or ignored — is the discriminator. Naming both fixes
      *and* why each is insufficient alone is the strong answer. The observation
      about every pod taking exactly the grace period shows they have noticed it
      in the wild.
    follow_ups:
      - "What is the second job an init does that your application is not doing?"
      - "How would you demonstrate this on a running container?"
      - "What does a preStop hook add that a SIGTERM handler does not?"

  - id: i5
    level: L3
    question: >-
      A boot is slow. How do you find out why, and what would you actually
      change?
    model_answer: >-
      `systemd-analyze` first, for the split across firmware, loader, kernel and
      userspace — that alone says whether the problem is even in systemd's half.


      Then `systemd-analyze critical-chain`, not `blame`. They answer different
      questions and people reach for the wrong one. `blame` lists the slowest
      units, most of which started in parallel and cost nothing; making one of
      those faster changes the total by zero. `critical-chain` shows the
      dependency path that determined when boot finished, which is the only list
      where an improvement is an improvement.


      What I would change, in order: remove dependencies rather than shorten
      durations. A unit ordered `After=network-online.target` that does not
      actually need the network can often drop the line and start immediately,
      which is worth more than optimising anything. Then disable what is not
      used, since the fastest unit is one that does not run.


      For containers the equivalent question usually has a different answer:
      image pull time dominates start-up far more often than anything inside the
      container, so the useful lever is image size rather than anything in the
      entrypoint.
    signal: >-
      Distinguishing `critical-chain` from `blame`, and being able to say why
      `blame` misleads, is the main signal. "Remove the dependency rather than
      shorten the duration" shows they have actually made a boot faster.
      Recognising that the containerised version of the question has a different
      answer is a good sign of transfer.
    follow_ups:
      - "Why is network-online.target so often unnecessary?"
      - "What would you look at if the time was in the kernel rather than userspace?"
      - "What is the equivalent measurement for a pod?"
