id: quiz.boot-and-init
topic: topic.boot-and-init
pass_score: 70

questions:
  - id: q1
    type: single_choice
    level: L2
    objectives: [OBJ-A02.5.1]
    stem: What does UEFI firmware hand to the next stage of boot?
    options:
      - id: a
        text: Control, after loading a bootloader it found by path on the EFI system partition
        correct: true
      - id: b
        text: A mounted root filesystem, ready for the kernel to use
        note: >-
          Firmware cannot mount the root. It reads one FAT partition and nothing
          else — mounting is the kernel's job, and it needs the initramfs first.
      - id: c
        text: The kernel itself, which firmware loads directly from disk
        note: >-
          The bootloader loads the kernel. Firmware loads the bootloader, which
          is why replacing the bootloader does not require touching firmware.
      - id: d
        text: A list of hardware devices for the kernel to enumerate
        note: >-
          The kernel enumerates hardware itself. Firmware tables exist, but they
          are not the handover.
    explanation: >-
      UEFI initialises hardware, then finds a bootloader by a path recorded in
      NVRAM on the EFI system partition — the one filesystem it can read, FAT.
      Legacy BIOS could not even do that: it read the first 512 bytes of a disk
      and jumped to them, which is why MBR bootloaders were a two-stage
      arrangement squeezed into 446 bytes.

  - id: q2
    type: single_choice
    level: L2
    objectives: [OBJ-A02.5.1]
    stem: What is `switch_root` doing?
    options:
      - id: a
        text: Pivoting from the initramfs to the real root filesystem and freeing the RAM disk
        correct: true
      - id: b
        text: Changing which user the boot process runs as
        note: >-
          Nothing about boot changes user at this point. Everything so far is
          uid 0 and stays that way until services drop privilege.
      - id: c
        text: Remounting the root filesystem read-write after a filesystem check
        note: >-
          That also happens, and it is a separate step done by init afterwards —
          not what switch_root is.
      - id: d
        text: Selecting between multiple installed root filesystems at the bootloader menu
        note: >-
          That choice was made earlier, by the bootloader, and expressed as
          `root=` on the kernel command line.
    explanation: >-
      The initramfs exists only to make the real root mountable. Once it has
      loaded the drivers, assembled the RAID, unlocked the LUKS volume or
      activated the LVM group, `switch_root` makes the real root `/`, frees the
      RAM disk, and executes `/sbin/init` from it — which becomes PID 1.

  - id: q3
    type: single_choice
    level: L2
    objectives: [OBJ-A02.5.2]
    stem: >-
      A machine will not boot and you have one chance to edit the kernel command
      line. Which parameter gives you the best chance of a usable shell?
    options:
      - id: a
        text: '`init=/bin/sh` — bypass init entirely and get a shell as PID 1 on the real root'
        correct: true
      - id: b
        text: '`single` — boot to single-user mode'
        note: >-
          A good second choice, and it still runs init. If init itself is what
          is broken, it will fail the same way.
      - id: c
        text: '`quiet` — suppress the noise so the error is visible'
        note: >-
          `quiet` hides messages rather than revealing them. Removing it is
          sometimes useful; adding it never is.
      - id: d
        text: '`ro` — mount the root read-only so nothing can be damaged further'
        note: >-
          The root is usually mounted read-only at this stage anyway, and
          read-only does not help you run anything.
    explanation: >-
      `init=/bin/sh` is the recovery of last resort because it removes systemd
      from the picture completely: the kernel mounts the real root and runs a
      shell as PID 1. Everything is present and nothing is started. From there
      you can `mount -o remount,rw /`, read the journal of the previous boot, and
      rebuild the initramfs.

  - id: q4
    type: single_choice
    level: L2
    objectives: [OBJ-A02.5.2]
    stem: What does `panic=0` on the kernel command line do?
    options:
      - id: a
        text: Hang forever after a kernel panic, keeping the message on screen
        correct: true
      - id: b
        text: Disable kernel panics, so the machine continues after a fatal error
        note: >-
          A panic means the kernel cannot safely continue. There is no setting
          that makes it continue anyway.
      - id: c
        text: Reboot immediately after a panic
        note: >-
          That is `panic=-1`. A positive value waits that many seconds first.
      - id: d
        text: Write a crash dump before rebooting
        note: >-
          Crash dumps are kdump's job, configured separately. `panic=` only
          decides what happens to the machine afterwards.
    explanation: >-
      `panic=N` is how many seconds to wait before rebooting: `0` means never,
      `-1` means immediately. The trade is real. Hanging keeps the panic output
      where somebody standing at the machine can read it; rebooting restores
      service in seconds and loses the message unless a serial console or crash
      dump captured it. Neither is right for every machine.

  - id: q5
    type: single_choice
    level: L2
    objectives: [OBJ-A02.5.3]
    stem: Why does an initramfs exist at all?
    options:
      - id: a
        text: The driver needed to read the root filesystem lives on the root filesystem
        correct: true
      - id: b
        text: To speed up boot by loading commonly used files into RAM in advance
        note: >-
          It is discarded as soon as the real root is mounted, and it makes boot
          slightly slower rather than faster.
      - id: c
        text: To provide a recovery environment if the real root is damaged
        note: >-
          A useful side effect — many initramfs images drop to a shell on
          failure — but not the reason it exists.
      - id: d
        text: To hold the bootloader configuration the kernel needs to read
        note: >-
          The bootloader has finished by this point, and its configuration was
          read before the kernel was loaded.
    explanation: >-
      It breaks a circular dependency. To mount the root the kernel needs a
      driver for the controller it is on — NVMe, RAID, LUKS, LVM, iSCSI — and
      that module lives in `/lib/modules` on the root it cannot mount yet. A
      small root in RAM, containing exactly the modules this machine needs,
      supplies them. This is also why a kernel upgrade that regenerates the
      initramfs without the right driver produces a machine that cannot find a
      perfectly healthy disk.

  - id: q6
    type: single_choice
    level: L3
    objectives: [OBJ-A02.5.4]
    stem: >-
      A unit has `Requires=postgres.service` and no other dependency directives.
      When does it start relative to postgres?
    options:
      - id: a
        text: At the same time — `Requires=` pulls postgres in but orders nothing
        correct: true
      - id: b
        text: After postgres has finished starting
        note: >-
          That is `After=`, and it has to be written separately. `Requires=`
          alone implies no ordering whatsoever.
      - id: c
        text: Before postgres, since the dependency must be resolved first
        note: >-
          Nothing orders it before either. Both jobs are queued and both start
          as soon as their own ordering constraints allow — which here is
          immediately.
      - id: d
        text: It refuses to start until postgres is already running
        note: >-
          That is `Requisite=`, which fails rather than starting the dependency.
    explanation: >-
      systemd separates *whether* from *when*, and English does not.
      `Requires=` answers whether — pull it in, and fail if it fails. `After=`
      answers when. Specifying one does not imply the other, so this unit races
      postgres: it works on a fast machine and fails on a loaded one, with an
      error that points at the wrong service. Almost every real dependency needs
      both lines.

  - id: q7
    type: single_choice
    level: L3
    objectives: [OBJ-A02.5.4]
    stem: >-
      What is the practical difference between `Requires=` and `Wants=` when the
      named unit fails to start?
    options:
      - id: a
        text: With `Requires=` your unit fails too; with `Wants=` it starts anyway
        correct: true
      - id: b
        text: '`Requires=` orders you after it and `Wants=` does not'
        note: >-
          Neither orders anything. Ordering is `After=` and `Before=`, and both
          of these are independent of it.
      - id: c
        text: '`Wants=` does not start the unit at all, it only records a preference'
        note: >-
          It does start it. The difference is only in what happens when that
          start fails.
      - id: d
        text: '`Requires=` is evaluated at boot and `Wants=` at every state change'
        note: >-
          Both are evaluated whenever the unit is started. There is no
          difference in timing.
    explanation: >-
      `Wants=` is the better default for most dependencies, and `Requires=` is
      stronger than people expect — it propagates failure, and with `BindsTo=`
      it also propagates *stopping*. A monitoring agent that `Requires=` the
      application will take the application down with it when the agent's own
      config is wrong, which is rarely what anyone intended.

  - id: q8
    type: multi_choice
    level: L3
    objectives: [OBJ-A02.5.4]
    stem: >-
      Which of these express *ordering* rather than requirement? Select all that
      apply.
    options:
      - id: a
        text: '`After=`'
        correct: true
      - id: b
        text: '`Before=`'
        correct: true
      - id: c
        text: '`Requires=`'
        note: >-
          Requirement: whether the unit is pulled in and what happens if it
          fails. It orders nothing.
      - id: d
        text: '`BindsTo=`'
        note: >-
          Requirement, and the strongest one — it also stops your unit when the
          other stops. Still no ordering.
    explanation: >-
      Only `After=` and `Before=` order anything, and they are the same edge
      written from opposite ends. Everything else — `Requires=`, `Wants=`,
      `BindsTo=`, `Requisite=`, `PartOf=` — answers whether, or what happens on
      failure. Keeping the two categories separate in your head is most of what
      it takes to write unit files that work under load.

  - id: q9
    type: single_choice
    level: L3
    objectives: [OBJ-A02.5.5]
    stem: >-
      A unit is `Type=simple`. When does systemd consider it started, and what
      does `After=` on it therefore mean for other units?
    options:
      - id: a
        text: The moment `exec()` succeeds — so `After=` orders against a launch, not readiness
        correct: true
      - id: b
        text: When the process binds its listening socket
        note: >-
          systemd has no way to know that with `Type=simple`. Socket activation
          can provide it, and that is a different mechanism.
      - id: c
        text: When the process exits successfully
        note: >-
          That is `Type=oneshot`, and it is the right shape for a migration
          rather than a long-running service.
      - id: d
        text: When the service sends a readiness notification
        note: >-
          That is `Type=notify`, the only type where started and ready are the
          same event.
    explanation: >-
      With the default type, "started" means `exec()` returned. Not the port
      bound, not the connection pool warm. So adding `After=` to fix a race
      narrows it without closing it — the dependent unit is now ordered after the
      other was *launched*. Closing it properly needs `Type=notify` and an
      `sd_notify` call, which is exactly the gap Kubernetes readiness probes fill.

  - id: q10
    type: single_choice
    level: L3
    objectives: [OBJ-A02.5.5]
    stem: >-
      Which unit type should a database migration use, so the application waits
      for it to finish?
    options:
      - id: a
        text: '`Type=oneshot` with `RemainAfterExit=yes`'
        correct: true
      - id: b
        text: '`Type=simple`, since the migration is a normal program'
        note: >-
          Units ordered after a simple unit wait only for exec. The application
          would start while the migration was still running.
      - id: c
        text: '`Type=forking`, so systemd knows when the work is done'
        note: >-
          Forking tells systemd the *parent* exited and a child is the real
          service. A migration has no daemon to hand off to.
      - id: d
        text: '`Type=notify`, so it can report completion explicitly'
        note: >-
          Notify reports *readiness* for a long-running service. A program that
          exits when finished is exactly what oneshot describes.
    explanation: >-
      Units ordered after a `oneshot` wait for it to *exit*, which is genuine
      completion rather than launch. `RemainAfterExit=yes` keeps the unit
      "active" afterwards, so the dependency stays satisfied and the migration is
      not re-run every time something references it.

  - id: q11
    type: single_choice
    level: L3
    objectives: [OBJ-A02.5.6]
    stem: >-
      A unit has `Restart=always` and is failed, not running. How is that
      possible?
    options:
      - id: a
        text: It hit its start rate limit, and systemd stopped retrying
        correct: true
      - id: b
        text: '`Restart=always` does not apply to failures during start-up'
        note: >-
          It does apply to start-up failures — `Restart=always` covers every
          exit, clean or not.
      - id: c
        text: The unit was manually stopped, which overrides the restart policy
        note: >-
          A manual stop does override it, and the state would then be `inactive`
          rather than `failed`.
      - id: d
        text: '`Restart=always` needs `RestartSec=` to be set before it takes effect'
        note: >-
          `RestartSec` defaults to 100ms. Its absence changes the timing, not
          whether restarts happen.
    explanation: >-
      `StartLimitBurst` starts within `StartLimitIntervalSec` — five in ten
      seconds by default — and exceeding it stops systemd retrying, whatever
      `Restart=` says. A service that crashes instantly reaches that in well
      under a second, especially with `RestartSec=0`. The journal records `Start
      request repeated too quickly` and `Failed with result 'start-limit-hit'`.

  - id: q12
    type: single_choice
    level: L3
    objectives: [OBJ-A02.5.6]
    stem: >-
      A service hit its start limit at 04:11. The underlying bug was fixed at
      04:40. At 09:40 it is still failed. Why, and what do you do?
    options:
      - id: a
        text: systemd stopped retrying permanently — run `systemctl reset-failed`, then start it
        correct: true
      - id: b
        text: The fix did not work; investigate the original failure again
        note: >-
          Nothing has tried to start it since 04:11, so the fix has never been
          tested. Re-investigating would be five hours spent on a solved problem.
      - id: c
        text: The restart backoff has grown to hours; wait for the next attempt
        note: >-
          systemd's limit is not a growing backoff — it stops. Kubernetes has
          the growing-backoff behaviour, capped at five minutes.
      - id: d
        text: The unit needs `systemctl daemon-reload` because its file changed
        note: >-
          Needed if the unit file changed, and it does not clear the start-limit
          counter. The service would stay failed.
    explanation: >-
      This is the trap that costs the most time. Once a unit hits its start
      limit it is no longer being retried, so fixing the cause changes nothing
      observable and the service looks broken long after it is not.
      `systemctl reset-failed` clears the counter. It is also worth raising
      `RestartSec` afterwards — five starts at five-second intervals cannot reach
      a five-in-ten-seconds limit, so the protection stays and real services
      stop tripping it.

  - id: q13
    type: single_choice
    level: L3
    objectives: [OBJ-A02.5.7]
    stem: What is the Kubernetes equivalent of `Type=notify` with `sd_notify`?
    options:
      - id: a
        text: A readiness probe
        correct: true
      - id: b
        text: A liveness probe
        note: >-
          Liveness answers "should I be killed", not "am I ready for traffic".
          Confusing the two turns a dependency's slowness into an outage.
      - id: c
        text: An initContainer
        note: >-
          That is the equivalent of `After=` — ordering. It says nothing about
          the main container's readiness.
      - id: d
        text: '`restartPolicy: Always`'
        note: >-
          That is the equivalent of `Restart=always`, which is about failure
          rather than readiness.
    explanation: >-
      Both are the service declaring, in its own voice, that it can now do its
      job — and both exist because "the process started" is a much weaker claim
      than anyone wants it to be. The same warning applies to both: a readiness
      endpoint that returns 200 as soon as the HTTP server is listening is
      exactly the lie `Type=simple` tells.

  - id: q14
    type: single_choice
    level: L3
    objectives: [OBJ-A02.5.8]
    stem: >-
      A unit shows `Active: failed (Result: dependency)` and no Main PID was ever
      recorded. What happened?
    options:
      - id: a
        text: A unit it required failed, so its job was cancelled before anything ran
        correct: true
      - id: b
        text: It started, could not reach a dependency at runtime, and exited
        note: >-
          That would show `Result: exit-code` and a Main PID, because the
          process ran.
      - id: c
        text: A dependency was declared that does not exist on this system
        note: >-
          That produces a load error and the unit is reported as not-found,
          which reads quite differently.
      - id: d
        text: It timed out waiting for a dependency to become ready
        note: >-
          A timeout is reported as `Result: timeout`, and the service would have
          been running while it waited.
    explanation: >-
      "No Main PID" is the diagnostic detail: nothing was executed. A
      `Requires=` on a unit that failed cancels the job, and the service never
      runs a single instruction. Reading `Result:` and asking whether there was
      ever a PID sorts most failed units in seconds — `timeout` means it ran and
      did not report, `exit-code` means it ran and exited badly, `dependency`
      means it never started.

  - id: q15
    type: single_choice
    level: L3
    objectives: [OBJ-A02.5.8]
    stem: >-
      A machine rebooted unexpectedly last night. Which command is most likely to
      tell you why?
    options:
      - id: a
        text: '`journalctl -b -1 -p err`'
        correct: true
      - id: b
        text: '`journalctl -p err`'
        note: >-
          Without `-b -1` this is the current boot, which by definition started
          after the event you are investigating.
      - id: c
        text: '`dmesg | grep -i error`'
        note: >-
          `dmesg` is the current boot's kernel ring buffer. The messages from
          before the reboot are gone.
      - id: d
        text: '`systemctl --failed`'
        note: >-
          Useful for what is broken now. It has no history and cannot say what
          happened before the reboot.
    explanation: >-
      The current boot's log cannot contain the reason the previous one ended.
      `-b -1` selects the previous boot, and `-p err` trims it to the priority
      worth reading first. If it returns nothing, the journal is not persistent
      — `Storage=persistent` in journald.conf and a `/var/log/journal` directory
      — and that is worth fixing before the next incident rather than after. The
      container equivalent is `kubectl logs --previous`, and it is reached for
      late for exactly the same reason.
