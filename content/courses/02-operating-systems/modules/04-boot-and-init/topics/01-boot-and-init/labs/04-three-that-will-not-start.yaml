id: lab.three-that-will-not-start
topic: topic.boot-and-init
title: "Challenge: three services that will not start"
type: challenge
tier: 2
image: groundwork/lab-foundations:1
duration_minutes: 30
objectives: [OBJ-A02.5.6, OBJ-A02.5.8]

intro: >-
  Three services failed on the same node this morning. Under /tmp/failures you
  have each one's unit file, its journal for the boot, and its status as of now.


  One never ran a single instruction. One ran perfectly and was killed anyway.
  One is fixed already and will not come back until somebody types a specific
  command. Work out which is which, and give the fix for each — including the
  one where the fix is a command rather than a change.

setup:
  - /opt/lab/seed.sh
  - /opt/lab/seed-init.sh

steps:
  - id: s1
    instruction: >-
      Before opening anything, write to /tmp/hypotheses at least three distinct
      reasons a unit can end up failed.
    hint: >-
      One involves the service never being executed. One involves it working and
      being killed anyway. One involves systemd deciding not to try any more.
    walkthrough: |
      printf 'a dependency failed, so the service was never executed\nthe service ran but did not report readiness in time\nit crashed repeatedly and systemd stopped retrying\nit exited non-zero and Restart= does not cover that case\n' > /tmp/hypotheses
    verify:
      - type: file_exists
        path: /tmp/hypotheses
        describe: You recorded hypotheses before looking
      - type: command_output
        command: "wc -l < /tmp/hypotheses"
        pattern: "[3-9]"
        describe: At least three hypotheses

  - id: s2
    instruction: >-
      Get the verdict systemd recorded for each, which is the fastest way to
      sort them. Save each service's `Result:` to /tmp/answer-results.
    hint: >-
      The `Active:` line in each status file carries the result in parentheses.
    walkthrough: |
      for s in alpha bravo charlie; do
        printf '%s %s\n' "$s" "$(grep -o 'Result: [a-z-]*' /tmp/failures/$s/status.txt || echo 'no result recorded')"
      done > /tmp/answer-results
      cat /tmp/answer-results
    verify:
      - type: file_matches
        path: /tmp/answer-results
        pattern: 'alpha Result: timeout'
        describe: Alpha timed out
      - type: file_matches
        path: /tmp/answer-results
        pattern: 'bravo Result: start-limit-hit'
        describe: Bravo hit its start limit
      - type: file_matches
        path: /tmp/answer-results
        pattern: 'charlie no result recorded'
        describe: And charlie has no result at all, because nothing ran

  - id: s3
    instruction: >-
      Alpha's journal says it was working. Save the two lines that prove the
      service itself was healthy, plus its `Type=`, to /tmp/answer-alpha.
    walkthrough: |
      {
        grep -E 'listening|ready to accept' /tmp/failures/alpha/journal.txt
        grep '^Type=' /tmp/failures/alpha/unit.txt
      } > /tmp/answer-alpha
      cat /tmp/answer-alpha
    verify:
      - type: file_matches
        path: /tmp/answer-alpha
        pattern: 'ready to accept work'
        describe: The service logged that it was ready
      - type: file_matches
        path: /tmp/answer-alpha
        pattern: '^Type=notify$'
        describe: But its unit is Type=notify, which expects a different kind of report

  - id: s4
    instruction: >-
      Say what alpha is actually missing. Write it to /tmp/answer-alpha-cause —
      and note how long systemd waited before giving up.
    hint: >-
      `Type=notify` does not read your logs. Compare the timestamps of the first
      and last journal lines.
    walkthrough: |
      head -1 /tmp/failures/alpha/journal.txt; grep 'timed out' /tmp/failures/alpha/journal.txt
      echo "the unit is Type=notify, so systemd waits for an sd_notify READY=1 message and the service never sends one; logging that it is ready is not the same protocol, so systemd waited the default 90 seconds and then terminated a service that had been working the whole time" > /tmp/answer-alpha-cause
    verify:
      - type: file_matches
        path: /tmp/answer-alpha-cause
        pattern: "sd_notify|READY"
        describe: You named the readiness protocol it never used
      - type: file_matches
        path: /tmp/answer-alpha-cause
        pattern: "90|ninety"
        describe: And the timeout it waited out

  - id: s5
    instruction: >-
      Charlie has no result and no PID. Find what stopped it and save the
      evidence to /tmp/answer-charlie.
    walkthrough: |
      {
        grep -E 'Requires|After' /tmp/failures/charlie/unit.txt
        grep -E 'mount|Dependency' /tmp/failures/charlie/journal.txt
      } > /tmp/answer-charlie
      cat /tmp/answer-charlie
    verify:
      - type: file_matches
        path: /tmp/answer-charlie
        pattern: 'Requires=var-lib-reports.mount'
        describe: It requires a mount unit
      - type: file_matches
        path: /tmp/answer-charlie
        pattern: 'Connection timed out'
        describe: And that mount failed — an NFS server that did not answer
      - type: file_matches
        path: /tmp/answer-charlie
        pattern: 'Dependency failed'
        describe: So the job was cancelled before charlie ever executed

  - id: s6
    instruction: >-
      Bravo is the interesting one. Its config file was restored hours ago and
      it is still failed.


      Save the journal line that explains why, and the two directives that
      produced it, to /tmp/answer-bravo.
    hint: >-
      Look for the line about repeated requests, then find the settings in the
      `[Unit]` section that define "repeated".
    walkthrough: |
      {
        grep -E 'repeated too quickly|start-limit-hit' /tmp/failures/bravo/journal.txt
        grep -E '^StartLimit|^Restart' /tmp/failures/bravo/unit.txt
      } > /tmp/answer-bravo
      cat /tmp/answer-bravo
    verify:
      - type: file_matches
        path: /tmp/answer-bravo
        pattern: 'Start request repeated too quickly'
        describe: systemd stopped trying
      - type: file_matches
        path: /tmp/answer-bravo
        pattern: 'StartLimitBurst=5'
        describe: After five attempts
      - type: file_matches
        path: /tmp/answer-bravo
        pattern: 'RestartSec=0'
        describe: Which RestartSec=0 guaranteed it would reach in under a second

  - id: s7
    instruction: >-
      Write your three diagnoses to /tmp/answer-diagnosis — one line each,
      naming the mechanism rather than the symptom.
    walkthrough: |
      {
        echo "alpha: healthy service with the wrong Type; it never sends sd_notify READY=1, so systemd timed out after 90 seconds and killed something that was working"
        echo "bravo: crashlooped on a missing config file, hit StartLimitBurst=5 within StartLimitIntervalSec=10 because RestartSec=0, and systemd stopped retrying permanently; the config was fixed at 04:40 and nothing has tried since"
        echo "charlie: its required NFS mount timed out, so the dependency failed and the job was cancelled; charlie itself never executed a single instruction"
      } > /tmp/answer-diagnosis
      cat /tmp/answer-diagnosis
    verify:
      - type: file_matches
        path: /tmp/answer-diagnosis
        pattern: "alpha:.*(notify|READY|timeout)"
        describe: You diagnosed alpha as a readiness-protocol mismatch
      - type: file_matches
        path: /tmp/answer-diagnosis
        pattern: "bravo:.*(start.?limit|retry|retrying)"
        describe: And bravo as start rate limiting
      - type: file_matches
        path: /tmp/answer-diagnosis
        pattern: "charlie:.*(mount|depend)"
        describe: And charlie as a failed dependency

  - id: s8
    instruction: >-
      Write the fixes to /tmp/answer-fixes — one line each.


      One of them is a command to run right now, not a change to a file, and
      saying so is the point of the exercise.
    walkthrough: |
      {
        echo "alpha: either call sd_notify READY=1 in the service, or change the unit to Type=exec if it has no readiness protocol; raising TimeoutStartSec would only delay the same kill"
        echo "bravo: run systemctl reset-failed bravo.service to clear the counter and start it, then set RestartSec=5 so an instant crash loop can never reach five starts in ten seconds again"
        echo "charlie: fix or remove the NFS mount; if reports are optional, change Requires= to Wants= so a failed mount degrades charlie instead of cancelling it"
      } > /tmp/answer-fixes
      cat /tmp/answer-fixes
    verify:
      - type: file_matches
        path: /tmp/answer-fixes
        pattern: "alpha:.*(sd_notify|Type=)"
        describe: Alpha's fix addresses the readiness protocol
      - type: file_matches
        path: /tmp/answer-fixes
        pattern: "reset-failed"
        describe: Bravo needs a command run, not just a file changed
      - type: file_matches
        path: /tmp/answer-fixes
        pattern: "charlie:.*(Wants=|mount)"
        describe: And charlie's fix addresses the dependency

solution: |
  **The three verdicts.**

  | | alpha | bravo | charlie |
  |---|---|---|---|
  | Result | `timeout` | `start-limit-hit` | none — never ran |
  | Main PID | 41882, killed by TERM | several, all exited 1 | never started |
  | Actually broken now? | Yes | **No — fixed at 04:40** | Yes, upstream |
  | Fix | Change the unit or the code | **A command** | Fix the mount, or weaken the dependency |

  **alpha — a working service with the wrong `Type=`.** Its journal says
  `listening on 0.0.0.0:9000` and `ready to accept work`, and ninety seconds
  later systemd terminated it.

  The unit is `Type=notify`, which means systemd waits for an `sd_notify(0,
  "READY=1")` message on a socket it passed in the environment. The service logs
  that it is ready, which is a different thing entirely — systemd does not read
  your logs. With no message, the start operation ran to `TimeoutStartSec`
  (90 seconds by default) and systemd killed a service that had been serving the
  whole time.

  The fix is to make the declaration and the code agree. Either implement
  `sd_notify` — best, because then `After=` on this unit means real readiness for
  everything downstream — or set `Type=exec`, which is honest about not having a
  readiness protocol. Raising `TimeoutStartSec` is the tempting one and it only
  delays the same kill.

  **charlie — never executed a single instruction.** No Main PID, no result, and
  the journal explains itself:

  ```text
  mount.nfs: Connection timed out
  Failed to mount /var/lib/reports.
  Dependency failed for Charlie report generator.
  Job charlie.service/start failed with result 'dependency'.
  ```

  `Requires=var-lib-reports.mount` means if the mount fails, charlie fails —
  and the job is cancelled before anything runs. That is `Requires=` working
  exactly as designed, and the diagnosis takes ten seconds if you notice that
  "no Main PID" and "no result" mean nothing was ever started.

  Whether that is right depends on the service. If the reports directory is
  essential, `Requires=` is correct and the NFS server is the bug. If charlie
  could run degraded, `Wants=` lets it start and fail on its own terms, which is
  usually more useful than not starting at all.

  **bravo — the one that is already fixed.** This is the trap, and it is the most
  valuable of the three.

  ```ini
  Restart=always
  RestartSec=0
  StartLimitIntervalSec=10
  StartLimitBurst=5
  ```

  The service crashed on a missing config file. `Restart=always` restarted it.
  `RestartSec=0` restarted it *immediately*. Five attempts inside the same
  second, `StartLimitBurst=5` exceeded, and systemd stopped:

  ```text
  Start request repeated too quickly.
  Failed with result 'start-limit-hit'.
  ```

  **At that point systemd is no longer retrying.** The platform team restored
  the config at 04:40, and nothing happened, because nothing was going to try
  again. Five hours later it is still failed — not because it is broken, but
  because nobody told it to have another go.

  ```bash
  systemctl reset-failed bravo.service
  systemctl start bravo.service
  ```

  Then fix the setting that made an instant crash loop inevitable:

  ```ini
  RestartSec=5      # five starts now take 25 seconds, so the limit is unreachable
  ```

  Raising `RestartSec` is a better fix than raising `StartLimitBurst`, because it
  keeps the protection — the limit exists to stop a busy loop consuming a core
  and filling a disk — while making a real service unable to trip it.

  **The order to read a failed unit in.**

  ```bash
  systemctl status x        # Result= and whether there was ever a Main PID
  systemctl cat x           # the unit *and its drop-ins* — the setting is often in a drop-in
  journalctl -u x -b        # this boot
  journalctl -b -1 -u x     # the boot that actually failed, if the machine rebooted
  ```

  The `Result:` field alone sorts most cases: `timeout` means it ran and did not
  report; `start-limit-hit` means it is not being retried; `dependency` means it
  never ran; `exit-code` means it ran and exited badly.

  **Where this goes.** **E29** has the same three failures under different names.
  A readiness probe that never turns green is alpha. `CrashLoopBackOff` is bravo
  — with one important difference: Kubernetes keeps retrying, just increasingly
  slowly, so a fix eventually takes effect on its own where systemd's never
  will. And an `initContainer` that cannot mount its volume is charlie.
