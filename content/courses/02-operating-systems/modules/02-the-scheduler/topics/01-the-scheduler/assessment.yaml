id: assessment.the-scheduler
topic: topic.the-scheduler
pass_score: 70

parts:
  - id: A
    title: Explain why the test showed nothing
    kind: explain
    objectives: [OBJ-A02.3.4]
    prompt: >-
      A colleague has niced a batch job to 19, tested it on a quiet staging
      node, measured no difference at all, and is about to remove the change as
      useless.


      In about 200 words: explain what their test demonstrated, what the setting
      does under contention, how you would construct a test that shows it, and
      when nice is the wrong tool entirely.
    rubric:
      - "States that a share is weight over the sum of *runnable* weights, so a lone task's share is 1 regardless of nice"
      - "Gives the contended figure with the weights: nice 0 is 1024, nice 19 is 15, so roughly 68:1 or 1.4%"
      - "Describes creating contention deliberately — pinning competing processes to one CPU with taskset"
      - "Distinguishes a weight from a limit, and says cpu.max is the tool when a ceiling is needed on an idle machine"
      - "Notes that the failure mode is sudden rather than gradual, because the denominator changes without warning"
    model_answer: >-
      The test demonstrated that the staging node was quiet.


      A task's CPU share is its weight over the sum of all *runnable* weights.
      Alone, that sum is its own weight, so the share is 1 whatever the
      numerator is — a nice-19 process on an idle machine runs exactly as fast as
      a nice-0 one. Nothing was measured because there was nothing to arbitrate.


      Under contention it is dramatic. Nice 0 has weight 1024 and nice 19 has
      weight 15, so against a single normal competitor the batch job gets about
      1.4% of a CPU — a ratio of roughly 68 to 1, not the modest reduction the
      name suggests.


      To see it, create the contention: run two busy processes with
      `taskset -c 0` so they share one run queue, and compare their CPU time
      from `/proc/PID/stat`. The ratio comes out in the tens within a minute.


      Keep the change, but know what it is. A weight is not a limit — it does
      nothing on an idle machine and everything on a busy one, so the failure
      mode arrives suddenly, on the first busy afternoon, with nothing of the
      job's own having changed. If what is wanted is a ceiling that holds even
      on an empty machine, that is `cpu.max`, and nice will never provide it.
    common_failures:
      - "Concluding the setting is broken rather than that the test lacked contention"
      - "Describing nice 19 as roughly half or a quarter — applying a linear intuition to a geometric scale"
      - "Proposing a test that adds load generally rather than forcing tasks onto the same run queue"
      - "Omitting the weight-versus-limit distinction, which is what decides whether nice was the right choice at all"

  - id: B
    title: Diagnose from per-task evidence
    kind: diagnose
    objectives: [OBJ-A02.3.8, OBJ-A02.3.7, OBJ-A02.3.3]
    prompt: >-
      Two services on one 32-CPU node at 44% utilisation. Both have bad tail
      latency. Same 600-second window for both.


      **X** — 32 threads. Totals: on-cpu 574s, waiting 606s.
      `cpu.max 100000 100000`. `cpu.stat`: nr_periods 6000, nr_throttled 5768.
      `nr_voluntary_switches 1140`, `nr_involuntary_switches 917302`. Startup
      log says `GOMAXPROCS=32`.


      **Y** — 4 threads. Totals: on-cpu 30s, waiting 0.1s.
      `cpu.max 400000 100000`. `cpu.stat`: nr_periods 6000, nr_throttled 2.
      `nr_voluntary_switches 1881044`, `nr_involuntary_switches 3177`.


      Diagnose each, name the single most important change for each, and say
      what the node's 44% figure was worth.
    rubric:
      - "X: throttled in 96% of periods against a 1-CPU quota, with 32 threads sized from the node rather than the quota"
      - "Y: not a scheduling problem — near-zero run-queue wait and overwhelmingly voluntary switches mean it is blocked externally"
      - "Fixes X's thread count before or alongside the quota, and explains why the quota alone is insufficient"
      - "Leaves Y's resources alone and moves the investigation off CPU entirely"
      - "Explains that node utilisation averages over CPUs, time and cgroups, and so could not have found either"
    model_answer: >-
      **X — throttled by its own quota, and over-threaded inside it.** 5768 of
      6000 periods ended early: 96%, against a 1-CPU limit, on a node with
      capacity. 574 seconds of work against 606 seconds queued means more than
      half the elapsed time was spent waiting for a turn. The switch ratio
      confirms the shape — 917302 involuntary against 1140 voluntary, so it is
      essentially never blocking and essentially always being stopped.


      `GOMAXPROCS=32` on a 1-CPU quota is the compounding defect: 32 runnable
      threads rotate through 100ms of allowance, each switch discarding the
      cache the last one warmed, and a request may wait several rotations.


      Most important change: set `GOMAXPROCS` from the quota. It is free, and it
      changes what the right quota is — so raising `limits.cpu` first would buy a
      fraction of the improvement at real cost. Then size the limit until the
      throttled ratio is near zero.


      **Y — not a scheduling problem.** Run-queue wait of 0.1 seconds against 30
      seconds of CPU is nothing, and 1.88 million voluntary switches say it
      spends its life blocked on something external. It is nowhere near its
      4-CPU quota.


      Most important change: none to its resources. Move the investigation to
      whatever it is waiting on — a database, a downstream call, a pool.


      **The node's 44%.** Worth very little. It averages over CPUs, over time and
      over cgroups — and the third one is decisive here, because a container
      throttled at its own limit contributes only its quota to node utilisation
      however desperate it is. The figure was true and answered a question
      neither team had.
    common_failures:
      - "Recommending more replicas for X — every replica has the same quota, so per-request latency is unchanged"
      - "Raising X's CPU limit without touching the thread count, which treats the symptom at cost"
      - "Diagnosing Y as under-resourced because its latency is bad, ignoring that it never queued"
      - "Accepting the 44% node figure as evidence that neither problem is CPU-related"

  - id: C
    title: Review a request for real-time scheduling
    kind: reason
    objectives: [OBJ-A02.3.8, OBJ-A02.3.6]
    prompt: >-
      A team has opened a pull request adding `--cap-add=SYS_NICE` to their
      market-data container, with the justification: "we need consistent
      sub-millisecond processing and the scheduler keeps preempting us; SCHED_FIFO
      fixes it in our tests".


      Write your review comment — about 200 words. Reach a decision, say what
      the capability actually grants, name the risk precisely, and state what
      evidence or alternative you would want.
    rubric:
      - "Reaches a clear decision rather than listing considerations"
      - "States that CAP_SYS_NICE grants both negative nice and the real-time policies, and that this is a node-level grant"
      - "Names the specific risk: a runnable SCHED_FIFO task preempts all normal tasks and runs until it blocks"
      - "Mentions sched_rt_runtime_us as the only thing preventing total loss of the node"
      - "Asks for evidence the latency is scheduling at all, and offers at least one unprivileged alternative"
    model_answer: >-
      Holding this, but the requirement may well be legitimate — let us establish
      which problem we are solving.


      `--cap-add=SYS_NICE` grants two things: negative nice values, and the
      real-time policies. `SCHED_FIFO` means a runnable thread in this container
      preempts every normal task on its CPU and runs until it *blocks*. If it
      ever spins — a busy-wait, a tight poll loop, a bug — nothing normal runs on
      that CPU, kubelet included. The only thing between us and losing the node
      is `sched_rt_runtime_us`, which reserves 50ms of each second for normal
      tasks, and that turns "gone" into "very slow". This is a node-level grant
      wearing a container-level flag.


      Before approving I want two things. First, evidence the latency is
      scheduling: per-thread `schedstat` showing real run-queue wait, and
      `cpu.stat` showing whether we are simply hitting our own quota. "The
      scheduler keeps preempting us" is consistent with a CPU limit and a thread
      pool sized from `nproc`, and both are free to fix.


      Second, confirmation the hot path blocks between work items rather than
      polls.


      If the deadline is real and the code blocks, I will approve it with a
      dedicated node pool and `SCHED_RR` rather than FIFO. Happy to take the
      measurements with you this week.
    common_failures:
      - "Approving because the requirement sounds like a genuine real-time use case, without asking whether the code blocks"
      - "Refusing outright with no path to yes, which gets overruled the next time latency is on fire"
      - "Describing the risk as 'it could use a lot of CPU' rather than as preemption of every normal task including the kubelet"
      - "Missing that the symptom is equally consistent with quota throttling, which needs no capability to fix"
