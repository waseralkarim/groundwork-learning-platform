id: lab.nice-under-contention
topic: topic.the-scheduler
title: Measure what nice is worth, and check it against the weight table
type: guided
tier: 2
image: groundwork/lab-foundations:1
duration_minutes: 30
objectives: [OBJ-A02.3.4]

intro: >-
  Almost everyone believes nice 19 means "a bit lower priority". The weight
  table says it means about one seventieth. This lab settles it with a
  stopwatch.


  You will run the control first — a nice-19 process with nothing to compete
  against — and find it runs at full speed, which is the fact that makes people
  conclude nice does nothing. Then you will create real contention by pinning
  two processes to one CPU, measure the CPU each receives, and check whether the
  ratio matches the two weights you can read out of /proc.


  If the arithmetic holds, you have derived the scheduler's rule from a
  measurement rather than been told it.

setup:
  - /opt/lab/seed.sh

steps:
  - id: s1
    instruction: >-
      Start with the control. Run a nice-19 busy loop for six seconds, alone,
      pinned to CPU 0, and record how much CPU time it accumulated into
      /tmp/answer-alone.


      CPU time is field 14 of /proc/PID/stat, in clock ticks of 10ms.
    hint: >-
      Start it in the background, sleep 5, then read field 14 of
      /proc/$PID/stat before it exits.
    walkthrough: |
      taskset -c 0 nice -n 19 bash -c 'end=$((SECONDS+6)); while [ $SECONDS -lt $end ]; do :; done' &
      P=$!
      sleep 5
      awk '{print "ticks=" $14}' /proc/$P/stat > /tmp/answer-alone
      cat /tmp/answer-alone
      wait
    verify:
      - type: file_matches
        path: /tmp/answer-alone
        pattern: 'ticks=[0-9]+'
        describe: A CPU-time reading was captured
      - type: command_exit
        command: "test $(tr -dc '0-9' < /tmp/answer-alone) -ge 100"
        exit_code: 0
        describe: At least a second of CPU in five — nice 19 alone is not slowed at all

  - id: s2
    instruction: >-
      Write down what the control shows, in /tmp/answer-control — one sentence
      about what nice 19 did to a process with no competitor.
    hint: >-
      Your share is your weight divided by the sum of all runnable weights.
      Alone, what is that sum?
    walkthrough: |
      echo "nothing: with no other runnable task the sum of weights is its own weight, so its share is all of the cpu it is allowed regardless of nice" > /tmp/answer-control
    verify:
      - type: file_matches
        path: /tmp/answer-control
        pattern: "nothing|no effect|full|all"
        describe: You recorded that nice made no difference without competition
      - type: command_exit
        command: "test $(wc -w < /tmp/answer-control) -ge 10"
        exit_code: 0
        describe: You wrote a real explanation

  - id: s3
    instruction: >-
      Now create contention. Run two busy loops for ten seconds, both pinned to
      CPU 0 — one at the default nice, one at nice 19 — and save both processes'
      CPU-time readings to /tmp/answer-contended.


      Label them so you can tell which is which.
    hint: >-
      Start both in the background, keep their PIDs, sleep about nine seconds,
      then read field 14 of each one's stat file.
    walkthrough: |
      taskset -c 0 bash -c 'end=$((SECONDS+10)); while [ $SECONDS -lt $end ]; do :; done' &
      A=$!
      taskset -c 0 nice -n 19 bash -c 'end=$((SECONDS+10)); while [ $SECONDS -lt $end ]; do :; done' &
      B=$!
      sleep 9
      {
        echo "normal=$(awk '{print $14}' /proc/$A/stat)"
        echo "nice19=$(awk '{print $14}' /proc/$B/stat)"
      } > /tmp/answer-contended
      cat /tmp/answer-contended
      wait
    verify:
      - type: file_matches
        path: /tmp/answer-contended
        pattern: 'normal=[0-9]+'
        describe: The nice-0 process's CPU time was captured
      - type: file_matches
        path: /tmp/answer-contended
        pattern: 'nice19=[0-9]+'
        describe: And the nice-19 process's
      - type: command_exit
        command: "test $(awk -F= '/normal/{n=$2} /nice19/{m=$2} END{print (m>0 ? int(n/m) : n)}' /tmp/answer-contended) -ge 10"
        exit_code: 0
        describe: The nice-0 process got at least ten times more CPU

  - id: s4
    instruction: >-
      Read the two weights the scheduler was actually using. Capture
      se.load.weight for a nice-0 process and a nice-19 process into
      /tmp/answer-weights.
    hint: >-
      `grep se.load.weight /proc/self/sched` for your own, and the same inside
      `nice -n 19 bash -c ...` for the other.
    walkthrough: |
      {
        echo "normal=$(grep se.load.weight /proc/self/sched | tr -dc '0-9')"
        echo "nice19=$(nice -n 19 bash -c 'grep se.load.weight /proc/self/sched' | tr -dc '0-9')"
      } > /tmp/answer-weights
      cat /tmp/answer-weights
    verify:
      - type: file_matches
        path: /tmp/answer-weights
        pattern: 'normal=1048576'
        describe: Weight 1024, scaled
      - type: file_matches
        path: /tmp/answer-weights
        pattern: 'nice19=15360'
        describe: Weight 15, scaled

  - id: s5
    instruction: >-
      Compute the ratio the weights predict, and write it — a whole number — to
      /tmp/answer-predicted.
    hint: "Divide the larger weight by the smaller one."
    walkthrough: |
      awk -F= '/normal/{n=$2} /nice19/{m=$2} END { printf "%d\n", n/m }' /tmp/answer-weights > /tmp/answer-predicted
      cat /tmp/answer-predicted
    verify:
      - type: file_matches
        path: /tmp/answer-predicted
        pattern: '^68$'
        describe: 1048576 divided by 15360 is 68

  - id: s6
    instruction: >-
      Now compute the ratio you actually measured, from /tmp/answer-contended,
      and write it to /tmp/answer-measured.


      Then compare the two numbers.
    hint: "Divide the nice-0 process's ticks by the nice-19 process's."
    walkthrough: |
      awk -F= '/normal/{n=$2} /nice19/{m=$2} END { printf "%d\n", (m>0 ? n/m : n) }' /tmp/answer-contended > /tmp/answer-measured
      echo "predicted $(cat /tmp/answer-predicted) measured $(cat /tmp/answer-measured)"
    verify:
      - type: command_exit
        command: "test $(cat /tmp/answer-measured) -ge 10"
        exit_code: 0
        describe: The measured ratio is in the tens, not single digits

  - id: s7
    instruction: >-
      Finish with the consequence. Write to /tmp/answer-consequence what this
      means for a batch job niced to 19 on a machine that is usually quiet.


      Say what happens on the quiet days and what happens on the busy one.
    hint: >-
      The share depends on who else is runnable, and that changes without
      anything of yours changing.
    walkthrough: |
      echo "on quiet days it runs at full speed and nobody notices the nice value at all, but on the one busy afternoon it drops to roughly a seventieth of a competing task and its queue backs up, even though nothing about its own configuration changed" > /tmp/answer-consequence
    verify:
      - type: file_matches
        path: /tmp/answer-consequence
        pattern: "busy|contention|compet"
        describe: You tied the behaviour change to the arrival of competition
      - type: command_exit
        command: "test $(wc -w < /tmp/answer-consequence) -ge 15"
        exit_code: 0
        describe: You wrote a real explanation

solution: |
  ```bash
  # control: nice 19, alone
  taskset -c 0 nice -n 19 bash -c 'end=$((SECONDS+6)); while [ $SECONDS -lt $end ]; do :; done' &
  P=$!; sleep 5; awk '{print $14}' /proc/$P/stat     # ~250 ticks: full speed

  # contended: nice 0 against nice 19, same CPU
  taskset -c 0 bash -c 'end=$((SECONDS+10)); while [ $SECONDS -lt $end ]; do :; done' & A=$!
  taskset -c 0 nice -n 19 bash -c 'end=$((SECONDS+10)); while [ $SECONDS -lt $end ]; do :; done' & B=$!
  sleep 9
  awk '{print $14}' /proc/$A/stat      # ~441 ticks
  awk '{print $14}' /proc/$B/stat      # ~6 ticks

  grep se.load.weight /proc/self/sched                                   # 1048576
  nice -n 19 bash -c 'grep se.load.weight /proc/self/sched'              # 15360
  ```

  **What you just measured.**

  **The control is the important half.** Alone, the nice-19 process ran at
  exactly the speed the cgroup quota allowed. Not slightly slower — the same. Its
  share is its weight divided by the sum of all runnable weights, and when it is
  the only runnable task that sum is its own weight. The fraction is 1 whatever
  the numerator is.

  This is why "I tried renicing it and nothing happened" is such a common and
  such a wrong conclusion. The setting worked perfectly; the test had no
  competition in it for the setting to arbitrate.

  **Under contention, the ratio is enormous.** Typical readings on this
  platform:

  ```text
  normal  441 ticks   (4.41s of CPU)
  nice19    6 ticks   (0.06s of CPU)
  ratio    ~73
  ```

  Against a predicted 68 from `1048576 / 15360`. The measurement is a few
  percent off the table, which is what you would expect from start-up ordering,
  timer granularity and the fact that the quota was being enforced at the same
  time. It is not off by a factor, and that is the point: the mechanism is
  plainly the one the table describes.

  **The weight table, since you have now confirmed it applies:**

  | nice | weight | share against one nice-0 competitor |
  |---|---|---|
  | −20 | 88761 | 98.9% |
  | −5 | 3121 | 75.3% |
  | 0 | 1024 | 50% |
  | 5 | 335 | 24.7% |
  | 10 | 110 | 9.7% |
  | 19 | 15 | **1.4%** |

  Each nice step is about 1.25×, so the scale is geometric and the intuition
  that "19 out of 39 steps is about half" is wrong by a factor of thirty-five.

  **The failure mode this creates is sudden, not gradual.** A batch job at nice
  19 is invisible for weeks — it runs at full speed every time anyone looks.
  Then, on the one afternoon when something else is busy, it gets 1.4% of a CPU
  and its queue backs up. Nothing about it changed. Somebody else turned up.

  **Which tells you when nice is the wrong tool.** A weight is not a limit. If
  you need a ceiling that holds on an idle machine — because the batch job
  should never take more than a quarter of the box regardless — that is
  `cpu.max`, and `nice` will never do it. If you want the job to get out of the
  way only when it matters and use everything otherwise, that is exactly what a
  weight is for.

  **The same statement in Kubernetes.** A low CPU *request* is this: a small
  weight, invisible when the node is quiet, decisive when it is not. A low CPU
  *limit* is the other thing: a ceiling enforced even on an empty node. Teams
  reach for the limit and mean the request roughly as often as they get it right.

  **Why pinning was necessary.** Two processes on a 16-CPU machine are not
  competing — they each get a CPU and the weights arbitrate nothing.
  `taskset -c 0` forces them onto one run queue, which is the entire experiment.
  Any test of a weight-based setting that does not create contention is measuring
  nothing, and this is the cheapest way to create it.
