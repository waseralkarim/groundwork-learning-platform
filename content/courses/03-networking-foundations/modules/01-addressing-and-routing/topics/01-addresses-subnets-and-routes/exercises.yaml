topic: topic.addresses-subnets-and-routes

exercises:
  - id: e1
    title: Same wire, different answers
    level: L1
    objectives: [OBJ-A03.1.2]
    kind: interpretation
    prompt: >-
      Four machines are plugged into one switch:


      ```text
      A  10.0.1.5/24
      B  10.0.1.200/24
      C  10.0.1.200/25
      D  10.0.1.60/25
      ```


      For each machine, say whether it treats `10.0.1.5` as a neighbour or as
      something needing a router. Then say which pairs can hold a normal
      two-way conversation.
    answer: >-
      A: itself. B: neighbour — its /24 covers .0–.255. C: remote — its /25
      starts at .128, so .5 is outside. D: neighbour — its /25 covers .0–.127,
      which includes .5. Two-way conversations: A–B, A–D, B–D is one-way only
      (B thinks D is local, D thinks B is remote), and C can talk to nobody on
      this wire except by going through the gateway and back.
    explanation: >-
      The exercise is the same comparison four times, and the point is that each
      machine answers it using only its own mask — no machine knows what mask
      any other machine has.


      **D is the one worth dwelling on.** A /25 does not automatically mean "the
      upper half". `10.0.1.60/25` has a block size of 128 and 60 rounds down to
      0, so D's network is .0–.127. Two machines can both have /25s and be on
      different networks, which is exactly the C/D pair here.


      **B–D is the asymmetric case.** B (/24) thinks D is local and sends
      directly, and those packets arrive. D (/25, lower half) thinks B at .200 is
      remote and replies via the gateway. So B sees a timeout and D sees
      requests it answered normally — the shape that means "compare the masks"
      rather than "investigate the host that reported it".


      **C is isolated in practice.** Its network is .128–.255, so of the others
      only B at .200 is inside it — and B, having a /24, replies directly, which
      does work. So C–B is the one pair that functions by accident, in both
      directions, for a reason neither host is aware of.

  - id: e2
    title: Carve up a block
    level: L2
    objectives: [OBJ-A03.1.3]
    kind: calculation
    prompt: >-
      You have been given `10.30.0.0/22` for a new environment and need four
      subnets of equal size.


      Give the four CIDR blocks, the usable host range of the third one, and how
      many hosts each provides. Then say what you would have to do if one of the
      four later needed 600 hosts.
    answer: >-
      /22 is 1024 addresses, so four equal subnets are /24s: 10.30.0.0/24,
      10.30.1.0/24, 10.30.2.0/24 and 10.30.3.0/24. The third one's usable range
      is 10.30.2.1 – 10.30.2.254, 254 hosts each. If one needed 600 hosts there
      is no room: a /23 would be required, the block only holds four /24s, and
      the answer is either a larger allocation or renumbering the neighbours.
    explanation: >-
      The arithmetic: a /22 is 2^(32−22) = 1024 addresses. Dividing by four means
      each piece is 256 addresses, which is a /24 — and each step of one in the
      prefix halves the block, so /22 → /23 → /24 is exactly two halvings, or
      four pieces.


      The boundaries are the third and fourth octets doing what they always do:
      the /24s start at 10.30.0.0, 10.30.1.0, 10.30.2.0 and 10.30.3.0, and the
      /22 ends at 10.30.3.255.


      **The last part is the real lesson.** Subnets cannot be resized in place —
      a /24 growing to a /23 has to consume its neighbour, and the neighbour is
      already in use. That is why address planning is done generously up front:
      a /20 here instead of a /22 would have cost nothing and left room for four
      /22s.


      The rule of thumb worth carrying: allocate at least four times what you
      think you need, from a part of `10.0.0.0/8` nobody else is using. Private
      space is free and renumbering is not.

  - id: e3
    title: Read a routing table
    level: L2
    objectives: [OBJ-A03.1.5]
    kind: interpretation
    prompt: >-
      ```text
      default via 192.168.1.1 dev wlan0 metric 600
      10.0.0.0/8 via 10.8.0.1 dev wg0
      10.24.0.0/16 dev eth0 proto kernel scope link src 10.24.0.15
      169.254.169.254 via 192.168.1.1 dev wlan0
      192.168.1.0/24 dev wlan0 proto kernel scope link src 192.168.1.87
      ```


      Say which interface a packet leaves by for each of: `10.24.3.10`,
      `10.99.0.4`, `169.254.169.254`, `192.168.1.200` and `8.8.8.8`. Then say
      which of those five involves no router at all.
    answer: >-
      10.24.3.10 → eth0 (/16 beats the /8). 10.99.0.4 → wg0 (only the /8 and the
      default match; /8 wins). 169.254.169.254 → wlan0 (a /32, the longest
      possible prefix). 192.168.1.200 → wlan0 (/24 beats the default).
      8.8.8.8 → wlan0 via the default, since nothing else matches. The two
      involving no router are 10.24.3.10 and 192.168.1.200 — both are `scope
      link` routes with no `via`.
    explanation: >-
      Every line is longest-prefix match, and the interesting ones are the two
      extremes.


      **`10.24.3.10` is the collision worth checking.** Both the VPN's /8 and the
      local /16 match it, and the /16 is more specific — so this machine reaches
      that network directly on eth0 rather than down the tunnel. Had the local
      route not existed, the same address would have gone to the VPN, which is
      precisely the "I connected to the VPN and lost the database" failure.


      **The /32 for the metadata service is the longest prefix possible.** It
      cannot be beaten by anything, which is why it is written that way: it
      guarantees that one address keeps going out the local gateway however many
      other routes get added.


      **The two with no router** are the ones whose routes have `scope link` and
      no `via`. The kernel ARPs for the destination's own MAC address and sends
      the frame straight to it. Everything else goes to a gateway's MAC while
      still carrying the destination's IP — which is the mechanical difference
      between "on my network" and "somewhere else".

  - id: e4
    title: What NAT costs
    level: L2
    objectives: [OBJ-A03.1.7]
    kind: short_answer
    prompt: >-
      A busy NAT gateway is failing: new connections are refused, existing ones
      are fine, and the gateway's CPU and bandwidth are both low.


      Explain what is most likely exhausted, why the symptom takes that
      particular shape, and name two other consequences of NAT that this outage
      illustrates.
    answer: >-
      The connection-tracking table. NAT keeps one entry per connection with an
      idle timeout, and once the table is full there is nowhere to record a new
      mapping — so new connections fail while established ones, which already
      have entries, are unaffected. CPU and bandwidth are irrelevant because the
      limit is memory-shaped, not throughput-shaped. It illustrates that NAT is
      state rather than a transformation, and that losing that state kills every
      connection through it at once.
    explanation: >-
      The symptom shape is the diagnosis. "New fails, existing works" points at
      a per-connection resource, and NAT's per-connection resource is a table
      entry. On Linux that is conntrack, and `nf_conntrack_max` is the number to
      look at — along with the timeouts, since long ones make the table fill with
      connections nobody is using.


      **NAT is state, and that is the general lesson.** Address translation
      sounds like a stateless rewrite and cannot be: the reply has to be mapped
      back, so something must remember. That memory has a size, a timeout and a
      single location, which makes a NAT gateway a stateful bottleneck in a
      design that otherwise looks stateless.


      **The two consequences worth naming.** A failover loses the table, so every
      connection through the old gateway dies at once — routing recovers in
      seconds and the connections do not. And the server on the far side sees one
      address for every client behind the NAT, which breaks per-client rate
      limiting and IP allow-lists, and is why `X-Forwarded-For` had to be
      invented.
