    assessed_by: [quiz.q14, quiz.q15, lab.find-the-shared-fate, exercise.e5, assessment.C]

terminology:
  - term: region
    definition: >-
      A geographic area with its own set of zones. The boundary against a
      regional disaster, and the unit most cloud services are scoped to.
  - term: availability zone
    definition: >-
      One or more datacentres with independent power, cooling and network,
      within a region. The boundary against a facility-level failure.
  - term: failure domain
    definition: >-
      A set of things that fail together. Naming yours is more useful than
      counting replicas, because replicas in one domain are one thing.
  - term: correlated failure
    definition: >-
      Failures that were assumed independent and are not. It is what turns
      calculated availability into a number that never materialises.
  - term: series composition
    definition: >-
      Components all required. Availability multiplies, so it always falls —
      every dependency you add makes the system worse.
  - term: parallel composition
    definition: >-
      Any one component suffices. Unavailability multiplies, so nines are added
      quickly — provided the failures are independent.
  - term: quorum
    definition: >-
      A majority, needed for a distributed system to accept writes. `floor(n/2)+1`,
      and where the nodes sit decides which failures it survives.
  - term: shared fate
    definition: >-
      Things that look separate and depend on one component — a single vault
      cluster, one control plane, one DNS zone, one deployment pipeline.
  - term: blast radius
    definition: >-
      What one failure takes with it. The same question as A04.4's, asked about
      infrastructure rather than credentials.
  - term: RPO and RTO
    definition: >-
      How much data you may lose, and how long recovery may take. Both are
      decisions; left unstated they are whatever the system happens to do.
  - term: failover
    definition: >-
      Switching to a standby. It is a procedure with its own failure modes, and
      an untested one is a plan rather than a capability.
  - term: static stability
    definition: >-
      Continuing to work during a failure without needing a control plane to
      act. It is why a data plane that keeps serving beats one that must be
      rescued.

foreshadows:
  - "E27's Kubernetes topology constraints are the placement decisions computed here."
  - "F37's SLOs are these numbers, chosen deliberately and then measured."
  - "H45's multi-region architecture is this topic at the next scale."
  - "H47's disaster recovery turns RPO and RTO from terms into tested procedures."

