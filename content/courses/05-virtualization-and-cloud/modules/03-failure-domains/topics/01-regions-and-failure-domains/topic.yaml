    verb: describe
    statement: >-
      Describe what a region and an availability zone are, and which failures
      each boundary is drawn against.
    assessed_by: [quiz.q1, quiz.q2, lab.count-the-domains, exercise.e1]

  - id: OBJ-A05.3.2
    level: L1
    verb: identify
    statement: >-
      Identify the failure domains a deployment spans, and what shares a fate
      within each.
    assessed_by: [quiz.q3, quiz.q4, lab.count-the-domains]

  - id: OBJ-A05.3.3
    level: L2
    verb: calculate
    statement: >-
      Calculate composite availability for components in series and in parallel,
      and convert it to downtime.
    assessed_by: [quiz.q5, quiz.q6, lab.compose-the-numbers, exercise.e2, assessment.A]

  - id: OBJ-A05.3.4
    level: L2
    verb: explain
    statement: >-
      Explain why parallel redundancy only multiplies availability when failures
