id: topic.regions-and-failure-domains
slug: regions-and-failure-domains
title: "Failure Domains: What Actually Shares a Fate"
summary: >-
  Redundancy adds nines quickly and only when failures are independent, which
  they almost never are. This topic computes what a topology really survives —
  including the result that three quorum nodes across two zones tolerate a
  random zone loss half the time.
order: 1
levels: [L1, L2]
estimated_minutes: 120
status: published

prerequisites:
  - topic: topic.service-models-and-responsibility
    hardness: required

