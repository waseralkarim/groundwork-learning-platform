id: lab.killed-at-sixty-percent
topic: topic.virtual-memory
title: "Challenge: killed with headroom to spare"
type: challenge
tier: 2
image: groundwork/lab-foundations:1
duration_minutes: 25
objectives: [OBJ-A01.4.6]

intro: >-
  A service is killed. Its own memory graph shows it using well under the
  limit at the moment of death, and the team's conclusion is that the platform
  is broken.


  You are going to reproduce that exact situation deliberately, then produce the
  evidence that explains it. The reproduction matters: this is the memory
  incident people misdiagnose most often, and the wrong fix — raising the limit
  — sometimes works, which is what keeps it alive.

setup:
  - /opt/lab/seed.sh

steps:
  - id: s1
    instruction: >-
      Before running anything, write at least two hypotheses to /tmp/hypotheses,
      one per line: reasons a container might be OOM-killed while the
      application's own memory looks modest.
    walkthrough: |
      printf 'page cache counts toward the limit\nthe application under-reports its own memory\nanother process in the container is using memory\n' > /tmp/hypotheses
    verify:
      - type: file_exists
        path: /tmp/hypotheses
        describe: You recorded hypotheses first
      - type: command_output
        command: "wc -l < /tmp/hypotheses"
        pattern: "[2-9]"
        describe: At least two hypotheses

  - id: s2
    instruction: >-
      Set the scene. Spool 200 MB of scratch data to /tmp — the sort of thing a
      service does with an upload — then record the limit, the current charge,
      and the anon/file split to /tmp/before.


      This is a container doing ordinary work: writing a temporary file. Nothing
      is wrong yet.
    hint: >-
      `dd if=/dev/zero of=/tmp/scratch bs=1M count=200`, then read
      memory.max, memory.current and the anon/file lines of memory.stat.
    walkthrough: |
      dd if=/dev/zero of=/tmp/scratch bs=1M count=200 2>/dev/null
      {
        echo "max=$(cat /sys/fs/cgroup/memory.max)"
        echo "current=$(cat /sys/fs/cgroup/memory.current)"
        grep -E '^(anon|file) ' /sys/fs/cgroup/memory.stat
      } > /tmp/before
      cat /tmp/before
    verify:
      - type: file_matches
        path: /tmp/before
        pattern: 'current=\d+'
        describe: The starting charge was recorded
      - type: file_matches
        path: /tmp/before
        pattern: '^file \d+'
        describe: The page cache figure was recorded

  - id: s3
    instruction: >-
      Now be the application. Run /opt/lab/eat-memory asking for more anonymous
      memory than the container has left — 400 MB allocated and touched — in the
      foreground, and capture what happens to /tmp/answer-outcome.


      Read the exit status carefully.
    hint: >-
      `/opt/lab/eat-memory 400 400; echo "exit=$?" > /tmp/answer-outcome`. An
      exit status of 137 means SIGKILL.
    walkthrough: |
      /opt/lab/eat-memory 400 400 >/dev/null 2>&1
      echo "exit=$?" > /tmp/answer-outcome
      cat /tmp/answer-outcome
    verify:
      - type: file_matches
        path: /tmp/answer-outcome
        pattern: 'exit=(137|9|1)'
        describe: The process was killed rather than returning normally

  - id: s4
    instruction: >-
      Find the kernel's own record of the kill. The container cannot read
      `dmesg`, but the cgroup keeps counters.


      Save them to /tmp/answer-events, and make sure the file shows a non-zero
      oom_kill count.
    hint: "`cat /sys/fs/cgroup/memory.events` — look for `oom` and `oom_kill`."
    walkthrough: |
      cat /sys/fs/cgroup/memory.events > /tmp/answer-events
      cat /tmp/answer-events
    verify:
      - type: file_matches
        path: /tmp/answer-events
        pattern: 'oom_kill [1-9]'
        describe: The cgroup recorded an OOM kill

  - id: s5
    instruction: >-
      Now the diagnosis. Record the anon and file figures again to /tmp/after,
      and compare them with /tmp/before.


      Then write to /tmp/answer-cause which kind of memory — the single word
      `anon` or `file` — was responsible for the kill.
    walkthrough: |
      grep -E '^(anon|file) ' /sys/fs/cgroup/memory.stat > /tmp/after
      echo "--- before ---"; cat /tmp/before
      echo "--- after ---"; cat /tmp/after
      echo anon > /tmp/answer-cause
    verify:
      - type: file_matches
        path: /tmp/after
        pattern: '^file \d+'
        describe: The page cache figure was captured after the kill
      - type: file_matches
        path: /tmp/answer-cause
        pattern: '^anon$'
        describe: You identified anonymous memory as the cause

  - id: s6
    instruction: >-
      Explain the incident in at least thirty words in /tmp/answer-why: why the
      container reached its limit, what the kernel did before killing anything,
      and why the application's own memory graph looked healthy until the end.
    walkthrough: |
      cat > /tmp/answer-why <<'EOF'
      The limit counts the scratch file as well as the application's own memory,
      because /tmp is a tmpfs and the file is held in RAM. That charge cannot be
      reclaimed, so it permanently reduced the headroom available to the heap.
      The application then allocated anonymous memory on top, the total exceeded
      the limit with nothing left to give back, and the kernel killed the
      process. The application's own graph never saw the file at all.
      EOF
    verify:
      - type: command_output
        command: "wc -w < /tmp/answer-why"
        pattern: "([3-9][0-9]|[0-9]{3,})"
        describe: At least thirty words of explanation
      - type: file_matches
        path: /tmp/answer-why
        pattern: "cache|reclaim"
        describe: You named reclaim as what happened before the kill

solution: |
  ```bash
  dd if=/dev/zero of=/tmp/scratch bs=1M count=200               # spool scratch data
  cat /sys/fs/cgroup/memory.current
  grep -E '^(anon|file) ' /sys/fs/cgroup/memory.stat

  /opt/lab/eat-memory 400 400 ; echo "exit=$?"   # 137 — SIGKILL
  cat /sys/fs/cgroup/memory.events               # oom_kill 1
  grep -E '^(anon|file) ' /sys/fs/cgroup/memory.stat
  ```

  **What actually happened, in order.**

  1. Writing 200 MB of scratch data to `/tmp` charged the cgroup, because `/tmp`
     is a tmpfs — the file *is* memory. Nothing looked wrong, and the
     application had allocated none of it.
  2. That charge is not reclaimable. It appears on the `file` line, which is
     usually the reclaimable half, but tmpfs has no disk copy to be dropped to.
     The container's usable headroom was permanently reduced.
  3. The application then asked for anonymous memory and began touching it.
  4. The total passed the limit. The kernel looked for something to reclaim and
     found nothing: the heap cannot be dropped, and neither can the tmpfs file.
  5. It killed the largest process in the group. SIGKILL, exit 137, no handler,
     no final log line.

  **Why the application's graph looked fine.** It was plotting its own heap,
  which never approached the limit — the limit was being approached by heap plus
  a temporary file the application did not think of as memory. Everything the
  team was looking at was accurate and irrelevant.

  **The trap in the `file` line.** On most systems `file` means page cache and
  is reclaimable, which makes a high figure harmless. Here it was tmpfs, and
  reading the number without checking the `shmem` line would lead to exactly the
  wrong conclusion: "most of the charge is reclaimable, we have headroom".

  **Why "raise the limit" is not the diagnosis.** It often works, which is the
  trap. A bigger limit means more room for both, so the kill happens later or
  not at all. But nobody has learned that a temporary file is competing with the
  heap for the same budget — and the next service to spool a larger upload will
  find the new limit too.

  **The reading that gives you the answer in ten seconds:**

  ```bash
  grep -E '^(anon|file|shmem) ' /sys/fs/cgroup/memory.stat
  cat /sys/fs/cgroup/memory.events
  ```

  | What you see | What it means |
  |---|---|
  | `anon` near the limit | The application genuinely needs that memory, or leaks |
  | `file` high and `shmem` high | A tmpfs is holding it. Not reclaimable, despite the line it is on |
  | `file` high and `shmem` low | Real page cache. Usually harmless |
  | `oom_kill` non-zero | Something died. This is never a false positive |

  **Where this goes.** In Kubernetes this is a pod with exit code 137 and reason
  `OOMKilled`, and the same two files are readable from the node. The fix is
  chosen the same way: find out which half of the charge was at the limit before
  changing anything (**E29**, **E31**).
