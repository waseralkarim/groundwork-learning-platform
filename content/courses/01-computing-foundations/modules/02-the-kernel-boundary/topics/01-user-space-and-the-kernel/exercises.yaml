topic: topic.user-space-and-the-kernel

exercises:
  - id: e1
    title: Order the journey of one printf
    level: L2
    objectives: [OBJ-A01.3.3]
    kind: ordering
    prompt: >-
      Put these events in the order they happen when a C program calls
      `printf("hello\n")` with stdout connected to a terminal:


      1. The CPU switches to ring 0 and jumps to the kernel's entry point

      2. libc formats the string into its own buffer

      3. The kernel copies the bytes out of the process's memory

      4. libc loads the syscall number and arguments into registers

      5. The kernel returns the number of bytes accepted

      6. libc decides the buffer should be flushed now
    answer: "2, 6, 4, 1, 3, 5"
    explanation: >-
      Everything up to step 4 happens entirely in user space, in the process's
      own memory, at its own privilege level — formatting and the buffering
      decision are libc's business and the kernel knows nothing about them.


      The crossing is a single instruction between steps 4 and 1. Only after
      that does the kernel exist in this story: it validates the descriptor,
      copies the bytes across the boundary deliberately rather than trusting the
      pointer, and returns a count.


      The one people place wrongly is step 6. Whether to flush is decided in user
      space, before any crossing — which is why redirecting stdout to a file
      changes the behaviour without changing a line of code.

  - id: e2
    title: Read three timing profiles
    level: L2
    objectives: [OBJ-A01.3.4]
    kind: interpretation
    prompt: >-
      For each of these, say what the program is doing and what you would
      investigate next:


      **A** — real 12.0s, user 11.6s, sys 0.2s


      **B** — real 12.0s, user 0.3s, sys 11.4s


      **C** — real 12.0s, user 0.2s, sys 0.3s
    answer: >-
      A is compute-bound — use a profiler, not strace. B is syscall-bound — use
      `strace -c` to find the call being made too often. C is waiting on
      something external — the CPU was idle, so look at I/O, locks, or a remote
      dependency.
    explanation: >-
      The rule is that user plus sys is CPU actually consumed, and real is wall
      clock. When they are close, the process was running the whole time and the
      split tells you where; when real greatly exceeds their sum, the process was
      blocked and neither number is the story.


      In **C**, 11.5 of the 12 seconds are unaccounted for by any CPU time at
      all. That is a process asleep waiting — a slow query, a lock, a network
      call — and both a profiler and strace will mislead you, because there is
      almost nothing to sample and one blocked call to see.


      This one triage step takes five seconds and eliminates two of three
      possible investigations.

  - id: e3
    title: Three capability decisions
    level: L3
    objectives: [OBJ-A01.3.6]
    kind: short_answer
    prompt: >-
      For each requirement, state the minimum privilege that satisfies it:


      **A** — A Go web server must listen on port 80.


      **B** — A backup container must read every file in a volume, including
      ones owned by other users with mode 600.


      **C** — A monitoring agent must read the kernel log ring buffer with
      `dmesg`.
    answer: >-
      A — CAP_NET_BIND_SERVICE, or bind a high port and map 80 to it at the load
      balancer. B — CAP_DAC_READ_SEARCH, which bypasses read permission checks
      without granting write. C — CAP_SYSLOG.
    explanation: >-
      The habit worth building is asking "which single capability" rather than
      "does this need root", because the second question has no useful answer.


      **A** has a better answer than the capability: publishing container port
      8080 as host port 80, or terminating at an ingress, removes the
      requirement entirely. The best privilege is the one you did not need.


      **B** is the one people get wrong, reaching for CAP_DAC_OVERRIDE, which
      bypasses read *and* write checks. CAP_DAC_READ_SEARCH bypasses only reads
      and directory traversal — strictly less authority for a backup job that
      never writes.


      **C** is why `dmesg` fails in most containers even as root: CAP_SYSLOG is
      not in the default set.

  - id: e4
    title: Attribute four refusals
    level: L3
    objectives: [OBJ-A01.3.7]
    kind: short_answer
    prompt: >-
      Give the likely errno and the layer that refused each of these, in a
      container running as root with default Docker settings:


      **A** — Writing to /etc/hosts when the root filesystem is mounted
      read-only.


      **B** — Opening a file owned by uid 1000 with mode 600, as uid 1000, from a
      process whose working directory lacks execute permission on a parent
      directory.


      **C** — Calling `mount -t tmpfs`.


      **D** — Binding to port 443.
    answer: >-
      A — EROFS, the mount. B — EACCES, the file permission check (path
      traversal needs `x` on every directory). C — EPERM, missing CAP_SYS_ADMIN.
      D — EPERM without CAP_NET_BIND_SERVICE, but Docker's default set includes
      it, so this one succeeds.
    explanation: >-
      Four superficially similar failures, four different layers.


      **B** is the one that wastes afternoons. The file's own mode is correct and
      the user is right, and it still fails — because reaching a file requires
      `x` on every directory in the path. `ls -ld` on each component finds it in
      seconds; staring at the file itself never will.


      **D** matters because it is the exception. Docker's default fourteen
      capabilities include CAP_NET_BIND_SERVICE, so binding 443 as root in a
      container works — which is exactly why it breaks the moment someone adds
      `cap_drop: [ALL]` for hardening, with a puzzling EPERM from code that has
      always worked.
