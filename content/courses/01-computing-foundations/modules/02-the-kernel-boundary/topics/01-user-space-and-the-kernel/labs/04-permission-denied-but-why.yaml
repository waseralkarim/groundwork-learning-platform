id: lab.permission-denied-but-why
topic: topic.user-space-and-the-kernel
title: "Challenge: permission denied, but why?"
type: challenge
tier: 2
image: groundwork/lab-foundations:1
duration_minutes: 25
objectives: [OBJ-A01.3.7]

intro: >-
  Three operations. All three will be refused. All three print something that
  reads like "you are not allowed", and all three have different causes and
  different fixes.


  One of them you can fix from inside this container in a single command. The
  other two you cannot fix at all from here, and knowing which is which is the
  whole skill. Work out what refused each one before you read anything.

setup:
  - /opt/lab/seed.sh
  - /opt/lab/seed-boundary.sh

steps:
  - id: s1
    instruction: >-
      Before running anything, write at least two hypotheses to /tmp/hypotheses,
      one per line — reasons an operation might be refused on a Linux system.


      Write them now. Diagnosis you commit to before seeing evidence is the only
      kind that teaches you anything.
    hint: >-
      There are at least four distinct mechanisms that can refuse an operation,
      and only one of them is about file modes.
    walkthrough: |
      printf 'file permissions are wrong\nthe filesystem is read-only\na capability is missing\n' > /tmp/hypotheses
    verify:
      - type: file_exists
        path: /tmp/hypotheses
        describe: You recorded hypotheses first
      - type: command_output
        command: "wc -l < /tmp/hypotheses"
        pattern: "[2-9]"
        describe: At least two hypotheses

  - id: s2
    instruction: >-
      Now collect the evidence. Attempt all three of these, capturing every
      message — including the errors — into /tmp/diagnosis:


      1. Read /tmp/challenge/secret.txt

      2. Create a file at /opt/lab/newfile

      3. Change the owner of /tmp/challenge/marker to root
    walkthrough: |
      cat /tmp/challenge/secret.txt >> /tmp/diagnosis 2>&1
      touch /opt/lab/newfile >> /tmp/diagnosis 2>&1
      chown root /tmp/challenge/marker >> /tmp/diagnosis 2>&1
      cat /tmp/diagnosis
    verify:
      - type: file_matches
        path: /tmp/diagnosis
        pattern: "Permission denied"
        describe: The first refusal was captured
      - type: file_matches
        path: /tmp/diagnosis
        pattern: "Read-only file system"
        describe: The second refusal was captured
      - type: file_matches
        path: /tmp/diagnosis
        pattern: "not permitted"
        describe: The third refusal was captured

  - id: s3
    instruction: >-
      Three different messages mean three different errno values. Write them to
      /tmp/answer-errnos, one per line and in the order you attempted them,
      using their C names.


      If you are unsure which name goes with which message, `strace` the command
      and read the failing call's return value.
    hint: >-
      `strace -e trace=openat cat /tmp/challenge/secret.txt` prints the errno
      name directly. The three you want are among EACCES, EPERM, EROFS.
    walkthrough: |
      strace -e trace=openat cat /tmp/challenge/secret.txt 2>&1 | tail -3
      printf 'EACCES\nEROFS\nEPERM\n' > /tmp/answer-errnos
    verify:
      - type: file_matches
        path: /tmp/answer-errnos
        pattern: '^EACCES$'
        describe: The unreadable file was EACCES
      - type: file_matches
        path: /tmp/answer-errnos
        pattern: '^EROFS$'
        describe: The read-only path was EROFS
      - type: file_matches
        path: /tmp/answer-errnos
        pattern: '^EPERM$'
        describe: The ownership change was EPERM

  - id: s4
    instruction: >-
      Exactly one of the three is fixable from inside this container. Fix it and
      read the file, saving its contents to /tmp/answer-secret.


      Think about which one before you try: you own the file, but you are not
      root, the root filesystem is read-only, and your capability set is empty.
    walkthrough: |
      chmod 400 /tmp/challenge/secret.txt
      cat /tmp/challenge/secret.txt > /tmp/answer-secret
    verify:
      - type: file_matches
        path: /tmp/answer-secret
        pattern: "mode bits"
        describe: You fixed the permission check and read the file
      - type: command_ran
        pattern: "chmod"
        describe: You fixed it by changing the mode, not by escalating

  - id: s5
    instruction: >-
      Say why the other two cannot be fixed from in here. Write at least twenty
      words to /tmp/answer-why, naming what would have to change and where that
      change would have to be made.
    hint: >-
      One is a property of how the filesystem was mounted; the other is a
      property of the process's capability set. Neither is a property of any
      file.
    walkthrough: |
      cat > /tmp/answer-why <<'EOF'
      The read-only failure is a mount option, so it can only be changed by
      whoever started this container by not mounting the root filesystem
      read-only. The ownership failure needs cap_chown, which is granted at
      container start and cannot be gained from inside because the bounding set
      is empty and no-new-privileges is set.
      EOF
    verify:
      - type: command_output
        command: "wc -w < /tmp/answer-why"
        pattern: "([2-9][0-9]|[0-9]{3,})"
        describe: At least twenty words of explanation
      - type: file_matches
        path: /tmp/answer-why
        pattern: "mount|read-only|capab"
        describe: You named the mechanism rather than the message

solution: |
  ```bash
  cat /tmp/challenge/secret.txt              # Permission denied      → EACCES
  touch /opt/lab/newfile                     # Read-only file system  → EROFS
  chown root /tmp/challenge/marker           # Operation not permitted → EPERM

  strace -e trace=openat cat /tmp/challenge/secret.txt   # names the errno directly

  chmod 400 /tmp/challenge/secret.txt        # the one fixable failure
  cat /tmp/challenge/secret.txt > /tmp/answer-secret
  ```

  **Three refusals, three mechanisms.**

  **EACCES — the file permission check.** The file was mode `000`, and DAC
  applies to the owner too. You own it, so you may change its mode; changing the
  mode of your own file requires no capability. This is the only one of the
  three that a process can resolve on its own, and it is resolved with `chmod`.

  **EROFS — the mount.** `/opt/lab` is on the container's root filesystem, which
  was mounted read-only when the container started. This has nothing to do with
  who you are: root would be refused identically. There is no command that fixes
  it from inside, because the property does not belong to the file, the user or
  the process — it belongs to the mount, and the mount was made before your
  first instruction ran.

  **EPERM — the capability.** Changing a file's owner requires `CAP_CHOWN`.
  Your effective set is empty, your bounding set is empty, and `NoNewPrivs` is
  set, so the capability cannot be acquired by any means available to you. The
  fix is `--cap-add=CHOWN` at container start — outside, before the process
  exists.

  **Why the distinction is worth the effort.**

  These print as "Permission denied", "Read-only file system" and "Operation not
  permitted", and under pressure people read all three as "permissions" and
  start running `chmod` and `chown`. On two of the three, that cannot possibly
  work, and the time is gone before anyone questions the assumption.

  The reliable habit is to get the errno instead of the message:

  ```bash
  strace -f -e trace=openat,chown,mount ./failing-program 2>&1 | grep -E 'EACCES|EPERM|EROFS'
  ```

  Then the fix follows directly:

  | errno | Fix | Where |
  |---|---|---|
  | `EACCES` | `chmod` / `chown` / run as the right user | Inside, usually |
  | `EROFS` | Write somewhere writable, or change the mount | Outside |
  | `EPERM` | Add the one capability the call needs | Outside, at start |

  **Where this goes.** Every one of these appears in **C16** as a container
  configuration decision, and in **E29** as a `securityContext` field. A
  read-only root filesystem with a writable volume for the paths that need it is
  the recommended shape — and the reason it surprises people is that it produces
  `EROFS` from code that has always worked, which now you can read in one
  glance.
