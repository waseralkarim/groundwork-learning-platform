id: lab.every-crossing
topic: topic.user-space-and-the-kernel
title: Watch every crossing a program makes
type: guided
tier: 2
image: groundwork/lab-foundations:1
duration_minutes: 25
objectives: [OBJ-A01.3.1, OBJ-A01.3.2, OBJ-A01.3.3]

intro: >-
  Every effect a program has on anything outside its own memory is a system
  call. That is a complete list, not a summary — which means you can watch all
  of it, for any binary, without its source.


  You will trace `ls`, find the one call that started it, find the calls that
  loaded its libraries, and then find a call that does not appear at all.

setup:
  - /opt/lab/seed.sh

steps:
  - id: s1
    instruction: >-
      Get a summary of every system call `ls /tmp` makes, written to
      /tmp/answer-counts. Use the counting mode rather than the full trace —
      it is the form you would actually use on a real process.
    hint: "`strace -c -o /tmp/answer-counts /bin/ls /tmp`"
    walkthrough: |
      strace -c -o /tmp/answer-counts /bin/ls /tmp
    verify:
      - type: file_exists
        path: /tmp/answer-counts
        describe: The summary was captured
      - type: file_matches
        path: /tmp/answer-counts
        pattern: "total"
        describe: It is a strace summary with a total line
      - type: command_ran
        pattern: "strace"
        describe: You used strace to produce it

  - id: s2
    instruction: >-
      Listing one directory took dozens of calls. Most of them ran before your
      program did anything at all.


      Trace only `execve` and record how many there were, as a bare number, in
      /tmp/answer-execve. Think about what that number tells you before you run
      it.
    hint: >-
      `strace -f -e trace=execve -o /tmp/e.txt /bin/ls /tmp` then count the lines
      that contain `execve(`.
    walkthrough: |
      strace -f -e trace=execve -o /tmp/e.txt /bin/ls /tmp
      grep -c 'execve(' /tmp/e.txt > /tmp/answer-execve
    verify:
      - type: file_matches
        path: /tmp/answer-execve
        pattern: '^1$'
        describe: Exactly one execve started the program

  - id: s3
    instruction: >-
      `ls` does not contain the code for `printf` or `opendir` — it is
      dynamically linked, so something has to load the C library at startup.


      Trace `openat` and save the line that opens libc to /tmp/answer-libc.
    hint: "`strace -e trace=openat -o /tmp/o.txt /bin/ls /tmp` then grep for libc."
    walkthrough: |
      strace -e trace=openat -o /tmp/o.txt /bin/ls /tmp
      grep libc /tmp/o.txt > /tmp/answer-libc
    verify:
      - type: file_matches
        path: /tmp/answer-libc
        pattern: "libc"
        describe: You found the call that loads the C library
      - type: file_matches
        path: /tmp/answer-libc
        pattern: "openat"
        describe: The library was opened with openat

  - id: s4
    instruction: >-
      Now find the call that actually produces output. Trace only `write` for a
      command that prints one word, saving it to /tmp/answer-write.


      Look at the first argument. That number is the file descriptor, and you
      already know which one it is.
    hint: "`strace -e trace=write -o /tmp/answer-write /bin/echo boundary`"
    walkthrough: |
      strace -e trace=write -o /tmp/answer-write /bin/echo boundary
    verify:
      - type: file_matches
        path: /tmp/answer-write
        pattern: 'write\(1'
        describe: The output was a write to file descriptor 1

  - id: s5
    instruction: >-
      Look at what is linked into every process on the machine. Save the first
      line of `ldd /bin/ls` to /tmp/answer-vdso.


      The entry you find has no path, because it is not a file. The kernel maps
      it into every process.
    hint: "`ldd /bin/ls | head -1 > /tmp/answer-vdso`"
    walkthrough: |
      ldd /bin/ls | head -1 > /tmp/answer-vdso
    verify:
      - type: file_matches
        path: /tmp/answer-vdso
        pattern: "vdso"
        describe: You found the vDSO mapped into the process

  - id: s6
    instruction: >-
      That mapping is kernel code running at your privilege level, and it exists
      so a few very frequent calls never have to cross the boundary.


      Trace `clock_gettime` while running `date` — a command that certainly
      reads the clock — and record how many calls appeared, as a bare number, in
      /tmp/answer-clock.
    hint: >-
      `strace -e trace=clock_gettime -o /tmp/c.txt /bin/date`, then count the
      lines starting with `clock_gettime`. Expect a surprise.
    walkthrough: |
      strace -e trace=clock_gettime -o /tmp/c.txt /bin/date
      grep -c '^clock_gettime' /tmp/c.txt > /tmp/answer-clock || echo 0 > /tmp/answer-clock
    verify:
      - type: file_matches
        path: /tmp/answer-clock
        pattern: '^0$'
        describe: The clock was read without any boundary crossing

solution: |
  ```bash
  strace -c -o /tmp/answer-counts /bin/ls /tmp

  strace -f -e trace=execve -o /tmp/e.txt /bin/ls /tmp
  grep -c 'execve(' /tmp/e.txt > /tmp/answer-execve        # 1

  strace -e trace=openat -o /tmp/o.txt /bin/ls /tmp
  grep libc /tmp/o.txt > /tmp/answer-libc

  strace -e trace=write -o /tmp/answer-write /bin/echo boundary

  ldd /bin/ls | head -1 > /tmp/answer-vdso

  strace -e trace=clock_gettime -o /tmp/c.txt /bin/date
  grep -c '^clock_gettime' /tmp/c.txt > /tmp/answer-clock  # 0
  ```

  **What each step showed.**

  **One `execve`.** A program is started exactly once, by the call that replaces
  the process image. Everything after it is that program running — which is why
  `strace -f -e trace=execve` is the fastest way to see what a shell script
  actually invokes, wrappers and all.

  **`openat` on libc.** The dynamic loader ran before `main`. Those opens are
  the mechanism behind `version GLIBC_2.34 not found` and behind the difference
  between a 5 MB static Go image and a 50 MB dynamically linked one.

  **`write(1, ...)`.** File descriptor 1 is stdout, which you met as a
  convention in **Processes**. Here it is as a bare integer in a register —
  which is all it ever was.

  **The vDSO.** `linux-vdso.so.1` has no path because it is not on disk. The
  kernel maps a page of its own code into every process precisely so the most
  frequent calls need no crossing.

  **Zero `clock_gettime`.** `date` certainly read the clock. It did it through
  the vDSO, in ring 3, without a single crossing — which is why the count is
  zero and why `strace` showed nothing.

  That last one is the important habit. `strace` shows you crossings, not work.
  A call you cannot find in the trace has not necessarily been skipped: it may
  simply never have needed the kernel.
