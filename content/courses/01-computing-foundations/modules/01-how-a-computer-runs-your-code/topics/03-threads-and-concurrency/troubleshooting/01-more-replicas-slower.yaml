id: troubleshooting.more-replicas-slower
topic: topic.threads-and-concurrency
title: We doubled the workers and p99 got worse
level: L3
objectives: [OBJ-A01.6.5, OBJ-A01.6.6]
reveal_policy: progressive

situation: >-
  A JSON transformation service runs as 6 Kubernetes replicas with a 500m CPU
  limit each. Under load its p99 latency is 800ms, which is too slow, so the
  team doubled its worker threads from 4 to 8 in the hope of getting through
  more requests per pod.


  p99 went to 1.9 seconds. CPU utilisation on the dashboard *fell* from 62% to
  48%. The horizontal autoscaler, configured at 80% CPU, has never fired.


  The next proposed change is to move to larger nodes. You have been asked
  whether that will help.

symptoms:
  - "p99 latency rose from 800ms to 1.9s after doubling worker threads"
  - "CPU utilisation fell from 62% to 48% at the same time"
  - "The HPA at 80% CPU has never triggered, in either configuration"
  - "Throughput per pod is roughly unchanged"
  - "No errors, no restarts, memory flat"
  - "It is fast in local testing on a developer laptop"

artifacts:
  - type: config
    label: The deployment
    content: |
      resources:
        requests: { cpu: 250m, memory: 256Mi }
        limits:   { cpu: 500m, memory: 512Mi }
      env:
        - name: WORKER_THREADS
          value: "8"        # was 4
      ---
      # HorizontalPodAutoscaler
      metrics:
        - type: Resource
          resource:
            name: cpu
            target: { type: Utilization, averageUtilization: 80 }

  - type: command_output
    label: Inside a pod, before and after the change
    content: |
      $ cat /sys/fs/cgroup/cpu.max
      50000 100000

      # with WORKER_THREADS=4
      $ grep -E 'nr_periods|nr_throttled|throttled_usec' /sys/fs/cgroup/cpu.stat
      nr_periods 5981
      nr_throttled 1789
      throttled_usec 41203551

      # with WORKER_THREADS=8, same load, same duration
      $ grep -E 'nr_periods|nr_throttled|throttled_usec' /sys/fs/cgroup/cpu.stat
      nr_periods 5977
      nr_throttled 4402
      throttled_usec 158904770

  - type: command_output
    label: What the runtime thinks it has
    content: |
      $ nproc
      64
      $ ls /proc/1/task | wc -l
      41

  - type: metric
    label: The dashboard the team was reading
    content: |
      container_cpu_usage_seconds_total (rate, as % of limit)
        4 workers:  62%
        8 workers:  48%
      No panel exists for container_cpu_cfs_throttled_seconds_total

diagnostic_questions:
  - "What does cpu.max say the pod may use, and how does that compare with nproc?"
  - "What happened to nr_throttled and throttled_usec between the two runs?"
  - "Why would CPU utilisation fall while latency rose?"
  - "Why has the autoscaler never fired?"
  - "Would larger nodes change any of this?"

hints:
  - "Compare the two throttling figures before looking at anything else."
  - "A throttled container is idle while it is stopped. What does that do to a utilisation graph?"
  - "The pod has 41 threads. Where did the extra ones come from?"
  - "The limit is per pod. What does the node's size have to do with it?"

root_cause: >-
  The pods are throttled, and doubling the workers made it worse.


  `cpu.max` is `50000 100000` — half a CPU per pod. Four busy workers already
  exhausted that quota in about 30% of periods; eight workers exhaust it in about
  74%, and `throttled_usec` nearly quadrupled for the same load. Every worker is
  stopped for the remainder of each period in which the quota runs out, so each
  request spends far more wall time waiting.


  CPU utilisation fell for the same reason: a stopped container is idle. The
  metric is measuring consumption, and consumption is capped — so more throttling
  produces a *lower* utilisation figure alongside worse latency. The HPA reads
  that same figure, which is why it has never fired.


  The 41 threads are a second symptom of one cause: the runtime read `nproc` as
  64 and sized its internal pools accordingly, on a pod entitled to half a core.


  Node size is irrelevant. The constraint is the per-pod quota, and it does not
  change when the node gets bigger.

method: >-
  **1. Read the limit before anything else.** `50000 100000` is half a CPU. Eight
  worker threads on half a CPU is the whole story in one line, and everything
  else is confirmation.


  **2. Compare the throttling counters across the change.** `nr_throttled` went
  from 1,789 of 5,981 periods to 4,402 of 5,977 — from a third to three quarters
  — and `throttled_usec` nearly quadrupled under identical load. That is a
  measurement of the cause, not an inference about it.


  **3. Explain the falling utilisation rather than dismissing it.** It is the
  detail that misled the team, and it is not an anomaly: throttled time is idle
  time, so worse throttling produces a lower utilisation figure. Any dashboard
  without a throttling panel will tell this story backwards.


  **4. Count the threads.** 41 threads in a pod with 500m of CPU says the runtime
  sized itself from `nproc`. That is a separate misconfiguration with the same
  root: a value describing the node, used by a process living in a container.


  **5. Test the proposal against the evidence.** Larger nodes change neither
  `cpu.max` nor the thread count. The proposal would cost money and change
  nothing measurable, and the counters above are what says so.

resolution: >-
  **Reduce the workers and tell the runtime the truth.**


  ```yaml
  env:
    - name: WORKER_THREADS
      value: "1"          # 500m of CPU supports one CPU-bound worker
    - name: GOMAXPROCS    # or the JVM's container support, or automaxprocs
      value: "1"
  ```


  For CPU-bound work the honest worker count is `ceil(quota / period)`, which is
  1 here. Expect latency to improve immediately, because requests stop queuing
  behind a spent quota.


  **Then decide whether the pod needs more CPU**, which is a different question
  from how many workers it runs:


  ```yaml
  resources:
    requests: { cpu: 500m }
    limits:   { cpu: "1" }
  ```


  Raise the limit, re-measure `throttled_usec`, and stop when it is near zero
  under peak load. That is the number that says whether the change worked, and it
  is unambiguous in a way that utilisation is not.


  **Fix the autoscaler**, which is currently blind:


  ```promql
  rate(container_cpu_cfs_throttled_periods_total[5m])
    / rate(container_cpu_cfs_periods_total[5m])
  ```


  Scale on that, or on a work signal such as queue depth or request rate. CPU
  utilisation cannot see the condition that is hurting this service.


  **And add the missing panel.** A dashboard with CPU utilisation and no
  throttling metric will produce this same wrong conclusion the next time — it
  is not that the team read the graph badly, it is that the graph could not show
  the problem.
