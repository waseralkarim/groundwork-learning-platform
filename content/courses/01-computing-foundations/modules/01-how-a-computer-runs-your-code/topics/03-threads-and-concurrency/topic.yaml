id: topic.threads-and-concurrency
slug: threads-and-concurrency
title: "Threads and Concurrency: Doing More Than One Thing"
summary: >-
  What a thread shares and what it keeps to itself, why adding workers can make
  a service slower, and how a CPU limit stops every thread at once. The topic
  that explains throttling.
order: 6
levels: [L2, L3]
estimated_minutes: 120
status: published

prerequisites:
  - topic: topic.processes
    hardness: required
  - topic: topic.virtual-memory
    hardness: recommended

objectives:
  - id: OBJ-A01.6.1
    level: L2
    verb: distinguish
    statement: >-
      Distinguish a thread from a process by what each shares and what each
      keeps private.
    assessed_by: [quiz.q1, quiz.q2, lab.count-the-threads]

  - id: OBJ-A01.6.2
    level: L2
    verb: interpret
    statement: >-
      Interpret a process's thread list, and identify which threads are doing
      the work.
    assessed_by: [quiz.q3, lab.count-the-threads, exercise.e1]

  - id: OBJ-A01.6.3
    level: L2
    verb: distinguish
    statement: >-
      Distinguish concurrency from parallelism, and say which one a single CPU
      can provide.
    assessed_by: [quiz.q4, quiz.q5, exercise.e2]

  - id: OBJ-A01.6.4
    level: L3
    verb: explain
    statement: >-
      Explain what a CPU limit actually restricts, and what happens to threads
      when the quota for a period is spent.
    assessed_by: [quiz.q6, quiz.q7, lab.the-limit-is-real, assessment.A]

  - id: OBJ-A01.6.5
    level: L3
    verb: measure
    statement: >-
      Measure CPU throttling in a cgroup, and relate it to the number of worker
      threads running.
    assessed_by: [quiz.q8, quiz.q9, lab.the-limit-is-real, lab.more-workers-made-it-slower]

  - id: OBJ-A01.6.6
    level: L3
    verb: diagnose
    statement: >-
      Diagnose a service that became slower after being given more workers, and
      identify the limit responsible.
    assessed_by: [quiz.q10, quiz.q11, lab.more-workers-made-it-slower, troubleshooting.more-replicas-slower]

  - id: OBJ-A01.6.7
    level: L3
    verb: explain
    statement: >-
      Explain how a lost update happens between two threads, and what a lock
      actually prevents.
    assessed_by: [quiz.q12, quiz.q13, lab.lost-updates, exercise.e3]

  - id: OBJ-A01.6.8
    level: L3
    verb: troubleshoot
    statement: >-
      Troubleshoot a stuck service, distinguishing a deadlock from saturation
      from waiting on something external.
    assessed_by: [quiz.q14, quiz.q15, exercise.e4, troubleshooting.everything-is-stuck, assessment.C]

terminology:
  - term: thread
    definition: >-
      A schedulable flow of execution inside a process. Shares the address
      space, open files and working directory with its siblings; has its own
      stack, registers and identifier.
  - term: TID
    definition: >-
      Thread identifier. The kernel schedules threads, not processes — a
      process's PID is simply the TID of its first thread.
  - term: concurrency
    definition: >-
      Several tasks in progress over the same period, interleaved. Possible on
      one CPU, and the property most servers actually need.
  - term: parallelism
    definition: >-
      Several tasks executing at the same instant. Requires more than one CPU,
      and is what a CPU limit below 1.0 makes impossible.
  - term: context switch
    definition: >-
      Saving one thread's state and restoring another's. Between threads of one
      process it is cheap; between processes the page tables change too.
  - term: cpu.max
    definition: >-
      The cgroup v2 CPU limit, written as quota and period in microseconds.
      "50000 100000" means 50ms of CPU time per 100ms — half a CPU.
  - term: throttling
    definition: >-
      What happens when a cgroup spends its quota before the period ends: every
      thread in it is stopped until the next period. Not slowed — stopped.
  - term: throttled_usec
    definition: >-
      The total time a cgroup spent stopped by its own limit, in cpu.stat. The
      single most useful CPU metric a container has, and almost nobody plots it.
  - term: race condition
    definition: >-
      A result that depends on the order two threads happened to interleave.
      The classic case is a lost update: two threads read the same value, both
      add one, and one increment disappears.
  - term: mutex
    definition: >-
      A lock ensuring one thread at a time runs a section of code. It does not
      make code fast, and it does not make it correct on its own — it makes an
      interleaving impossible.
  - term: deadlock
    definition: >-
      Two or more threads each holding something the other needs, so none can
      proceed. CPU usage falls to zero while the service appears to hang.
  - term: load average
    definition: >-
      A rolling count of runnable *and* uninterruptible tasks on Linux — which
      is why a machine waiting on I/O can show a high load average with an idle
      CPU.
  - term: thread pool
    definition: >-
      A fixed set of worker threads serving a queue of work. Sizing it from the
      machine's CPU count is the mistake this topic exists to prevent.
  - term: GOMAXPROCS
    definition: >-
      Go's limit on threads executing user code simultaneously. Defaults to the
      machine's CPU count, not the container's, which is the same bug the JVM
      has with memory.

foreshadows:
  - "CPU requests and limits in E29 are cpu.max, and the throttling metric is the one to alert on."
  - "Horizontal pod autoscaling on CPU utilisation misreads a throttled pod, because throttled time is not utilisation (E29)."
  - "Connection pool and worker sizing in B13 and C17 are this topic applied to databases and CI runners."
  - "Node CPU pressure and noisy neighbours in E31 are the same accounting from the cluster's side."

