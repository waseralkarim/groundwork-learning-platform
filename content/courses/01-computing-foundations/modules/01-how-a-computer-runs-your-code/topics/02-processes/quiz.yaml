id: quiz.processes
topic: topic.processes
pass_score: 70

questions:
  - id: q1
    type: single_choice
    level: L1
    objectives: [OBJ-A01.2.1]
    stem: What does a PID identify?
    options:
      - id: a
        text: A running process, uniquely, at this moment on this machine
        correct: true
      - id: b
        text: A program on disk
        note: >-
          A program has no PID. One program can be running as many processes at
          once, each with its own.
      - id: c
        text: A user's session
        note: >-
          Sessions group processes and have their own leader, but a PID belongs
          to a single process.
      - id: d
        text: A permanent identifier that always refers to the same process
        note: >-
          PIDs are recycled. A PID you noted a minute ago may now belong to
          something else entirely — which is why scripts should check before
          they signal.
    explanation: >-
      A PID is unique among running processes at a point in time, not over time.
      They wrap around and get reused, which is why `kill $(cat pidfile)` can
      signal the wrong process if the file is stale.

  - id: q2
    type: multi_choice
    level: L1
    objectives: [OBJ-A01.2.1]
    stem: Select everything the kernel tracks about a process.
    options:
      - id: a
        text: Its parent's PID
        correct: true
      - id: b
        text: Its open file descriptors
        correct: true
      - id: c
        text: Its state
        correct: true
      - id: d
        text: The source code it was compiled from
        note: >-
          The kernel knows which binary is mapped, not where it came from. It
          has no notion of source at all.
    explanation: >-
      The process table entry holds identity, ancestry, state, ownership, open
      descriptors and memory maps. Everything you can read under /proc/<pid>/ is
      the kernel exposing that entry.

  - id: q3
    type: single_choice
    level: L2
    objectives: [OBJ-A01.2.2]
    stem: What does fork() do?
    options:
      - id: a
        text: Creates a near-identical copy of the calling process with a new PID
        correct: true
      - id: b
        text: Starts a named program in a new process
        note: >-
          That is fork *plus* exec. fork alone creates a copy of what is already
          running — no new program is involved.
      - id: c
        text: Replaces the current program with a different one
        note: That is exec. It creates no process; the PID is unchanged.
      - id: d
        text: Creates a new thread inside the current process
        note: >-
          Threads share an address space. A forked child gets its own, which is
          the essential difference.
    explanation: >-
      fork duplicates the caller. The child differs only in its PID, its PPID and
      what the call returns — 0 in the child, the child's PID in the parent. That
      return value is how each side knows which one it is.

  - id: q4
    type: single_choice
    level: L2
    objectives: [OBJ-A01.2.2]
    stem: A process calls execve() successfully. What is its PID afterwards?
    options:
      - id: a
        text: Unchanged — same PID, different program
        correct: true
      - id: b
        text: A new PID, allocated for the new program
        note: >-
          exec creates no process, so there is nothing to allocate a PID for.
          This is the whole point of the call.
      - id: c
        text: The parent's PID
        note: The parent is unaffected and keeps its own PID.
      - id: d
        text: Always 1
        note: PID 1 is the first process at boot, unrelated to exec.
    explanation: >-
      exec replaces the program inside an existing process. Same PID, same PPID,
      same open descriptors, new code. This is why `exec "$@"` in a container
      entrypoint makes your application PID 1 rather than a child of the shell.

  - id: q5
    type: single_choice
    level: L2
    objectives: [OBJ-A01.2.3]
    stem: A process's parent exits while the child is still running. What happens to the child?
    options:
      - id: a
        text: It is reparented to PID 1 immediately
        correct: true
      - id: b
        text: It is killed along with its parent
        note: >-
          Children are not killed when a parent exits. This is exactly why a
          background job survives you logging out.
      - id: c
        text: It keeps running with no parent at all
        note: >-
          Every process except PID 1 has a parent. The kernel reparents orphans
          as part of process teardown, so a parentless process never exists.
      - id: d
        text: It becomes a zombie
        note: >-
          A zombie has *exited*. This child is still running — it is an orphan,
          which is a different thing.
    explanation: >-
      Reparenting to PID 1 is immediate and unconditional. It is how daemons
      detach — fork, let the parent exit, and the child is adopted by init.

  - id: q6
    type: single_choice
    level: L2
    objectives: [OBJ-A01.2.3]
    stem: >-
      `ps -ef --forest` shows sshd (PID 412, PPID 1), then your shell (PID 8835,
      PPID 8834). What can you conclude?
    options:
      - id: a
        text: Your shell was not forked directly by sshd — something in between was
        correct: true
      - id: b
        text: Your shell was forked directly by sshd
        note: >-
          Then its PPID would be 412. It is 8834, so there is another process
          between them.
      - id: c
        text: Your shell is an orphan
        note: An orphan has PPID 1. This one has PPID 8834.
      - id: d
        text: sshd is a child of your shell
        note: The arrow points the other way — sshd's PPID is 1.
    explanation: >-
      PPID 8834 is neither 412 nor 1, so an intermediate process exists — in
      practice the per-connection sshd that drops privileges before starting your
      shell. Reading PPIDs bottom-up reconstructs how any process came to exist.

  - id: q7
    type: single_choice
    level: L2
    objectives: [OBJ-A01.2.4]
    stem: A process is in state D. What is it doing?
    options:
      - id: a
        text: Waiting on I/O in a way the kernel will not interrupt
        correct: true
      - id: b
        text: Exiting
        note: A process that has exited and not been reaped is in state Z.
      - id: c
        text: Consuming CPU heavily
        note: >-
          That would be R. A process in D is consuming no CPU at all — it is
          waiting.
      - id: d
        text: Stopped by a debugger
        note: That is state T, and it is resumable with SIGCONT.
    explanation: >-
      D is uninterruptible sleep. Signals are not delivered, so kill -9 has no
      effect until the I/O completes. A growing number of D processes is a
      storage problem, and killing them cannot help.

  - id: q8
    type: single_choice
    level: L2
    objectives: [OBJ-A01.2.4]
    stem: How much memory does a zombie process occupy?
    options:
      - id: a
        text: None — it holds a process table entry and an exit code
        correct: true
      - id: b
        text: The same as it did while running
        note: >-
          Its memory was released when it exited. What remains is bookkeeping,
          not the process.
      - id: c
        text: A small fixed amount, a few kilobytes
        note: >-
          Its RSS is exactly 0. The table entry is kernel bookkeeping, not
          process memory.
      - id: d
        text: It depends on how long it has been a zombie
        note: Nothing about a zombie changes over time. It is inert.
    explanation: >-
      A zombie holds one process table entry and one integer. This is why
      zombie accumulation is dangerous in a way that is invisible on a memory
      graph — it exhausts PIDs, not RAM.

  - id: q9
    type: single_choice
    level: L2
    objectives: [OBJ-A01.2.5]
    stem: Which of these signals can a process choose to ignore?
    options:
      - id: a
        text: SIGTERM
        correct: true
      - id: b
        text: SIGKILL
        note: >-
          Cannot be caught, blocked or ignored. This is deliberate — the system
          needs a way to stop an uncooperative process.
      - id: c
        text: SIGSTOP
        note: >-
          Also uncatchable, for the same reason. It suspends rather than
          terminates, but the process gets no say either way.
      - id: d
        text: None of them — signals are always fatal
        note: >-
          Most signals are catchable, and several are ignored by default.
          SIGCHLD is ignored unless you ask for it.
    explanation: >-
      SIGTERM is catchable, which is exactly what makes graceful shutdown
      possible. SIGKILL and SIGSTOP are the two that cannot be caught, blocked or
      ignored.

  - id: q10
    type: single_choice
    level: L2
    objectives: [OBJ-A01.2.5]
    stem: >-
      A worker takes 60 seconds per job. Its orchestrator sends SIGTERM and
      SIGKILLs after 30 seconds. What happens to a job in flight?
    options:
      - id: a
        text: It is killed halfway through, every time
        correct: true
      - id: b
        text: The orchestrator waits for the job to finish
        note: >-
          The grace period is a fixed deadline, not a negotiation. Nothing
          extends it because work is still running.
      - id: c
        text: The job is automatically retried
        note: >-
          Retries are an application or queue concern. The kernel and the
          orchestrator do not know a job existed.
      - id: d
        text: SIGTERM is re-sent until the job completes
        note: >-
          One SIGTERM, then the deadline, then SIGKILL. Repeating the request
          would not help a process that is busy rather than ignoring it.
    explanation: >-
      The grace period must exceed the longest unit of work, or the work must be
      interruptible and resumable. This is the most common cause of "jobs
      mysteriously fail during deploys" — and it is a configuration mismatch,
      not a bug.

  - id: q11
    type: single_choice
    level: L3
    objectives: [OBJ-A01.2.6]
    stem: >-
      You run `kill -9 4821` and the process is still there afterwards. What are
      the two possible explanations?
    options:
      - id: a
        text: It is a zombie, or it is in uninterruptible sleep
        correct: true
      - id: b
        text: The process is catching SIGKILL
        note: >-
          SIGKILL cannot be caught. If this were possible, no process could ever
          be reliably stopped.
      - id: c
        text: You lack permission, and nothing else
        note: >-
          Permission would give you an error immediately. This case is about a
          kill that reported success and changed nothing.
      - id: d
        text: The process restarted with the same PID
        note: >-
          PIDs are allocated sequentially and rarely reused that fast. A
          supervisor restart would show a different PID.
    explanation: >-
      Either it already exited and is waiting to be reaped — nothing left to
      kill — or it is in state D, where signals are queued rather than delivered.
      `ps -o stat=` distinguishes them in one command, and the two have entirely
      different fixes.

  - id: q12
    type: single_choice
    level: L3
    objectives: [OBJ-A01.2.6]
    stem: >-
      A container takes exactly 10 seconds to stop, every time, and exits 0.
      What is happening?
    options:
      - id: a
        text: SIGTERM is being ignored, and the SIGKILL at the end of the grace period is what stops it
        correct: true
      - id: b
        text: The application is doing 10 seconds of cleanup
        note: >-
          Real cleanup varies in duration. A number identical to the grace
          period every time is the deadline, not the work.
      - id: c
        text: Docker is slow to send the signal
        note: >-
          SIGTERM is sent immediately. The ten seconds is the wait before
          escalating.
      - id: d
        text: The container is out of memory
        note: >-
          An OOM kill is immediate and reports exit code 137. This one exits 0
          after a consistent delay.
    explanation: >-
      Exactly the grace period, every time, is the signature of an ignored
      SIGTERM — usually because the application is PID 1 with no handler, so the
      kernel discards the signal. No cleanup ran, and exit code 0 reports no
      problem.

  - id: q13
    type: single_choice
    level: L3
    objectives: [OBJ-A01.2.7]
    stem: Why does the kernel treat PID 1 differently from every other process?
    options:
      - id: a
        text: Default signal actions are not applied to it, so a signal with no handler is discarded
        correct: true
      - id: b
        text: It runs with higher priority than other processes
        note: >-
          Priority is unrelated. init is not scheduled specially; it is
          *signalled* specially.
      - id: c
        text: It cannot be signalled at all
        note: >-
          It can — it just only responds to signals it has installed a handler
          for.
      - id: d
        text: It runs in kernel space rather than user space
        note: >-
          PID 1 is an ordinary user-space process. Its special treatment is a
          rule about signals, not about where it executes.
    explanation: >-
      The exemption stops a stray signal from killing init and panicking the
      kernel. It assumes PID 1 is a program written to be init. In a container
      PID 1 is your application, which is why the protection turns into a bug.

  - id: q14
    type: single_choice
    level: L3
    objectives: [OBJ-A01.2.8]
    stem: >-
      A machine has 8,000 zombie processes. Memory use is 20%, CPU is idle. What
      is the risk?
    options:
      - id: a
        text: PID exhaustion — nothing new can start, including your shell
        correct: true
      - id: b
        text: Memory exhaustion from the accumulated processes
        note: >-
          Zombies hold no memory. This is precisely why the failure is invisible
          on a memory graph until it happens.
      - id: c
        text: CPU exhaustion from the kernel managing them
        note: >-
          A zombie runs no code and is never scheduled. It costs a table entry,
          not cycles.
      - id: d
        text: None — zombies are harmless
        note: >-
          One is harmless. Eight thousand is a countdown to a machine that
          cannot fork.
    explanation: >-
      Each zombie holds a PID, and PIDs are a finite pool — often 32,768 by
      default. When it runs out, fork fails and nothing can start, while every
      resource dashboard looks healthy. The fix is the parent that is not
      reaping, never the zombies.

  - id: q15
    type: single_choice
    level: L3
    objectives: [OBJ-A01.2.8]
    stem: >-
      Zombies are accumulating under a long-running parent you cannot restart
      right now. What is the correct immediate action?
    options:
      - id: a
        text: Send the parent SIGCHLD, which may prompt it to reap
        correct: true
      - id: b
        text: kill -9 each zombie
        note: >-
          A zombie has already exited. There is nothing for SIGKILL to act on,
          and this is the instinct the failure is built to defeat.
      - id: c
        text: Raise the system's pid_max
        note: >-
          That buys time and hides the leak. It is worth doing as a stopgap, but
          it is not a fix.
      - id: d
        text: Reboot
        note: >-
          It works, and it is the answer only once you have exhausted the
          others — restarting the parent achieves the same thing with far less
          disruption.
    explanation: >-
      SIGCHLD is the notification that a child died, and a parent with a handler
      may reap on receiving it. If it does not, restarting the parent is the
      fix — the zombies are reparented to PID 1 and reaped immediately. The
      permanent fix is in the parent's code: call wait().
