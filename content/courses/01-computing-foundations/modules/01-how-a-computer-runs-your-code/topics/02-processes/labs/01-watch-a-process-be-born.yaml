id: lab.watch-a-process-be-born
topic: topic.processes
title: Watch a process be born
type: guided
tier: 2
image: groundwork/lab-foundations:1
duration_minutes: 20
objectives: [OBJ-A01.2.1, OBJ-A01.2.2]

intro: >-
  You are going to watch fork and exec happen, with your own eyes, in a real
  process tree.


  The thing to notice is the PID. A forked child gets a new one; an exec'd
  process keeps the one it had. Once you have seen that, the two-call design
  stops being trivia and becomes obvious.

setup:
  - /opt/lab/seed.sh

steps:
  - id: s1
    instruction: >-
      Find out what PID 1 is in this container, and write just its command name
      to /tmp/answer-pid1.


      It will not be systemd — you are in a container, and that is the point.
    hint: "`ps -p 1 -o comm=` prints just the command for PID 1."
    walkthrough: |
      ps -p 1 -o comm= | tr -d ' ' > /tmp/answer-pid1
    verify:
      - type: file_exists
        path: /tmp/answer-pid1
        describe: The answer file exists
      - type: command_output
        command: "cat /tmp/answer-pid1 | tr -d '[:space:]'"
        equals_command: "ps -p 1 -o comm= | tr -d '[:space:]'"
        describe: You identified this container's PID 1

  - id: s2
    instruction: >-
      Write down your own shell's PID and its parent's PID, in the form
      `pid=<n> ppid=<n>`, to /tmp/answer-shell.


      Then look at what the parent is. Your shell was forked by something.
    hint: >-
      `$$` is your shell's PID. `ps -p $$ -o ppid=` gives its parent. Try
      `ps -p $(ps -p $$ -o ppid=) -o comm=` to see what that parent is.
    walkthrough: |
      echo "pid=$$ ppid=$(ps -p $$ -o ppid= | tr -d ' ')" > /tmp/answer-shell
    verify:
      - type: file_matches
        path: /tmp/answer-shell
        pattern: 'pid=\d+\s+ppid=\d+'
        describe: Both PIDs were recorded

  - id: s3
    instruction: >-
      Run `sleep 300 &` to start a background child, then capture the process
      tree showing your shell and its child into /tmp/answer-tree.
    hint: "`ps -ef --forest | grep -A2 $$ > /tmp/answer-tree`, or `pstree -p $$`."
    walkthrough: |
      nohup sleep 300 >/dev/null 2>&1 &
      sleep 1
      ps -ef --forest > /tmp/answer-tree
    verify:
      - type: process_running
        pattern: "sleep 300"
        describe: The background child is running
      - type: file_matches
        path: /tmp/answer-tree
        pattern: "sleep"
        describe: The tree you captured shows the child

  - id: s4
    instruction: >-
      Confirm that the sleep's parent really is your shell. Write its PPID to
      /tmp/answer-sleep-ppid and check it matches the PID you recorded in step 2.
    hint: "`pgrep -f 'sleep 300'` gives the PID; then `ps -p <pid> -o ppid=`."
    walkthrough: |
      ps -p "$(pgrep -f '[s]leep 300' | head -1)" -o ppid= | tr -d ' ' > /tmp/answer-sleep-ppid
    verify:
      - type: file_matches
        path: /tmp/answer-sleep-ppid
        pattern: '^\d+$'
        describe: A PPID was recorded
      - type: command_output
        command: "cat /tmp/answer-sleep-ppid | tr -d '[:space:]'"
        equals_command: "ps -p $(pgrep -f '[s]leep 300' | head -1) -o ppid= | tr -d '[:space:]'"
        describe: The recorded PPID is the sleep's actual parent

  - id: s5
    instruction: >-
      Now watch fork and exec directly. Run
      `strace -f -e trace=clone,execve -o /tmp/answer-strace /bin/ls /tmp`


      Then look at the file. You are looking for two things: a `clone` call (the
      modern name for fork) and an `execve`.
    hint: >-
      `clone` is what the C library actually calls for fork these days — same
      idea, more options. `-f` follows the child so you see both sides.
    walkthrough: |
      strace -f -e trace=clone,execve -o /tmp/answer-strace /bin/ls /tmp
    verify:
      - type: file_exists
        path: /tmp/answer-strace
        describe: The syscall trace was captured
      - type: file_matches
        path: /tmp/answer-strace
        pattern: "execve"
        describe: The trace contains the exec that replaced the program

  - id: s6
    instruction: >-
      One last thing worth seeing: exec keeps the PID. Run
      `echo "before=$$" > /tmp/answer-exec && bash -c 'echo "child=$$" >> /tmp/answer-exec; exec sleep 1'`


      Then read the file. The child shell and the sleep it exec'd into shared a
      PID — the shell did not spawn sleep, it *became* sleep.
    hint: "The point is that `exec` replaces the program without creating a process."
    walkthrough: |
      echo "before=$$" > /tmp/answer-exec
      bash -c 'echo "child=$$" >> /tmp/answer-exec; exec sleep 1'
    verify:
      - type: file_matches
        path: /tmp/answer-exec
        pattern: 'before=\d+'
        describe: The parent shell PID was recorded
      - type: file_matches
        path: /tmp/answer-exec
        pattern: 'child=\d+'
        describe: The child shell PID was recorded

solution: |
  ```bash
  ps -p 1 -o comm= > /tmp/answer-pid1

  echo "pid=$$ ppid=$(ps -p $$ -o ppid= | tr -d ' ')" > /tmp/answer-shell

  sleep 300 &
  ps -ef --forest | grep -A2 "$$" > /tmp/answer-tree

  ps -p "$(pgrep -f 'sleep 300' | head -1)" -o ppid= | tr -d ' ' > /tmp/answer-sleep-ppid

  strace -f -e trace=clone,execve -o /tmp/answer-strace /bin/ls /tmp

  echo "before=$$" > /tmp/answer-exec
  bash -c 'echo "child=$$" >> /tmp/answer-exec; exec sleep 1'
  ```

  **What you just saw.**

  **PID 1 is bash.** On a real machine PID 1 is `systemd` — a program written to
  be init, which reaps orphans and handles signals. Here it is a shell, because a
  PID namespace renumbered the container's first process to 1. That substitution
  is the entire PID 1 problem, and lab 4 makes it bite.

  **The tree is real.** Your shell forked to create `sleep`, and `sleep`'s PPID
  is your shell's PID. Every process on the machine got here the same way; the
  chain runs unbroken back to PID 1.

  **`clone` then `execve` in the trace.** `clone` is the modern system call
  behind `fork` — same concept, finer control over what is shared. Then `execve`
  replaces the program. Two calls, exactly as the lesson described, visible in
  order in the trace.

  **The PID survived exec.** In step 6 the child shell printed its PID, then
  `exec sleep 1` replaced the shell's program with `sleep` — same process, same
  PID, same open files, different code.

  That last one is not a curiosity. `exec "$@"` at the end of a container
  entrypoint script is how you make your application PID 1 instead of a child of
  the shell — which is the difference between receiving SIGTERM and never seeing
  it. You will write that line in **C14**, and you now know exactly what it does.
