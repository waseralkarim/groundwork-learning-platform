id: lab.wrong-architecture
topic: topic.the-machine
title: "Challenge: the binary that will not run"
type: challenge
tier: 2
image: groundwork/lab-foundations:1
duration_minutes: 15
objectives: [OBJ-A01.1.3]

intro: >-
  There is a program at /tmp/challenge/tool. It does not run.


  ```text
  $ /tmp/challenge/tool
  bash: /tmp/challenge/tool: cannot execute binary file: Exec format error
  ```


  That is everything you are given. No hints about the cause, because in
  production nobody hands you the cause.


  Investigate, then write your diagnosis. You are being assessed on whether you
  can find the evidence, not on whether you can guess the answer.

setup:
  - /opt/lab/seed-wrong-arch.sh

steps:
  - id: s1
    instruction: >-
      Before touching anything else, write down what you think might be wrong —
      at least two possibilities — in /tmp/hypotheses. One per line.


      This step exists because forming a hypothesis before gathering evidence is
      the habit that makes debugging fast. Skipping it is how people end up
      randomly trying things for an hour.
    walkthrough: |
      printf 'corrupt download
      wrong architecture
      ' > /tmp/hypotheses
    verify:
      - type: command_output
        command: "grep -c . /tmp/hypotheses"
        pattern: '^[2-9]|^[1-9][0-9]'
        describe: At least two hypotheses were recorded before investigating

  - id: s2
    instruction: >-
      Gather the evidence. Determine what the file actually is, what the machine
      actually is, and where they disagree. Record the specific mismatch — the
      binary's architecture and the machine's architecture — in
      /tmp/diagnosis, in the form `binary=<arch> machine=<arch>`.
    walkthrough: |
      file /tmp/challenge/tool
      readelf -h /tmp/challenge/tool | grep Machine || true
      echo "binary=aarch64 machine=$(uname -m)" > /tmp/diagnosis
    verify:
      - type: file_matches
        path: /tmp/diagnosis
        pattern: 'binary=\S+\s+machine=\S+'
        describe: The diagnosis names both architectures
      - type: command_output
        command: "grep -o 'machine=[^ ]*' /tmp/diagnosis | cut -d= -f2"
        equals_command: "uname -m"
        describe: The machine architecture in your diagnosis is correct

  - id: s3
    instruction: >-
      State what would have to change for this binary to run here. Write one of
      the words `rebuild`, `emulate`, or `both` to /tmp/answer-remedy, then
      explain your choice in /tmp/answer-why (at least one sentence).
    walkthrough: |
      echo rebuild > /tmp/answer-remedy
      echo 'The binary is arm64 while this machine is amd64, so the kernel refuses to load it' > /tmp/answer-why
    verify:
      - type: file_matches
        path: /tmp/answer-remedy
        pattern: '^(rebuild|emulate|both)$'
        describe: A remedy was chosen
      - type: command_output
        command: "wc -w < /tmp/answer-why"
        pattern: '^\s*([1-9][0-9]|[1-9][0-9][0-9])'
        describe: The reasoning is at least ten words

solution: |
  **The evidence.**

  ```bash
  file /tmp/challenge/tool
  # ELF 64-bit LSB executable, ARM aarch64, ...

  uname -m
  # x86_64

  readelf -h /tmp/challenge/tool | grep Machine
  #   Machine:  AArch64
  ```

  **The diagnosis.** The binary was compiled for arm64. The machine is amd64.
  These are different instruction set architectures — different vocabularies of
  machine instruction. The kernel read the ELF header, saw `AArch64`, and refused
  to create the process. Not one instruction of the program ran.

  **The remedy.** Either is valid and they trade off differently:

  - **rebuild** — compile the program for amd64. Correct, fast at runtime,
    requires the source and a toolchain.
  - **emulate** — install `qemu-user-static` and run the arm64 binary under
    translation. Works without source, and costs somewhere between 2× and 10× in
    performance.

  "both" is the honest answer for a migration: emulate to unblock today, rebuild
  to fix it.

  **Why `Exec format error` is a gift.** It is one of the few production errors
  that means exactly one thing. It is never a bug in the application, never a
  permissions problem, never a corrupt download. The loader compared two values
  and they differed.

  **Where you will meet it again.** You build a container image on an Apple
  laptop — arm64 — and deploy it to an Intel node. Same error, printed by
  Kubernetes instead of bash:

  ```text
  exec /app/server: exec format error
  ```

  The fix is `docker buildx build --platform linux/amd64`, and the reason it
  works is this lesson. **C14 Containers** covers multi-architecture images and
  refers back here.
