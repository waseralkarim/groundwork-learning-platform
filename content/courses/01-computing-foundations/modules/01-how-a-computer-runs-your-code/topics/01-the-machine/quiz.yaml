id: quiz.the-machine
topic: topic.the-machine
pass_score: 70

questions:
  - id: q1
    type: single_choice
    level: L1
    objectives: [OBJ-A01.1.1]
    stem: A server loses power abruptly. Which of the following is lost?
    options:
      - id: a
        text: The contents of RAM
        correct: true
      - id: b
        text: The contents of the SSD
        note: >-
          Persistent storage survives power loss — that is the definition of
          persistent. Data written but not yet flushed from a buffer can be lost,
          but the disk's contents are not.
      - id: c
        text: Both RAM and SSD contents
        note: Half right. Only volatile storage is lost.
      - id: d
        text: Neither — everything is written to disk continuously
        note: >-
          A common but expensive assumption. Writes are buffered by default;
          `fsync` exists precisely because they are not continuous.
    explanation: >-
      RAM is volatile: it requires power to retain its contents. Storage is
      persistent. Every durability guarantee in every database is ultimately a
      strategy for getting data across that boundary before the power goes.

  - id: q2
    type: single_choice
    level: L1
    objectives: [OBJ-A01.1.1]
    stem: >-
      Which resource is the correct place to keep data that must survive a
      process restart?
    options:
      - id: a
        text: Persistent storage
        correct: true
      - id: b
        text: RAM
        note: >-
          RAM does not even survive the process exiting, let alone a restart —
          the kernel reclaims a process's memory the moment it terminates.
      - id: c
        text: CPU registers
        note: >-
          Registers hold single values for nanoseconds. They are not storage in
          any useful sense.
      - id: d
        text: The page cache
        note: >-
          The page cache is RAM. It is a copy of file data, and the file is the
          durable thing, not the cache.
    explanation: >-
      This distinction becomes Docker volumes and Kubernetes PersistentVolumes
      later. A container's own filesystem is discarded on restart for exactly
      this reason — anything that must survive has to live somewhere persistent.

  - id: q3
    type: ordering
    level: L1
    objectives: [OBJ-A01.1.2]
    stem: Put the three stages of the instruction cycle in order.
    options:
      - id: a
        text: Fetch the instruction from memory
        correct: true
      - id: b
        text: Decode what the instruction means
        correct: true
      - id: c
        text: Execute the instruction
        correct: true
    explanation: >-
      Fetch, decode, execute — then repeat, billions of times a second. Modern
      CPUs pipeline these so several instructions are in different stages at
      once, but the logical order is unchanged.

  - id: q4
    type: single_choice
    level: L1
    objectives: [OBJ-A01.1.2]
    stem: What is a single machine instruction most like?
    options:
      - id: a
        text: "A tiny operation such as \"add these two registers\""
        correct: true
      - id: b
        text: A line of Python
        note: >-
          One line of Python typically becomes dozens or hundreds of machine
          instructions. The gap between them is what an interpreter bridges.
      - id: c
        text: A function call in your application
        note: >-
          A function call is many instructions: pushing arguments, jumping,
          setting up a stack frame, returning.
      - id: d
        text: A system call such as reading a file
        note: >-
          A syscall is a request to the kernel that runs a great deal of code.
          The instruction that triggers it is one instruction; the work is not.
    explanation: >-
      Machine instructions are far smaller than people expect. This is why
      compiled languages start faster than interpreted ones: the translation
      from your code to these tiny operations already happened.

  - id: q5
    type: single_choice
    level: L2
    objectives: [OBJ-A01.1.3]
    stem: >-
      You copy a working binary from an AWS Graviton instance to an Intel
      instance and run it. You get `Exec format error`. What happened?
    options:
      - id: a
        text: >-
          The binary is arm64 and the Intel machine is amd64 — different
          instruction sets
        correct: true
      - id: b
        text: The file was corrupted during the copy
        note: >-
          Corruption gives you a segfault or garbage, not this specific message.
          `Exec format error` comes from the loader reading a valid header it
          cannot use.
      - id: c
        text: The binary does not have the execute permission bit set
        note: >-
          Missing execute permission gives `Permission denied`, which is a
          different error entirely.
      - id: d
        text: A shared library is missing
        note: >-
          A missing library reports the library by name — for example
          `libssl.so.3: cannot open shared object file`. The process gets further
          than this one did.
    explanation: >-
      Graviton is arm64; Intel is amd64. The kernel read the ELF header, saw the
      wrong architecture, and refused to create the process. Not one instruction
      of the program ran, which is why this can never be an application bug.

  - id: q6
    type: ordering
    level: L2
    objectives: [OBJ-A01.1.4]
    stem: Order these from fastest to slowest access.
    options:
      - id: a
        text: CPU register
        correct: true
      - id: b
        text: L1 cache
        correct: true
      - id: c
        text: RAM
        correct: true
      - id: d
        text: NVMe SSD
        correct: true
    explanation: >-
      Register (~0.3ns), L1 (~1ns), RAM (~80ns), SSD (~50,000ns). The step from
      RAM to SSD is roughly three orders of magnitude, which is why swapping
      feels like a broken machine rather than a slow one.

  - id: q7
    type: single_choice
    level: L2
    objectives: [OBJ-A01.1.4]
    stem: Roughly how much slower is an NVMe SSD read than a RAM read?
    options:
      - id: a
        text: About 1,000× slower
        correct: true
      - id: b
        text: About 10× slower
        note: >-
          Far too optimistic. If this were true, swapping would be a mild
          inconvenience rather than an outage.
      - id: c
        text: About the same — modern SSDs are very fast
        note: >-
          SSDs are fast compared to spinning disks. Compared to RAM they are
          nowhere close, and the marketing does not help here.
      - id: d
        text: About 1,000,000× slower
        note: >-
          That is closer to a cross-continent network round trip. SSDs are slow
          relative to RAM, but not that slow.
    explanation: >-
      RAM is ~80 nanoseconds; NVMe is ~50 microseconds. That is a factor of
      roughly 600–1000. It is the single most useful number in this topic,
      because it explains caching, swapping and database tuning all at once.

  - id: q8
    type: single_choice
    level: L2
    objectives: [OBJ-A01.1.5]
    stem: What is the difference between a program and a process?
    options:
      - id: a
        text: A program is a file on disk; a process is a running instance of one
        correct: true
      - id: b
        text: They are two words for the same thing
        note: >-
          The distinction is load-bearing. "A container is just a process" is
          meaningless if these are the same thing.
      - id: c
        text: A program is compiled; a process is interpreted
        note: >-
          Compilation is unrelated. An interpreted script running is just as
          much a process as a compiled binary running.
      - id: d
        text: A process is a program that has finished running
        note: >-
          A finished process no longer exists. Processes are things that are
          currently running.
    explanation: >-
      One program can become many processes — running nginx three times gives
      three processes from one file. A process can also outlive its program:
      delete the binary while it runs and the process continues, because the
      kernel holds the file's contents, not its name.

  - id: q9
    type: multi_choice
    level: L2
    objectives: [OBJ-A01.1.5]
    stem: >-
      Select everything the kernel does between `execve` and your code running.
    options:
      - id: a
        text: Verify the binary's architecture against the CPU
        correct: true
      - id: b
        text: Create a fresh virtual address space and map the binary into it
        correct: true
      - id: c
        text: Load required shared libraries, if dynamically linked
        correct: true
      - id: d
        text: Check that the program contains no bugs
        note: >-
          Nothing at any layer does this. The kernel verifies format and
          permissions, never correctness.
    explanation: >-
      Architecture verification and library loading are where most startup
      failures live — both happen before a single line of your code executes.
      That is why `Exec format error` and `GLIBC_2.34 not found` are never
      application bugs.

  - id: q10
    type: single_choice
    level: L2
    objectives: [OBJ-A01.1.6]
    stem: >-
      `free -h` on a healthy 32GB production server shows 412Mi free and 22Gi
      available. What should you do?
    options:
      - id: a
        text: Nothing — the machine has 22Gi of usable memory
        correct: true
      - id: b
        text: Raise an alert — the server is nearly out of memory
        note: >-
          This is the single most common mistake in this topic, and a real cause
          of 3am pages for healthy machines. The `free` column is not a measure
          of memory pressure.
      - id: c
        text: Restart the largest process to reclaim memory
        note: >-
          Restarting a healthy service to fix a number you misread is how a
          non-incident becomes an incident.
      - id: d
        text: Add swap space immediately
        note: >-
          There is no memory pressure to relieve. Adding swap here solves
          nothing and can mask a real problem later.
    explanation: >-
      The kernel deliberately fills spare RAM with page cache, because idle RAM
      does no work. That memory is reclaimed instantly when a process needs it.
      `available` is the kernel's own estimate of what a new process could get
      without swapping, and it is the only one of the two numbers that answers
      the question.

  - id: q11
    type: single_choice
    level: L2
    objectives: [OBJ-A01.1.6]
    stem: What is in the `buff/cache` column of `free`?
    options:
      - id: a
        text: File data the kernel is caching, reclaimable on demand
        correct: true
      - id: b
        text: Memory leaked by processes that failed to free it
        note: >-
          Leaked memory shows as used and is not reclaimable. That is precisely
          what makes a leak a problem.
      - id: c
        text: Memory reserved for the kernel and unavailable to processes
        note: >-
          Some kernel memory is unreclaimable, but buff/cache specifically is
          the reclaimable kind.
      - id: d
        text: Swap space currently in use
        note: Swap has its own line in `free` output.
    explanation: >-
      The page cache holds recently read or written file data so a second read
      does not touch the disk. It counts as used but is released the moment a
      process needs the memory, which is why it is included in `available`.

  - id: q12
    type: single_choice
    level: L3
    objectives: [OBJ-A01.1.7]
    stem: >-
      `vmstat 1` shows `r` consistently at 12 on a 4-core machine, `id` at 0,
      `wa` at 0, and `si`/`so` at 0. What is the bottleneck?
    options:
      - id: a
        text: CPU — three times more runnable processes than cores, and no idle time
        correct: true
      - id: b
        text: Memory — the run queue is long because of allocation pressure
        note: >-
          Memory pressure shows up in `si`/`so`. Both are zero here, so nothing
          is swapping.
      - id: c
        text: Disk — a long run queue implies I/O contention
        note: >-
          I/O contention shows in `b` and `wa`. `wa` is 0, so nothing is waiting
          on disk.
      - id: d
        text: Not enough information to say
        note: >-
          There is enough: three columns each rule out an alternative, which is
          exactly what makes this a diagnosis rather than a guess.
    explanation: >-
      `r` is the count of processes ready to run and waiting for a core. At 12 on
      4 cores, each process spends most of its time queued. `wa=0` rules out I/O
      and `si/so=0` rules out memory. Adding cores or reducing concurrency are
      the levers.

  - id: q13
    type: single_choice
    level: L3
    objectives: [OBJ-A01.1.7]
    stem: >-
      `vmstat 1` shows `wa` at 65, `us` at 4, `id` at 30, and `b` at 8. What is
      happening?
    options:
      - id: a
        text: I/O-bound — the CPU is idle because processes are blocked on disk
        correct: true
      - id: b
        text: CPU-bound — 65% of CPU time is being consumed
        note: >-
          `wa` is not CPU work. It is time the CPU spent idle *because* it had
          nothing to do but wait for I/O. Reading it as utilisation is a very
          common misreading.
      - id: c
        text: Memory-bound — high wait indicates swapping
        note: >-
          Swapping would raise `wa`, but it would also show in `si`/`so`, which
          are not elevated here.
      - id: d
        text: Healthy — 30% idle means there is spare capacity
        note: >-
          The idle time is a symptom, not spare capacity. The CPU cannot use it
          because the work is blocked.
    explanation: >-
      `wa` is time the CPU sat idle waiting for I/O to complete, with `b` showing
      8 processes blocked. Adding CPU would change nothing. The fix is faster
      storage, fewer or larger I/O operations, or caching.

  - id: q14
    type: single_choice
    level: L3
    objectives: [OBJ-A01.1.8]
    stem: >-
      A process is OOM-killed. Which signal did it receive, and what could it
      have done about it?
    options:
      - id: a
        text: SIGKILL — nothing, it cannot be caught or ignored
        correct: true
      - id: b
        text: SIGTERM — it could have run a shutdown handler
        note: >-
          SIGTERM is what a graceful shutdown sends. The OOM killer does not
          negotiate; that is the whole point of it.
      - id: c
        text: SIGSEGV — it could have caught it and freed memory
        note: >-
          SIGSEGV is an invalid memory access, a different failure entirely.
      - id: d
        text: No signal — the kernel simply stops scheduling it
        note: >-
          The process is genuinely terminated, and the kill is recorded in
          `dmesg` and in the cgroup's event counters.
    explanation: >-
      SIGKILL cannot be caught, blocked or ignored. No shutdown hook, no flush,
      no cleanup. This is why out-of-memory must be prevented rather than
      handled — and why a Kubernetes pod exits with code 137, which is 128 + 9.

  - id: q15
    type: single_choice
    level: L3
    objectives: [OBJ-A01.1.8]
    stem: >-
      You must run 200 processes at ~300MB RSS each on a 32GB machine with swap
      enabled. What will users see first?
    options:
      - id: a
        text: Timeouts and unresponsiveness, before any out-of-memory error
        correct: true
      - id: b
        text: An immediate out-of-memory error when the 108th process starts
        note: >-
          The kernel does not refuse at the boundary. It reclaims page cache,
          then swaps, and only kills as a last resort — so degradation comes
          first.
      - id: c
        text: Nothing — Linux overcommits, so 200 processes will run fine
        note: >-
          Overcommit lets them *start*. It does nothing once they actually touch
          the memory they reserved.
      - id: d
        text: Processes failing to start with "cannot allocate memory"
        note: >-
          Possible eventually, but swapping degrades the machine long before
          allocation outright fails.
    explanation: >-
      60GB of demand against ~30GB of usable RAM. The kernel drops page cache
      first (I/O quietly slows), then swaps (latency goes from 80ns to 50µs), and
      the machine becomes unresponsive while every process is technically still
      running. Health checks time out and monitoring reports the service down.
      The OOM killer arrives last. This is why memory exhaustion usually presents
      as a latency incident.
