      from a read-only mount from a permission failure.
    assessed_by: [quiz.q14, quiz.q15, exercise.e4, troubleshooting.container-cannot-write, assessment.C]

terminology:
  - term: inode
    definition: >-
      The structure holding everything about a file except its name: type,
      permissions, owner, size, timestamps, link count, and where the data is.
      Identified by a number, unique within a filesystem.
  - term: directory
    definition: >-
      A file whose contents are a list of names paired with inode numbers.
      "Deleting a file" is removing one such pair.
  - term: hard link
    definition: >-
      An additional name for the same inode. Indistinguishable from the
      original — there is no "real" one — and the data survives until the last
      name is removed.
  - term: symbolic link
    definition: >-
      A small file whose contents are a path. Following it is a separate lookup,
      which is why it can point at something that does not exist.
  - term: link count
    definition: >-
      How many names refer to an inode. The kernel frees a file's data when this
      reaches zero *and* no process still has it open — the second condition is
      what surprises people.
  - term: mount
    definition: >-
      Attaching a filesystem at a directory, so paths below it are served by that
      filesystem. Mount options — read-only, noexec, nosuid — apply to everything
      under it.
  - term: overlayfs
    definition: >-
      A filesystem that presents several read-only layers plus one writable layer
      as a single directory tree. What every container's root filesystem is.
  - term: lowerdir
    definition: >-
      The read-only layers of an overlay: the image. Shared between every
      container started from that image, on one copy on disk.
  - term: upperdir
    definition: >-
      The writable layer of an overlay. Where a container's changes go, and what
      is discarded when it is removed.
  - term: copy-up
    definition: >-
      What overlayfs does when a container modifies a file from a lower layer:
      the entire file is copied into the upper layer first. Editing one byte of a
      2 GB file costs 2 GB.
  - term: tmpfs
    definition: >-
      A filesystem that lives in memory. Fast, empty on every boot, and charged
      against the memory limit — not the disk.
  - term: bind mount
    definition: >-
      Making an existing directory appear at a second location. How a host
      directory is handed to a container.
  - term: ENOSPC
    definition: >-
      "No space left on device." Either no free blocks or no free inodes, and
      `df -h` alone cannot tell you which.
  - term: fsync
    definition: >-
      The system call that asks for data already written to be made durable on
      the device. Until it returns, a successful write lives only in the page
      cache.
  - term: sparse file
    definition: >-
      A file with holes — ranges that have never been written and occupy no
      blocks. Its apparent size can vastly exceed the space it uses, which is why
      `ls -l` and `du` disagree.

foreshadows:
  - "Image layers, the build cache and why image size matters are all overlayfs, which is introduced properly in C14."
  - "Volumes and bind mounts exist because upperdir is discarded when a container is removed (C14, C15)."
  - "A read-only root filesystem with a writable volume is the hardened container shape from C16 — and the source of most EROFS surprises."
  - "Node disk pressure and image garbage collection in E31 are this topic at cluster scale."
  - "Database durability in B13 is a negotiation with fsync and the page cache."

tags: [filesystems, storage, containers, linux, troubleshooting, fundamentals]
