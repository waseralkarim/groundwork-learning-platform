    level: L2
    verb: explain
    statement: >-
      Explain what an inode holds and what a filename actually refers to.
    assessed_by: [quiz.q1, quiz.q2, lab.what-a-file-really-is]

  - id: OBJ-A01.5.2
    level: L2
    verb: distinguish
    statement: >-
      Distinguish a hard link from a symbolic link, and predict what removing
      each one does to the data.
    assessed_by: [quiz.q3, quiz.q4, lab.what-a-file-really-is, exercise.e1]

  - id: OBJ-A01.5.3
    level: L2
    verb: interpret
    statement: >-
      Interpret a mount table, identifying filesystem types and the options that
      decide what can be written where.
    assessed_by: [quiz.q5, quiz.q6, lab.your-root-is-an-overlay]

  - id: OBJ-A01.5.4
    level: L3
    verb: explain
    statement: >-
      Explain how an overlay filesystem composes image layers, and where a
      container's writes actually land.
    assessed_by: [quiz.q7, quiz.q8, lab.your-root-is-an-overlay, assessment.A]

  - id: OBJ-A01.5.5
    level: L3
    verb: diagnose
    statement: >-
      Diagnose a filesystem reporting full while du accounts for almost nothing,
      and identify the process responsible.
    assessed_by: [quiz.q9, quiz.q10, lab.the-disk-that-will-not-empty, troubleshooting.disk-full-nothing-there]

  - id: OBJ-A01.5.6
    level: L3
    verb: distinguish
    statement: >-
      Distinguish running out of space from running out of inodes, and say which
      command reveals each.
    assessed_by: [quiz.q11, lab.space-and-inodes, exercise.e2]

  - id: OBJ-A01.5.7
    level: L3
    verb: explain
    statement: >-
      Explain what fsync guarantees, and why a write that returned successfully
      is not yet durable.
    assessed_by: [quiz.q12, quiz.q13, exercise.e3, assessment.B]

