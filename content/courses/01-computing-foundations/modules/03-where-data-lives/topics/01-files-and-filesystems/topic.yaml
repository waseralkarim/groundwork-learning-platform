id: topic.files-and-filesystems
slug: files-and-filesystems
title: "Files and Filesystems: What a Name Actually Refers To"
summary: >-
  A filename is not a file. Once that is real, deleted logs that never free
  space, containers whose writes vanish, and disks that are full with nothing on
  them all stop being mysteries.
order: 5
levels: [L2, L3]
estimated_minutes: 120
status: published

prerequisites:
  - topic: topic.user-space-and-the-kernel
    hardness: required
  - topic: topic.the-machine
    hardness: recommended

