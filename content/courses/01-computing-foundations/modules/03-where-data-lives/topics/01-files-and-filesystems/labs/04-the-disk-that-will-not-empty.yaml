id: lab.the-disk-that-will-not-empty
topic: topic.files-and-filesystems
title: "Challenge: the disk that will not empty"
type: challenge
tier: 2
image: groundwork/lab-foundations:1
duration_minutes: 25
objectives: [OBJ-A01.5.5]

intro: >-
  A filesystem is full. You delete the large file. It is still full. You check
  what is using the space and find almost nothing there.


  This is the most common storage incident there is, and the usual resolution —
  restart the service and watch the space come back — teaches nobody anything.
  You are going to reproduce it deliberately and then find the culprit with two
  commands.

setup:
  - /opt/lab/seed.sh

steps:
  - id: s1
    instruction: >-
      Before running anything, write at least two hypotheses to /tmp/hypotheses,
      one per line: reasons a filesystem could report full when nothing visible
      is using the space.
    walkthrough: |
      printf 'a deleted file is still open somewhere\nanother filesystem is mounted underneath\nsparse files or reserved blocks\n' > /tmp/hypotheses
    verify:
      - type: file_exists
        path: /tmp/hypotheses
        describe: You recorded hypotheses first
      - type: command_output
        command: "wc -l < /tmp/hypotheses"
        pattern: "[2-9]"
        describe: At least two hypotheses

  - id: s2
    instruction: >-
      Create the situation. Write a large file to /tmp, start a background
      process that holds it open, and then delete the file.


      Record the state afterwards — `df -h /tmp` and `du -sh /tmp` — to
      /tmp/before.
    hint: >-
      `dd` a file of a few hundred megabytes, then something like
      `sleep 300 < /tmp/big &` to hold a descriptor on it, then `rm /tmp/big`.
    walkthrough: |
      dd if=/dev/zero of=/tmp/big bs=1M count=300 2>/dev/null
      sleep 300 < /tmp/big &
      sleep 1
      rm /tmp/big
      { df -h /tmp; du -sh /tmp; } > /tmp/before
      cat /tmp/before
    verify:
      - type: command_exit
        command: "test ! -e /tmp/big"
        exit_code: 0
        describe: The file has been deleted
      - type: file_matches
        path: /tmp/before
        pattern: "tmpfs"
        describe: The filesystem state was recorded

  - id: s3
    instruction: >-
      Show the contradiction plainly. Record the used figure from `df` and the
      total from `du` to /tmp/answer-mismatch, in the form `df=<n> du=<n>`.


      They should disagree by hundreds of megabytes. That gap is the whole
      finding.
    hint: >-
      `df -m /tmp | awk 'NR==2 {print $3}'` for megabytes used, and
      `du -sm /tmp | cut -f1` for what the names account for.
    walkthrough: |
      echo "df=$(df -m /tmp | awk 'NR==2 {print $3}') du=$(du -sm /tmp | cut -f1)" > /tmp/answer-mismatch
      cat /tmp/answer-mismatch
    verify:
      - type: file_matches
        path: /tmp/answer-mismatch
        pattern: 'df=[0-9]{3,}'
        describe: df reports hundreds of megabytes in use
      - type: command_exit
        command: "test $(awk -F'du=' '{print $2}' /tmp/answer-mismatch) -lt 100"
        exit_code: 0
        describe: du accounts for almost none of it

  - id: s4
    instruction: >-
      Find what is holding the space. There is no `lsof` here, so use /proc
      directly: every process's open files are listed under /proc/PID/fd, and a
      deleted one is marked.


      Save the evidence to /tmp/answer-culprit.
    hint: >-
      `ls -l /proc/*/fd/* 2>/dev/null | grep deleted` — the link target ends
      with `(deleted)`.
    walkthrough: |
      ls -l /proc/*/fd/* 2>/dev/null | grep '(deleted)' > /tmp/answer-culprit
      cat /tmp/answer-culprit
    verify:
      - type: file_matches
        path: /tmp/answer-culprit
        pattern: '\(deleted\)'
        describe: You found an open file with no name left
      - type: file_matches
        path: /tmp/answer-culprit
        pattern: '/tmp/big'
        describe: The evidence names the file that was deleted

  - id: s5
    instruction: >-
      Free the space by making the holder let go, then confirm with `df` and
      save the result to /tmp/after.


      Note what you had to do — the file was already deleted, so `rm` was never
      going to help.
    hint: "Kill the process holding the descriptor, then measure again."
    walkthrough: |
      pkill -f 'sleep 300' || true
      sleep 2
      df -h /tmp > /tmp/after
      echo "--- before ---"; cat /tmp/before
      echo "--- after ---"; cat /tmp/after
    verify:
      - type: command_exit
        command: "test $(df -m /tmp | awk 'NR==2 {print $3}') -lt 100"
        exit_code: 0
        describe: The space came back once the descriptor was closed
      - type: file_matches
        path: /tmp/after
        pattern: "tmpfs"
        describe: The recovered state was recorded

  - id: s6
    instruction: >-
      Write the diagnosis to /tmp/answer-why, in at least thirty words: why the
      space was not freed by deleting the file, why `du` could not see it, and
      what you would do on a production log file instead of killing the process.
    walkthrough: |
      cat > /tmp/answer-why <<'EOF'
      Deleting removed the name, but the kernel keeps a file's blocks until the
      link count reaches zero and no process still holds it open. du walks names
      and there was no name left, so it could not see the file, while df asks the
      filesystem how many blocks are free. On a production log I would truncate
      it in place with a redirect, or signal the service to reopen its logs,
      rather than killing the process.
      EOF
    verify:
      - type: command_output
        command: "wc -w < /tmp/answer-why"
        pattern: "([3-9][0-9]|[0-9]{3,})"
        describe: At least thirty words
      - type: file_matches
        path: /tmp/answer-why
        pattern: "truncat|reopen|HUP"
        describe: You named a way to free the space without killing the service

solution: |
  ```bash
  dd if=/dev/zero of=/tmp/big bs=1M count=300
  sleep 300 < /tmp/big &          # a process holds the descriptor
  rm /tmp/big                     # the name is gone; the data is not

  df -m /tmp | awk 'NR==2 {print $3}'    # hundreds of MB used
  du -sm /tmp | cut -f1                  # almost nothing

  ls -l /proc/*/fd/* 2>/dev/null | grep '(deleted)'
  # l-wx------ 1 learner learner 64 … /proc/412/fd/0 -> /tmp/big (deleted)

  pkill -f 'sleep 300'            # the holder lets go
  df -h /tmp                      # space returns
  ```

  **Why deleting did nothing.**

  `rm` removes a directory entry and decrements the inode's link count. The
  kernel frees the blocks when **both** the link count is zero *and* no process
  has the file open. Freeing them while a process was still writing would hand
  live data to someone else, so it waits.

  **Why `du` could not see it.** `du` walks the directory tree adding up the
  files it finds by name. There was no name. `df` asks the filesystem how many
  blocks are free, and they were not. The gap between the two *is* the diagnosis:
  when `du` is far smaller than `df`'s used figure, stop deleting things and go
  looking for a holder.

  **How to find it in ten seconds.** `lsof +L1` lists open files with no
  remaining links. Where `lsof` is not installed — most containers — `/proc` has
  it directly:

  ```bash
  ls -l /proc/*/fd/* 2>/dev/null | grep '(deleted)'
  ```

  The link target names both the process and the file.

  **What to do in production.** Killing the process worked here and is the wrong
  habit. In order of preference:

  ```bash
  kill -HUP <pid>              # if the service reopens its logs on SIGHUP
  : > /var/log/app/app.log     # truncate in place — frees blocks, keeps the fd
  systemctl restart app        # works, costs an outage
  ```

  Truncation is the one worth remembering: the descriptor points at the inode, so
  emptying the file frees every block without breaking the writer.

  **And the prevention.** Never delete a log a process is writing to. Rotate with
  `copytruncate`, or signal the service to reopen — because rotating by rename
  leaves the writer attached to the renamed inode, which is this same incident
  arriving by a different route.
