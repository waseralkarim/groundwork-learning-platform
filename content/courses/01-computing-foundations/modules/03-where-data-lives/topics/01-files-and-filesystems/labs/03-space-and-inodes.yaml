id: lab.space-and-inodes
topic: topic.files-and-filesystems
title: Two ways to run out
type: guided
tier: 2
image: groundwork/lab-foundations:1
duration_minutes: 20
# 64 MiB of writable space, deliberately. The default is larger than the
# container's memory limit, and /tmp is a tmpfs — so filling it to produce
# ENOSPC would OOM-kill the container instead, which is a different lesson.
disk_mb: 64
objectives: [OBJ-A01.5.6]

intro: >-
  A filesystem can run out of blocks or run out of inodes. Both produce the same
  error, and only one of them is visible in the command everybody runs.


  You will fill a filesystem until writes fail, read both figures, and see a
  file whose apparent size and real size differ by a factor of a thousand.

setup:
  - /opt/lab/seed.sh

steps:
  - id: s1
    instruction: >-
      Record both the block usage and the inode usage of /tmp, to
      /home/learner/answer-df-before.


      Note that they report entirely different resources — and note where the
      answer goes: your home directory is a separate filesystem, which matters
      once /tmp is full.
    hint: "`df -h /tmp` for blocks and `df -i /tmp` for inodes."
    walkthrough: |
      { df -h /tmp; df -i /tmp; } > /home/learner/answer-df-before
      cat /home/learner/answer-df-before
    verify:
      - type: file_matches
        path: /home/learner/answer-df-before
        pattern: "Avail|Available"
        describe: Block usage was captured
      - type: file_matches
        path: /home/learner/answer-df-before
        pattern: "IUse%|IFree"
        describe: Inode usage was captured

  - id: s2
    instruction: >-
      Fill /tmp until a write fails. Write a large file with `dd` — bigger than
      the filesystem — and capture the error to /home/learner/answer-enospc.


      Use /tmp/filler as the target so you can clean it up afterwards. The error
      has to go to your home directory: there will be no room left on /tmp to
      write it.
    hint: >-
      `dd if=/dev/zero of=/tmp/filler bs=1M count=999 2>/home/learner/answer-enospc` —
      it will stop when the filesystem is full.
    walkthrough: |
      dd if=/dev/zero of=/tmp/filler bs=1M count=999 2>/home/learner/answer-enospc || true
      tail -2 /home/learner/answer-enospc
    verify:
      - type: file_matches
        path: /home/learner/answer-enospc
        pattern: "No space left on device"
        describe: The write failed with ENOSPC

  - id: s3
    instruction: >-
      Now find out which resource ran out. Record both figures again to
      /home/learner/answer-df-after and write the answer — the single word `blocks` or
      `inodes` — to /home/learner/answer-which.
    hint: >-
      Compare the two `df` outputs. One of them will be at or near 100%, and the
      other will not have moved much.
    walkthrough: |
      { df -h /tmp; df -i /tmp; } > /home/learner/answer-df-after
      cat /home/learner/answer-df-after
      echo blocks > /home/learner/answer-which
    verify:
      - type: file_matches
        path: /home/learner/answer-which
        pattern: '^blocks$'
        describe: You identified that space, not inodes, ran out
      - type: file_matches
        path: /home/learner/answer-df-after
        pattern: "IUse%|IFree"
        describe: Both figures were captured again

  - id: s4
    instruction: >-
      Clean up and confirm the space came back, recording the result to
      /home/learner/answer-df-recovered.


      Nothing is holding this file open, so the blocks should be released
      immediately.
    hint: "`rm /tmp/filler` then `df -h /tmp > /home/learner/answer-df-recovered`."
    walkthrough: |
      rm -f /tmp/filler
      df -h /tmp > /home/learner/answer-df-recovered
      cat /home/learner/answer-df-recovered
    verify:
      - type: command_exit
        command: "test ! -e /tmp/filler"
        exit_code: 0
        describe: The filler file is gone
      - type: file_matches
        path: /home/learner/answer-df-recovered
        pattern: "tmpfs"
        describe: The filesystem was measured again

  - id: s5
    instruction: >-
      Now the other way sizes lie. Create a sparse file — one with a hole — by
      seeking a gigabyte into an empty file and writing a single byte.


      Record its apparent size and its real disk usage to /home/learner/answer-sparse in
      the form `apparent=<n> actual=<n>`.
    hint: >-
      `dd if=/dev/zero of=/tmp/sparse bs=1 count=1 seek=1G 2>/dev/null`, then
      `stat -c %s` for apparent size and `du -h` or `stat -c %b` for blocks.
    walkthrough: |
      dd if=/dev/zero of=/tmp/sparse bs=1 count=1 seek=1G 2>/dev/null
      echo "apparent=$(stat -c %s /tmp/sparse) actual=$(du -h /tmp/sparse | cut -f1)" > /home/learner/answer-sparse
      ls -lh /tmp/sparse
      cat /home/learner/answer-sparse
    verify:
      - type: file_matches
        path: /home/learner/answer-sparse
        pattern: 'apparent=10[0-9]{8}'
        describe: The file appears to be about a gigabyte
      - type: command_exit
        command: "test $(du -k /tmp/sparse | cut -f1) -lt 1024"
        exit_code: 0
        describe: It occupies almost no actual space

  - id: s6
    instruction: >-
      Write to /home/learner/answer-two-limits, in at least twenty words, the two things a
      filesystem can run out of, which command shows each, and why `df -h` alone
      can be misleading.
    walkthrough: |
      cat > /home/learner/answer-two-limits <<'EOF'
      A filesystem can run out of blocks, shown by df -h, or out of inodes,
      shown by df -i. Both fail with ENOSPC, so a disk that looks half empty can
      still refuse every write because it has no inodes left for new files.
      EOF
    verify:
      - type: command_output
        command: "wc -w < /home/learner/answer-two-limits"
        pattern: "([2-9][0-9]|[0-9]{3,})"
        describe: At least twenty words
      - type: file_matches
        path: /home/learner/answer-two-limits
        pattern: "inode"
        describe: You named inodes as the second limit

solution: |
  ```bash
  df -h /tmp ; df -i /tmp                 # blocks and inodes: different resources

  dd if=/dev/zero of=/tmp/filler bs=1M count=999   # No space left on device
  df -h /tmp ; df -i /tmp                 # blocks 100%, inodes barely moved
  rm /tmp/filler                          # space returns immediately

  dd if=/dev/zero of=/tmp/sparse bs=1 count=1 seek=1G
  stat -c %s /tmp/sparse                  # ~1 GB apparent
  du -h /tmp/sparse                       # a few kilobytes actual
  ```

  **Two limits, one error.**

  **You ran out of blocks.** `df -h` went to 100% while `df -i` barely moved,
  because one enormous file needs one inode. The reverse happens with millions of
  tiny files: inodes at 100%, space at 40%, and every write failing with the same
  `ENOSPC`.

  That is why the diagnosis is always **both** commands. `df -h` alone cannot
  distinguish the two, and the fixes are completely different: free space, versus
  delete small files or reformat — on ext4 the inode count is fixed when the
  filesystem is created and cannot be raised online.

  **The space came back immediately.** Nothing held the file open, so removing
  the last name freed the blocks at once. Remember this contrast: it is exactly
  what does *not* happen in the next lab, and the difference is the whole
  diagnosis of a disk that stays full.

  **A sparse file is a third way sizes mislead.** The apparent size is the offset
  of its furthest byte; the actual usage is the blocks written. The hole was
  never allocated, and reading it returns zeros the kernel makes up on demand.

  VM images, database files and core dumps are routinely sparse, and it matters
  when copying: a tool that does not understand holes writes out every zero, and
  a few-kilobyte file becomes a genuine gigabyte. `cp --sparse=always`, `rsync
  -S` and `tar -S` keep the holes.

  **Where this goes.** Node disk pressure in **E31** is this at cluster scale,
  and the monitoring lesson is the same: alert on free inodes as well as free
  space, and on the growth rate rather than the level.
