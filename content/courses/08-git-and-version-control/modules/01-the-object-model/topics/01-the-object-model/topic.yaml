terminology:
  - term: object
    definition: >-
      An immutable record in the repository, named by the SHA-1 of its own
      contents. Everything Git stores is one of four kinds.
  - term: blob
    definition: >-
      The contents of a file, and nothing else. A blob has no name, no path and
      no permissions — those live in the tree that points at it.
  - term: tree
    definition: >-
      A directory. A list of entries, each with a mode, a type, an object id and
      a name. Trees point at blobs and at other trees.
  - term: commit
    definition: >-
      A tree, zero or more parents, an author, a committer and a message. The id
      covers all of it, which is why changing any part produces a different
      commit.
  - term: annotated tag
    definition: >-
      An object naming another object, with a message and a tagger. Distinct
      from a lightweight tag, which is only a ref.
  - term: content addressing
    definition: >-
      Naming something by the hash of its contents, so the name changes whenever
      the contents do. A04.1 taught the property; Git is the clearest thing
      built on it.
  - term: ref
    definition: >-
      A file under `.git/refs` containing an object id. A branch is a ref; so is
      a lightweight tag.
  - term: HEAD
    definition: >-
      A file naming the ref you are currently on, usually as
      `ref: refs/heads/main`. Detached `HEAD` means it contains an id directly.
  - term: loose object
    definition: >-
      One object in one zlib-compressed file under `.git/objects`, named by the
      first two hex characters of its id and then the remaining thirty-eight.
  - term: snapshot
    definition: >-
      What a commit records — the complete state of the tree, not a change to
      it. Unchanged files are reused by id rather than stored again.

foreshadows:
  - "B10.7's reflog recovery works only because nothing is deleted when a pointer moves."
  - "B10.13's bisect is a walk over the same DAG this topic builds."
  - "C14's image layers are content-addressed for the same reasons, and A04.1's digest is the same idea again."

