id: topic.the-object-model
slug: the-object-model
title: "What a Repository Is: Four Objects and a Pointer"
summary: >-
  A commit id is not assigned, it is computed — and `sha1sum` produces the same
  forty characters `git hash-object` does. That one fact explains why `--amend`
  leaves the old commit sitting in the store, and why an unchanged file costs
  nothing across a thousand commits. Git stores snapshots, not diffs, and a
  branch is a file containing forty bytes.
order: 1
levels: [L1, L2]
estimated_minutes: 120
status: published

prerequisites:
  - topic: topic.hashing-and-passwords
    hardness: required
  - topic: topic.the-filesystem-hierarchy
    hardness: recommended
  - topic: topic.how-a-line-becomes-a-command
    hardness: recommended

