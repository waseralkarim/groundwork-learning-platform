terminology:
  - term: branch
    definition: >-
      A ref under `.git/refs/heads/` holding one commit id. Creating one writes
      41 bytes and no objects; committing on it moves that file.
  - term: merge base
    definition: >-
      The most recent commit reachable from both branches — the point they last
      agreed. Everything a merge does is defined relative to it.
  - term: fast-forward
    definition: >-
      Moving a branch pointer forward when the target already contains it. No
      merge commit is created because there is nothing to combine.
  - term: three-way merge
    definition: >-
      Comparing base→ours and base→theirs, then combining. It is what lets Git
      tell "you added this" apart from "they deleted that".
  - term: merge commit
    definition: >-
      A commit with two or more parents. Its tree is the combined result; its
      parents record what was combined.
  - term: conflict
    definition: >-
      Both sides changed the same region relative to the base. The index holds
      stages 1, 2 and 3 for the path and Git refuses to write a tree until one
      remains.
  - term: "ours / theirs"
    definition: >-
      Stage 2 is the branch you are on, stage 3 the branch being merged. The
      names swap meaning during a rebase, which is a common source of error.
  - term: semantic conflict
    definition: >-
      Two changes that merge cleanly and are wrong together — a renamed function
      on one side, a new caller of the old name on the other. Git cannot see it.
  - term: "--no-ff"
    definition: >-
      Force a merge commit even when a fast-forward is possible, to keep the
      branch's shape in history.
  - term: octopus merge
    definition: >-
      A merge with more than two parents. Rare, refuses conflicts outright, and
      mostly evidence the model has no special case for two.

foreshadows:
  - "B10.5's rebase replays commits instead of merging them, and swaps what ours and theirs mean."
  - "B10.9 is conflict resolution in depth, on the index stages this topic exposes."
  - "E27's CI is where semantic conflicts are actually caught, since Git cannot see them."

tags: [git, version-control, branching, merging, conflicts, fundamentals]
