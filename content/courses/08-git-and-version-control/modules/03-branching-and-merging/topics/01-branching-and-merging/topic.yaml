id: topic.branching-and-merging
slug: branching-and-merging
title: "Merging: Three Trees, One Ancestor"
summary: >-
  A merge does not compare two branches. It compares each of them against the
  commit they last had in common, which is why Git can combine two sets of
  changes it has never seen together and why a conflict happens exactly when
  both sides changed the same region. Fast-forward is not a kind of merge — it
  is what happens when there is nothing to merge.
order: 1
levels: [L2, L3]
estimated_minutes: 130
status: published

prerequisites:
  - topic: topic.the-object-model
    hardness: required
  - topic: topic.staging-and-committing
    hardness: required

