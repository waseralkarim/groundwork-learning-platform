    statement: >-
      Diagnose a conflict by reading the index's non-zero stages rather than the
      markers in the file.
    assessed_by: [quiz.q10, quiz.q11, lab.merge-by-hand, troubleshooting.the-merge-that-lost-a-fix]

  - id: OBJ-B10.3.6
    level: L3
    verb: diagnose
