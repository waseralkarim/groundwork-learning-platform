    level: L2
    verb: explain
    statement: >-
      Explain what creating and switching a branch does to `HEAD`, the index and
      the working tree.
    assessed_by: [quiz.q1, quiz.q2, lab.what-switching-actually-moves, exercise.e1]

  - id: OBJ-B10.3.2
    level: L2
    verb: trace
    statement: >-
      Trace a history's shape from its commits' parent links, and locate the
      merge base of two branches.
    assessed_by: [quiz.q3, quiz.q4, lab.find-the-ancestor, exercise.e2]

  - id: OBJ-B10.3.3
    level: L2
    verb: distinguish
    statement: >-
      Distinguish a fast-forward from a true merge, and say what each does to
