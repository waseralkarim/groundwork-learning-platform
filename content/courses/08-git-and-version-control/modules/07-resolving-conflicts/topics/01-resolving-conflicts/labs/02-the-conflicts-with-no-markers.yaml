id: lab.the-conflicts-with-no-markers
topic: topic.resolving-conflicts
title: Four conflicts, four different shapes in the index
type: guided
tier: 2
image: groundwork/lab-foundations:1
duration_minutes: 35
objectives: [OBJ-B10.7.3, OBJ-B10.7.4]

intro: >-
  Everything you have met so far is a *content* conflict: one path, three
  stages, markers in the file, edit and stage.


  Three other kinds exist. One writes no markers at all. One has no base. One
  produces three unmerged paths for a single logical disagreement. In each case
  the instinct learned from content conflicts — open the file and look for
  `<<<<<<<` — finds nothing, and the index is the only thing that explains what
  Git is asking.

setup:
  - /opt/lab/seed-git.sh

steps:
  - id: s1
    instruction: >-
      Produce a modify/delete conflict — one side edits a file, the other
      removes it — and record its shape. Save to /tmp/answer-moddel.
    hint: >-
      Look for markers in the file first, then look at `git ls-files --stage`.
    walkthrough: |
      rm -rf /tmp/md; mkdir -p /tmp/md; cd /tmp/md
      git init -q
      echo "the original" > d.txt && git add -A && git commit -q -m base
      git checkout -q -b remover
      git rm -q d.txt && git commit -q -m "deleted it"
      git checkout -q main
      echo "improved" > d.txt && git commit -q -am "changed it"
      {
        echo "merging:"
        git merge remover 2>&1 | grep -i conflict | sed 's/^/  /'
        echo
        echo "markers in the file? $(grep -c '<<<<<<<' d.txt) - none."
        echo "the file is just my version, untouched:"
        echo "  $(cat d.txt)"
        echo
        echo "the index:"
        git ls-files --stage d.txt | sed 's/^/  /'
        echo
        echo "stages 1 and 2 only. no stage 3, because THEIRS does not exist -"
        echo "they deleted it. there is nothing to merge the two sides into, so"
        echo "no markers are written."
        echo
        echo "the question git is asking is not 'which lines' - it is 'should"
        echo "this file exist at all'. that is a decision, not an edit."
      } > /tmp/answer-moddel
      cat /tmp/answer-moddel
    verify:
      - type: command_output
        command: "cd /tmp/md && git ls-files --stage d.txt | wc -l"
        equals: "2"
        describe: The path has two stages, not three
      - type: command_output
        command: "cd /tmp/md && grep -c '<<<<<<<' d.txt"
        equals: "0"
        describe: And no markers were written
      - type: file_matches
        path: /tmp/answer-moddel
        pattern: "(?i)should\\s+this file exist"
        describe: And you identified what is actually being asked

  - id: s2
    instruction: >-
      Resolve it both ways and show that each is a single command. Save to
      /tmp/answer-moddel-fix.
    hint: >-
      Keeping it and removing it are `git add` and `git rm`.
    walkthrough: |
      cd /tmp/md
      {
        echo "to keep the file:  git add d.txt"
        echo "to remove it:      git rm d.txt"
        echo
        echo "taking the deletion:"
        git rm -q d.txt
        echo "  unmerged paths left: $(git diff --name-only --diff-filter=U | wc -l)"
        git commit -q -m "merge: accept the deletion"
        echo "  d.txt exists now? $(test -e d.txt && echo yes || echo no)"
        echo
        echo "no editing, no markers, no ambiguity - just a decision expressed"
        echo "as whichever command matches it."
      } > /tmp/answer-moddel-fix
      cat /tmp/answer-moddel-fix
    verify:
      - type: command_output
        command: "cd /tmp/md && test -e d.txt && echo present || echo removed"
        equals: "removed"
        describe: You resolved by accepting the deletion
      - type: command_output
        command: "cd /tmp/md && git status --short | wc -l"
        equals: "0"
        describe: And the merge completed cleanly

  - id: s3
    instruction: >-
      Produce an add/add conflict — both sides create the same path
      independently — and find what is missing from its index entry. Save to
      /tmp/answer-addadd.
    hint: >-
      Compare the stage numbers against a content conflict's.
    walkthrough: |
      rm -rf /tmp/aa; mkdir -p /tmp/aa; cd /tmp/aa
      git init -q
      echo base > b.txt && git add -A && git commit -q -m base
      git checkout -q -b other
      echo "theirs version" > new.txt && git add -A && git commit -q -m t
      git checkout -q main
      echo "ours version" > new.txt && git add -A && git commit -q -m o
      {
        git merge other 2>&1 | grep -i conflict | sed 's/^/  /'
        echo
        echo "the index:"
        git ls-files --stage new.txt | sed 's/^/  /'
        echo
        echo "stages 2 and 3, and NO STAGE 1. there is no base, because neither"
        echo "side inherited this file - both invented it."
        echo
        echo "so diff3 has nothing to show me here, and it is honest about that."
        echo "there is no 'what it said before' to consult, and the whole"
        echo "attribution rule from B10.3 does not apply - neither side changed"
        echo "anything relative to a base, because there was no base."
        echo
        echo "which makes it a design question rather than a merge question: two"
        echo "people wrote the same file for the same purpose, and someone has to"
        echo "decide what that file should contain."
      } > /tmp/answer-addadd
      cat /tmp/answer-addadd
    verify:
      - type: command_output
        command: "cd /tmp/aa && git ls-files --stage new.txt | awk '{print $3}' | tr '\\n' ' ' | tr -d ' '"
        equals: "23"
        describe: The path has stages 2 and 3 with no stage 1
      - type: file_matches
        path: /tmp/answer-addadd
        pattern: "(?i)no base|NO STAGE 1"
        describe: And you noticed the base is absent
      - type: file_matches
        path: /tmp/answer-addadd
        pattern: "(?i)design question"
        describe: And said what kind of decision it really is

  - id: s4
    instruction: >-
      Produce a rename/rename conflict and count how many paths it leaves
      unmerged. Save to /tmp/answer-rename.
    hint: >-
      Both sides move the same file to different names. Then run
      `git diff --name-only --diff-filter=U`.
    walkthrough: |
      rm -rf /tmp/rr; mkdir -p /tmp/rr; cd /tmp/rr
      git init -q
      seq 1 30 | sed 's/^/line /' > orig.txt && git add -A && git commit -q -m base
      git checkout -q -b other
      git mv orig.txt theirs.txt && git commit -q -m "theirs: renamed"
      git checkout -q main
      git mv orig.txt ours.txt && git commit -q -m "ours: renamed"
      {
        git merge other 2>&1 | grep -iE 'conflict' | sed 's/^/  /'
        echo
        echo "files in the tree now: $(ls *.txt | tr '\n' ' ')"
        echo
        echo "unmerged paths:"
        git diff --name-only --diff-filter=U | sed 's/^/  /'
        echo
        echo "THREE paths for ONE disagreement. the original name and both new"
        echo "ones are all unmerged, because git cannot express 'this file is now"
        echo "called something, and we disagree about what' as a single entry."
        echo
        echo "and both new files exist on disk with the content intact - nothing"
        echo "is missing. the only thing wrong is the name, and no marker can say"
        echo "that."
      } > /tmp/answer-rename
      cat /tmp/answer-rename
    verify:
      - type: command_output
        command: "cd /tmp/rr && git diff --name-only --diff-filter=U | wc -l"
        equals: "3"
        describe: One rename/rename conflict leaves three unmerged paths
      - type: command_output
        command: "cd /tmp/rr && ls *.txt | wc -l"
        equals: "2"
        describe: And both renamed files are present on disk
      - type: file_matches
        path: /tmp/answer-rename
        pattern: "(?i)THREE paths for ONE"
        describe: And you noticed the mismatch between paths and decisions

  - id: s5
    instruction: >-
      Write to /tmp/answer-shapes a table of the four conflict shapes and how to
      recognise each one.
    hint: >-
      Sort them by what the index looks like, because that is the thing that is
      always available.
    walkthrough: |
      cat > /tmp/answer-shapes <<'EOF'
      four shapes, and the index tells them apart when the file cannot:

        kind             stages        markers   what is being asked
        ---------------------------------------------------------------------
        content          1, 2, 3       yes       which lines
        modify/delete    1, 2  or 1,3  NO        should this file exist
        add/add          2, 3 (no 1)   yes       what should this new file be
        rename/rename    3 paths       NO        what is this file called

      how i would actually work:

        git status                          names the kind for each path
        git diff --name-only --diff-filter=U   the full list, nothing else
        git ls-files --stage <path>         the shape, when status is unclear

      the habit worth having is to run the --diff-filter=U list FIRST, before
      opening anything. it is the complete set of decisions i owe, and it
      includes the paths with no markers - which are exactly the ones i would
      otherwise miss, because my instinct is to search for <<<<<<< and move on
      when i do not find it.

      that instinct is the actual hazard here. a modify/delete leaves my version
      of the file sitting there looking perfectly normal, and a rename/rename
      leaves both files present with their content intact. nothing looks wrong.
      the merge simply will not complete, and the reason is not visible anywhere
      except the index.
      EOF
      cat /tmp/answer-shapes
    verify:
      - type: file_matches
        path: /tmp/answer-shapes
        pattern: "(?i)modify/delete"
        describe: You tabulated the shapes
      - type: file_matches
        path: /tmp/answer-shapes
        pattern: "diff-filter=U"
        describe: And named the command that lists every decision
      - type: file_matches
        path: /tmp/answer-shapes
        pattern: "(?i)nothing looks wrong"
        describe: And identified why these are easy to miss

solution: >-
  **Four kinds, four shapes in the index:**


  | Kind | Stages | Markers | The question |
  |---|---|---|---|
  | content | 1, 2, 3 | yes | which lines |
  | modify/delete | 1, 2 (or 1, 3) | **no** | should this file exist |
  | add/add | 2, 3 — **no base** | yes | what should this new file be |
  | rename/rename | **three paths** | **no** | what is this file called |


  **modify/delete writes no markers** because there is no third version to merge
  against — one side deleted it. Your copy sits in the tree looking entirely
  normal. The question is not "which lines" but "should this exist", and it is
  answered with `git add` or `git rm` rather than an edit.


  **add/add has no stage 1.** Neither side inherited the file, so there is no
  base — and the B10.3 attribution rule genuinely does not apply, because neither
  side changed anything *relative to* anything. `diff3` shows no base section
  here, honestly, because there is none.


  **rename/rename leaves three unmerged paths for one disagreement** — the
  original name and both new ones — because Git cannot express "we disagree about
  what this file is called" as a single entry. Both files are present with their
  content intact. Nothing is wrong except the name.


  **Which is why the working habit is to list before looking:**


  ```console
  $ git diff --name-only --diff-filter=U
  ```


  That is the complete set of decisions you owe, including the paths with no
  markers — the ones the search-for-`<<<<<<<` instinct silently skips.
