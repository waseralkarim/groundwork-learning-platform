    assessed_by: [quiz.q12, quiz.q13, lab.forty-conflicts-one-method, exercise.e4, assessment.A, assessment.B, assessment.C]

terminology:
  - term: conflict style
    definition: >-
      How Git writes markers into a conflicted file. `merge` is the two-way
      default; `diff3` and `zdiff3` add the base between `|||||||` and `=======`.
  - term: diff3
    definition: >-
      A conflict style showing base, ours and theirs. Makes attribution possible
      by inspection rather than by guessing which side changed what.
  - term: zdiff3
    definition: >-
      Like `diff3`, but with common lines hoisted out of the conflicted region
      first, so the markers surround only what genuinely differs.
  - term: modify/delete
    definition: >-
      One side changed a file, the other removed it. The index holds stages 1
      and 2 or 1 and 3 — never all three — and no markers are written.
  - term: add/add
    definition: >-
      Both sides created the same path independently. There is no base, so the
      index has stages 2 and 3 with no stage 1.
  - term: rename/rename
    definition: >-
      Both sides moved the same file to different names. Git reports it, and the
      resolution is a decision about which name is right.
  - term: "--diff-filter=U"
    definition: >-
      Limit output to unmerged paths, which is how you list exactly what still
      needs a decision.
  - term: merge tool
    definition: >-
      A three-pane program that shows base, ours and theirs. Worth configuring
      because it presents the base by default, which the markers do not.
  - term: abort
    definition: >-
      `git merge --abort` or `git rebase --abort`. Costs nothing, loses nothing,
      and is frequently the correct move once a merge is understood to be the
      wrong shape.

foreshadows:
  - "B10.10's workflows exist largely to keep merges small enough that this topic is short."
  - "E27's CI is what catches the conflicts that resolved cleanly and are wrong."

tags: [git, version-control, conflicts, merge, diff3, fundamentals]
