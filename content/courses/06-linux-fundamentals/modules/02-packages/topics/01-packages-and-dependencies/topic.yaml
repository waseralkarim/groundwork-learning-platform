id: topic.packages-and-dependencies
slug: packages-and-dependencies
title: "Packages: What Put This File Here"
summary: >-
  A package is a manifest before it is an archive, and the manifest is what lets
  you ask a running system where any file came from. This topic follows the
  question in both directions — file to package, package to consequence — and
  spends its time on the two answers that hurt: the file no package owns, and
  the dependency nobody declared.
order: 1
levels: [L1, L2]
estimated_minutes: 115
status: published

prerequisites:
  - topic: topic.distributions-and-versions
    hardness: required
  - topic: topic.files-and-filesystems
    hardness: recommended

objectives:
