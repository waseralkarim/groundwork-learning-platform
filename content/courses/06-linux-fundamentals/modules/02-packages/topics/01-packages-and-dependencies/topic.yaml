    level: L1
    verb: identify
    statement: >-
      Identify which package owns a given file, and which files a given package
      owns.
    assessed_by: [quiz.q1, quiz.q2, lab.what-put-this-file-here, exercise.e1]

  - id: OBJ-B06.2.2
    level: L1
    verb: describe
    statement: >-
      Describe what a package contains beyond its files, and what the package
      database records about it.
    assessed_by: [quiz.q3, quiz.q4, lab.what-put-this-file-here]

  - id: OBJ-B06.2.3
    level: L2
    verb: interpret
    statement: >-
      Interpret a dependency declaration, distinguishing Depends, Pre-Depends,
      Recommends and Suggests by what each one guarantees.
    assessed_by: [quiz.q5, quiz.q6, quiz.q7, lab.the-closure, exercise.e2]

  - id: OBJ-B06.2.4
    level: L2
    verb: explain
    statement: >-
      Explain the difference between the packages that were asked for and the
      packages that are installed.
    assessed_by: [quiz.q8, quiz.q9, lab.the-closure, exercise.e3]

  - id: OBJ-B06.2.5
    level: L2
    verb: predict
    statement: >-
      Predict the consequence of removing a package, including the cases where
      removal is refused.
    assessed_by: [quiz.q10, quiz.q11, lab.what-removal-costs, exercise.e4]

  - id: OBJ-B06.2.6
    level: L2
    verb: distinguish
    statement: >-
      Distinguish files the package system manages from files it does not, and
      state what is lost for the second kind.
    assessed_by: [quiz.q12, lab.what-put-this-file-here, lab.find-the-real-finding, assessment.C]

  - id: OBJ-B06.2.7
    level: L2
    verb: diagnose
    statement: >-
      Diagnose a failure caused by an undeclared dependency or an unmanaged
