terminology:
  - term: package
    definition: >-
      An archive of files plus a manifest: metadata, a dependency declaration, a
      list of configuration files, and scripts that run around installation. The
      manifest is the part that makes it a package rather than a tarball.
  - term: package database
    definition: >-
      The local record of what is installed — on Debian, `/var/lib/dpkg/`. It is
      a description of the machine, not of the archive, and it is what every
      "what is installed" question actually reads.
  - term: file ownership
    definition: >-
      The mapping from a path to the package that placed it there. `dpkg -S`
      asks in that direction; `dpkg -L` asks in the other.
  - term: Depends
    definition: >-
      A hard requirement: the package will not be configured until it is met. The
      only relationship that is a guarantee.
  - term: Pre-Depends
    definition: >-
      Stronger than Depends — the requirement must be fully installed *before
      unpacking* even begins. Rare, and it makes some removals impossible.
  - term: Recommends
    definition: >-
      Installed by default but not required. Software that works without it, in a
      way somebody would consider broken — which is why it is the source of the
      dependency nobody declared.
  - term: Suggests
    definition: >-
      Related software, never installed automatically. Documentation, effectively.
  - term: dependency closure
    definition: >-
      Everything that gets installed as a consequence of asking for something.
      The gap between the two numbers is the honest size of a request.
  - term: manual and automatic
    definition: >-
      Whether a package was asked for or pulled in. It is recorded, and it is
      what makes `autoremove` possible and dangerous.
  - term: essential
    definition: >-
      A flag marking packages the system does not function without. Removal is
      refused rather than warned about.
  - term: conffile
    definition: >-
      A configuration file the package system tracks by checksum, so it can tell
      whether you edited it and decide what an upgrade should do with it.
  - term: alternatives
    definition: >-
      A symlink layer letting several packages provide the same command. It is
      why `dpkg -S /usr/bin/awk` finds nothing while the binary it points at is
      owned.
  - term: unowned file
    definition: >-
      A file no package placed. It receives no upgrades, no security fixes and no
      integrity checking, and nothing on the machine records that it exists.

foreshadows:
  - "B06.3's filesystem hierarchy explains why /usr/local is where unowned files are supposed to go."
  - "C14's image layers are this dependency closure made visible as size."
  - "G43's SBOM generation reads exactly the database this topic queries."
  - "D22's configuration management exists because conffile handling does not scale to a fleet."

