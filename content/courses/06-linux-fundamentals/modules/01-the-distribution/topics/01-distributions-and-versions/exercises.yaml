topic: topic.distributions-and-versions

exercises:
  - id: e1
    title: Identify four systems from one file each
    level: L1
    objectives: [OBJ-B06.1.1]
    kind: interpretation
    prompt: >-
      For each, give the distribution, the release, and one thing the file tells
      you beyond the name:


      1. `ID=ubuntu VERSION_ID="24.04" ID_LIKE=debian VERSION_CODENAME=noble`

      2. `ID="rocky" VERSION_ID="9.4" ID_LIKE="rhel centos fedora"`

      3. `ID=alpine VERSION_ID=3.20.3` (no `ID_LIKE`)

      4. `ID=arch BUILD_ID=rolling` (no `VERSION_ID`)
    answer: >-
      1. **Ubuntu 24.04 (noble).** `ID_LIKE=debian` says a script handling Debian
         should handle this without naming Ubuntu. The codename matters because
         package archives are addressed by it.


      2. **Rocky Linux 9.4.** Three families in `ID_LIKE`, which says it is a RHEL
         rebuild and will behave like one for package management and paths.


      3. **Alpine 3.20.3.** No `ID_LIKE` at all — it is not derived from anything,
         and a script must handle it explicitly. That absence is a warning: it
         uses musl rather than glibc and `apk` rather than apt or dnf.


      4. **Arch, rolling.** No `VERSION_ID` **because there is no release**. A
         script requiring that field breaks here, and the absence is meaningful
         data rather than a gap.
    explanation: >-
      Items 3 and 4 are the instructive ones. The **absence** of a field is
      informative in both: no `ID_LIKE` means no family to fall back on, and no
      `VERSION_ID` means no releases exist to number.


      That is worth generalising. A script reading `/etc/os-release` should treat
      a missing field as a case to handle rather than as bad data — and should
      fail loudly on an unrecognised `ID`, because the alternative is a guess
      that is silently wrong.

  - id: e2
    title: Decompose three version strings
    level: L2
    objectives: [OBJ-B06.1.3]
    kind: interpretation
    prompt: >-
      Name every component and say what each records:


      1. `3.5.6-1~deb13u2`

      2. `4:14.2.0-1`

      3. `5.2.37-2+b9`
    answer: >-
      1. Upstream **3.5.6**; distribution revision **1**; suffix **~deb13u2**, a
         Debian 13 update — the second security or point release for it. The `~`
         sorts before nothing, which is what makes the scheme work.


      2. Epoch **4**; upstream **14.2.0**; revision **1**. The epoch is a
         permanent override applied because upstream versioning went backwards at
         some point, and it beats every other component.


      3. Upstream **5.2.37**; revision **2**; suffix **+b9**, a binary NMU — the
         package was rebuilt nine times without a source change, usually against
         new libraries. `+` sorts *after* nothing, so this is newer than
         `5.2.37-2`.


      The pattern: **upstream says what the authors released; everything after it
      says what the distribution did.**
    explanation: >-
      Item 3 is the one people misread most, because `+b9` looks like a large
      number of changes and represents none at all to the source. A binary NMU is
      a rebuild, typically triggered by a library transition, and it is why two
      systems can run "the same version" of a package with different binaries.


      The two suffixes sorting in opposite directions — `~` before, `+` after —
      is worth memorising, because it is the difference between a pre-release and
      a rebuild and there is no other signal.

  - id: e3
    title: Answer a vulnerability finding
    level: L2
    objectives: [OBJ-B06.1.5]
    kind: short_answer
    prompt: >-
      A scanner reports the container as vulnerable: `curl 8.14.1`, CVE fixed
      upstream in `8.15.0`. `dpkg-query` reports `8.14.1-2+deb13u4`.


      Write the ticket reply, and say what you would check before sending it.
    answer: >-
      *The scanner is comparing upstream version numbers, which does not work
      against a stable distribution. Our package is `8.14.1-2+deb13u4` — the
      `+deb13u4` records four Debian updates to that upstream release, which is
      where security fixes arrive.*


      *Debian backports fixes rather than upgrading versions, so the upstream
      number stays at 8.14.1 while the vulnerability is addressed. I have
      confirmed against Debian's security tracker that this CVE is fixed in our
      installed version. [link]*


      *The scanner needs to consume distribution security data rather than
      comparing upstream numbers, or it will keep producing this class of finding
      for every package we run.*


      **Before sending it, check three things:** that the tracker really does
      list this CVE as fixed in that version — not merely that a revision exists;
      that curl came from the archive rather than a third-party repository, where
      no backport applies; and that the package is in the supported set, since
      LTS commitments often cover a subset.
    explanation: >-
      The reply is easy and the checks are the exercise. **"Stable therefore
      patched" is exactly as unfounded as "version is old therefore
      vulnerable"** — both replace looking with a rule of thumb, and the second
      one at least errs toward caution.


      The third check catches a real case: a package installed from a
      third-party repository carries a version string that looks like the
      distribution's and receives none of its backports. The version format tells
      you nothing about where a package came from.

  - id: e4
    title: Match release models to situations
    level: L2
    objectives: [OBJ-B06.1.6]
    kind: ordering
    prompt: >-
      Match each situation to fixed, rolling or LTS, and give the deciding
      property:


      (a) A CI runner image rebuilt hourly

      (b) A database server, 400 of them, upgraded on a change-managed schedule

      (c) A laptop belonging to someone who needs this month's toolchain

      (d) A medical device with a five-year certification
    answer: >-
      - **(a) fixed, frequent point updates.** Deciding property: it is rebuilt
        hourly, so lifetime collapses and it needs to be current *at build time*
        rather than supported for years.


      - **(b) LTS fixed.** Deciding property: change-managed upgrades at that
        fleet size need a named support lifetime and predictable behaviour
        between events.


      - **(c) rolling.** Deciding property: currency is the actual requirement,
        and the recovery from breakage is cheap.


      - **(d) LTS fixed, longest available — and probably vendor-supported.**
        Deciding property is not the lifetime but the **certification**: changing
        the software may invalidate it, so the constraint is regulatory rather
        than technical and it decides everything else.
    explanation: >-
      (a) and (b) look similar and are opposite, which is the useful pair. Both
      are fixed releases and one wants the *shortest* useful cycle while the
      other wants the longest — because rebuild frequency and upgrade cost pull
      in opposite directions.


      (d) is the same shape as the challenge lab's appliance: a constraint from
      outside the technical stack overrides the release model. Certification, a
      kernel module, or a contractual support requirement all eliminate options
      rather than trading them off, and looking for those first is faster than
      comparing models on merit.

  - id: e5
    title: Write what outlives you
    level: L2
    objectives: [OBJ-B06.1.8]
    kind: short_answer
    prompt: >-
      You have chosen Debian stable for a fleet. Write the decision record, and
      say which line will matter most in two years.
    answer: >-
      ```text
      Distribution:        Debian 13 (trixie), fixed release
      Why:                 predictable behaviour between change windows;
                           no kernel module, glibc or vendor-support constraint
      Supported until:     <date> — security fixes only, and only for the
                           archive; check the supported subset
      Outside the archive: - node 22 from nodesource      owner: <name>
                           - datadog-agent (vendor deb)   owner: <name>
                           - internal CLI in /usr/local   owner: <name>
      Base image pinning:  tag in CI (for patches), digest in release manifests
      Would change this:   a dependency requiring a newer glibc; a compliance
                           requirement for vendor-supported OS; moving to an
                           appliance model with field lifetimes
      ```


      **The line that will matter most is "outside the archive".** In two years
      the distribution choice will be obvious from the machines. What will not be
      obvious is which software Debian is *not* patching, and who agreed to patch
      it instead.
    explanation: >-
      Most decision records capture the decision and omit its consequences. The
      distribution and the date are recoverable from any running machine; the
      outside-the-archive list is not recoverable from anywhere, and every entry
      on it is a permanent obligation somebody accepted implicitly.


      The "would change this" line is the second most valuable, for the reason
      the A05 topics kept returning to: without reversal conditions, a decision
      cannot be revisited by anybody who was not in the room, so it is either
      followed forever or overturned without understanding what it was for.
