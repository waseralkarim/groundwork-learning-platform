id: topic.distributions-and-versions
slug: distributions-and-versions
title: "The Distribution: Old on Purpose"
summary: >-
  A distribution is a kernel, a userland, an archive and a release policy — and
  the policy is why the software is older than upstream. This topic identifies a
  system from the machine rather than from memory, and reads the version strings
  that policy produces, including the three comparison rules that are not string
  comparison.
order: 1
levels: [L1, L2]
estimated_minutes: 110
status: published

prerequisites:
  - topic: topic.files-and-filesystems
    hardness: recommended

objectives:
  - id: OBJ-B06.1.1
    level: L1
    verb: identify
    statement: >-
      Identify the distribution, release and codename of a running system from
      the machine itself, portably.
    assessed_by: [quiz.q1, quiz.q2, lab.what-am-i-running, exercise.e1]

  - id: OBJ-B06.1.2
    level: L1
    verb: describe
    statement: >-
      Describe what a distribution provides beyond a kernel, and what
      distinguishes one from another.
    assessed_by: [quiz.q3, quiz.q4, lab.what-am-i-running]

  - id: OBJ-B06.1.3
    level: L2
    verb: interpret
    statement: >-
      Interpret a package version string, naming each component and what it
      records.
    assessed_by: [quiz.q5, quiz.q6, lab.read-a-version-string, exercise.e2]

  - id: OBJ-B06.1.4
    level: L2
    verb: predict
    statement: >-
      Predict the result of comparing two package versions, including the cases
      where it is not string comparison.
    assessed_by: [quiz.q7, quiz.q8, quiz.q9, lab.version-comparison-traps, assessment.A]

  - id: OBJ-B06.1.5
    level: L2
    verb: explain
    statement: >-
      Explain why a stable release ships software older than upstream, and what
      that policy buys and costs.
    assessed_by: [quiz.q10, quiz.q11, lab.read-a-version-string, exercise.e3]

  - id: OBJ-B06.1.6
    level: L2
    verb: distinguish
    statement: >-
      Distinguish release models — fixed, rolling and long-term support — by
      what each one guarantees.
    assessed_by: [quiz.q12, quiz.q13, lab.choose-a-release, exercise.e4]

  - id: OBJ-B06.1.7
    level: L2
    verb: diagnose
    statement: >-
      Diagnose a failure caused by a version assumption, and identify the
      comparison that was wrong.
    assessed_by: [quiz.q14, lab.version-comparison-traps, troubleshooting.the-version-that-went-backwards]

