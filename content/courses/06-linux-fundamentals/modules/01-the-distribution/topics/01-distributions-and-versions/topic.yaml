    assessed_by: [quiz.q15, lab.choose-a-release, exercise.e5, assessment.B, assessment.C, troubleshooting.the-base-image-nobody-chose]

terminology:
  - term: distribution
    definition: >-
      A kernel, a userland, an archive of packages built to work together, and a
      policy about when any of it changes. The last two are what actually
      distinguish one from another.
  - term: os-release
    definition: >-
      `/etc/os-release` — the standard machine-readable identity of a system.
      Present on every modern distribution, unlike the tools people reach for.
  - term: codename
    definition: >-
      A release's name — `trixie`, `noble`, `jammy`. Used by package archives, so
      it appears in sources and in version suffixes.
  - term: upstream version
    definition: >-
      The version the software's own authors released. The first part of a
      package version, and the only part upstream knows about.
  - term: distribution revision
    definition: >-
      The number after the hyphen. It counts changes the distribution made to the
      same upstream release — a patch, a build fix, a security backport.
  - term: epoch
    definition: >-
      A number before a colon, as in `4:14.2.0-1`. It exists to force ordering
      when upstream versioning goes backwards, and it beats every other component.
  - term: backport
    definition: >-
      A fix taken from a newer upstream release and applied to an older one, so
      the version number stays put while the bug goes away. It is why "our
      version is old" is a weak argument about vulnerability.
  - term: fixed release
    definition: >-
      Versions frozen at release and changed only for security and grave bugs.
      Predictable, and increasingly far behind upstream.
  - term: rolling release
    definition: >-
      Continuously updated, always close to upstream. No upgrade event, and no
      point at which the system is known to be unchanging.
  - term: long-term support
    definition: >-
      A release supported for years rather than months. What is supported is
      usually security fixes only — the versions do not move.
  - term: security suffix
    definition: >-
      A marker such as `~deb13u2` or `+deb12u1` identifying a security or point
      update. `~` sorts *before* nothing, which is what makes it work.
  - term: derivative
    definition: >-
      A distribution built from another's archive — Ubuntu from Debian, Rocky
      from RHEL. It inherits most decisions and diverges on policy.

foreshadows:
  - "B06.2's package management reads the same archive this topic identifies."
  - "C14's base image choice is this decision made for a container, with the same trade."
  - "G43's vulnerability scanning depends on version comparison being correct, and on understanding backports."
  - "B07's systemd and journald behaviour differs by release, which is why identifying one precisely matters."

