id: troubleshooting.the-secret-that-would-not-unset
topic: topic.environment-and-shell-startup
title: The credential that was still there after being removed
level: L2
objectives: [OBJ-B06.4.6, OBJ-B06.4.5]
reveal_policy: progressive

situation: >-
  An audit six months ago found a payment-provider API key passed to a service as
  an environment variable. The finding was accepted and a fix was shipped: the
  application now reads the key at startup and immediately unsets it.


  The finding was closed. A re-test at the time confirmed the variable was gone.


  This week the provider notifies you that the key has been used from an IP range
  you do not own. The key is the one that was "removed".


  The service has not been redeployed in eleven weeks. The application team is
  confident the fix works — they can demonstrate it.


  Work out where the key was still available, and what the fix actually
  accomplished.

symptoms:
  - "A credential removed six months ago has been used by somebody else"
  - "The application demonstrably unsets the variable at startup"
  - "A re-test at the time confirmed the variable was gone"
  - "The service has not been redeployed in eleven weeks"
  - "No application log shows the key"

artifacts:
  - type: config
    label: The fix that closed the finding
    content: |
      # app/config.py
      import os

      PAYMENT_API_KEY = os.environ["PAYMENT_API_KEY"]
      del os.environ["PAYMENT_API_KEY"]     # remove from the environment

  - type: command_output
    label: The team's demonstration, run inside the container
    content: |
      $ docker exec payments env | grep PAYMENT_API_KEY
      $
      # (nothing — the variable is gone)

      $ docker exec payments sh -c 'echo $PAYMENT_API_KEY'

      $

  - type: command_output
    label: What a different check found
    content: |
      $ docker exec payments sh -c 'tr "\0" "\n" < /proc/1/environ | grep PAYMENT'
      PAYMENT_API_KEY=pk_live_51H8xQ2eZvKY

      $ docker exec payments ps eww -p 1 | tr ' ' '\n' | grep PAYMENT
      PAYMENT_API_KEY=pk_live_51H8xQ2eZvKY

  - type: command_output
    label: From the host, with no container access at all
    content: |
      $ docker inspect payments --format '{{range .Config.Env}}{{println .}}{{end}}'
      PATH=/usr/local/bin:/usr/local/sbin:/usr/bin
      PYTHONUNBUFFERED=1
      PAYMENT_API_KEY=pk_live_51H8xQ2eZvKY
      LOG_LEVEL=info

  - type: config
    label: How the key is supplied
    content: |
      # compose.yaml
      services:
        payments:
          image: registry.internal/payments:4.7.2
          env_file: ./secrets/payments.env      # changed from -e during the fix

  - type: log
    label: From the incident timeline
    content: |
      11 weeks ago   last deploy of payments
       6 weeks ago   a support engineer was granted docker group membership
                     on the payments host to "check container logs"
       2 days ago    provider reports use of the key from an unknown IP

  - type: log
    label: The audit re-test, six months ago
    content: |
      RETEST-4471: confirmed PAYMENT_API_KEY is not present in
                   `docker exec payments env`. Finding closed.

diagnostic_questions:
  - "The team's demonstration and the other check disagree. Are they looking at the same thing?"
  - "What does /proc/PID/environ record, and when is it written?"
  - "Which of the exposures does deleting the variable actually close?"
  - "What changed six weeks ago, and what did it grant?"
  - "What exactly did the re-test verify?"

hints:
  - "Compare what `env` reports with what `/proc/1/environ` reports."
  - "Ask when the kernel populates /proc/PID/environ, and whether anything updates it."
  - "The `docker inspect` output needs no access to the container at all."
  - "Read the timeline entry about group membership."

root_cause: >-
  **`del os.environ[...]` removes a variable from the process's live environment.
  It does not, and cannot, remove it from the snapshot the kernel recorded at
  `execve` — and it has no effect at all on the container's stored
  configuration.**


  Three distinct exposures existed and the fix addressed one of them.


  **`/proc/PID/environ` is written once, at `execve`, and never updated.** It
  holds the environment the process was *started with*. Deleting a variable at
  runtime changes the live copy that `env` and `getenv` read; the snapshot is
  untouched. So the key has been readable at `/proc/1/environ` — and through
  `ps eww`, which reads the same region — for the entire eleven weeks the process
  has been running, and for every run before that.


  **`docker inspect` is the widest exposure and the fix never touched it.** The
  container's `Config.Env` is stored by the daemon on disk. It is populated at
  creation, it does not change when the process modifies its own environment, it
  survives the container stopping, and it is readable by **anyone who can reach
  the Docker daemon** — with no access to the container itself.


  Six weeks ago a support engineer was added to the `docker` group to read
  container logs. That grant made every environment variable of every container
  on the host readable to them, which is not what anybody thought they were
  granting. Docker group membership is root-equivalent, and this is one of the
  quieter reasons why.


  **What the fix did accomplish**, and it is worth stating fairly: child
  processes started after the deletion no longer inherit the key. For an
  application that shells out — to a PDF renderer, a CLI, an image tool — that is
  a real exposure closed, because those children receive the whole environment
  and anything they log on error may contain it.


  **Why the re-test passed.** It ran `docker exec payments env`, which shows the
  live environment of a *new* process — and that new process was started after
  the deletion, from the application's modified copy. The re-test confirmed
  exactly what the fix changed, and nothing else. It was a correct test of the
  wrong property.


  **Why `env_file` changed nothing.** Moving from `-e` to `env_file` was part of
  the same fix. It keeps the value out of shell history and out of the host's
  process list at launch. Once the container exists, the file has been read and
  the values are ordinary environment variables in `Config.Env` — `docker
  inspect` prints them identically.

method: >-
  **1. When two checks disagree, ask what each one reads.** `env` reports the
  live environment of the process running it. `/proc/PID/environ` reports the
  snapshot taken at `execve` of a *specific* process. They are different objects,
  and neither is wrong.


  **2. Know that the snapshot is immutable.** Nothing a process does to its own
  environment updates `/proc/PID/environ`. This is the fact the whole incident
  turns on, and it takes one command to demonstrate:


  ```bash
  API_TOKEN=x bash -c 'unset API_TOKEN; tr "\0" "\n" < /proc/$$/environ | grep API_TOKEN'
  ```


  **3. Enumerate exposures rather than testing one.** For an environment secret
  there are four, and they compound: same-user `/proc` access, `ps eww`, `docker
  inspect` from the host, and inheritance by children. A fix that closes one is
  not a fix; it is progress.


  **4. Ask what a passing test actually asserted.** "`env` no longer shows it" is
  a true statement about the live copy of a newly-started process. Write the
  assertion out in full and the gap becomes obvious — which is the general
  technique, because a test that passes is much harder to look at critically than
  one that fails.


  **5. Read access grants as capability grants.** "Added to the `docker` group to
  read logs" is, in fact, "granted read access to every environment variable of
  every container on the host, plus root". The stated reason and the granted
  capability are rarely the same size.


  **6. Check the deploy date against the fix date.** The process has been running
  eleven weeks, so it holds an eleven-week-old snapshot. A fix that only takes
  effect on the *next* start does nothing for a long-lived process — and nobody
  had restarted it.


  The habit: **a mitigation that is believed to work is worse than none**,
  because the finding gets closed and nobody looks again. Ask what a control
  leaves exposed, in a list, before accepting it.

resolution: >-
  **Immediately:** rotate the key at the provider, then hunt for use. Rotation
  first, because every route above is still open until the value is worthless.


  Then work out the exposure window honestly — six weeks of `docker` group
  access is the *known* window, and `/proc` and `ps` were open to anything
  running as that user for far longer.


  **Then move the secret out of the environment entirely:**


  ```yaml
  services:
    payments:
      image: registry.internal/payments:4.7.2
      secrets:
        - payment_api_key
      environment:
        PAYMENT_API_KEY_FILE: /run/secrets/payment_api_key

  secrets:
    payment_api_key:
      file: ./secrets/payment_api_key
  ```


  ```python
  with open(os.environ["PAYMENT_API_KEY_FILE"]) as f:
      PAYMENT_API_KEY = f.read().strip()
  ```


  The *path* is in the environment, which is fine — it is not a secret. The value
  is in a file: absent from `ps`, absent from the exec snapshot, absent from
  `docker inspect`, not inherited by children, and **replaceable underneath a
  running process**, which is what makes rotation something other than a
  fleet-wide restart.


  **Keep the `del os.environ[...]` line.** It closes the child-process exposure
  and costs nothing. Add a comment saying what it does and does not do, so the
  next person does not read it as the fix.


  **Revisit the `docker` group grant.** Membership is root-equivalent. If the
  support engineer needs container logs, give them a log aggregator or a narrowly
  scoped sudo rule for `docker logs`, not the daemon socket.


  **And fix the test.** The re-test asserted the wrong property, which is the
  reusable finding:


  ```bash
  # a secret must not appear in ANY of these
  docker exec "$c" env | grep -q "$PATTERN"                       && fail
  docker exec "$c" sh -c 'tr "\0" "\n" < /proc/1/environ' | grep -q "$PATTERN" && fail
  docker inspect "$c" --format '{{json .Config.Env}}' | grep -q "$PATTERN"     && fail
  ```


  Three assertions instead of one, run in CI against every service. This class of
  finding does not recur once the test enumerates the exposures rather than
  sampling one.


  **For the postmortem:** the fix was correct code that closed one of four
  exposures, the re-test correctly verified the one thing that had changed, the
  finding was closed on that evidence, and the credential remained readable to
  anything on the host for six months. The specific mechanism — that
  `/proc/PID/environ` is a snapshot nothing can edit — is not obscure, and it was
  never checked because the test that passed looked like proof.
