terminology:
  - term: environment
    definition: >-
      A list of KEY=VALUE strings handed to a program at `execve`. It is
      inherited from whoever started the process — there is no lookup and no
      central registry.
  - term: export
    definition: >-
      Marks a shell variable to be included in the environment of processes the
      shell starts. Without it the variable exists only inside that shell.
  - term: login shell
    definition: >-
      A shell started as part of logging in, or with `-l`. It reads
      `/etc/profile` and one of the user's profile files, and nothing else
      distinguishes it.
  - term: interactive shell
    definition: >-
      A shell reading commands from a terminal. It reads `/etc/bash.bashrc` and
      `~/.bashrc`. Orthogonal to whether it is a login shell.
  - term: /etc/profile
    definition: >-
      Read by login shells only. On Debian it rewrites PATH, and it gives root a
      different PATH from everyone else.
  - term: /etc/bash.bashrc
    definition: >-
      Read by interactive bash only. Where a distribution puts prompts, aliases
      and history settings — none of which a script ever sees.
  - term: BASH_ENV
    definition: >-
      The one startup file a non-interactive bash will read, if the variable is
      set. Almost never set, and the only hook available to a script.
  - term: /etc/environment
    definition: >-
      Read by PAM, not by any shell. In a container there is usually no PAM, so
      it does nothing at all.
  - term: environ
    definition: >-
      `/proc/PID/environ` — the environment as it was at `execve`. A snapshot: it
      never updates, and unsetting a variable does not remove it.
  - term: PATH
    definition: >-
      The ordered list of directories searched for a command. Constructed
      differently by the image, by `/etc/profile` and by the shell's compiled-in
      fallback.
  - term: sbin
    definition: >-
      Directories for administrative tools. Debian's `/etc/profile` omits them
      for non-root users, so a login shell can fail to find a command a script
      finds easily.
  - term: hermetic environment
    definition: >-
      An environment constructed explicitly rather than inherited — `env -i`, or
      a systemd unit with its own `Environment=`. What makes a job reproducible.
  - term: secret file
    definition: >-
      A secret delivered as a file with restrictive permissions instead of a
      variable. Not inherited by children, absent from `ps` and from the exec
      snapshot, and revocable by deletion.

foreshadows:
  - "B08's shell mechanics build on the expansion rules this topic assumes."
  - "B07's systemd units are where Environment= and EnvironmentFile= replace startup files entirely."
  - "C14's container ENV and docker inspect are the exposure this topic measures."
  - "E27's CI runners are non-interactive non-login shells, which is why half of CI debugging is this topic."

tags: [linux, shell, environment, path, secrets, fundamentals]
