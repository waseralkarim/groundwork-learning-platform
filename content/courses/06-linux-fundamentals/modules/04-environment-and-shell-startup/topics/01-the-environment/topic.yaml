id: topic.environment-and-shell-startup
slug: environment-and-shell-startup
title: "The Environment: What Your Process Actually Inherits"
summary: >-
  "It works in my shell" is the most common bug report in operations, and it has
  one cause: the shell you typed in read startup files that cron, systemd and CI
  do not. This topic measures which files each of the four shell modes reads,
  why PATH is narrower after logging in, and why a secret in the environment
  survives being unset.
order: 1
levels: [L1, L2]
estimated_minutes: 115
status: published

prerequisites:
  - topic: topic.the-filesystem-hierarchy
    hardness: required
  - topic: topic.processes
    hardness: recommended

