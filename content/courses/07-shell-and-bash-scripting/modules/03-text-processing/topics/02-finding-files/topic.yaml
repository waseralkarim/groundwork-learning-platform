terminology:
  - term: predicate
    definition: >-
      A test find applies to each path — `-name`, `-type`, `-mtime`. Adjacent
      predicates are ANDed implicitly; `-o` is OR, and it binds more loosely.
  - term: action
    definition: >-
      What find does with a matching path — `-print`, `-delete`, `-exec`. If you
      supply none, `-print` is implied; if you supply one, it is not.
  - term: "-exec ;"
    definition: >-
      Run the command once per file. One process each, and **find ignores the
      command's exit status**.
  - term: "-exec +"
    definition: >-
      Batch as many paths as fit on a command line, like xargs. One process for
      many files, and a failure **does** reach find's exit status.
  - term: "-mtime"
    definition: >-
      Modification age in **whole 24-hour periods, truncated**. `+7` means
      strictly more than seven of them, so a file seven days old is excluded.
  - term: "-mmin"
    definition: >-
      The same test in minutes. Usually what people meant when they wrote
      `-mtime`, because it has no rounding surprise at the boundary.
  - term: "-prune"
    definition: >-
      Do not descend into this directory. Different from excluding it from the
      output, because find never enters it.
  - term: "-print0"
    definition: >-
      Separate results with NUL. Paired with `xargs -0`, it is the only encoding
      safe for arbitrary filenames.
  - term: "xargs -r"
    definition: >-
      Do not run the command at all if the input is empty. GNU-specific, and the
      default without it is to run it once with no arguments.
  - term: "xargs -I"
    definition: >-
      Substitute each item into a template. It implies one item per command, so
      it silently gives up batching.
  - term: "xargs -P"
    definition: >-
      Run that many commands in parallel. Fast, and it interleaves output from
      several processes.
  - term: dry run
    definition: >-
      Printing what a destructive command would act on, before it acts. The only
      review step that catches a wrong predicate.

foreshadows:
  - "F31's backup pruning is this topic's retention logic at fleet scale."
  - "C14's build context exclusion is `-prune` reasoning applied to Docker."
  - "D22's configuration management replaces most bulk file operations entirely."
  - "B12's log rotation depends on the same time predicates and the same off-by-one."

tags: [shell, find, xargs, files, bulk-operations, fundamentals]
