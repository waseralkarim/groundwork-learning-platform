id: topic.finding-files
slug: finding-files
title: "Finding Files and Acting on Them"
summary: >-
  `find -mtime +7` does not match a file that is seven days old. `-exec cmd \;`
  runs one process per file and throws away every failure, while `-exec cmd +`
  runs one and reports them. And `xargs` runs your command even when it received
  nothing at all. Bulk operations on files, and the four ways they quietly act on
  the wrong set.
order: 2
levels: [L1, L2]
estimated_minutes: 115
status: published

prerequisites:
  - topic: topic.searching-text
    hardness: required
  - topic: topic.where-output-goes
    hardness: required

