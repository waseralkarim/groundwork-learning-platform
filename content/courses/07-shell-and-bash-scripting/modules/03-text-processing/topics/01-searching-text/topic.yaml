id: topic.searching-text
slug: searching-text
title: "Searching Text: Exit Codes, Regex Dialects and Fields"
summary: >-
  `grep` returns 1 when it finds nothing, which under `set -e` ends your script
  on a successful search. Its `+` means one thing and `grep -E`'s means another.
  And `cut -d' '` silently returns empty fields on the spacing that every real
  command produces. Three tools you have used for six courses, and the rules
  nobody stated.
order: 1
levels: [L1, L2]
estimated_minutes: 115
status: published

prerequisites:
  - topic: topic.where-output-goes
    hardness: required
  - topic: topic.how-a-line-becomes-a-command
    hardness: required

