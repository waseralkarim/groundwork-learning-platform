terminology:
  - term: exit status 1
    definition: >-
      For grep, "no lines matched". A normal, informative result — and
      indistinguishable from failure to `set -e`, which is why it ends scripts.
  - term: exit status 2
    definition: >-
      For grep, an actual error — unreadable file, bad pattern. The status that
      deserves attention, and the one people forget exists.
  - term: BRE
    definition: >-
      Basic regular expressions — the default for `grep` and `sed`. `+`, `?`,
      `|`, `(` and `{` are **literal** unless backslash-escaped.
  - term: ERE
    definition: >-
      Extended regular expressions — `grep -E`, `sed -E`, `awk`. The
      metacharacters work without backslashes, which is the dialect most people
      already have in their heads.
  - term: fixed string
    definition: >-
      `grep -F` — treat the pattern as literal text with no metacharacters. The
      correct choice whenever the pattern came from data.
  - term: anchor
    definition: >-
      `^` and `$` — the start and end of a line. The difference between matching
      a name and matching every line containing it.
  - term: greedy
    definition: >-
      A quantifier matches as much as it can. `s/".*"/X/` on a line with two
      quoted strings replaces everything between the first and last quote.
  - term: field separator
    definition: >-
      What splits a line into fields. `cut -d` takes exactly one character;
      awk's default splits on **runs** of whitespace, which is why they disagree
      on real output.
  - term: NR
    definition: >-
      awk's record number — the line being processed. `NR == 1` skips a header.
  - term: NF
    definition: >-
      awk's field count for the current line. `$NF` is the last field, which
      survives columns being added on the left.
  - term: "-print0"
    definition: >-
      Separate results with NUL rather than newline. NUL is the only byte a
      filename cannot contain, so it is the only safe separator.
  - term: word boundary
    definition: >-
      `grep -w`, or `\b` in some dialects. The difference between finding `dev`
      and finding it inside `device`.

foreshadows:
  - "B08.4's find and xargs act on the results these tools produce."
  - "B12's log analysis is this topic applied to volume."
  - "F34's structured logging exists partly because field extraction from text is this fragile."
  - "G43's scanners parse tool output, and inherit every problem in this topic."

