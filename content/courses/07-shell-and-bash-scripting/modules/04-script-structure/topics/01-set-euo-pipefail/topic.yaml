id: topic.set-euo-pipefail
slug: set-euo-pipefail
title: "set -euo pipefail, and What It Does Not Do"
summary: >-
  Everyone puts it at the top and almost nobody knows where it stops working.
  `set -e` is exempt in nine contexts including every `if` condition;
  `local x=$(cmd)` silently discards the failure; and `((count++))` ends your
  script the first time it runs. This topic measures each one and builds a
  preamble worth defending.
order: 1
levels: [L1, L2]
estimated_minutes: 120
status: published

