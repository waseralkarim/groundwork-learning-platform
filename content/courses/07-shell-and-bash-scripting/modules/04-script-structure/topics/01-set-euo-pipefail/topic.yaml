terminology:
  - term: errexit
    definition: >-
      `set -e`. Exit when a command returns non-zero — except in the many
      contexts where the shell is already testing that status.
  - term: nounset
    definition: >-
      `set -u`. Fail on expanding an unset variable. Exits **127**, not 1, and
      does not object to `${VAR:-default}`.
  - term: pipefail
    definition: >-
      `set -o pipefail`. A pipeline's status becomes the last non-zero one
      instead of the last command's.
  - term: exemption
    definition: >-
      A context where errexit is deliberately suppressed — an `if` or `while`
      condition, an operand of `&&` or `||`, anything after `!`, and any
      non-final pipeline stage.
  - term: masked status
    definition: >-
      A failure hidden because the shell reported something else's status —
      most commonly `local x=$(cmd)`, where `local` succeeds regardless.
  - term: EXIT trap
    definition: >-
      A handler that runs when the shell exits for any reason, including an
      errexit abort. The correct place for cleanup.
  - term: ERR trap
    definition: >-
      A handler that runs when a command fails. It is **not** inherited by
      functions unless `set -E` is also given.
  - term: "set -E"
    definition: >-
      errtrace. Makes functions, subshells and command substitutions inherit the
      ERR trap. Without it an ERR trap is silent in exactly the places you want
      it.
  - term: mktemp
    definition: >-
      Create a temporary file or directory with a unique name. Paired with an
      EXIT trap, it is how a script cleans up after itself.
  - term: idempotent
    definition: >-
      Safe to run twice. The property that makes a failed run recoverable by
      re-running it rather than by repairing state.
  - term: strict mode
    definition: >-
      The `set -euo pipefail` preamble. A useful default and not a guarantee —
      it catches unhandled failures, not wrong ones.

foreshadows:
  - "B08.6's functions and exit codes build directly on errexit's behaviour inside them."
  - "B08.7's traps and cleanup extend the EXIT-trap pattern this topic introduces."
  - "E27's CI steps run with their own shell options, which is why a script must not depend on the caller's."
  - "D22's configuration management is idempotency enforced by a tool rather than by discipline."

tags: [shell, bash, errexit, traps, robustness, fundamentals]
