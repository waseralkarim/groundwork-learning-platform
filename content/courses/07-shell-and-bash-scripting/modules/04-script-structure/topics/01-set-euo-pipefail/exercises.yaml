topic: topic.set-euo-pipefail

exercises:
  - id: e1
    title: Three options, three questions
    level: L1
    objectives: [OBJ-B08.5.1]
    kind: interpretation
    prompt: >-
      For each option in `set -euo pipefail`, answer in one sentence: what it
      changes, what exit status it produces, and one failure it does **not**
      catch.
    answer: >-
      **`-e` (errexit)** — the shell exits when a command returns non-zero. The
      exit status is the failing command's own, so a script that dies on a
      missing file exits 1 and one that dies on a missing binary exits 127.
      It does not catch a failure in any context where the shell is already
      testing the status — an `if` condition, an `&&`/`||` operand, a non-final
      pipeline stage.


      **`-u` (nounset)** — expanding a variable that was never set is an error.
      The exit status is **127**, which conventionally means "command not found"
      and therefore reads misleadingly in a log. It does not catch a variable
      that is set to the *wrong* value, nor one set to empty — `VAR=` passes.


      **`-o pipefail`** — a pipeline reports its last non-zero status rather than
      its last command's, preserving the actual value. It does not tell you
      *which* stage failed, and it makes any pipeline ending in `head` report 141
      once the producer is killed by SIGPIPE.
    explanation: >-
      The point of the exercise is that each option has a precise boundary. A
      preamble defended as "it makes the script strict" survives exactly one
      follow-up question in review.

  - id: e2
    title: Predict eight lines
    level: L2
    objectives: [OBJ-B08.5.3]
    kind: interpretation
    prompt: >-
      Each of these runs under `set -e`. Say whether the script reaches the final
      `echo done`.


      1. `grep -q missing /etc/hostname; echo done`

      2. `if grep -q missing /etc/hostname; then :; fi; echo done`

      3. `grep -q missing /etc/hostname || true; echo done`

      4. `n=$(grep -c missing /etc/hostname); echo done`

      5. `f(){ grep -q missing /etc/hostname; }; f; echo done`

      6. `f(){ grep -q missing /etc/hostname; }; f || true; echo done`

      7. `f(){ local n=$(grep -c missing /etc/hostname); }; f; echo done`

      8. `grep -q missing /etc/hostname | cat; echo done`
    answer: >-
      **Reaches `done`:** 2, 3, 6, 7, 8. **Does not:** 1, 4, 5.


      1. **No.** A bare failing command is the case errexit exists for. `grep`
         exits 1 on no match.


      2. **Yes.** An `if` condition is exempt — and this is the reason the
         exemption exists at all.


      3. **Yes.** An operand of `||` is exempt.


      4. **No.** A plain assignment takes the command substitution's status.
         Note that `grep -c` prints `0` and *still* exits 1, so the variable is
         assigned and the script dies anyway.


      5. **No.** A function called plainly is not exempt; its non-zero return
         propagates.


      6. **Yes.** Same function, now an operand of `||`. And the suppression
         extends through the whole body, not just the call.


      7. **Yes** — and this is the dangerous one. `local` is a command whose
         status is its own success, so grep's failure is discarded. Remove the
         word `local` and it becomes case 4.


      8. **Yes.** `grep` is a non-final pipeline stage; without `pipefail` the
         pipeline reports `cat`'s success. With `pipefail` it would be **no**.
    explanation: >-
      Cases 4 and 7 differ by one word, and 5 and 6 by two characters. Both pairs
      are worth being able to spot at reading speed, because both appear in real
      code written by people who believed the preamble was covering them.

  - id: e3
    title: Review a deploy helper
    level: L2
    objectives: [OBJ-B08.5.4]
    kind: interpretation
    prompt: >-
      Review this function. It is part of a script with `set -euo pipefail` at
      the top, and it has never reported a failure.


      ```bash
      publish_image() {
        local tag=$1
        local digest=$(docker push "$tag" | awk '/digest:/ {print $3}')
        local count=0
        for region in us eu ap; do
          replicate "$tag" "$region"
          ((count++))
        done
        echo "published $tag ($digest) to $count regions"
      }
      ```
    answer: >-
      **Four defects, two of them silent.**


      **1. `local digest=$(...)` discards the status.** `local` is a command, so
      neither `docker push` failing nor the pipeline matters — the line always
      succeeds. This is SC2155. Fix: `local digest` then `digest=$(...)`.


      **2. The pipeline hides `docker push` anyway.** Even split into two lines,
      `docker push | awk` reports awk's status without `pipefail`. `pipefail` is
      set here, so once (1) is fixed this one is covered — but it is worth naming
      separately, because the fix for (1) alone would not save a script that
      lacked `pipefail`.


      **3. `((count++))` exits the script on the first iteration**, because the
      post-increment's value is the old count, 0. Under `set -e` this function
      never reaches its second region. Fix: `count=$((count + 1))`.


      **4. The message is unverified.** It reports a digest that may be empty
      (awk printing nothing is not an error) and a region count that was
      incremented rather than confirmed. Assert: `[ -n "$digest" ]` and
      `[ "$count" -eq 3 ]`.


      Corrected:


      ```bash
      publish_image() {
        local tag=$1 digest count=0
        digest=$(docker push "$tag" | awk '/digest:/ {print $3}')
        [ -n "$digest" ] || { echo "no digest in push output" >&2; return 1; }
        for region in us eu ap; do
          replicate "$tag" "$region"
          count=$((count + 1))
        done
        [ "$count" -eq 3 ] || { echo "replicated to $count of 3" >&2; return 1; }
        echo "published $tag ($digest) to $count regions"
      }
      ```
    explanation: >-
      Note that `local tag=$1` on the first line is *fine* — `$1` is not a
      command, so there is no status to lose. The rule is not "never use
      `local x=`"; it is "never use `local x=$(...)`", and the same for `declare`,
      `export` and `readonly`.

  - id: e4
    title: Make a script survive an empty argument list
    level: L2
    objectives: [OBJ-B08.5.6]
    kind: short_answer
    prompt: >-
      This script works when called with arguments and fails confusingly when
      called with none. Explain each failure and rewrite the preamble.


      ```bash
      #!/bin/bash
      set -euo pipefail
      TARGET=$1
      RETRIES=$RETRY_COUNT
      echo "deploying to $TARGET, $RETRIES retries"
      for f in "$@"; do echo "  $f"; done
      ```
    answer: >-
      **`TARGET=$1` with no arguments** — under `-u`, an unset positional is an
      unbound variable, so the script exits **127** with
      `$1: unbound variable`. Correct behaviour, useless message: it does not
      say what the argument is for.


      **`RETRIES=$RETRY_COUNT`** — same failure, and it happens on line 4 rather
      than wherever `RETRIES` is first *used*, which is the one good thing about
      it. The message still only names the variable, not its legal values.


      **`for f in "$@"`** — this is *fine* with zero arguments in modern bash;
      the loop simply runs zero times. It was an error before bash 4.4, which is
      where the defensive `"${@:-}"` idiom comes from.


      Rewritten:


      ```bash
      #!/bin/bash
      set -euo pipefail

      usage() { echo "usage: $0 TARGET [FILE...]" >&2; exit 64; }

      TARGET=${1:-}; [ -n "$TARGET" ] || usage
      shift
      : "${RETRY_COUNT:?RETRY_COUNT must be set (integer, 0-5)}"
      RETRIES=$RETRY_COUNT

      echo "deploying to $TARGET, $RETRIES retries"
      for f in "$@"; do echo "  $f"; done
      ```


      Each failure now names itself: a usage line and status 64 (`EX_USAGE`) for
      a missing argument, and a sentence naming the variable and its legal range
      for a missing environment variable.
    explanation: >-
      `-u` is a safety net, not an interface. A script that relies on it for
      required inputs produces `unbound variable` and exit 127 — which reads like
      a missing binary. `${VAR:?message}` and an explicit `usage` turn the same
      failures into instructions.

  - id: e5
    title: Defend a preamble to a reviewer
    level: L2
    objectives: [OBJ-B08.5.8]
    kind: short_answer
    prompt: >-
      A colleague opens a pull request adding this to the top of every script in
      the repository. Write your review comment.


      ```bash
      set -euxo pipefail
      IFS=$'\n\t'
      ```
    answer: >-
      **Approve `-e`, `-u` and `pipefail`. Block `-x`. Question the `IFS` line.**


      **`-x` must not be a default.** It prints every command *after expansion*,
      so any script that handles a token, password or connection string writes it
      to stdout — and in CI that means the build log, which is retained, indexed
      and usually readable by more people than the secret is. `-x` belongs behind
      a flag: `[ -n "${DEBUG:-}" ] && set -x`. It also makes normal output
      unreadable, so operators stop reading logs at all.


      **`IFS=$'\n\t'` treats a symptom.** Its purpose is to stop unquoted
      expansions splitting on spaces. The fix for an unquoted expansion is to
      quote it; changing the field separator globally means every unquoted
      expansion in the file — including in code you did not write and functions
      you source — now behaves differently from every other shell on the system.
      It also breaks `read` with default field splitting, and anything parsing
      space-separated output. If a specific loop needs it, set it for that loop:
      `while IFS= read -r line`.


      **What I would ask for instead**, if the goal is repository-wide
      robustness: `shellcheck` in CI. It finds SC2155 (`local x=$(cmd)`), unquoted
      expansions, and about two hundred other things — mechanically, per script,
      without changing runtime behaviour. That is a much better return than two
      lines applied uniformly to scripts nobody re-read.


      **And I would ask what problem prompted this.** A blanket preamble change
      is usually a response to one incident; naming it decides which of these
      lines actually helps.
    explanation: >-
      The general rule: **every line of a preamble should answer a failure that
      script can actually have.** A preamble nobody can explain is cargo cult,
      and the first time one of its lines causes a problem, somebody deletes the
      whole block — including the three lines that were earning their place.
