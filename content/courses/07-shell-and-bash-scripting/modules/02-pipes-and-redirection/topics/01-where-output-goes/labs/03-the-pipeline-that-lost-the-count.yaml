id: lab.the-pipeline-that-lost-the-count
topic: topic.where-output-goes
title: Find the counter that stays zero, and the failure that stays hidden
type: guided
tier: 2
image: groundwork/lab-foundations:1
duration_minutes: 30
objectives: [OBJ-B08.2.2, OBJ-B08.2.5, OBJ-B08.2.7]

intro: >-
  `/tmp/pipes/collect.sh` summarises errors from a log. It reports zero errors
  for a log containing three, and it reports success when the log does not exist
  at all.


  Both are properties of pipelines rather than bugs in the logic. You will find
  each one, watch `head` kill `yes` with a signal, and fix the script.

setup:
  - /opt/lab/seed-pipes.sh

steps:
  - id: s1
    instruction: >-
      Run collect.sh against the sample log and record how its two numbers
      disagree. Save to /tmp/answer-disagree.
    hint: >-
      The script writes two lines to its report. Compare both against the real
      number of ERROR lines.
    walkthrough: |
      cd /tmp/pipes
      cat collect.sh
      {
        echo "real ERROR lines in app.log: $(grep -c ERROR app.log)"
        echo
        bash collect.sh /tmp/pipes/app.log /tmp/pipes/out.txt | sed 's/^/  /'
        echo
        echo "the report says:"
        cat out.txt | sed 's/^/    /'
        echo
        echo "the first number comes from a while loop and is 0. the second comes from wc -l and is correct. same log, same script, two answers."
      } > /tmp/answer-disagree
      cat /tmp/answer-disagree
    verify:
      - type: file_matches
        path: /tmp/answer-disagree
        pattern: "real ERROR lines in app.log: 3"
        describe: You established the true count
      - type: file_matches
        path: /tmp/answer-disagree
        pattern: "total errors: 0"
        describe: And that the loop reported zero
      - type: file_matches
        path: /tmp/answer-disagree
        pattern: "(?i)two answers"
        describe: And noticed the same script disagrees with itself

  - id: s2
    instruction: >-
      Explain why the counter is zero, and demonstrate two ways to make it
      correct. Save to /tmp/answer-subshell.
    hint: >-
      Ask which process runs the `while` loop when it is the last stage of a
      pipeline.
    walkthrough: |
      {
        echo "why it is zero:"
        count=0
        printf 'a\nb\nc\n' | while read -r l; do count=$((count + 1)); done
        echo "  after 'cmd | while read': count=$count"
        echo
        echo "every stage of a pipeline runs in its own SUBSHELL - a separate process with its own copy of every variable. the loop ran three times and incremented a count belonging to a child process, which then exited and took its memory with it."
        echo
        echo "nothing was lost or overwritten. the parent's count was never touched."
        echo
        echo "fix 1 - process substitution. the loop is not in a pipeline at all:"
        count=0
        while read -r l; do count=$((count + 1)); done < <(printf 'a\nb\nc\n')
        echo "  count=$count"
        echo
        echo "fix 2 - bash's lastpipe, which runs the last stage in the parent:"
        count=0
        shopt -s lastpipe; set +m
        printf 'a\nb\nc\n' | while read -r l; do count=$((count + 1)); done
        echo "  count=$count"
        shopt -u lastpipe
        echo
        echo "process substitution is the general answer: < <(cmd) presents a command's output as a file, so there is no pipeline and no subshell for the loop."
        echo
        echo "lastpipe is bash-only and needs job control off - which it is in a script and is NOT in an interactive shell, so testing it interactively can convince you it does not work."
      } > /tmp/answer-subshell
      cat /tmp/answer-subshell
    verify:
      - type: file_matches
        path: /tmp/answer-subshell
        pattern: "while read': count=0"
        describe: You reproduced the lost counter
      - type: file_matches
        path: /tmp/answer-subshell
        pattern: "(?i)SUBSHELL"
        describe: And named the cause
      - type: file_matches
        path: /tmp/answer-subshell
        pattern: "count=3"
        describe: And produced a correct count
      - type: file_matches
        path: /tmp/answer-subshell
        pattern: "(?i)job control off"
        describe: And noted lastpipe's condition

  - id: s3
    instruction: >-
      Find why the script exits 0 when the log file does not exist, and work out
      what a pipeline's exit status really reports. Save to /tmp/answer-status.
    hint: >-
      Run the script against a missing file. Then experiment with the exit status
      of a pipeline whose first command fails.
    walkthrough: |
      cd /tmp/pipes
      {
        echo "against a log that does not exist:"
        bash collect.sh /tmp/pipes/missing /tmp/pipes/out2.txt >/dev/null 2>&1
        echo "  exit status: $?"
        echo "  report says: $(head -1 out2.txt)"
        echo "  ^ a confident report of zero errors, for a file that is not there."
        echo
        echo "why: a pipeline's exit status is the status of its LAST command only."
        false | true; echo "  false | true            -> \$? = $?"
        echo
        echo "so grep failing is invisible behind a successful sort or wc. and the failing stage is usually the one doing the real work - grep, curl, pg_dump."
        echo
        set -o pipefail
        false | true; echo "  with set -o pipefail    -> \$? = $?"
        set +o pipefail
        echo
        echo "and to find out WHICH stage failed:"
        false | true
        echo "  PIPESTATUS = ${PIPESTATUS[*]}   (one entry per stage)"
        echo
        echo "PIPESTATUS is valid ONLY immediately after the pipeline - the next command overwrites it, including an echo. copy it first if it is needed twice:"
        echo "    cmd_a | cmd_b"
        echo "    status=(\"\${PIPESTATUS[@]}\")"
      } > /tmp/answer-status
      cat /tmp/answer-status
    verify:
      - type: file_matches
        path: /tmp/answer-status
        pattern: "exit status: 0"
        describe: You showed the script succeeds on a missing file
      - type: file_matches
        path: /tmp/answer-status
        pattern: "false \\| true +-> \\$\\? = 0"
        describe: And that a pipeline reports only its last command
      - type: file_matches
        path: /tmp/answer-status
        pattern: "pipefail +-> \\$\\? = 1"
        describe: And what pipefail changes
      - type: file_matches
        path: /tmp/answer-status
        pattern: "PIPESTATUS = 1 0"
        describe: And which stage actually failed
      - type: file_matches
        path: /tmp/answer-status
        pattern: "(?i)overwrites it"
        describe: And that PIPESTATUS must be copied immediately

  - id: s4
    instruction: >-
      Watch a reader terminate a writer, and record what exit status that
      produces. Then check how it interacts with pipefail. Save to
      /tmp/answer-sigpipe.
    hint: >-
      `yes` runs forever. Pipe it into `head` and see what happens to it.
    walkthrough: |
      {
        echo "yes runs forever. piped into head -2:"
        yes 2>/dev/null | head -2 | sed 's/^/    /'
        echo "  PIPESTATUS = ${PIPESTATUS[*]}"
        echo
        echo "141 = 128 + 13. signal 13 is SIGPIPE, sent by the kernel to a writer whose reader has closed. that is how the pipeline terminates instead of running forever, and it is the mechanism that makes 'find / | head' cheap rather than a full filesystem walk."
        echo
        echo "now the interaction nobody expects:"
        set -o pipefail
        yes 2>/dev/null | head -2 >/dev/null
        echo "  with pipefail:    \$? = $?"
        set +o pipefail
        yes 2>/dev/null | head -2 >/dev/null
        echo "  without pipefail: \$? = $?"
        echo
        echo "with pipefail on, a pipeline ending in head REPORTS FAILURE - because the first stage was killed by SIGPIPE and 141 is non-zero."
        echo
        echo "that is a real interaction between two things i was told to enable. set -euo pipefail plus a 'head' anywhere gives a script that exits on a completely normal event."
        echo
        echo "the fix is per-line and deserves a comment, because a bare || true looks like sloppiness:"
        echo "    # head closes the pipe early; SIGPIPE on the producer is expected"
        echo "    producer | head -20 || true"
      } > /tmp/answer-sigpipe
      cat /tmp/answer-sigpipe
    verify:
      - type: file_matches
        path: /tmp/answer-sigpipe
        pattern: "PIPESTATUS = 141 0"
        describe: You captured the SIGPIPE exit status
      - type: file_matches
        path: /tmp/answer-sigpipe
        pattern: "(?i)128 \\+ 13"
        describe: And decoded it
      - type: file_matches
        path: /tmp/answer-sigpipe
        pattern: "with pipefail: +\\$\\? = 141"
        describe: And found the interaction with pipefail
      - type: file_matches
        path: /tmp/answer-sigpipe
        pattern: "(?i)deserves a comment"
        describe: And that the fix needs explaining

  - id: s5
    instruction: >-
      Rewrite collect.sh so all three faults are fixed, and verify it against
      both the real log and a missing one. Save to /tmp/answer-fixed.
    walkthrough: |
      cat > /tmp/answer-fixed <<'FIX'
      #!/bin/bash
      # Summarise errors from a log and write a report.
      set -euo pipefail

      LOG=${1:?LOG required}
      OUT=${2:?OUT required}

      [ -r "$LOG" ] || { echo "cannot read log: $LOG" >&2; exit 1; }

      # read the file ONCE, and count in this shell rather than a subshell
      count=0
      while IFS= read -r _; do
        count=$((count + 1))
      done < <(grep ERROR "$LOG" || true)

      printf 'total errors: %d\n' "$count" > "$OUT"
      echo "report written to $OUT"
      FIX
      chmod +x /tmp/answer-fixed
      cd /tmp/pipes
      {
        echo "against the real log:"
        bash /tmp/answer-fixed /tmp/pipes/app.log /tmp/pipes/fixed.txt | sed 's/^/  /'
        echo "  report: $(cat /tmp/pipes/fixed.txt)   (real: $(grep -c ERROR app.log))"
        echo
        echo "against a missing log:"
        bash /tmp/answer-fixed /tmp/pipes/missing /tmp/pipes/fixed2.txt 2>&1 | sed 's/^/  /'
        echo "  exit status: ${PIPESTATUS[0]}"
        echo
        echo "what changed, and why:"
        echo "  < <(grep ...)   process substitution, so the loop runs in THIS shell"
        echo "                  and count survives. also reads the file once instead"
        echo "                  of twice, so the two numbers cannot disagree."
        echo "  [ -r \"\$LOG\" ]   an explicit check, because a missing file is a"
        echo "                  failure and should not produce a confident zero."
        echo "  || true         grep exits 1 when it matches nothing, which is not"
        echo "                  an error here - and with set -e it would abort the"
        echo "                  script on a clean log."
        echo "  \${1:?}          the arguments are required, and saying so beats"
        echo "                  defaulting to a path that might exist."
      } >> /tmp/answer-fixed
      tail -20 /tmp/answer-fixed
    verify:
      - type: file_matches
        path: /tmp/answer-fixed
        pattern: "< <\\(grep ERROR"
        describe: You used process substitution to keep the count
      - type: file_matches
        path: /tmp/answer-fixed
        pattern: "total errors: 3"
        describe: And the fixed script counts correctly
      - type: file_matches
        path: /tmp/answer-fixed
        pattern: "cannot read log"
        describe: And fails loudly on a missing file
      - type: file_matches
        path: /tmp/answer-fixed
        pattern: "(?i)reads the file once"
        describe: And you explained why the two numbers can no longer disagree
      - type: file_matches
        path: /tmp/answer-fixed
        pattern: "(?i)grep exits 1 when it matches nothing"
        describe: And why the || true is needed with set -e

solution: >-
  **Two numbers, one log, one script.**


  The report says `total errors: 0` from a `while` loop and `3` from `wc -l`, for
  a log containing three. The loop is wrong.


  **Every pipeline stage is a subshell.**


  ```console
  $ count=0
  $ printf 'a\nb\nc\n' | while read -r l; do count=$((count + 1)); done
  $ echo $count
  0
  ```


  The loop ran three times and incremented a `count` belonging to a **child
  process**, which then exited. Nothing was lost or overwritten — the parent's
  `count` was never touched.


  Two fixes, both giving 3:


  ```bash
  while read -r l; do count=$((count+1)); done < <(printf 'a\nb\nc\n')  # process substitution
  shopt -s lastpipe; set +m                                              # bash, job control off
  ```


  Process substitution is the general answer — `< <(cmd)` presents output as a
  file, so there is no pipeline. `lastpipe` is bash-only and needs job control
  off, which it is in a script and is **not** interactively, so testing it in a
  terminal can convince you it does not work.


  **And the missing file exits 0.**


  ```console
  $ false | true; echo $?
  0
  ```


  A pipeline's status is its **last** command's, so a failing `grep` is invisible
  behind a successful `sort`. The failing stage is usually the one doing the real
  work.


  ```console
  $ set -o pipefail; false | true; echo $?
  1
  $ false | true; echo "${PIPESTATUS[@]}"
  1 0
  ```


  `PIPESTATUS` is valid **only immediately** after the pipeline — even an `echo`
  overwrites it. Copy it if you need it twice.


  **SIGPIPE, and the interaction nobody expects.**


  ```console
  $ yes | head -2
  $ echo "${PIPESTATUS[@]}"
  141 0
  ```


  `141 = 128 + 13` — SIGPIPE, sent to a writer whose reader has closed. It is
  normal, and it is what makes `find / | head` cheap.


  But with `pipefail` on, that pipeline **reports failure**, because 141 is
  non-zero. So `set -euo pipefail` plus a `head` anywhere gives a script that
  exits on an entirely normal event. The fix is per-line and needs a comment,
  because a bare `|| true` reads as sloppiness:


  ```bash
  # head closes the pipe early; SIGPIPE on the producer is expected
  producer | head -20 || true
  ```


  **The fixed script:**


  ```bash
  set -euo pipefail
  LOG=${1:?LOG required}
  [ -r "$LOG" ] || { echo "cannot read log: $LOG" >&2; exit 1; }

  count=0
  while IFS= read -r _; do count=$((count + 1)); done < <(grep ERROR "$LOG" || true)
  printf 'total errors: %d\n' "$count" > "$OUT"
  ```


  Process substitution keeps the count **and** reads the file once, so the two
  numbers can no longer disagree. The explicit `-r` check turns a missing file
  into a failure rather than a confident zero. And `|| true` is needed because
  `grep` exits 1 when it matches nothing — which is not an error here, and would
  abort the script under `set -e` on a clean log.
