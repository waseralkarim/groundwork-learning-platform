id: topic.where-output-goes
slug: where-output-goes
title: "Where Output Actually Goes"
summary: >-
  Redirection is applied left to right, a pipeline runs every stage in its own
  process, and a program writing to a pipe buffers differently than one writing
  to a terminal. Each of those has a failure mode that produces no error — a
  config file truncated to nothing, a variable that stays zero, and a log that
  goes quiet exactly when you need it.
order: 1
levels: [L1, L2]
estimated_minutes: 120
status: published

prerequisites:
  - topic: topic.how-a-line-becomes-a-command
    hardness: required
  - topic: topic.user-space-and-the-kernel
    hardness: recommended

