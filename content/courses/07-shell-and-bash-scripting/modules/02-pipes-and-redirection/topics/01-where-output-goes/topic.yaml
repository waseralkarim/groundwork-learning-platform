terminology:
  - term: file descriptor
    definition: >-
      A small integer naming an open file, pipe or socket for one process. 0, 1
      and 2 are opened before your program starts and are visible in
      `/proc/PID/fd`.
  - term: stdin
    definition: >-
      Descriptor 0 — where a program reads input from unless told otherwise.
  - term: stdout
    definition: >-
      Descriptor 1 — results. Redirected by `>` and consumed by the next stage
      of a pipeline.
  - term: stderr
    definition: >-
      Descriptor 2 — diagnostics. Deliberately separate so errors survive a
      redirect and are not fed into the next command.
  - term: redirection
    definition: >-
      Attaching a descriptor to a file or to another descriptor. Applied **left
      to right**, which is why `>f 2>&1` and `2>&1 >f` do different things.
  - term: duplication
    definition: >-
      `2>&1` — make descriptor 2 a copy of *wherever 1 points now*. It copies the
      current target, not the name, which is the entire source of the ordering
      trap.
  - term: truncation
    definition: >-
      `>` empties the target before the command runs. That is why `sort f > f`
      leaves an empty file.
  - term: noclobber
    definition: >-
      A shell option making `>` refuse to overwrite an existing file. `>|`
      overrides it for one redirection.
  - term: pipe
    definition: >-
      A kernel buffer connecting one process's stdout to another's stdin. Both
      run at once, and the writer blocks when the buffer is full.
  - term: subshell
    definition: >-
      A child shell. Every stage of a pipeline runs in one, which is why a
      variable set inside `cmd | while read` is gone afterwards.
  - term: PIPESTATUS
    definition: >-
      A bash array holding the exit status of every stage of the last pipeline.
      The only way to see which stage failed.
  - term: pipefail
    definition: >-
      A shell option making a pipeline's status the last non-zero one. Without
      it, `false | true` succeeds.
  - term: SIGPIPE
    definition: >-
      The signal a writer gets when the reader has closed. It is how `head` stops
      `yes`, and it shows as exit status 141.
  - term: line buffering
    definition: >-
      Flushing output at every newline. The C library does this when stdout is a
      terminal and **block-buffers** when it is a pipe — which is why piped
      output can arrive minutes late.
  - term: process substitution
    definition: >-
      `<(cmd)` — a command's output presented as a filename. Lets a loop read a
      command's output without a pipeline, so no subshell is involved.

foreshadows:
  - "B08.3's find and xargs build pipelines whose exit status this topic teaches you to read."
  - "B08.5's `set -euo pipefail` is the pipefail option, in context."
  - "F34's log shipping depends on the buffering behaviour this topic measures."
  - "C14's container logs are stdout and stderr, which is why a container that logs to a file logs nowhere."

tags: [shell, bash, pipes, redirection, buffering, fundamentals]
