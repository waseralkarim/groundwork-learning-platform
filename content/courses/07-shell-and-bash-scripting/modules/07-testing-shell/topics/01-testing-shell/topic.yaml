id: topic.testing-shell
slug: testing-shell
title: "Testing a Script Without Running It for Real"
summary: >-
  Three passing tests on a script with two bugs, because none touched a boundary
  and none passed the argument the bug lives in. `bats` reports the file, the
  line and the failing expression — but not the values. And a script that calls
  `kubectl` is testable with no cluster, once a fake binary earlier on `PATH`
  reads as technique rather than trick.
order: 1
levels: [L2, L3]
estimated_minutes: 120
status: published

prerequisites:
  - topic: topic.concurrency-and-locking
    hardness: required
  - topic: topic.functions-and-scope
    hardness: required
  - topic: topic.arguments-and-options
    hardness: recommended

