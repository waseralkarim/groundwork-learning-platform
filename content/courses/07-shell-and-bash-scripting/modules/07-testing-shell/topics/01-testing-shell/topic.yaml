terminology:
  - term: bats
    definition: >-
      Bash Automated Testing System. A test file is shell with `@test` blocks;
      the runner reports TAP and exits non-zero if any test fails.
  - term: "@test"
    definition: >-
      One test case. Its body is ordinary shell, and it fails the moment any
      command in it returns non-zero — so a bare `[ ... ]` is an assertion.
  - term: run
    definition: >-
      Execute a command without failing the test, capturing its exit status in
      `$status`, its combined output in `$output`, and its lines in `${lines[@]}`.
  - term: TAP
    definition: >-
      Test Anything Protocol. `1..N` then `ok N` / `not ok N` per test — the
      format `bats` emits by default and most CI systems can parse.
  - term: test double
    definition: >-
      A stand-in for something the test must not really use. In shell, usually a
      script with the real command's name, placed earlier on `PATH`.
  - term: "BATS_TEST_TMPDIR"
    definition: >-
      A directory created fresh for each test and removed afterwards. Where
      fixtures and fake binaries belong.
  - term: setup / teardown
    definition: >-
      Functions run before and after **each** test. `setup_file` and
      `teardown_file` run once for the whole file.
  - term: boundary case
    definition: >-
      An input at the edge of a behaviour change — exactly 7 days, exactly zero
      files, exactly the limit. Where the bugs are, and where happy-path tests
      never go.
  - term: skip
    definition: >-
      Mark a test as deliberately not run, with a reason. Reported as a pass
      with a note rather than hidden by commenting it out.
  - term: arrange-act-assert
    definition: >-
      Build the fixture, run the thing once, then assert. Running the thing
      inside each assertion is how a suite ends up testing the fixture instead.

foreshadows:
  - "B11's pytest gives the same ideas with real assertion output, which is one reason to stop writing shell."
  - "E27's CI is where these suites have to run, on every change, to be worth writing."
  - "F35's incident reviews keep producing test cases nobody would have invented."

