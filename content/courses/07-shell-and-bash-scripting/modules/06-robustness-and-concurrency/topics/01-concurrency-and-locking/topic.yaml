id: topic.concurrency-and-locking
slug: concurrency-and-locking
title: "Overlapping Runs, Locks and Safe Retries"
summary: >-
  A lock lives on the **inode**, not the path — so the tidy-looking
  `trap 'rm -f $LOCK' EXIT` lets the next two runs both acquire and proceed.
  A PID file outlives the process that wrote it; a `flock` does not, even on
  SIGKILL. And `timeout` without `-k` reports 124 for a process that ignored
  the signal and finished its work anyway.
order: 1
levels: [L2, L3]
estimated_minutes: 120
status: published

prerequisites:
  - topic: topic.set-euo-pipefail
    hardness: required
  - topic: topic.functions-and-scope
    hardness: required
  - topic: topic.processes
    hardness: recommended

