terminology:
  - term: flock
    definition: >-
      An advisory lock held on an **open file description**. Released by the
      kernel when the last descriptor closes — including when the process is
      killed — so it cannot go stale.
  - term: advisory lock
    definition: >-
      A lock only honoured by processes that ask for it. Nothing stops a program
      that does not check from writing to the file anyway.
  - term: open file description
    definition: >-
      The kernel object behind a file descriptor, pointing at an inode. Two
      processes that opened the *same path* after an `rm` hold descriptions of
      **different inodes**, and neither lock sees the other.
  - term: stale lock
    definition: >-
      A lock that outlives the process holding it — a PID file left behind by a
      crash. The next run either refuses forever or has to guess whether the
      recorded PID is real.
  - term: TOCTOU
    definition: >-
      Time-of-check to time-of-use. `[ -e lock ] || touch lock` has a window
      between the test and the creation in which another process does the same,
      and both proceed.
  - term: atomic operation
    definition: >-
      One that either happens completely or not at all, with no state visible in
      between. `mkdir` and `rename` are; check-then-act is not.
  - term: idempotent
    definition: >-
      Safe to apply more than once with the same result. The property that makes
      a retry safe and a duplicate delivery harmless.
  - term: "timeout"
    definition: >-
      Run a command with a time limit. Sends `TERM` and exits **124**; the
      process may ignore it, so `-k` is needed to guarantee anything.
  - term: exponential backoff
    definition: >-
      Doubling the wait between retries, with jitter, so a recovering dependency
      is not hit by every client at the same moment.
  - term: thundering herd
    definition: >-
      Many clients retrying in lockstep after a failure, so the recovering
      service is knocked down again by the retry storm. Jitter is what prevents
      it.

foreshadows:
  - "B08.9's testing topic exercises the failure paths this topic creates, which are the hardest to test by hand."
  - "C15's container orchestration replaces the lock with a scheduler that guarantees a single replica."
  - "D22's configuration management runs are themselves guarded this way."
  - "F35's incident work turns on whether an operation could safely be retried."

tags: [shell, bash, concurrency, locking, flock, idempotency, reliability]
