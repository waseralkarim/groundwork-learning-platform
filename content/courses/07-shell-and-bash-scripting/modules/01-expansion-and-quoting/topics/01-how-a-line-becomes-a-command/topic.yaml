    assessed_by: [quiz.q15, lab.forwarding-arguments, exercise.e5, assessment.A, assessment.B, assessment.C]

terminology:
  - term: expansion
    definition: >-
      The shell's rewriting of a line before running anything. Eight stages, in a
      fixed order, and the order is the whole subject.
  - term: word splitting
    definition: >-
      Splitting the *result* of an expansion into separate words at characters in
      IFS. It happens after the variable is substituted, which is why the
      variable's contents change the argument count.
  - term: IFS
    definition: >-
      Internal Field Separator — the characters word splitting breaks on. Space,
      tab and newline by default.
  - term: globbing
    definition: >-
      Filename expansion — `*`, `?`, `[...]` replaced by matching filenames. It
      runs after word splitting, and its results are never re-split.
  - term: nullglob
    definition: >-
      A bash option deciding what an unmatched pattern becomes. Off by default,
      so `*.log` with no matches stays the literal text `*.log`.
  - term: quote removal
    definition: >-
      The final stage, where the quotes you typed are deleted. They were never
      arguments — they were instructions to the earlier stages.
  - term: single quotes
    definition: >-
      Suppress every expansion. What is inside is literal, including `$`, and no
      escape works — not even for a single quote.
  - term: double quotes
    definition: >-
      Suppress word splitting and globbing, but allow parameter expansion,
      command substitution and arithmetic. The usual correct choice.
  - term: command substitution
    definition: >-
      `$(...)` — replaced by the command's output, with all trailing newlines
      removed. The result is then word-split unless quoted.
  - term: "\"$@\""
    definition: >-
      The positional parameters, each preserved as its own word. The only correct
      way to forward arguments.
  - term: "\"$*\""
    definition: >-
      All positional parameters joined into one word, separated by the first
      character of IFS. Almost never what you want.
  - term: set -x
    definition: >-
      Trace mode. Prints each command after expansion, quoting any word that
      needs it — the fastest way to see what a program actually received.
  - term: printf %q
    definition: >-
      Prints a value quoted so it could be reused as shell input. Makes word
      boundaries and invisible characters visible.
  - term: POSIX sh
    definition: >-
      The portable subset. `/bin/sh` is dash on Debian, which has no `[[`, no
      arrays and no here-strings — so a `#!/bin/sh` script using them fails.

foreshadows:
  - "B08.2's pipes and redirection are applied to lines this topic teaches you to read."
  - "B08.5's `set -euo pipefail` protects scripts whose quoting this topic makes correct."
  - "B08.3's find and xargs exist largely to handle the filenames this topic shows breaking."
  - "D22's templating engines generate shell lines, and inherit every rule here."

tags: [shell, bash, quoting, expansion, scripting, fundamentals]
