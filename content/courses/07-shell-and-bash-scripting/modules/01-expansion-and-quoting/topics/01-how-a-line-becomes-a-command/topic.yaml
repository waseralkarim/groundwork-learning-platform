id: topic.how-a-line-becomes-a-command
slug: how-a-line-becomes-a-command
title: "How a Line Becomes a Command"
summary: >-
  A shell does not run what you typed. It rewrites the line through eight stages
  in a fixed order, and one of them chops your variables into words. This topic
  measures each stage, shows the two commands that reveal exactly what a program
  received, and treats quoting as what it is — the control on the order, not a
  matter of taste.
order: 1
levels: [L1, L2]
estimated_minutes: 120
status: published

prerequisites:
  - topic: topic.environment-and-shell-startup
    hardness: required
  - topic: topic.processes
    hardness: recommended

