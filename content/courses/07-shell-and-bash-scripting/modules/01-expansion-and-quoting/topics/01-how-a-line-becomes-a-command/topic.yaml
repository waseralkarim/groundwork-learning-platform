    statement: >-
      Identify the order in which the shell performs its expansions, and which
      stage produces word boundaries.
    assessed_by: [quiz.q1, quiz.q2, lab.watch-the-line-change, exercise.e1]

  - id: OBJ-B08.1.2
    level: L1
    verb: describe
    statement: >-
      Describe what single quotes, double quotes and no quotes each suppress.
    assessed_by: [quiz.q3, quiz.q4, lab.watch-the-line-change]

  - id: OBJ-B08.1.3
    level: L2
    verb: predict
    statement: >-
      Predict the exact list of arguments a command receives from a given line.
    assessed_by: [quiz.q5, quiz.q6, quiz.q7, lab.count-the-arguments, exercise.e2]

  - id: OBJ-B08.1.4
    level: L2
