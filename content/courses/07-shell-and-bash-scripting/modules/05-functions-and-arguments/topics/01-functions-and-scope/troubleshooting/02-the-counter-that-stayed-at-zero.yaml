id: troubleshooting.the-counter-that-stayed-at-zero
topic: topic.functions-and-scope
title: The archiver that copies everything and reports nothing
level: L2
objectives: [OBJ-B08.6.5, OBJ-B08.6.7]
reveal_policy: progressive

situation: >-
  A nightly archiver copies the day's export files to long-term storage and
  reports how many it moved. It has reported **0 files** every night for as long
  as anyone has looked.


  The storage bill says otherwise: the bucket is growing by about 40 GB a night.
  Someone checks, and every file is there.


  A guard was added six months ago — `[ "$copied" -gt 0 ] || alert "archiver did
  nothing"` — and it has been paging every single night since. The team muted it
  after a week, on the reasonable grounds that the archive was demonstrably fine.


  Tonight the archiver genuinely failed — the storage mount was read-only — and
  nobody was paged, because the only alert that would have fired had been muted
  six months earlier.


  Work out why a loop that plainly runs reports a count of zero.

symptoms:
  - "The script reports 'archived 0 files' and the files are all present"
  - "The loop body demonstrably runs — the copies happen"
  - "No command fails and the script exits 0"
  - "A guard on the count has paged every night for six months and was muted"
  - "The one night the archiver really failed, nothing paged"

artifacts:
  - type: config
    label: The archiver
    content: |
      #!/bin/bash
      set -euo pipefail

      SRC=/srv/exports
      DEST=/mnt/archive

      copied=0
      bytes=0

      find "$SRC" -type f -name '*.csv' -mtime -1 | while read -r f; do
        cp "$f" "$DEST/"
        copied=$((copied + 1))
        bytes=$((bytes + $(stat -c%s "$f")))
      done

      echo "archived $copied files ($bytes bytes)"
      [ "$copied" -gt 0 ] || alert "archiver did nothing"

  - type: log
    label: Last night's run
    content: |
      archived 0 files (0 bytes)
      ALERT: archiver did nothing

  - type: command_output
    label: The archive, checked at the same moment
    content: |
      $ find /mnt/archive -name '*.csv' -mtime -1 | wc -l
      1184
      $ du -sh /mnt/archive
      3.9T    /mnt/archive

  - type: command_output
    label: The same shape, reduced
    content: |
      $ n=0; printf 'a\nb\nc\n' | while read -r l; do n=$((n+1)); done; echo "n=$n"
      n=0
      $ n=0; while read -r l; do n=$((n+1)); done < <(printf 'a\nb\nc\n'); echo "n=$n"
      n=3

  - type: command_output
    label: Counted from inside the loop instead
    content: |
      $ printf 'a\nb\nc\n' | { n=0; while read -r l; do n=$((n+1)); done; echo "inside: n=$n"; }
      inside: n=3

diagnostic_questions:
  - "The copies happen and the count does not. What is different about those two operations?"
  - "How many processes are involved in `find … | while read …`?"
  - "Where does an assignment made in a subshell go when that subshell exits?"
  - "Why did the guard fire every night rather than intermittently?"
  - "What did muting the guard actually cost, and when was that cost paid?"

hints:
  - "Compare the two reduced cases in the artifacts. They differ only in how input reaches the loop."
  - "`cp` changes something shared between processes. `copied=` changes something that is not."
  - "The loop is not failing to run. Count from inside it and see."
  - "A guard that fires every night is telling you something true about the script."

root_cause: >-
  **The `while` loop is the right-hand stage of a pipeline, so it runs in a
  subshell.**


  Every stage of a pipeline runs in its own forked shell. `cp` writes to the
  **filesystem**, which is shared between processes, so the copies survive. The
  assignments to `copied` and `bytes` write to **variables**, which are
  per-process, so they die when the subshell exits at the end of the loop.


  The loop was never failing. Counted from inside, it reaches 1,184:


  ```console
  $ printf 'a\nb\nc\n' | { n=0; while read; do n=$((n+1)); done; echo "inside: n=$n"; }
  inside: n=3
  ```


  **The work happens and the result is thrown away**, which is why the symptom is
  always "it does the job and reports nothing".


  **The guard was correct and was read as broken.** It fired every night because
  `copied` was genuinely 0 every night — an accurate report of a variable that
  could never be anything else. Muting it was the reasonable-looking decision and
  the expensive one: it removed the only control that could distinguish "the
  count is broken" from "the archiver did nothing", and six months later those
  two cases became different.


  **That is the real finding.** The subshell bug is ordinary and would have cost
  an hour. The outage cost came from an alert that fired constantly, was
  investigated once, was found to disagree with reality, and was silenced instead
  of being fixed or deleted. An alert that is always wrong trains people to
  ignore it, and it stays in the config looking like coverage.


  Nothing failed. `find`, `cp`, `while` and `read` all behaved exactly as
  documented, and `set -euo pipefail` had nothing to act on.

method: >-
  **1. Separate what survived from what did not, and ask what they have in
  common.** The copies survived; the counters did not. One writes to the
  filesystem, one writes to a variable. That single observation points at a
  process boundary before any of the code has been read closely.


  **2. Count the processes in the line.** `find … | while …` is a pipeline, and
  every stage of a pipeline is a subshell. The loop is not in the shell that
  prints the summary.


  **3. Instrument from inside rather than outside.** Move the `echo` inside the
  braces and the count is right. That distinguishes "the loop is not running"
  from "the loop's result is not escaping", which are the two hypotheses, and it
  takes one command.


  **4. Reduce it to three lines.** `printf 'a\nb\nc\n' | while read -r l; do
  n=$((n+1)); done` reproduces it with no `find`, no `cp` and no storage. Any
  diagnosis that still needs the real filesystem has not been reduced far enough.


  **5. Read a constantly-firing alert as data.** The guard said `copied` was 0
  and `copied` *was* 0. It was correct about the variable and wrong about the
  world, and the gap between those two is exactly where the bug was. An alert
  that disagrees with reality every single time is describing something real
  about the code that produced it.


  **6. Ask what a mute costs before applying it.** Muting is a decision to accept
  an unknown, and it is usually made at the worst moment — during the
  investigation, by whoever is most tired of the noise. The question worth asking
  is "what would this alert have told me if it were right?", and here the answer
  was "that the archive is empty".


  The habit: **an alert is either fixed or deleted.** A muted alert is worse than
  no alert, because it still looks like coverage on the dashboard.

resolution: >-
  **Immediately:** confirm tonight's actual failure — the read-only mount — and
  re-run the archive. Then check how far back the real gap goes, which the count
  cannot tell you and the archive itself can.


  **Fix the loop.** Process substitution is the smallest change; the loop body
  does not move:


  ```bash
  copied=0
  bytes=0

  while read -r f; do
    cp "$f" "$DEST/"
    copied=$((copied + 1))
    bytes=$((bytes + $(stat -c%s "$f")))
  done < <(find "$SRC" -type f -name '*.csv' -mtime -1)
  ```


  Two alternatives and why not:


  - `mapfile -t files < <(find …)` then a `for` loop — right when you need the
    list **twice** or need to count it before deciding anything. It buffers
    everything first, which for 1,184 files is nothing and for a million is a
    consideration.

  - `shopt -s lastpipe` — runs the last pipeline stage in the current shell and
    fixes this without restructuring, but it changes every pipeline in the file
    and **silently does nothing when job control is on**. So it works in the
    script and not when a colleague pastes the loop into a terminal to debug it.
    A fix that behaves differently under investigation is a bad fix.


  **Then assert the outcome rather than the counter**, because the counter is
  still just a number the script tells itself:


  ```bash
  expected=$(find "$SRC" -type f -name '*.csv' -mtime -1 | wc -l)
  ...
  [ "$copied" -eq "$expected" ] || {
    echo "archived $copied of $expected" >&2; exit 1; }
  ```


  That compares two independently derived numbers. The original compared a
  number to itself.


  **And deal with the alert properly.** Unmute it, then give it a failure-path
  test so it is exercised rather than trusted:


  ```bash
  ./archive.sh /nonexistent; echo "rc=$?"      # must be non-zero
  ```


  **Audit for the same shape:** `grep -rn '| *while' /opt/jobs/` finds every
  piped loop in the estate, and `shellcheck` flags the variable as modified in a
  subshell (**SC2031**), which is one of the cases where it earns its place in
  CI.


  **For the postmortem, two findings and the second is the important one.** The
  technical fault is ordinary: a pipeline forks, so a loop on its right-hand side
  cannot report anything through a variable. The organisational fault is that an
  alert fired 180 nights in a row, was investigated once, disagreed with
  observable reality, and was **muted rather than fixed or deleted** — which
  removed the only control that would have caught the real failure, and left
  something on the dashboard that looked like coverage.
