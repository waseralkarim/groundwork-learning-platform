id: topic.functions-and-scope
slug: functions-and-scope
title: "Functions, Scope and What They Return"
summary: >-
  Shell scope is **dynamic**: a helper can read — and overwrite — a variable
  belonging to the function that called it, three levels up, without being
  passed anything. A value returned on stdout costs you every side effect,
  because command substitution is a subshell. And the exit status is one byte,
  so a script that exits with a count reports success at 256.
order: 1
levels: [L1, L2]
estimated_minutes: 120
status: published

