terminology:
  - term: dynamic scope
    definition: >-
      A called function can read and write the variables of whatever called it,
      however far up. Shell scope follows the **call stack**, not the text of
      the file — which is the opposite of every language that says `let`.
  - term: local
    definition: >-
      Declare a variable bounded by the current function *and everything it
      calls*. It hides an outer variable of the same name rather than creating
      an isolated one.
  - term: nameref
    definition: >-
      `local -n dest=$1` — a variable that is an alias for another whose name is
      given at run time. Lets a caller choose where a function writes its result.
  - term: subshell
    definition: >-
      A forked copy of the shell. It inherits everything and returns nothing but
      an exit status and whatever it wrote — so an assignment made inside one is
      gone when it ends.
  - term: command substitution
    definition: >-
      `$(...)`. Runs its contents **in a subshell** and substitutes the output
      with trailing newlines stripped.
  - term: exit status
    definition: >-
      A single unsigned byte, 0–255, that a process hands its parent. Values
      above 255 wrap: `exit 256` is a **success**.
  - term: "return"
    definition: >-
      End a function with a given status. It is an error outside a function or
      sourced script; `exit` ends the whole shell instead.
  - term: command
    definition: >-
      `command ls` runs the external or builtin `ls`, skipping any function of
      that name. The way to write a wrapper that does not call itself.
  - term: builtin
    definition: >-
      `builtin cd` runs the shell's own `cd`, skipping a function of that name.
  - term: FUNCNEST
    definition: >-
      A limit on how deeply functions may nest. **Unset by default**, so runaway
      recursion is bounded only by memory.
  - term: "declare -g"
    definition: >-
      Declare a variable at global scope from inside a function — the deliberate
      form of the thing that otherwise happens by accident.

foreshadows:
  - "B08.7's argument handling and getopts uses the scope rules this topic establishes."
