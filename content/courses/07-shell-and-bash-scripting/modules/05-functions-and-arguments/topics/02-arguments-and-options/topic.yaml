terminology:
  - term: positional parameters
    definition: >-
      `$1`, `$2`, … and the whole list in `$@`. `$0` is **not** one of them — it
      is the name the shell was invoked with, and `shift` never touches it.
  - term: "\"$@\""
    definition: >-
      The only expansion that reproduces the argument list exactly, one word per
      argument, splitting nothing. `"$*"` joins them into a single word.
  - term: shift
    definition: >-
      Discard the first N positional parameters. Returns **1 and does nothing at
      all** if N is greater than `$#` — it is all-or-nothing.
  - term: optstring
    definition: >-
      The letters `getopts` accepts. A trailing `:` on a letter means it takes an
      argument; a **leading** `:` on the whole string turns on silent error
      reporting.
  - term: OPTARG
    definition: >-
      The argument of the option just parsed — or, in silent mode, the offending
      letter for an unknown option or a missing argument.
  - term: OPTIND
    definition: >-
      The index of the next argument `getopts` will read. **Global, and not
      reset between calls**, so a parsing function must declare `local OPTIND=1`.
  - term: silent error reporting
    definition: >-
      A leading `:` in the optstring. `getopts` stops printing its own messages
      and reports through `?` and `:` in the option variable instead.
  - term: "getopt(1)"
    definition: >-
      A separate program, not a builtin. The util-linux version handles **long
      options**, `--opt=value`, unambiguous abbreviations and options after
      operands, and emits a requoted list for `eval set --`.
  - term: "--"
    definition: >-
      End of options. Everything after it is an operand, even if it starts with
      a dash — the only way to pass a file called `-rf`.
  - term: EX_USAGE
    definition: >-
      Exit status **64**, the `sysexits.h` convention for "you called it wrong",
      as distinct from "it went wrong".

foreshadows:
  - "B08.8's traps and cleanup handle the signals a long-running CLI receives."
  - "B11's argparse and typer give the same contract with none of this work, which is one reason to stop writing shell."
  - "E27's CI jobs invoke these scripts non-interactively, where a mis-parsed flag has no operator to notice it."
  - "D22's configuration management replaces flags with declared desired state."

