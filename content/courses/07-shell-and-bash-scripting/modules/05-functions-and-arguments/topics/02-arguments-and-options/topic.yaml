id: topic.arguments-and-options
slug: arguments-and-options
title: "Arguments, Options and the Two Parsers"
summary: >-
  `getopts` does not do long options — it parses `--dry-run` as the bundled
  letters `d`, `r`, `y`, `r`, `u`, `n`, which on a script with `-d` for delete
  quietly turns a dry run into a deletion. `OPTIND` is global, so a parsing
  function called twice ignores every flag the second time and still looks
  right. This topic measures both, and builds a command-line contract worth
  shipping.
order: 2
levels: [L1, L2]
estimated_minutes: 120
status: published

prerequisites:
  - topic: topic.functions-and-scope
    hardness: required
  - topic: topic.how-a-line-becomes-a-command
    hardness: required

