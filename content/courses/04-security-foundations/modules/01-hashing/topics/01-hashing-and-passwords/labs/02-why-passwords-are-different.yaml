id: lab.why-passwords-are-different
topic: topic.hashing-and-passwords
title: Measure what a password hash actually costs an attacker
type: guided
tier: 2
image: groundwork/lab-foundations:1
duration_minutes: 30
objectives: [OBJ-A04.1.4, OBJ-A04.1.5]

intro: >-
  "Use a slow hash" is advice everybody repeats and almost nobody has measured.
  You are going to measure it — the fast hash, the slow one at its default, and
  the slow one tuned — and produce a guesses-per-second figure you could defend
  in a review.


  Then you will use a stolen table to show exactly what a salt buys, and exactly
  what it does not. The second half surprises people more than the first.

setup:
  - /opt/lab/seed-hashing.sh

steps:
  - id: s1
    instruction: >-
      Before measuring, commit to a prediction. Write to /tmp/hypotheses how
      many times slower you expect `openssl passwd -6` at its default setting to
      be than a plain SHA-256 of the same password. One line, one number.
    hint: >-
      Any number is fine — the point is to have committed before the evidence
      arrives. Most people guess between 10 and 100.
    walkthrough: |
      echo "prediction: sha512crypt at its default will be about 50 times slower than a bare sha256" > /tmp/hypotheses
      cat /tmp/hypotheses
    verify:
      - type: file_exists
        path: /tmp/hypotheses
        describe: You committed to a prediction before measuring

  - id: s2
    instruction: >-
      Measure how long it takes to start `openssl` at all, so you can subtract
      it later. Run `openssl version` forty times, time the loop, and save the
      per-spawn cost to /tmp/answer-spawn.
    hint: >-
      There is no `time` builtin in this shell. Use `date +%s%N` before and
      after, subtract, and divide — nanoseconds, so divide by 1000000 for
      milliseconds.
    walkthrough: |
      t0=$(date +%s%N)
      i=0
      while [ $i -lt 40 ]; do openssl version >/dev/null; i=$((i+1)); done
      t1=$(date +%s%N)
      ms=$(( (t1 - t0) / 1000000 ))
      {
        echo "40 spawns took ${ms}ms"
        echo "spawn_ms=${ms}"
      } > /tmp/answer-spawn
      cat /tmp/answer-spawn
    verify:
      - type: file_matches
        path: /tmp/answer-spawn
        pattern: "spawn_ms=[0-9]+"
        describe: You measured the process startup cost separately
      - type: command_exit
        command: "test $(grep -o 'spawn_ms=[0-9]*' /tmp/answer-spawn | cut -d= -f2) -gt 0"
        exit_code: 0
        describe: And it is a real, non-zero number of milliseconds

  - id: s3
    instruction: >-
      Measure both rates. Time forty `openssl passwd -6` hashes, subtract the
      spawn cost you just measured, and convert to hashes per second. Get the
      SHA-256 rate from `openssl speed -seconds 3 sha256` at its 16-byte figure.
      Save both to /tmp/answer-rates.
    hint: >-
      `openssl speed` reports thousands of bytes per second. At a 16-byte input,
      hashes per second is that column times 1000, divided by 16.
    walkthrough: |
      spawn=$(grep -o 'spawn_ms=[0-9]*' /tmp/answer-spawn | cut -d= -f2)
      t0=$(date +%s%N)
      i=0
      while [ $i -lt 40 ]; do openssl passwd -6 -salt abcdefgh "pw$i" >/dev/null; i=$((i+1)); done
      t1=$(date +%s%N)
      total=$(( (t1 - t0) / 1000000 ))
      work=$(( total - spawn ))
      [ "$work" -lt 1 ] && work=1
      slow=$(( 40000 / work ))
      fast=$(openssl speed -seconds 3 sha256 2>/dev/null | awk '/^sha256/{printf "%d", $2*1000/16}')
      {
        echo "sha512crypt default: ${total}ms total, ${work}ms hashing -> ${slow} hashes/sec"
        echo "sha256:              ${fast} hashes/sec"
        echo "ratio: $(( fast / slow ))x"
      } > /tmp/answer-rates
      cat /tmp/answer-rates
    verify:
      - type: file_matches
        path: /tmp/answer-rates
        pattern: "sha512crypt default: .*[0-9]+ hashes/sec"
        describe: You measured the password hash rate with spawn cost removed
      - type: command_exit
        command: "test $(grep -o 'ratio: [0-9]*' /tmp/answer-rates | tr -dc 0-9) -gt 500"
        exit_code: 0
        describe: The fast hash is more than 500x faster, far beyond most predictions

  - id: s4
    instruction: >-
      Raise the work factor and measure again. Time a single
      `openssl passwd -6` with `rounds=1000000`, and append the new rate and the
      ratio against the default to /tmp/answer-rates.
    hint: >-
      The work factor goes inside the salt argument, as
      `-salt 'rounds=1000000$abcdefgh'`. Single quotes matter — the shell would
      otherwise treat `$abcdefgh` as a variable.
    walkthrough: |
      t0=$(date +%s%N)
      openssl passwd -6 -salt 'rounds=1000000$abcdefgh' hunter2 >/dev/null
      t1=$(date +%s%N)
      one=$(( (t1 - t0) / 1000000 ))
      [ "$one" -lt 1 ] && one=1
      tuned=$(( 1000 / one ))
      [ "$tuned" -lt 1 ] && tuned=1
      default=$(sed -n 's/.*default:.*-> \([0-9]*\) hashes.*/\1/p' /tmp/answer-rates)
      {
        echo "sha512crypt rounds=1000000: ${one}ms per hash -> ${tuned} hashes/sec"
        echo "tuned is $(( default / tuned ))x slower than the default of the same algorithm"
      } >> /tmp/answer-rates
      tail -2 /tmp/answer-rates
    verify:
      - type: file_matches
        path: /tmp/answer-rates
        pattern: "rounds=1000000: [0-9]+ms per hash"
        describe: You measured the cost of one hash at a raised work factor
      - type: command_exit
        command: "test $(grep -o 'rounds=1000000: [0-9]*' /tmp/answer-rates | tr -dc 0-9) -ge 100"
        exit_code: 0
        describe: And it costs at least 100ms — a tax an attacker pays a billion times

  - id: s5
    instruction: >-
      Show what a salt changes. Hash the same password twice with two different
      salts and save both to /tmp/answer-salt, then state in the same file
      whether the second hash took measurably longer than the first.
    hint: >-
      Use `-salt` twice with different values and the same password. Then think
      about whether anything you have measured suggests salting costs time.
    walkthrough: |
      {
        openssl passwd -6 -salt abcdefgh hunter2
        openssl passwd -6 -salt zzzzzzzz hunter2
        echo "same password, two salts, two unrelated stored values"
        echo "salting costs no measurable time: a salted hash runs at the same rate as an unsalted one, so a salt does not slow down a single guess at all"
      } > /tmp/answer-salt
      cat /tmp/answer-salt
    verify:
      - type: command_exit
        command: "test $(head -2 /tmp/answer-salt | sort -u | wc -l) -eq 2"
        exit_code: 0
        describe: One password produced two different stored values
      - type: file_matches
        path: /tmp/answer-salt
        pattern: "does not slow|no measurable time|same rate"
        describe: And you recorded that a salt costs an attacker no time per guess

  - id: s6
    instruction: >-
      /tmp/shadow-samples/users.csv is an unsalted table from a breach. Without
      any cracking, find which accounts share a password, then use
      /tmp/shadow-samples/wordlist.txt to recover it. Save both findings to
      /tmp/answer-unsalted.
    hint: >-
      Identical passwords hash identically when there is no salt, so sorting the
      hash column is enough to group them. Then hash each wordlist candidate
      once and compare against the group.
    walkthrough: |
      cd /tmp/shadow-samples
      dupe=$(awk -F, 'NR>2{print $3}' users.csv | sort | uniq -c | sort -rn | head -1)
      dupehash=$(echo "$dupe" | awk '{print $2}')
      count=$(echo "$dupe" | awk '{print $1}')
      {
        echo "accounts sharing one hash: $count"
        echo "shared hash: $dupehash"
        awk -F, -v h="$dupehash" 'NR>2 && $3==h {print "  " $2}' users.csv
        echo
        echo "cracking that one hash against the wordlist:"
        while read -r w; do
          c=$(printf '%s' "$w" | sha256sum | cut -d' ' -f1)
          if [ "$c" = "$dupehash" ]; then echo "  RECOVERED: $w"; fi
        done < wordlist.txt
        echo
        echo "one guess against one hash recovered the password for all $count accounts at once, because with no salt identical passwords are identical rows"
      } > /tmp/answer-unsalted
      cat /tmp/answer-unsalted
    verify:
      - type: file_matches
        path: /tmp/answer-unsalted
        pattern: "RECOVERED: summer2019"
        describe: You recovered the shared password from the wordlist
      - type: file_matches
        path: /tmp/answer-unsalted
        pattern: "accounts sharing one hash: 4"
        describe: And found that four accounts shared it, visible without any cracking

  - id: s7
    instruction: >-
      Write to /tmp/answer-conclusion what a salt defeats and what it does not,
      and which of the two parameters you measured decides the outcome for a
      single targeted account.
    hint: >-
      You now have two independent measurements. One of them changed the rate at
      which guesses can be made; the other did not change it at all.
    walkthrough: |
      {
        echo "what a salt defeats: shared work. it removes precomputed tables, it stops identical passwords showing as identical rows, and it forces each account to be attacked separately instead of one guess being tested against every row at once."
        echo
        echo "what a salt does not defeat: guessing. a salted hash is computed at exactly the same rate as an unsalted one, so it does not slow a single guess by any measurable amount."
        echo
        echo "for one targeted account there is no shared work to remove, so the salt helps almost nothing. the work factor is the only parameter that changes the answer, because it is the only one that changes guesses per second."
        echo
        echo "both are needed and they answer different questions: salt defeats bulk, work factor defeats guessing."
      } > /tmp/answer-conclusion
      cat /tmp/answer-conclusion
    verify:
      - type: file_matches
        path: /tmp/answer-conclusion
        pattern: "shared work|precomput|bulk"
        describe: You named what the salt removes
      - type: file_matches
        path: /tmp/answer-conclusion
        pattern: "work factor"
        describe: And identified the work factor as what decides a targeted attack
      - type: file_matches
        path: /tmp/answer-conclusion
        pattern: "targeted|single account|one account"
        describe: And distinguished the targeted case from the bulk case

solution: >-
  **The numbers.**


  Your figures will differ from these — they are from one core of the machine
  these labs were written on — but the *shape* will not:


  ```text
  sha256:                       ~3,900,000 hashes/sec
  sha512crypt, default rounds:       ~350 hashes/sec     (>10,000x slower)
  sha512crypt, rounds=1000000:         ~2 hashes/sec     (~1,900,000x slower)
  ```


  Almost nobody predicts five figures in step 1. The common guess is between
  10 and 100, and that gap is the reason the measurement is worth doing: the
  intuition is off by two orders of magnitude in the direction that matters.


  Subtracting the spawn cost mattered. `openssl` takes around 3ms just to start,
  and the default hash takes around 3ms to compute — so an unadjusted
  measurement would have reported the algorithm as twice as slow as it is, and
  the ratio as half what it is. A security number you cannot defend the
  methodology of is not usable in an argument.


  **Turning a rate into a decision.**


  A wordlist of every password from every previous breach, plus mutation rules,
  is a few billion candidates. Against one account:


  | Storage | Time for 3 billion guesses, one core |
  |---|---|
  | SHA-256 | about 13 minutes |
  | sha512crypt default | about 110 days |
  | sha512crypt rounds=1000000 | about 47 years |


  And an attacker has more than one core, and a GPU rather than a CPU — which
  moves the first row into seconds and the last row not nearly as far, because
  the whole design of a password hash is to resist exactly that parallelism.


  This is the argument to bring to a review. Not "SHA-256 is insecure" — it is
  not, and saying so damages your credibility with anyone who knows the field.
  The argument is: **for this job, at this rate, the entire attack completes in
  minutes, and one parameter moves it to decades.**


  **What the salt did, and what it did not.**


  Two hashes of `hunter2`, two salts, two unrelated outputs — and no measurable
  time difference between them. That second observation is the one that gets
  missed. A salt is free for the defender *and free for the attacker*: it changes
  no rate.


  Then the unsalted table made the other half concrete. Sorting the hash column
  showed four of six accounts sharing one value, before any cracking at all —
  that is already a finding, because it tells an attacker which hash to spend
  effort on. One guess against that hash, and four accounts fell together.


  With unique salts, those four rows would have been four different values, and
  the attacker would have had to run the wordlist four times. That is the whole
  contribution: **it removes amortisation**.


  Which is why the targeted case is the clarifying one. Against one specific
  person's account there was never any amortisation to remove. The salt helps
  essentially nothing; the work factor is the entire defence.


  **Salt defeats bulk. Work factor defeats guessing.** You need both, and a
  system with unique salts and a fast hash has solved the easier half of the
  problem and left the half that decides the outcome.
