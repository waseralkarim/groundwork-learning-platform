id: topic.encryption
slug: encryption
title: "Encryption: What the Key Protects, and What It Does Not"
summary: >-
  Encryption keeps data secret from anyone without the key. It does not keep it
  unaltered, it does not say who sent it, and it does not survive a key used
  twice. Each of those gaps is a real failure you can produce here in one
  command — including changing the amount in an encrypted payment without ever
  learning the key.
order: 1
levels: [L1, L2]
estimated_minutes: 130
status: published

prerequisites:
  - topic: topic.hashing-and-passwords
    hardness: required

