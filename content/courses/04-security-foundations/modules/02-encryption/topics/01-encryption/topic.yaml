terminology:
  - term: symmetric encryption
    definition: >-
      One key encrypts and decrypts. Fast enough for bulk data — around a
      gigabyte a second per core — and the whole problem is getting the key to
      the other party.
  - term: asymmetric encryption
    definition: >-
      A key pair: what the public key encrypts, only the private key decrypts.
      It solves key distribution, and it is thousands of times slower with a
      payload limit of a few hundred bytes.
  - term: hybrid encryption
    definition: >-
      Encrypt the data with a fresh symmetric key, encrypt that key with the
      recipient's public key, send both. Every real system does this, including
      TLS.
  - term: mode of operation
    definition: >-
      How a block cipher is applied to data longer than one block. It is not a
      detail — the same cipher in two modes has entirely different properties.
  - term: ECB
    definition: >-
      Electronic Codebook — each block encrypted independently, so identical
      plaintext blocks produce identical ciphertext blocks. It leaks structure
      and is never the right choice.
  - term: IV
    definition: >-
      Initialisation vector — a value that makes the same plaintext encrypt
      differently each time. Not secret, but it must never repeat under one key.
  - term: nonce
    definition: >-
      Number used once. The same requirement as an IV, named for the property
      that matters: reuse under one key is catastrophic, not merely untidy.
  - term: keystream
    definition: >-
      The pseudorandom bytes a stream cipher or counter mode produces from key
      and nonce, XORed with the plaintext. Reuse it and the key cancels out of
      the arithmetic entirely.
  - term: malleability
    definition: >-
      Being able to make a predictable change to the plaintext by changing the
      ciphertext, without the key. Every unauthenticated mode has this property.
  - term: AEAD
    definition: >-
      Authenticated Encryption with Associated Data — encryption and integrity
      in one operation, so a tampered ciphertext fails to decrypt rather than
      decrypting to something else. AES-GCM and ChaCha20-Poly1305.
  - term: key exchange
    definition: >-
      Establishing a shared secret over a channel an eavesdropper can read.
      Diffie–Hellman does this without the secret ever being transmitted.
  - term: forward secrecy
    definition: >-
      Using an ephemeral key exchange so that stealing the long-term private key
      later does not decrypt traffic captured earlier.
  - term: encryption at rest
    definition: >-
      Data encrypted on disk. It protects against a stolen disk and almost
      nothing else — a running process with the key sees plaintext, and so does
      anyone who compromises it.

foreshadows:
  - "A04.3's TLS handshake is a key exchange followed by hybrid encryption, both built here."
  - "C16's image and secret encryption is this primitive with a key management system attached."
  - "D22's cloud KMS answers the question this topic ends on — where does the key live."
  - "G43's secrets management is mostly key distribution, which is the problem asymmetric encryption exists to solve."

