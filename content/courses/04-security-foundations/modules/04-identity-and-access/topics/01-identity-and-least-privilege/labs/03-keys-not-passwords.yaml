id: lab.keys-not-passwords
topic: topic.identity-and-least-privilege
title: Authenticate with a key, and open the key to see the last two topics
type: guided
tier: 2
image: groundwork/lab-foundations:1
duration_minutes: 30
objectives: [OBJ-A04.4.6, OBJ-A04.4.8]

intro: >-
  SSH public key authentication is the asymmetric cryptography from A04.2 doing
  the job you actually meet it doing. You are going to run the whole exchange —
  challenge, signature, verification — without a server, because that is all it
  is.


  Then you will open a passphrase-protected private key and find `aes256-ctr` and
  `bcrypt` written in its own header, which is the previous two topics visible in
  one file.

setup:
  - /opt/lab/seed-identity.sh

steps:
  - id: s1
    instruction: >-
      Inspect the keys in /tmp/keys. Record each key's fingerprint and size, and
      show that a public key can be derived from its private half but not the
      reverse. Save to /tmp/answer-keys.
    hint: >-
      `ssh-keygen -lf` for fingerprints, `ssh-keygen -y -f` to derive a public
      key. Carol's key has the passphrase `correct-horse`.
    walkthrough: |
      cd /tmp/keys
      {
        echo "fingerprints:"
        for k in alice bob carol legacy; do ssh-keygen -lf $k.pub; done
        echo
        echo "sizes on disk:"
        for k in alice legacy; do printf '%-8s private=%s public=%s\n' "$k" "$(wc -c < $k)" "$(wc -c < $k.pub)"; done
        echo
        echo "deriving the public half from the private one:"
        ssh-keygen -y -f alice
        echo "and from a passphrase-protected key, given the passphrase:"
        ssh-keygen -y -f carol -P correct-horse
        echo
        echo "there is no reverse operation. the fingerprint is a sha256 of the public key - the hashing topic applied to identity, so two keys can be compared at a glance instead of by eye across 68 base64 characters."
      } > /tmp/answer-keys
      cat /tmp/answer-keys
    verify:
      - type: file_matches
        path: /tmp/answer-keys
        pattern: "SHA256:"
        describe: You read the fingerprints as SHA-256 digests
      - type: file_matches
        path: /tmp/answer-keys
        pattern: "ssh-ed25519 AAAA"
        describe: And derived a public key from a private one
      - type: file_matches
        path: /tmp/answer-keys
        pattern: "alice *private=[0-9]+ public=[0-9]+"
        describe: And compared key sizes on disk

  - id: s2
    instruction: >-
      Run the authentication exchange yourself. Sign a challenge with Alice's
      private key and verify it against her public key, then verify a tampered
      challenge and a wrong key. Save all three outcomes to /tmp/answer-exchange.
    hint: >-
      `ssh-keygen -Y sign -f <key> -n <namespace> <file>` and `ssh-keygen -Y
      verify -f <allowed> -I <identity> -n <namespace> -s <sig>`. The allowed
      file needs the namespace in quotes.
    walkthrough: |
      cd /tmp/keys
      echo "server-challenge-nonce-8f2a1c" > chal.txt
      ssh-keygen -Y sign -f alice -n sshtest chal.txt >/dev/null 2>&1
      printf 'alice@ops namespaces="sshtest" %s\n' "$(cut -d' ' -f1,2 alice.pub)" > allowed
      printf 'alice@ops namespaces="sshtest" %s\n' "$(cut -d' ' -f1,2 bob.pub)" > allowed-wrong
      {
        echo "1. correct key, correct challenge:"
        ssh-keygen -Y verify -f allowed -I alice@ops -n sshtest -s chal.txt.sig < chal.txt 2>&1 | head -1
        echo
        echo "2. same signature, tampered challenge:"
        echo "server-challenge-nonce-DIFFERENT" | ssh-keygen -Y verify -f allowed -I alice@ops -n sshtest -s chal.txt.sig 2>&1 | head -1
        echo
        echo "3. correct challenge, but only bob's key is authorised:"
        ssh-keygen -Y verify -f allowed-wrong -I alice@ops -n sshtest -s chal.txt.sig < chal.txt 2>&1 | head -1
        echo
        echo "that is authentication, complete. the server sends a challenge containing a nonce, the client signs it with the private key, the server verifies against the public key it already holds."
        echo "no secret crosses the wire in either direction. there is nothing to intercept, nothing to replay because the challenge differs every session, and nothing for a compromised server to steal - it only ever had the public half. that is the whole reason keys beat passwords."
      } > /tmp/answer-exchange
      cat /tmp/answer-exchange
    verify:
      - type: file_matches
        path: /tmp/answer-exchange
        pattern: "Good \"sshtest\" signature for alice@ops"
        describe: The correct key verified the challenge
      - type: file_matches
        path: /tmp/answer-exchange
        pattern: "incorrect signature"
        describe: A tampered challenge was rejected
      - type: file_matches
        path: /tmp/answer-exchange
        pattern: "Could not verify signature"
        describe: And a signature from an unauthorised key was rejected
      - type: file_matches
        path: /tmp/answer-exchange
        pattern: "(?i)no secret crosses"
        describe: And you stated why this beats a password

  - id: s3
    instruction: >-
      Open the private keys and compare an unprotected one with a
      passphrase-protected one. Save what each header declares to
      /tmp/answer-inside.
    hint: >-
      Strip the first and last lines, base64-decode, and look at the first few
      dozen bytes. Non-printing bytes will be noise — filter them.
    walkthrough: |
      cd /tmp/keys
      {
        echo "alice (no passphrase):"
        sed -e 1d -e '$d' alice | base64 -d 2>/dev/null | head -c 60 | tr -c '[:print:]' '.'
        echo
        echo
        echo "carol (passphrase-protected):"
        sed -e 1d -e '$d' carol | base64 -d 2>/dev/null | head -c 60 | tr -c '[:print:]' '.'
        echo
        echo
        echo "alice declares none....none - the private key is plaintext on disk, and anyone who reads that file has her identity."
        echo "carol declares aes256-ctr....bcrypt - the key material is encrypted with aes-256 in counter mode, and the encryption key is derived from her passphrase by bcrypt."
        echo "both of the previous two topics are in that one line. bcrypt because the file is a stealable offline target and a deliberately slow kdf is what stands in front of it; aes-256 because that is what protects bulk data."
      } > /tmp/answer-inside
      cat /tmp/answer-inside
    verify:
      - type: file_matches
        path: /tmp/answer-inside
        pattern: "aes256-ctr"
        describe: You found the cipher protecting the encrypted key
      - type: file_matches
        path: /tmp/answer-inside
        pattern: "bcrypt"
        describe: And the key derivation function behind it
      - type: file_matches
        path: /tmp/answer-inside
        pattern: "none"
        describe: And that the unprotected key declares no protection at all
      - type: file_matches
        path: /tmp/answer-inside
        pattern: "(?i)plaintext on disk"
        describe: And what that means for whoever can read the file

  - id: s4
    instruction: >-
      Audit /tmp/keys/authorized_keys against /tmp/keys/inventory.txt. Identify
      every entry, say which ones you can account for, and save to
      /tmp/answer-audit.
    hint: >-
      `ssh-keygen -lf` works on an authorized_keys file and fingerprints every
      line. The comment field is the only clue about ownership, and it is not
      verified.
    walkthrough: |
      cd /tmp/keys
      {
        echo "entries in authorized_keys: $(wc -l < authorized_keys)"
        ssh-keygen -lf authorized_keys
        echo
        echo "people listed in the inventory:"
        grep -c '@ops' inventory.txt
        echo
        echo "accounted for: alice@ops and bob@ops are current staff."
        echo "NOT accounted for:"
        echo "  deploy@ci-2019 - a ci system decommissioned three years ago. the private half is wherever that machine's disks went."
        echo "  root@build-01  - nobody knows. the comment is free text, unverified, and not an identity."
        echo
        echo "carol is in the inventory and has no key here, so the list and the inventory disagree in both directions."
        echo
        echo "each line is a permanent unexpiring credential. the format has no validity window, no revocation, and no log of use. if root@build-01's private half was on a laptop that was sold, that access still works today."
      } > /tmp/answer-audit
      cat /tmp/answer-audit
    verify:
      - type: file_matches
        path: /tmp/answer-audit
        pattern: "entries in authorized_keys: 4"
        describe: You counted the entries
      - type: file_matches
        path: /tmp/answer-audit
        pattern: "deploy@ci-2019"
        describe: And identified the key from a decommissioned system
      - type: file_matches
        path: /tmp/answer-audit
        pattern: "root@build-01"
        describe: And the one nobody can account for
      - type: file_matches
        path: /tmp/answer-audit
        pattern: "(?i)no validity window|unexpiring|no revocation"
        describe: And noted that the format has no expiry

  - id: s5
    instruction: >-
      Read /tmp/keys/captured-ssh-refusal.txt, then write to
      /tmp/answer-hardening what you would change about how this account's access
      is managed, and why diligence alone will not fix it.
    hint: >-
      The problem is that entries are added urgently and removed never. What
      changes that structurally rather than by asking people to be careful?
    walkthrough: |
      cd /tmp/keys
      cat captured-ssh-refusal.txt
      {
        echo "ssh refuses a private key that is more permissive than 0600 and says so plainly. that is one of very few places a tool declines to do what you asked, for your own protection, and it should be respected rather than worked around."
        echo
        echo "why diligence will not fix authorized_keys: adding an entry is urgent, routine and feels safe. removing one risks locking somebody out, and nobody is certain who a key belongs to because the only clue is an unverified comment. so the list only ever grows. that is a property of the format, not of the people maintaining it."
        echo
        echo "what changes it structurally:"
        echo "1. ssh certificates - a ca signs short-lived user certificates and the server trusts the ca rather than a list of keys. access expires by default, typically in hours, so removing someone means not reissuing. this is the single biggest improvement available and it is well supported and rarely deployed."
        echo "2. a bastion issuing per-session credentials, which also produces a log of who connected to what and when - solving the audit problem as well as the expiry one."
        echo "3. failing both: name a human owner for every entry and delete anything unowned. if a key turns out to be needed, someone will say so within the hour, and that is how you find out who owns it."
        echo
        echo "the general point: access that expires by default is the only mechanism that reliably removes access. anything that depends on somebody remembering to revoke will accumulate."
      } > /tmp/answer-hardening
      cat /tmp/answer-hardening
    verify:
      - type: file_matches
        path: /tmp/answer-hardening
        pattern: "(?i)certificate"
        describe: You proposed short-lived certificates as the structural fix
      - type: file_matches
        path: /tmp/answer-hardening
        pattern: "(?i)expire"
        describe: And identified expiry as what makes removal reliable
      - type: file_matches
        path: /tmp/answer-hardening
        pattern: "0600|too open|bad permissions"
        describe: And read SSH's refusal of an over-permissive private key

solution: >-
  **You ran authentication end to end, with no server.**


  ```text
  1. Good "sshtest" signature for alice@ops with ED25519 key SHA256:F5LX29...
  2. Signature verification failed: incorrect signature
  3. Could not verify signature.
  ```


  That is the whole mechanism. The server sends a challenge containing a session
  nonce; the client signs it with the private key; the server verifies against
  the public key it already holds. Case 2 shows why a captured signature cannot
  be replayed — the challenge differs every session. Case 3 shows the
  authorisation half: a perfectly valid signature from a key that is not on the
  list.


  **No secret crosses the wire in either direction.** Nothing to intercept,
  nothing to replay, and nothing for a compromised server to steal — it only ever
  had the public half. Compare a password, which the client must send and the
  server must receive, every single time.


  **The key files.**


  A public key is three fields: algorithm, the key, and a **comment**. The
  comment is free text — unverified, not unique, not an identity — and it is the
  only clue you will ever have about who a key belongs to.


  The fingerprint is A04.1 applied to identity: `SHA256:F5LX29nq37...`, a digest
  of the public key so two can be compared at a glance rather than across 68
  base64 characters.


  And `ssh-keygen -y` derives the public half from the private one, which answers
  the question that actually comes up — *which of these private keys matches this
  authorized entry*. There is no reverse operation.


  **Inside an encrypted private key.**


  ```text
  alice:  openssh-key-v1.....none....none.....
  carol:  openssh-key-v1.....aes256-ctr....bcrypt.....
  ```


  Carol's key is **AES-256-CTR encrypted** with the key derived from her
  passphrase by **bcrypt**. Both of the previous two topics, declared in the
  file's own header — bcrypt because a private key file is a stealable offline
  target and a deliberately slow KDF is the only thing in front of it, and
  AES-256 because that is what protects the material once the key is derived.


  Alice's says `none` twice: plaintext on disk. Anyone who reads that file has
  her identity, permanently, with nothing further required.


  **The audit, and why it always looks like this.**


  Four entries; three people in the inventory; and the sets do not match in
  either direction. `deploy@ci-2019` belongs to a system decommissioned three
  years ago, and its private half is wherever that machine's disks went.
  `root@build-01` is unaccounted for entirely. Carol is in the inventory with no
  key present.


  Every line is a **permanent, unexpiring credential**. The format has no validity
  window, no revocation mechanism and no log of use.


  The reason the list only grows is structural, not human: adding is urgent and
  safe-feeling, removing risks an outage, and nobody can prove who a key belongs
  to. Asking people to be more careful does not change any of those.


  **What does change it** is making access expire by default. SSH certificates —
  a CA signing short-lived user certificates, with the server trusting the CA
  rather than a list — turn revocation into *not reissuing*. A bastion issuing
  per-session credentials does the same and adds a connection log.


  Failing both, name a human owner for every entry and delete anything unowned.
  If a key was needed, someone will say so within the hour — and that is how you
  discover who owns it.


  **The transferable rule:** access that expires by default is the only mechanism
  that reliably removes access. Anything depending on somebody remembering to
  revoke will accumulate, and this is equally true of IAM roles, API tokens,
  database grants and firewall rules.
