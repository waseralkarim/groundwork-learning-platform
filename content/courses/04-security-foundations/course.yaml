title: Security Foundations
summary: >-
  The primitives every security control is built from, measured rather than
  described. What a hash actually guarantees, what encryption does and does not
  protect, how a certificate is checked and the three distinct ways that check
  fails, and who is allowed to do what on a machine you did not configure.
