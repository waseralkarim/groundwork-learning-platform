name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Test-only values. Real secrets never appear in this file.
  SECRET_KEY: ci-secret-key-not-used-for-anything-real
  POSTGRES_USER: groundwork
  POSTGRES_PASSWORD: ci-postgres-password-placeholder
  POSTGRES_DB: groundwork

jobs:
  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  api:
    name: API — lint, format, test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Install dependencies
        working-directory: services/api
        run: uv pip install --system '.[dev]'
      - name: Lint
        working-directory: services/api
        run: ruff check .
      - name: Format check
        working-directory: services/api
        run: ruff format --check .
      - name: Content — validate and lint
        working-directory: services/api
        env:
          GROUNDWORK_ENV: test
          CONTENT_DIR: ${{ github.workspace }}/content
        run: python -m app.content.cli lint --root "$GITHUB_WORKSPACE/content"
      - name: Test (unit)
        working-directory: services/api
        env:
          GROUNDWORK_ENV: test
        run: pytest --ignore=tests/test_ingest_integration.py

  broker:
    name: Lab broker — lint, format, test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Install dependencies
        working-directory: services/lab-broker
        run: uv pip install --system '.[dev]'
      - name: Lint
        working-directory: services/lab-broker
        run: ruff check .
      - name: Format check
        working-directory: services/lab-broker
        run: ruff format --check .
      - name: Test
        working-directory: services/lab-broker
        env:
          PROVISIONER: fake
        run: pytest

  web:
    name: Web — lint, typecheck, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with:
          version: 10.11.0
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: services/web/pnpm-lock.yaml
      - name: Install dependencies
        working-directory: services/web
        run: pnpm install --frozen-lockfile
      - name: Lint
        working-directory: services/web
        run: pnpm biome check src
      - name: Typecheck
        working-directory: services/web
        run: pnpm typecheck
      - name: Build
        working-directory: services/web
        run: pnpm build

  compose:
    name: Compose — config and security invariants
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Validate compose files
        run: docker compose config --quiet
      - name: Assert security invariants
        run: bash scripts/assert-no-privileged.sh

  images:
    name: Images — build, scan, SBOM
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        service: [api, web, lab-broker]
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - name: Build ${{ matrix.service }}
        uses: docker/build-push-action@v6
        with:
          context: services/${{ matrix.service }}
          target: runtime
          tags: groundwork-${{ matrix.service }}:${{ github.sha }}
          load: true
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}
      - name: Assert the image does not run as root
        run: |
          user=$(docker image inspect -f '{{.Config.User}}' groundwork-${{ matrix.service }}:${{ github.sha }})
          echo "USER=$user"
          if [ -z "$user" ] || [ "$user" = "root" ] || [ "$user" = "0" ]; then
            echo "::error::image runs as root"
            exit 1
          fi
      - name: Trivy scan
        uses: aquasecurity/trivy-action@0.33.1
        with:
          image-ref: groundwork-${{ matrix.service }}:${{ github.sha }}
          format: sarif
          output: trivy-${{ matrix.service }}.sarif
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
      - name: Upload Trivy results
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-${{ matrix.service }}.sarif
          category: trivy-${{ matrix.service }}
      - name: Generate SBOM
        uses: anchore/sbom-action@v0
        with:
          image: groundwork-${{ matrix.service }}:${{ github.sha }}
          format: spdx-json
          artifact-name: sbom-${{ matrix.service }}.spdx.json

  e2e:
    name: End to end — real stack
    runs-on: ubuntu-latest
    needs: [api, web, compose]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Create .env
        run: |
          cp .env.example .env
          sed -i "s|^SECRET_KEY=.*|SECRET_KEY=${SECRET_KEY}|" .env
          sed -i "s|^POSTGRES_PASSWORD=.*|POSTGRES_PASSWORD=${POSTGRES_PASSWORD}|" .env
      - name: Start the stack
        run: docker compose up --build --wait --wait-timeout 300 -d

      # Deliberately no manual ingest step. There used to be one, and it hid a
      # real defect for weeks: `docker compose up` produced an empty curriculum,
      # and CI could not see it because CI ingested by hand immediately
      # afterwards. The stack must arrive usable on its own.
      - name: A cold start produced a usable platform
        run: |
          topics=$(docker compose exec -T db psql -qtAX -U groundwork -d groundwork -c 'SELECT count(*) FROM topics')
          topics=$(echo "$topics" | tr -dc "0-9")
          echo "topics ingested: ${topics:-0}"
          test "${topics:-0}" -gt 0

      - name: Smoke test
        run: bash scripts/smoke.sh
      - name: Accessibility, mobile and compression checks
        run: python scripts/verify-accessibility.py
      - name: A backup restores, and progress still resolves
        run: bash scripts/verify-restore.sh
      - name: Integration tests against the real database
        run: docker compose run --rm -e GROUNDWORK_ENV=test api pytest
      - name: Migrations roll back cleanly
        run: docker compose run --rm migrate alembic downgrade base
      - name: Dump logs on failure
        if: failure()
        run: docker compose logs --no-color
      - name: Tear down
        if: always()
        run: docker compose down --volumes --remove-orphans

  labs:
    name: Lab plane — terminal and every lab walked
    runs-on: ubuntu-latest
    needs: [api, compose]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Create .env
        run: |
          cp .env.example .env
          sed -i "s|^SECRET_KEY=.*|SECRET_KEY=${SECRET_KEY}|" .env
          sed -i "s|^POSTGRES_PASSWORD=.*|POSTGRES_PASSWORD=${POSTGRES_PASSWORD}|" .env
          # The broker runs as a non-root user and must be in the socket's group
          # to open it. The gid differs between hosts, so read it rather than
          # assuming — this is the failure that looks like a broken runtime.
          echo "DOCKER_SOCKET_GID=$(stat -c %g /var/run/docker.sock)" >> .env

      - name: Build the lab base image
        run: docker build -t groundwork/lab-foundations:1 labs/images/foundations

      - name: Start the stack with the lab plane
        run: docker compose --profile labs up --build --wait --wait-timeout 420 -d

      - name: The lab runtime is reachable and can provision
        run: bash scripts/verify-labs.sh

      # Byte-for-byte proof that the terminal works. The endpoint this replaced
      # completed its handshake and moved nothing, with every health check green.
      - name: The terminal carries bytes in both directions
        run: python scripts/verify-terminal.py

      # The check that says the content still teaches. Each lab's steps are run
      # as a learner would, then its own verifications are asserted to pass —
      # which has caught instructions that were wrong while their checks passed.
      - name: Walk every lab as a learner
        run: python scripts/walk-labs.py

      - name: Dump logs on failure
        if: failure()
        run: docker compose --profile labs logs --no-color
      - name: Tear down
        if: always()
        run: docker compose --profile labs down --volumes --remove-orphans
